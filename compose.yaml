services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-korea_point}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-korea_point_local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - korea_point_postgres:/var/lib/postgresql
      - ./docker/postgres/init/01-enable-vector.sql:/docker-entrypoint-initdb.d/01-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  korea_point_postgres:
