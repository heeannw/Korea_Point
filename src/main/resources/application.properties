spring.application.name=demo
spring.profiles.active=local
server.port=8080

# Start the shared development database automatically when the application starts.
# Keep it running when the application stops to make repeated local restarts faster.
spring.docker.compose.lifecycle-management=start-only
#fastapi.base-url=http://172.28.6.127:8000
#fastapi.base-url=http://192.168.219.103:8000

TRANSPORT_KAKAO_API_KEY=${TRANSPORT_KAKAO_API_KEY:}
TRANSPORT_ODSAY_API_KEY=${TRANSPORT_ODSAY_API_KEY:}
TRANSPORT_TMAP_API_KEY=${TRANSPORT_TMAP_API_KEY:}
TOURISM_KAKAO_API_KEY=${TOURISM_KAKAO_API_KEY:}
SEOUL_SUBWAY_API_KEY=${SEOUL_SUBWAY_API_KEY:}
BUSAN_BIMS_SERVICE_KEY=${BUSAN_BIMS_SERVICE_KEY:}
TOUR_API_SERVICE_KEY=${TOUR_API_SERVICE_KEY:}

# Korea Tourism Organization TourAPI (tourism, restaurants, festivals, etc.)
tour-api.service-key=${TOUR_API_SERVICE_KEY:}

# 국세청 사업자등록정보 진위확인 및 상태조회 (data.go.kr).
# data.go.kr 은 계정당 인증키가 하나라 TourAPI 키가 그대로 통한다.
# 그래서 TOUR_API_SERVICE_KEY 만 있으면 따로 설정할 게 없다.
# 나중에 키를 분리하고 싶으면 NTS_BUSINESS_SERVICE_KEY 를 넣으면 그게 우선한다.
# 둘 다 없으면 체크섬까지만 검사하고 국세청 조회는 건너뛴다.
nts.business.service-key=${NTS_BUSINESS_SERVICE_KEY:${TOUR_API_SERVICE_KEY:}}

unsplash.access-key=${UNSPLASH_ACCESS_KEY:}

# TourAPI real-time calls for reservation flow.
# Shares the key with the tourism module: set TOUR_API_SERVICE_KEY in your environment.
tourapi.base-url=https://apis.data.go.kr/B551011/KorService2
tourapi.service-key=${TOUR_API_SERVICE_KEY:}
tourapi.mobile-os=ETC
tourapi.mobile-app=KoreaPoint
tourapi.area-code=6
tourapi.list-path=/areaBasedList2
tourapi.detail-path=/detailCommon2

# Weather and environmental APIs used by trip scheduling.
weather.service-key=${WEATHER_API_SERVICE_KEY:}
weather.forecast.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weather.warning.base-url=https://apis.data.go.kr/1360000/WthrWrnInfoService
weather.air-quality.base-url=https://apis.data.go.kr/B552584/ArpltnInforInqireSvc
weather.living-index.base-url=https://apis.data.go.kr/1360000/LivingWthrIdxServiceV5
weather.impact.base-url=https://apis.data.go.kr/1360000/ImpactInfoServiceV2
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-3.6-flash

# Chatbot (RAG). Busan storytelling API is the source material — its full text is never
# persisted; only embeddings + a reference key go into vector_documents (see ChatbotIngestionService).
BUSAN_STORY_SERVICE_KEY=${BUSAN_STORY_SERVICE_KEY:}
chatbot.busan-story.base-url=https://apis.data.go.kr/6260000/BusanCultureStoryTellingService/getBusanCultureStoryTelling
chatbot.busan-story.service-key=${BUSAN_STORY_SERVICE_KEY:}
chatbot.embedding.model=gemini-embedding-001
chatbot.embedding.dimension=768
chatbot.query.top-k=3
chatbot.query.max-distance=0.45

external-api.connect-timeout-ms=2500
external-api.read-timeout-ms=5000
external-api.weather-cache-minutes=30
external-api.warning-cache-minutes=10
external-api.air-cache-minutes=10
external-api.gemini-cache-minutes=60

# Gmail SMTP for local account email verification.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google OAuth2
spring.config.import=optional:classpath:application-secret.properties,optional:classpath:application-local.properties
spring.security.oauth2.client.registration.google.scope=email,profile

# Naver OAuth2
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:naver-client-id}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:naver-client-secret}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_REST_API_KEY:kakao-rest-api-key}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id


# Local PostgreSQL connection values are defined in application-local.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Quill ??? base64 ??? ??? ?? (?? 2MB ? 50MB)
server.tomcat.max-http-form-post-size=50MB

# Owner application documents are stored locally for the free/dev setup.
# In production, move these files to object storage and keep only paths in DB.
owner-application.upload-dir=uploads/owner-applications
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
