spring.application.name=demo
server.port=8080
#fastapi.base-url=http://172.28.6.127:8000
#fastapi.base-url=http://192.168.219.103:8000

TRANSPORT_KAKAO_API_KEY=${TRANSPORT_KAKAO_API_KEY:}
TRANSPORT_ODSAY_API_KEY=${TRANSPORT_ODSAY_API_KEY:}
TOURISM_KAKAO_API_KEY=${TOURISM_KAKAO_API_KEY:}
SEOUL_SUBWAY_API_KEY=${SEOUL_SUBWAY_API_KEY:}
BUSAN_BIMS_SERVICE_KEY=${BUSAN_BIMS_SERVICE_KEY:}

unsplash.access-key=${UNSPLASH_ACCESS_KEY:}

# TourAPI real-time calls for reservation flow.
# Keep the issued key outside git when possible: set TOUR_API_SERVICE_KEY in your environment.
tourapi.base-url=https://apis.data.go.kr/B551011/KorService2
tourapi.service-key=${TOUR_API_SERVICE_KEY:}
tourapi.mobile-os=ETC
tourapi.mobile-app=KoreaPoint
tourapi.area-code=6
tourapi.list-path=/areaBasedList2
tourapi.detail-path=/detailCommon2

# Korea Tourism Organization photo gallery fallback for places without TourAPI images.
photoapi.base-url=https://apis.data.go.kr/B551011/PhotoGalleryService1
photoapi.service-key=${PHOTO_API_SERVICE_KEY:}
photoapi.search-path=/gallerySearchList1

# Google OAuth2
spring.config.import=optional:classpath:application-secret.properties,optional:classpath:application-local.properties
spring.security.oauth2.client.registration.google.scope=email,profile


# Neon PostgreSQL (set these values as environment variables; never commit credentials)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Quill ??? base64 ??? ??? ?? (?? 2MB ? 50MB)
server.tomcat.max-http-form-post-size=50MB
