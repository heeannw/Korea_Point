spring.application.name=demo
server.port=8080
#fastapi.base-url=http://172.28.6.127:8000
#fastapi.base-url=http://192.168.219.103:8000

TRANSPORT_KAKAO_API_KEY=${TRANSPORT_KAKAO_API_KEY:}
TRANSPORT_ODSAY_API_KEY=${TRANSPORT_ODSAY_API_KEY:}
TOURISM_KAKAO_API_KEY=${TOURISM_KAKAO_API_KEY:}
SEOUL_SUBWAY_API_KEY=${SEOUL_SUBWAY_API_KEY:}
BUSAN_BIMS_SERVICE_KEY=${BUSAN_BIMS_SERVICE_KEY:}

unsplash.access-key=${UNSPLASH_ACCESS_KEY:}

# Google OAuth2
spring.config.import=optional:classpath:application-secret.properties,optional:classpath:application-local.properties
spring.security.oauth2.client.registration.google.scope=email,profile


spring.datasource.url=jdbc:h2:file:./data/korea_point;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Quill ??? base64 ??? ??? ?? (?? 2MB ? 50MB)
server.tomcat.max-http-form-post-size=50MB
