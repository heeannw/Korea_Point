<!DOCTYPE html>
<html lang="ko" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{reservation.policy.blockedTitle}">예약할 수 없는 장소</title>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
    <link rel="stylesheet" th:href="@{/css/reservation/booking.css}">
</head>
<body class="booking-page">
<main class="page">
    <h1 th:text="#{reservation.policy.blockedTitle}">예약할 수 없는 장소</h1>
    <p th:text="#{reservation.policy.blockedMessage}">장소 설정이나 신청 상태로 인해 진행할 수 없습니다. 무료·예약 미운영 장소인지, 방문 시각이나 결제 기한이 지났는지 확인해 주세요.</p>
    <p th:text="#{reservation.policy.existing}">이미 결제한 예약은 마이페이지에서 확인할 수 있습니다.</p>
    <a class="btn" th:href="@{/ko/reservation(lang=${lang})}" th:text="#{reservation.policy.back}">목록으로 돌아가기</a>
</main>
</body>
</html>
