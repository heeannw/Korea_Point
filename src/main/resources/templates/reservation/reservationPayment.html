<!DOCTYPE html>
<html lang="ko" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="#{reservation.payment.title} + ' | KoreaPoint'">예약금 결제 | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
    <link rel="stylesheet" th:href="@{/css/common/header-menu.css}">
    <link rel="stylesheet" th:href="@{/css/reservation/booking.css}">
</head>
<body class="booking-page booking-payment">
<div th:replace="~{fragments/app-header :: header(${lang == 'zh-CN' ? 'zh' : lang}, ${isLoggedIn}, ${currentUserName})}"></div>

<main class="page payment-page">
    <ol class="booking-steps" aria-label="Reservation progress"><li><span>1</span><span th:text="#{reservation.request.apply}"></span></li><li><span>2</span><span th:text="#{reservation.request.review}"></span></li><li class="active" aria-current="step"><span>3</span><span th:text="#{reservation.ui.step.payment}"></span></li><li><span>4</span><span th:text="#{reservation.ui.step.complete}"></span></li></ol>
    <section class="page-head">
        <div>
            <p class="eyebrow" th:text="#{reservation.payment.eyebrow}">예약금 결제</p>
            <h1 th:text="#{reservation.payment.title}">예약금 결제</h1>
            <p class="sub" th:text="#{reservation.payment.subtitle}">노쇼 방지를 위한 예약금만 결제합니다. 현장 이용금액은 포함되지 않습니다.</p>
        </div>
    </section>

    <div class="payment-layout">
        <section class="panel">
            <h2 class="section-title" th:text="#{reservation.payment.method}">결제수단 선택</h2>
            <p class="error" th:unless="${portOneReady}" th:text="#{reservation.test.setup}">결제를 준비 중입니다.</p>
            <form id="paymentForm" th:data-reservation-id="${reservation.id}" th:object="${paymentRequest}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="payment-methods">
                    <label class="payment-method">
                        <input type="radio" name="paymentMethod" value="CARD" checked>
                        <span th:text="#{reservation.test.card}">신용·체크카드</span>
                    </label>
                </div>
                <span class="error" th:errors="*{paymentMethod}"></span>
                <label class="field"><span th:text="#{reservation.test.phone}">구매자 연락처</span>
                    <input class="input" id="buyerPhone" type="tel" autocomplete="tel" required maxlength="20" pattern="[0-9+() -]{8,20}">
                </label>
                <p id="paymentMessage" role="status" aria-live="polite"></p>

                <button id="payButton" class="btn full payment-submit" type="submit"
                        th:disabled="${!portOneReady}" th:text="#{reservation.test.pay}">결제하기</button>
            </form>
        </section>

        <aside class="panel order-summary">
            <p class="eyebrow small" th:text="#{reservation.payment.summary}">예약 정보</p>
            <h2 th:text="${reservation.placeTitle}">장소명</h2><p th:text="${reservation.reviewNote}"></p>
            <dl class="summary-list compact">
                <div class="summary-row"><dt th:text="#{reservation.payment.date}">예약일</dt><dd th:text="${reservation.reservationDate}">2026-09-10</dd></div>
                <div class="summary-row"><dt th:text="#{reservation.payment.time}">시간</dt><dd th:text="${reservation.reservationTime}">18:00</dd></div>
                <div class="summary-row"><dt th:text="#{reservation.payment.people}">인원</dt><dd th:text="|${reservation.peopleCount}명|">2명</dd></div>
                <div class="summary-row"><dt th:text="#{reservation.request.deadline}"></dt><dd th:text="${#temporals.format(reservation.paymentDeadline, 'yyyy-MM-dd HH:mm')}"></dd></div>
                <div class="summary-row total"><dt>결제할 예약금</dt><dd th:text="|${#numbers.formatInteger(payment.amount, 3, 'COMMA')}원|">10,000원</dd></div>
            </dl>
            <div class="deposit-policy">
                <strong>예약금 정책</strong>
                <p>방문 24시간 전까지 취소하면 전액 환불됩니다. 방문 시 예약금은 현장 이용금액에서 차감됩니다.</p>
            </div>
        </aside>
    </div>
</main>
<script th:src="@{/js/common/header-menu.js}"></script>
<script src="https://cdn.iamport.kr/v1/iamport.js" th:if="${portOneReady}"></script>
<script th:inline="javascript">
    window.paymentText = {
        checking: /*[[#{reservation.test.checking}]]*/ '결제 결과 확인 중...',
        failed: /*[[#{reservation.test.failed}]]*/ '결제를 완료하지 못했습니다.',
        retry: /*[[#{reservation.test.retry}]]*/ '결제 결과를 다시 확인해 주세요.',
        sdk: /*[[#{reservation.test.sdk}]]*/ '결제창을 불러오지 못했습니다.'
    };
    function switchLang(lang) {
        window.location.href = `/ko/reservation?lang=${encodeURIComponent(lang)}`;
    }
</script>
<script th:src="@{/js/reservation/portone-payment.js}"></script>
</body>
</html>
