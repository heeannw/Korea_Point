<!DOCTYPE html>
<html lang="ko" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{reservation.complete.eyebrow} + ' | KoreaPoint'">예약 완료 | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
    <link rel="stylesheet" th:href="@{/css/common/header-menu.css}">
    <link rel="stylesheet" th:href="@{/css/reservation/booking.css}">
</head>
<body class="booking-page booking-complete">
<div th:replace="~{fragments/app-header :: header(${lang == 'zh-CN' ? 'zh' : lang}, ${isLoggedIn}, ${currentUserName})}"></div>

<main class="page">
    <ol class="booking-steps" aria-label="Reservation progress"><li><span>1</span><span th:text="#{reservation.request.apply}"></span></li><li><span>2</span><span th:text="#{reservation.request.review}"></span></li><li><span>3</span><span th:text="#{reservation.ui.step.payment}"></span></li><li class="active" aria-current="step"><span>4</span><span th:text="#{reservation.ui.step.complete}"></span></li></ol>
    <div class="booking-success-mark" aria-hidden="true">✓</div>
    <section class="page-head">
        <div>
            <p class="eyebrow" th:text="#{reservation.complete.eyebrow}">예약 완료</p>
            <h1 th:text="#{reservation.complete.title}">예약이 완료되었습니다</h1>
            <p class="sub" th:text="#{reservation.complete.subtitle}">예약 내용은 안전하게 저장되었으며 마이페이지에서 다시 확인할 수 있습니다.</p>
        </div>
    </section>

    <section class="panel">
        <dl class="summary-list">
            <div class="summary-row">
                <dt>예약번호</dt>
                <dd th:text="${reservationNo}">KP-00000000-0000</dd>
            </div>
            <div class="summary-row">
                <dt>관광지</dt>
                <dd th:text="${place != null ? place.title : reservation.placeTitle}">관광지명</dd>
            </div>
            <div class="summary-row">
                <dt>방문일</dt>
                <dd th:text="${reservation.reservationDate}">2026-07-26</dd>
            </div>
            <div class="summary-row">
                <dt>시간</dt>
                <dd th:text="${reservation.reservationTime}">10:00</dd>
            </div>
            <div class="summary-row">
                <dt>인원</dt>
                <dd th:text="|${reservation.peopleCount}명|">1명</dd>
            </div>
            <div class="summary-row">
                <dt>상태</dt>
                <dd th:text="${reservation.status}">예약 완료</dd>
            </div>
            <div class="summary-row" th:if="${payment != null}">
                <dt>예약금</dt>
                <dd th:text="|${#numbers.formatInteger(payment.amount, 3, 'COMMA')}원|">10,000원</dd>
            </div>
            <div class="summary-row" th:if="${payment != null}">
                <dt>결제 상태</dt>
                <dd th:text="${payment.status.label}">예약금 결제 완료</dd>
            </div>
            <div class="summary-row" th:if="${payment != null and payment.method != null}">
                <dt>결제수단</dt>
                <dd th:text="${payment.method.label}">신용·체크카드</dd>
            </div>
            <div class="summary-row" th:if="${payment != null and payment.approvalNo != null}">
                <dt>승인번호</dt>
                <dd th:text="${payment.approvalNo}">KPAY-000000</dd>
            </div>
            <div class="summary-row" th:if="${reservation.memo != null && !reservation.memo.isBlank()}">
                <dt>메모</dt>
                <dd th:text="${reservation.memo}">메모</dd>
            </div>
        </dl>

        <div class="notice payment-policy" th:if="${payment != null}">
            방문 시 예약금은 현장 이용금액에서 차감됩니다. 방문 24시간 전까지 취소하면 전액 환불됩니다.
        </div>

        <div class="card-actions">
            <a class="btn" th:href="@{/ko/reservation}">다른 관광지 예약</a>
            <a class="btn secondary" th:href="@{/ko/mypage}">마이페이지 보기</a>
        </div>
    </section>
</main>
<script th:src="@{/js/common/header-menu.js}"></script>
<script>
    function switchLang(lang) {
        window.location.href = `/ko/reservation?lang=${encodeURIComponent(lang)}`;
    }
</script>
</body>
</html>
