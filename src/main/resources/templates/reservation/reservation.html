<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약하기 | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Sora:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<header>
    <a class="logo" th:href="@{/ko}">Korea<span>Point</span></a>
    <div class="header-right">
        <a th:href="@{/ko/reservation}" class="h-btn active">예약</a>
        <a th:if="${hasReservation}" class="h-btn"
           th:href="@{/ko/mypage(
                reservationNo=${reservationNo},
                contentId=${reservation.contentId},
                contentTypeId=${reservation.contentTypeId},
                placeTitle=${place != null ? place.title : reservation.placeTitle},
                reservationDate=${reservation.reservationDate},
                reservationTime=${reservation.reservationTime},
                peopleCount=${reservation.peopleCount},
                memo=${reservation.memo}
           )}">마이페이지</a>
        <a th:unless="${hasReservation}" th:href="@{/ko/mypage}" class="h-btn">마이페이지</a>
        <th:block th:if="${isLoggedIn}">
            <span class="h-btn" th:text="${currentUserName}">User</span>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="h-btn h-btn-fill">Logout</button>
            </form>
        </th:block>
    </div>
</header>

<main class="page">
    <section class="page-head">
        <div>
            <p class="eyebrow">Busan Travel</p>
            <h1>관광지 예약 흐름</h1>
            <p class="sub">부산의 관광지를 둘러보고 방문 일정을 예약해보세요.</p>
        </div>
        <a th:if="${hasReservation}" class="btn secondary"
           th:href="@{/ko/mypage(
                reservationNo=${reservationNo},
                contentId=${reservation.contentId},
                contentTypeId=${reservation.contentTypeId},
                placeTitle=${place != null ? place.title : reservation.placeTitle},
                reservationDate=${reservation.reservationDate},
                reservationTime=${reservation.reservationTime},
                peopleCount=${reservation.peopleCount},
                memo=${reservation.memo}
           )}">마이페이지</a>
        <a th:unless="${hasReservation}" class="btn secondary" th:href="@{/ko/mypage}">마이페이지</a>
    </section>

    <div class="notice warning" th:unless="${hasTourApiKey}">
        관광지 목록을 불러오기 위한 설정이 필요합니다.
    </div>

    <form class="toolbar" id="searchForm">
        <input class="input" id="keyword" name="keyword" th:value="${keyword}" placeholder="관광지명 또는 주소로 검색">
        <select class="select" id="contentTypeId" name="contentTypeId" aria-label="카테고리">
            <option value="">전체</option>
            <option value="12">관광지</option>
            <option value="14">문화시설</option>
            <option value="15">행사/공연/축제</option>
            <option value="25">여행코스</option>
            <option value="28">레포츠</option>
            <option value="32">숙박</option>
            <option value="38">쇼핑</option>
            <option value="39">음식점</option>
        </select>
        <button class="btn" type="submit">검색</button>
    </form>

    <section id="placeGrid" class="grid" aria-live="polite"></section>
    <div id="emptyState" class="empty">부산 관광지 목록을 불러오는 중입니다.</div>
    <div class="card-actions" style="justify-content: center; margin-top: 24px;">
        <button class="btn secondary" id="loadMoreBtn" type="button" style="display: none;">더보기</button>
    </div>
</main>

<script>
    const grid = document.getElementById("placeGrid");
    const emptyState = document.getElementById("emptyState");
    const form = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keyword");
    const contentTypeInput = document.getElementById("contentTypeId");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const pageSize = 30;
    let currentPage = 1;
    let currentKeyword = "";
    let currentContentTypeId = "";
    let isLoading = false;

    function escapeHtml(value) {
        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function renderPlaces(places, append = false) {
        if (!append) {
            grid.innerHTML = "";
        }

        if (!places.length && !append) {
            emptyState.style.display = "block";
            emptyState.textContent = "표시할 관광지가 없습니다. 검색어를 바꿔 다시 시도해주세요.";
            loadMoreBtn.style.display = "none";
            return;
        }

        emptyState.style.display = "none";
        grid.insertAdjacentHTML("beforeend", places.map(place => {
            const detailUrl = `/ko/reservation/new?contentId=${encodeURIComponent(place.contentId || "")}&contentTypeId=${encodeURIComponent(place.contentTypeId || "")}&placeTitle=${encodeURIComponent(place.title || "")}`;
            const imageStyle = place.imageUrl ? `style="background-image:url('${escapeHtml(place.imageUrl)}')"` : "";
            return `
                <article class="place-card">
                    <div class="place-image" ${imageStyle}></div>
                    <div class="place-body">
                        <h2 class="place-title">${escapeHtml(place.title || "관광지명 없음")}</h2>
                        <p class="meta">${escapeHtml(place.displayAddress || place.address || "주소 정보 없음")}</p>
                        <p class="meta">${escapeHtml(place.displayTel || place.tel || "전화번호 정보 없음")}</p>
                        <div class="card-actions">
                            <a class="btn" href="${detailUrl}">예약하기</a>
                        </div>
                    </div>
                </article>
            `;
        }).join(""));

        loadMoreBtn.style.display = places.length >= pageSize ? "inline-flex" : "none";
    }

    async function loadPlaces(keyword = "", contentTypeId = "", pageNo = 1, append = false) {
        if (isLoading) return;
        isLoading = true;
        emptyState.style.display = "block";
        emptyState.textContent = append ? "다음 관광지 목록을 불러오는 중입니다." : "부산 관광지 목록을 불러오는 중입니다.";
        loadMoreBtn.disabled = true;
        if (!append) {
            grid.innerHTML = "";
        }

        const params = new URLSearchParams({ pageNo: String(pageNo), numOfRows: String(pageSize) });
        if (keyword.trim()) {
            params.set("keyword", keyword.trim());
        }
        if (contentTypeId.trim()) {
            params.set("contentTypeId", contentTypeId.trim());
        }

        try {
            const response = await fetch(`/api/tourapi/places?${params.toString()}`);
            if (!response.ok) throw new Error("request failed");
            const places = await response.json();
            renderPlaces(places, append);
            currentPage = pageNo;
        } catch (error) {
            emptyState.style.display = "block";
            emptyState.textContent = "관광지 목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
            loadMoreBtn.style.display = "none";
        } finally {
            isLoading = false;
            loadMoreBtn.disabled = false;
        }
    }

    form.addEventListener("submit", event => {
        event.preventDefault();
        currentKeyword = keywordInput.value;
        currentContentTypeId = contentTypeInput.value;
        loadPlaces(currentKeyword, currentContentTypeId, 1, false);
    });

    loadMoreBtn.addEventListener("click", () => {
        loadPlaces(currentKeyword, currentContentTypeId, currentPage + 1, true);
    });

    currentKeyword = keywordInput.value;
    currentContentTypeId = contentTypeInput.value;
    loadPlaces(currentKeyword, currentContentTypeId, 1, false);
</script>
</body>
</html>
