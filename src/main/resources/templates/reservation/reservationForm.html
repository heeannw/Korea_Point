<!DOCTYPE html>
<html lang="ko" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{reservation.form.pageTitle} + ' | KoreaPoint'">예약 정보 입력 | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
    <link rel="stylesheet" th:href="@{/css/common/header-menu.css}">
    <link rel="stylesheet" th:href="@{/css/reservation/booking.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
</head>
<body class="booking-page booking-form">
<div th:replace="~{fragments/app-header :: header(${lang == 'zh-CN' ? 'zh' : lang}, ${isLoggedIn}, ${currentUserName})}"></div>

<main class="page">
    <ol class="booking-steps" th:aria-label="#{reservation.ui.stepsLabel}" aria-label="Reservation progress"><li class="active" aria-current="step"><span>1</span><span th:text="#{reservation.request.apply}"></span></li><li><span>2</span><span th:text="#{reservation.request.review}"></span></li><li><span>3</span><span th:text="#{reservation.ui.step.payment}"></span></li><li><span>4</span><span th:text="#{reservation.ui.step.complete}"></span></li></ol>
    <section class="page-head">
        <div>
            <p class="eyebrow" th:text="#{reservation.form.eyebrow}">예약</p>
            <h1 th:text="#{reservation.form.pageTitle}">예약 정보 입력</h1>
            <p class="sub" th:text="#{reservation.form.subtitle}">방문 날짜와 시간, 인원을 선택해주세요.</p>
        </div>
        <a class="btn secondary" th:href="@{/ko/reservation(lang=${lang})}" th:text="#{reservation.form.back}">목록으로</a>
    </section>

    <div class="booking-checkout-layout">


    <form class="panel booking-input-panel" th:action="@{/ko/reservation/complete}" th:object="${reservationForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{contentId}">
        <input type="hidden" th:field="*{contentTypeId}">
        <input type="hidden" th:field="*{placeTitle}">
        <input type="hidden" th:field="*{lang}">

        <h2 class="section-title" th:text="#{reservation.ui.visit}">방문 정보</h2>
        <div class="form-grid">
            <label class="field">
                <span class="label" th:text="#{reservation.form.date}">예약 날짜</span>
                <div class="reservation-date-picker" id="reservationDatePicker">
                    <input class="input" type="text" th:field="*{reservationDate}"
                           th:placeholder="#{reservation.form.datePlaceholder}" data-input autocomplete="off">
                    <button class="calendar-toggle" type="button" data-toggle
                            th:aria-label="#{reservation.form.openCalendar}">📅</button>
                </div>
                <span class="error" th:errors="*{reservationDate}"></span>
            </label>

            <label class="field">
                <span class="label" th:text="#{reservation.form.time}">예약 시간</span>
                <select class="select" th:field="*{reservationTime}">
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                </select>
                <span class="error" th:errors="*{reservationTime}"></span>
            </label>

            <label class="field">
                <span class="label" th:text="#{reservation.form.people}">인원</span>
                <input class="input" type="number" min="1" max="10" th:field="*{peopleCount}">
                <span class="error" th:errors="*{peopleCount}"></span>
            </label>

            <label class="field full">
                <span class="label" th:text="#{reservation.form.memo}">요청 메모</span>
                <textarea class="textarea" th:field="*{memo}" th:placeholder="#{reservation.form.memoPlaceholder}"></textarea>
            </label>
        </div>

        <div class="deposit-preview">
            <div>
                <strong th:text="#{reservation.request.afterApproval}">승인 후 결제</strong>
                <p th:text="#{reservation.request.applyGuide}">관리자가 이용 가능 여부와 총 예약금을 확인한 후 안내합니다. 신청만으로 예약이 확정되지 않습니다.</p>
            </div>
        </div>

        <div class="card-actions">
            <button class="btn" type="submit" th:text="#{reservation.request.apply}">예약 신청</button>
            <a class="btn secondary" th:href="@{/ko/reservation(lang=${lang})}" th:text="#{reservation.form.cancel}">취소</a>
        </div>
    </form>
    <aside class="panel booking-place-summary">
        <img class="booking-summary-image" th:if="${place != null && place.imageUrl != null && !place.imageUrl.isBlank()}" th:src="${place.imageUrl}" th:alt="${place.title}" onerror="this.hidden=true">
        <p class="eyebrow" th:text="#{reservation.payment.summary}">예약 정보</p>
        <h2 class="place-title" th:text="${place != null ? place.title : reservationForm.placeTitle}">관광지명</h2>
        <p class="meta" th:text="${place != null && place.address != null && !place.address.isBlank() ? place.address : #messages.msg('reservation.list.noAddress')}">주소</p>
        <p class="meta" th:text="${place != null && place.tel != null && !place.tel.isBlank() ? place.tel : #messages.msg('reservation.list.noTel')}">전화번호</p>
        <p class="meta" th:if="${place != null && place.overview != null && !place.overview.isBlank()}" th:text="${place.overview}">설명</p>
        <dl class="reservation-operating-info"
            th:if="${place != null && place.operatingInformation != null && !place.operatingInformation.isEmpty()}">
            <div th:each="detail : ${place.operatingInformation}">
                <dt th:text="${detail.key}">운영 정보</dt>
                <dd th:text="${detail.value}">내용</dd>
            </div>
        </dl>
    </aside>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ko.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ja.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/fr.js"></script>
<script th:src="@{/js/common/header-menu.js}"></script>
<script th:inline="javascript">
    const PAGE_LOCALE = /*[[${lang}]]*/ "ko";
    const minReservationDate = /*[[${today}]]*/ "2026-01-01";
    const calendarLocales = {ko: "ko", ja: "ja", "zh-CN": "zh", fr: "fr", en: "default"};
    const calendarFormats = {ko: "Y년 m월 d일", ja: "Y年m月d日", "zh-CN": "Y年m月d日", fr: "d/m/Y", en: "Y-m-d"};
    if (window.flatpickr) {
        flatpickr("#reservationDatePicker", {
            wrap: true,
            locale: calendarLocales[PAGE_LOCALE] || "default",
            minDate: minReservationDate,
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: calendarFormats[PAGE_LOCALE] || "Y-m-d",
            disableMobile: true
        });
    }
function switchLang(lang) {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
    }
</script>
</body>
</html>
