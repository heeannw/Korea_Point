<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 정보 입력 | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Sora:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
    <script defer th:src="@{/js/trip/trip-translate.js}"></script>
</head>
<body>
<header>
    <a class="logo" th:href="@{/ko}">Korea<span>Point</span></a>
    <div class="header-right">
        <select class="h-btn" id="languageSelect" translate="no" onchange="changeTripLanguage(this.value)" aria-label="언어 선택">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh-CN">中文</option>
        </select>
        <a class="h-btn" th:href="@{/ko/mypage}" href="/ko/mypage" th:text="${currentUserName}">User</a>
    </div>
</header>

<main class="page">
    <section class="page-head">
        <div>
            <p class="eyebrow">Reservation</p>
            <h1>예약 정보 입력</h1>
            <p class="sub">방문 날짜와 시간, 인원을 선택해주세요.</p>
        </div>
        <a class="btn secondary" th:href="@{/ko/reservation}">목록으로</a>
    </section>

    <section class="panel" style="margin-bottom: 18px;">
        <h2 class="place-title" th:text="${place != null ? place.title : reservationForm.placeTitle}">관광지명</h2>
        <p class="meta" th:text="${place != null ? place.displayAddress : '상세 주소 정보가 없습니다.'}">주소</p>
        <p class="meta" th:if="${place != null && place.displayTel != null && !place.displayTel.isBlank()}" th:text="${place.displayTel}">전화번호</p>
        <p class="meta" th:if="${place != null && place.overview != null && !place.overview.isBlank()}" th:text="${place.overview}">설명</p>
    </section>

    <form class="panel" th:action="@{/ko/reservation/complete}" th:object="${reservationForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{contentId}">
        <input type="hidden" th:field="*{contentTypeId}">
        <input type="hidden" th:field="*{placeTitle}">

        <div class="form-grid">
            <label class="field">
                <span class="label">예약 날짜</span>
                <input class="input" type="date" th:field="*{reservationDate}" th:min="${today}">
                <span class="error" th:errors="*{reservationDate}"></span>
            </label>

            <label class="field">
                <span class="label">예약 시간</span>
                <select class="select" th:field="*{reservationTime}">
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                </select>
                <span class="error" th:errors="*{reservationTime}"></span>
            </label>

            <label class="field">
                <span class="label">인원</span>
                <input class="input" type="number" min="1" max="10" th:field="*{peopleCount}">
                <span class="error" th:errors="*{peopleCount}"></span>
            </label>

            <label class="field full">
                <span class="label">요청 메모</span>
                <textarea class="textarea" th:field="*{memo}" placeholder="필요한 요청사항을 입력하세요"></textarea>
            </label>
        </div>

        <div class="card-actions">
            <button class="btn" type="submit">예약 완료</button>
            <a class="btn secondary" th:href="@{/ko/reservation}">취소</a>
        </div>
    </form>
</main>
</body>
</html>
