<!DOCTYPE html>
<html th:lang="${lang}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="#{mypage.points.pageTitle}">포인트 충전 | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Sora:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common/header-menu.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/points.css}">
</head>
<body>
<div th:replace="~{fragments/app-header :: header(${lang}, ${isLoggedIn}, ${currentUserName})}"></div>

<main class="page">
    <section class="page-head">
        <div>
            <p class="eyebrow" th:text="#{mypage.points.eyebrow}">Points</p>
            <h1 th:text="#{mypage.points.title}">포인트 충전</h1>
            <p class="sub" th:text="#{mypage.points.subtitle}">충전한 포인트는 예약금 결제와 사업자 홍보글 작성 등에 쓸 수 있어요.</p>
        </div>
        <div class="head-actions">
            <a class="btn secondary" th:href="@{/ko/mypage(lang=${lang})}" th:text="#{mypage.points.back}">마이페이지로</a>
        </div>
    </section>

    <section class="box balance-box">
        <span th:text="#{mypage.points.balance}">보유 포인트</span>
        <strong th:text="|${user.point}P|">5000P</strong>
    </section>

    <div class="points-layout">
        <section class="box panel">
            <h2 class="section-title" th:text="#{mypage.points.chargeTitle}">포인트 충전</h2>
            <p class="error" th:unless="${portOneReady}" th:text="#{reservation.test.setup}">결제를 준비 중입니다.</p>

            <form id="chargeForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="tier-grid" role="radiogroup" th:aria-label="#{mypage.points.chargeTitle}">
                    <label class="tier-option" th:each="tier, iter : ${chargeTiers}">
                        <input type="radio" name="amount" th:value="${tier}" th:checked="${iter.first}">
                        <span class="tier-amount" th:text="|${#numbers.formatInteger(tier, 3, 'COMMA')}P|">1,000P</span>
                        <span class="tier-price" th:text="#{mypage.points.won(${#numbers.formatInteger(tier, 3, 'COMMA')})}">1,000원</span>
                    </label>
                </div>

                <label class="field">
                    <span class="label" th:text="#{reservation.test.phone}">구매자 연락처</span>
                    <input class="input" id="buyerPhone" type="tel" autocomplete="tel" required maxlength="20" pattern="[0-9+() -]{8,20}">
                </label>

                <p id="chargeMessage" role="status" aria-live="polite"></p>

                <button id="chargeButton" class="btn full" type="submit"
                        th:disabled="${!portOneReady}" th:text="#{mypage.points.chargeButton}">충전하기</button>
            </form>
        </section>

        <section class="box wide history-panel">
            <h2 class="section-title" th:text="#{mypage.points.history}">충전 내역</h2>
            <div th:if="${#lists.isEmpty(chargeHistory)}" class="empty" th:text="#{mypage.points.historyEmpty}">
                아직 충전 내역이 없어요.
            </div>
            <ul class="history-list" th:unless="${#lists.isEmpty(chargeHistory)}">
                <li class="history-row" th:each="charge : ${chargeHistory}">
                    <span class="history-amount" th:text="|${#numbers.formatInteger(charge.amount, 3, 'COMMA')}P|">1,000P</span>
                    <span class="status-badge" th:classappend="${charge.status.name() == 'PAID'} ? ' paid' : (${charge.status.name() == 'FAILED'} ? ' failed' : '')"
                          th:text="${#messages.msg('mypage.points.status.' + charge.status.name())}">충전 완료</span>
                    <span class="history-date" th:text="${#temporals.format(charge.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-19 12:00</span>
                </li>
            </ul>
        </section>
    </div>
</main>
<script th:src="@{/js/common/header-menu.js}"></script>
<script src="https://cdn.iamport.kr/v1/iamport.js" th:if="${portOneReady}"></script>
<script th:inline="javascript">
    window.pointsText = {
        checking: /*[[#{reservation.test.checking}]]*/ '결제 결과를 확인하고 있습니다.',
        failed: /*[[#{reservation.test.failed}]]*/ '결제가 완료되지 않았거나 취소되었습니다.',
        sdk: /*[[#{reservation.test.sdk}]]*/ '결제창을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.',
        selectAmount: /*[[#{mypage.points.selectAmount}]]*/ '충전할 금액을 선택해 주세요.'
    };
</script>
<script th:src="@{/js/point/points-payment.js}"></script>
</body>
</html>
