<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Sora:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<header>
    <a class="logo" th:href="@{/ko}">Korea<span>Point</span></a>
    <div class="header-right">
        <a th:href="@{/ko/reservation}" class="h-btn">예약</a>
        <a th:href="@{/ko/mypage}" class="h-btn active">마이페이지</a>
        <span class="h-btn" th:text="${currentUserName}">User</span>
    </div>
</header>

<main class="page">
    <section class="page-head">
        <div>
            <p class="eyebrow">My Page</p>
            <h1>마이페이지</h1>
            <p class="sub">내 정보와 예약 내역을 확인할 수 있습니다.</p>
        </div>
        <a class="btn" th:href="@{/ko/reservation}">예약하러 가기</a>
    </section>

    <div class="mypage-layout">
        <aside class="panel">
            <h2 class="place-title">내 정보</h2>
            <dl class="summary-list">
                <div class="summary-row">
                    <dt>이름</dt>
                    <dd th:text="${currentUserName}">User</dd>
                </div>
                <div class="summary-row">
                    <dt>상태</dt>
                    <dd>로그인 완료</dd>
                </div>
                <div class="summary-row">
                    <dt>오늘</dt>
                    <dd th:text="${today}">2026-07-26</dd>
                </div>
            </dl>
        </aside>

        <section class="panel">
            <h2 class="place-title">예약 내역</h2>
            <div th:if="${hasReservation}" class="reservation-list">
                <article class="reservation-card" th:each="reservation : ${reservations}">
                    <div class="reservation-card-head">
                        <div>
                            <p class="reservation-no" th:text="${reservation.reservationNo}">KP-00000000-0000</p>
                            <h3 th:text="${reservation.placeTitle}">관광지명</h3>
                        </div>
                        <span class="status-badge" th:text="${reservation.status}">예약 완료</span>
                    </div>
                    <dl class="summary-list compact">
                        <div class="summary-row">
                            <dt>방문일</dt>
                            <dd th:text="${reservation.reservationDate}">2026-07-26</dd>
                        </div>
                        <div class="summary-row">
                            <dt>시간</dt>
                            <dd th:text="${reservation.reservationTime}">10:00</dd>
                        </div>
                        <div class="summary-row">
                            <dt>인원</dt>
                            <dd th:text="|${reservation.peopleCount}명|">1명</dd>
                        </div>
                        <div class="summary-row" th:if="${reservation.memo != null && !reservation.memo.isBlank()}">
                            <dt>메모</dt>
                            <dd th:text="${reservation.memo}">메모</dd>
                        </div>
                    </dl>
                </article>
            </div>
            <div th:unless="${hasReservation}" class="empty" style="margin-top: 12px;">
                아직 예약 내역이 없습니다.<br>
                부산 관광지를 선택하고 예약을 진행해보세요.
            </div>
            <div class="quick-list" style="margin-top: 16px;">
                <a class="btn" th:href="@{/ko/reservation}">부산 관광지 예약하러 가기</a>
                <a class="btn secondary" th:href="@{/ko}">홈으로 이동</a>
            </div>
        </section>
    </div>
</main>
</body>
</html>
