<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>내 여행 일정 | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/trip/trip-plan-list.css}">
    <script defer th:src="@{/js/trip/trip-translate.js}"></script>
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d784d3e5b07bb6954d7053a939f92184"></script>
</head>
<body>
<div id="google_translate_element" style="display:none"></div>
<header>
    <a class="logo" th:href="@{/ko}">Korea<span>Point</span></a>
    <div class="header-actions"><a class="header-btn" href="/ko/trip">새 일정 만들기</a><select class="header-btn" id="languageSelect" onchange="changeTripLanguage(this.value)" aria-label="언어 선택"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">中文</option></select></div>
</header>
<main class="page">
    <h1 class="page-title">내 여행 일정</h1>
    <p class="page-subtitle">저장한 일정을 다시 확인하거나 삭제할 수 있습니다.</p>
    <div id="planGrid" class="plan-grid"><div class="loading">일정을 불러오는 중입니다...</div></div>
    <section id="detail" class="detail"><div class="detail-head"><h2 id="detailTitle" class="detail-title"></h2><div class="detail-head-actions"><button class="edit-btn" onclick="editCurrentPlan()">이 일정으로 다시 만들기</button><button class="close-btn" onclick="closeDetail()">닫기</button></div></div><div id="detailMeta" class="plan-meta"></div><div id="savedPlanMap" class="saved-plan-map"></div><div id="detailDays"></div></section>
    <h2 class="section-title">예약 요청 내역</h2>
    <div id="reservationList" class="reservation-list"><div class="loading">예약 요청을 불러오는 중입니다...</div></div>
</main>
<div class="toast" id="toast"></div>
<script>
    const grid = document.getElementById('planGrid');
    let currentDetailPlan = null;
    let savedPlanMap = null;
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
    function formatDate(value){return value ? new Date(value).toLocaleDateString('ko-KR') : '-'}
    async function loadPlans(){
        const response=await fetch('/api/trip/plan/list');
        if(!response.ok){grid.innerHTML='<div class="empty">일정을 불러오지 못했습니다.</div>';return}
        const plans=await response.json();
        if(!plans.length){grid.innerHTML='<div class="empty">저장한 일정이 없습니다.<br><a href="/ko/trip">첫 일정을 만들어보세요.</a></div>';return}
        grid.innerHTML=plans.map(p=>`<article class="plan-card"><div class="plan-title">${esc(p.title)}</div><div class="plan-meta">${esc(p.preferredAreas||'지역 미정')}<br>${p.travelDays}일 · ${esc(p.companion||'동행 미정')}<br>${formatDate(p.createdAt)}</div><div class="plan-actions"><button class="action-btn detail-btn" onclick="showDetail(${p.id})">상세보기</button><button class="action-btn delete-btn" onclick="deletePlan(${p.id})">삭제</button></div></article>`).join('');
    }
    async function showDetail(id){
        const response=await fetch(`/api/trip/plan/${id}`); if(!response.ok){toast('일정을 불러오지 못했습니다.');return}
        const p=await response.json(); currentDetailPlan=p; document.getElementById('detailTitle').textContent=p.title;
        document.getElementById('detailMeta').textContent=`${p.preferredAreas||'지역 미정'} · ${p.travelDays}일 · ${formatDate(p.createdAt)}`;
        document.getElementById('detailDays').innerHTML=(p.days||[]).map(day=>`<div class="day"><div class="day-title">Day ${day.day}</div>${(day.slots||[]).map(s=>`<div class="slot"><div class="slot-time">${esc(s.time)}</div><div><div class="slot-name">${esc(s.placeName)}</div><div class="slot-reason">${esc(s.reason)}</div></div><div class="slot-duration">${s.durationMinutes ? `${s.durationMinutes}분` : ''}</div></div>`).join('')}</div>`).join('');
        renderSavedMap(p); const detail=document.getElementById('detail');detail.classList.add('open');detail.scrollIntoView({behavior:'smooth'});
    }
    function renderSavedMap(plan){
        const container=document.getElementById('savedPlanMap'),slots=(plan.days||[]).flatMap(day=>day.slots||[]).filter(s=>s.lat&&s.lng);if(!slots.length||!window.kakao){container.style.display='none';return}container.style.display='block';savedPlanMap=new kakao.maps.Map(container,{center:new kakao.maps.LatLng(slots[0].lat,slots[0].lng),level:7});const bounds=new kakao.maps.LatLngBounds();slots.forEach(s=>{const position=new kakao.maps.LatLng(s.lat,s.lng);new kakao.maps.Marker({map:savedPlanMap,position,title:s.placeName});bounds.extend(position)});new kakao.maps.Polyline({map:savedPlanMap,path:slots.map(s=>new kakao.maps.LatLng(s.lat,s.lng)),strokeWeight:4,strokeColor:'#3b82f6',strokeOpacity:.8});savedPlanMap.setBounds(bounds);setTimeout(()=>savedPlanMap.relayout(),100)
    }
    function editCurrentPlan(){if(!currentDetailPlan)return;sessionStorage.setItem('tripEditRequest',JSON.stringify(currentDetailPlan));location.href='/ko/trip'}
    function closeDetail(){document.getElementById('detail').classList.remove('open')}
    async function deletePlan(id){
        if(!confirm('이 일정을 삭제할까요?'))return; const headers={}; if(csrfToken&&csrfHeader)headers[csrfHeader]=csrfToken;
        const response=await fetch(`/api/trip/plan/${id}`,{method:'DELETE',headers}); if(!response.ok){toast('삭제하지 못했습니다.');return} closeDetail();toast('일정이 삭제되었습니다.');loadPlans();
    }
    async function loadReservations(){
        const container=document.getElementById('reservationList'),response=await fetch('/api/trip/reservation/list');
        if(!response.ok){container.innerHTML='<div class="empty">예약 요청을 불러오지 못했습니다.</div>';return}
        const items=await response.json();if(!items.length){container.innerHTML='<div class="empty">예약 요청이 없습니다.</div>';return}
        container.innerHTML=items.map(r=>`<article class="reservation-card"><div><strong>${esc(r.placeName)}</strong><div class="plan-meta">${esc(r.tripTitle)} · ${r.visitDate} ${String(r.visitTime).slice(0,5)} · ${r.partySize}명</div></div><span class="status ${r.status.toLowerCase()}">${r.status}</span>${r.status==='REQUESTED'?`<button class="cancel-btn" onclick="cancelReservation(${r.id})">요청 취소</button>`:''}</article>`).join('');
    }
    async function cancelReservation(id){if(!confirm('예약 요청을 취소할까요?'))return;const headers={};if(csrfToken&&csrfHeader)headers[csrfHeader]=csrfToken;const response=await fetch(`/api/trip/reservation/${id}/cancel`,{method:'PATCH',headers});if(!response.ok){toast('취소하지 못했습니다.');return}toast('예약 요청이 취소되었습니다.');loadReservations()}
    loadPlans().catch(()=>grid.innerHTML='<div class="empty">일정을 불러오지 못했습니다.</div>');
    loadReservations().catch(()=>document.getElementById('reservationList').innerHTML='<div class="empty">예약 요청을 불러오지 못했습니다.</div>');
</script>
</body>
</html>
