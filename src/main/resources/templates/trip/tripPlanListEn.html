<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>My Trips | KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/trip/trip-plan-list.css}">
</head>
<body>
<header><a class="logo" th:href="@{/en}">Korea<span>Point</span></a><div class="header-actions"><a class="header-btn" href="/en/trip">Create Trip</a><a class="header-btn" href="/ko/trip/plans">KR</a></div></header>
<main class="page"><h1 class="page-title">My Trips</h1><p class="page-subtitle">Review or delete your saved itineraries.</p><div id="planGrid" class="plan-grid"><div class="loading">Loading your trips...</div></div><section id="detail" class="detail"><div class="detail-head"><h2 id="detailTitle" class="detail-title"></h2><button class="close-btn" onclick="closeDetail()">Close</button></div><div id="detailMeta" class="plan-meta"></div><div id="detailDays"></div></section><h2 class="section-title">Booking Requests</h2><div id="reservationList" class="reservation-list"><div class="loading">Loading booking requests...</div></div></main><div class="toast" id="toast"></div>
<script>
const grid=document.getElementById('planGrid'),csrfToken=document.querySelector('meta[name="_csrf"]')?.content,csrfHeader=document.querySelector('meta[name="_csrf_header"]')?.content;
const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function formatDate(value){return value?new Date(value).toLocaleDateString('en-US'):'-'}
async function loadPlans(){const response=await fetch('/api/trip/plan/list');if(!response.ok){grid.innerHTML='<div class="empty">Could not load your trips.</div>';return}const plans=await response.json();if(!plans.length){grid.innerHTML='<div class="empty">No saved trips yet.<br><a href="/en/trip">Create your first trip.</a></div>';return}grid.innerHTML=plans.map(p=>`<article class="plan-card"><div class="plan-title">${esc(p.title)}</div><div class="plan-meta">${esc(p.preferredAreas||'Area not set')}<br>${p.travelDays} days · ${esc(p.companion||'Companion not set')}<br>${formatDate(p.createdAt)}</div><div class="plan-actions"><button class="action-btn detail-btn" onclick="showDetail(${p.id})">Details</button><button class="action-btn delete-btn" onclick="deletePlan(${p.id})">Delete</button></div></article>`).join('')}
async function showDetail(id){const response=await fetch(`/api/trip/plan/${id}`);if(!response.ok){toast('Could not load this trip.');return}const p=await response.json();document.getElementById('detailTitle').textContent=p.title;document.getElementById('detailMeta').textContent=`${p.preferredAreas||'Area not set'} · ${p.travelDays} days · ${formatDate(p.createdAt)}`;document.getElementById('detailDays').innerHTML=(p.days||[]).map(day=>`<div class="day"><div class="day-title">Day ${day.day}</div>${(day.slots||[]).map(s=>`<div class="slot"><div class="slot-time">${esc(s.time)}</div><div><div class="slot-name">${esc(s.placeName)}</div><div class="slot-reason">${esc(s.reason)}</div></div><div class="slot-duration">${s.durationMinutes?`${s.durationMinutes} min`:''}</div></div>`).join('')}</div>`).join('');const detail=document.getElementById('detail');detail.classList.add('open');detail.scrollIntoView({behavior:'smooth'})}
function closeDetail(){document.getElementById('detail').classList.remove('open')}
async function deletePlan(id){if(!confirm('Delete this trip?'))return;const headers={};if(csrfToken&&csrfHeader)headers[csrfHeader]=csrfToken;const response=await fetch(`/api/trip/plan/${id}`,{method:'DELETE',headers});if(!response.ok){toast('Could not delete this trip.');return}closeDetail();toast('Trip deleted.');loadPlans()}
async function loadReservations(){const container=document.getElementById('reservationList'),response=await fetch('/api/trip/reservation/list');if(!response.ok){container.innerHTML='<div class="empty">Could not load booking requests.</div>';return}const items=await response.json();if(!items.length){container.innerHTML='<div class="empty">No booking requests yet.</div>';return}container.innerHTML=items.map(r=>`<article class="reservation-card"><div><strong>${esc(r.placeName)}</strong><div class="plan-meta">${esc(r.tripTitle)} · ${r.visitDate} ${String(r.visitTime).slice(0,5)} · ${r.partySize} guests</div></div><span class="status ${r.status.toLowerCase()}">${r.status}</span>${r.status==='REQUESTED'?`<button class="cancel-btn" onclick="cancelReservation(${r.id})">Cancel</button>`:''}</article>`).join('')}
async function cancelReservation(id){if(!confirm('Cancel this booking request?'))return;const headers={};if(csrfToken&&csrfHeader)headers[csrfHeader]=csrfToken;const response=await fetch(`/api/trip/reservation/${id}/cancel`,{method:'PATCH',headers});if(!response.ok){toast('Could not cancel the request.');return}toast('Booking request cancelled.');loadReservations()}
loadPlans().catch(()=>grid.innerHTML='<div class="empty">Could not load your trips.</div>');loadReservations().catch(()=>document.getElementById('reservationList').innerHTML='<div class="empty">Could not load booking requests.</div>');
</script></body></html>
