<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>여행 일정 — KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d784d3e5b07bb6954d7053a939f92184"></script>
    <link rel="stylesheet" th:href="@{/css/common/variables.css}">
    <link rel="stylesheet" th:href="@{/css/common/reset.css}">
    <link rel="stylesheet" th:href="@{/css/trip/trip-result.css}">
    <link rel="stylesheet" th:href="@{/css/common/layout.css}">
    <script defer th:src="@{/js/trip/trip-translate.js}"></script>
</head>
<body th:data-logged-in="${isLoggedIn}">
<div id="google_translate_element" style="display:none"></div>

<!-- ─── 헤더 ─── -->
<header>
    <a class="logo" th:href="@{/}">Korea<span>Point</span></a>
    <div class="header-right">
        <!-- sessionStorage 유지한 채 언어 전환 -->
        <select class="h-btn" id="languageSelect" onchange="changeTripLanguage(this.value)" aria-label="언어 선택"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">中文</option></select>
        <th:block th:if="${isLoggedIn}">
            <button type="button" class="h-btn h-btn-save" id="savePlanBtn" onclick="saveTripPlan()">일정 저장</button>
            <a href="/ko/trip/plans" class="h-btn">내 일정</a>
            <a class="h-btn" th:href="@{/ko/mypage}" href="/ko/mypage" th:text="${currentUserName}"></a>
            <a th:if="${isAdmin}" th:href="@{/admin}" class="h-btn">Admin</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="h-btn h-btn-fill">Logout</button>
            </form>
        </th:block>
        <th:block th:unless="${isLoggedIn}">
            <a th:href="@{/oauth2/authorization/google}" class="h-btn h-btn-fill">Login</a>
        </th:block>
    </div>
</header>

<!-- ─── 앱 바디 ─── -->
<div class="app-body">

    <!-- 사이드바 -->
    <div class="sidebar">
        <div class="back-bar">
            <a class="back-link" href="/ko/trip">← 다시 설정</a>
            <span class="trip-meta" id="tripMeta">로딩 중...</span>
        </div>
        <div class="day-selector" id="daySelector"></div>
        <div class="trip-insight" id="tripInsight" hidden>
            <div class="weather-line" id="weatherLine"></div>
            <div class="air-line" id="airLine" hidden></div>
            <div class="health-line" id="healthLine" hidden></div>
            <div class="warning-line" id="warningLine" hidden></div>
            <div class="festival-line" id="festivalLine" hidden></div>
            <div class="ai-line" id="aiLine"></div>
            <button type="button" class="reoptimize-btn" id="reoptimizeBtn" onclick="reoptimizeRemaining()">현재 날씨로 남은 일정 다시 짜기</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('schedule',this)">📅 일정</button>
            <button class="tab-btn" onclick="switchTab('tourism',this)">🏛️ 관광</button>
            <button class="tab-btn" onclick="switchTab('food',this)">🍽️ 음식</button>
            <button class="tab-btn" onclick="switchTab('cafe',this)">☕ 카페</button>
        </div>
        <div id="tab-schedule" class="tab-content active"><div id="scheduleList"><div class="empty-msg">일정 로딩 중...</div></div></div>
        <div id="tab-tourism" class="tab-content"><div id="tourismList"><div class="empty-msg">추천 관광지 없음</div></div></div>
        <div id="tab-food"    class="tab-content"><div id="foodList"><div class="empty-msg">추천 음식점 없음</div></div></div>
        <div id="tab-cafe"    class="tab-content"><div id="cafeList"><div class="empty-msg">추천 카페 없음</div></div></div>
    </div>

    <!-- 지도 -->
    <div class="map-area">
        <div id="map"></div>

        <div class="map-legend">
            <div class="legend-title">범례</div>
            <div class="legend-item"><div class="legend-dot" style="background:#3b9eff"></div>관광지</div>
            <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>음식점</div>
            <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div>카페</div>
            <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>바</div>
        </div>

        <div class="map-controls">
            <div class="mc" id="mcZI">＋</div>
            <div class="mc" id="mcZO">－</div>
        </div>

        <!-- 장소 상세 패널 -->
        <div class="detail-panel" id="detailPanel">
            <div class="dp-header">
                <button class="dp-back" onclick="closeDetail()">←</button>
                <div class="dp-title" id="dpTitle"></div>
            </div>
            <div class="dp-hero no-image" id="dpHero">
                <button class="dp-hero-nav dp-hero-prev dp-hero-hidden" id="dpImgPrev" type="button" onclick="moveDetailImage(-1)" aria-label="이전 사진">‹</button>
                <button class="dp-hero-nav dp-hero-next dp-hero-hidden" id="dpImgNext" type="button" onclick="moveDetailImage(1)" aria-label="다음 사진">›</button>
                <div class="dp-hero-count dp-hero-hidden" id="dpImgCount"></div>
            </div>
            <div class="dp-body">
                <section class="dp-summary">
                    <div class="dp-badges" id="dpBadges"></div>
                    <div class="dp-name" id="dpName"></div>
                    <div class="dp-sub" id="dpSub">
                        <span class="dp-addr-icon">📍</span>
                        <span id="dpAddr"></span>
                    </div>
                    <div class="dp-rating" id="dpRatingRow" style="display:none">
                        <span class="dp-rating-stars">★</span>
                        <span class="dp-rating-score" id="dpStarScore"></span>
                        <span class="dp-rating-count" id="dpReviewCnt"></span>
                    </div>
                </section>
                <div class="quick-actions">
                    <button class="quick-btn" id="dpTransBtn" type="button"><div class="qb-icon">🚇</div><span class="qb-label">길찾기</span></button>
                    <button class="quick-btn" id="dpNearFoodBtn" type="button"><div class="qb-icon">🍽️</div><span class="qb-label">근처 맛집</span></button>
                    <button class="quick-btn" id="dpNearCafeBtn" type="button"><div class="qb-icon">☕</div><span class="qb-label">근처 카페</span></button>
                    <button class="quick-btn" id="dpShareBtn" type="button"><div class="qb-icon">🔗</div><span class="qb-label">공유</span></button>
                </div>
                <nav class="dp-tabs">
                    <button class="dp-tab active" type="button" data-tab="info" onclick="showDetailTab('info')">정보</button>
                    <button class="dp-tab" type="button" data-tab="reviews" onclick="showDetailTab('reviews')">리뷰</button>
                </nav>
                <section class="tab-panel" id="tab-info">
                    <div class="dp-reason" id="dpReason"></div>
                    <div class="dp-info-row" id="dpInfoRow"></div>
                    <div class="section-card" id="dpDescSection" style="display:none">
                        <div class="section-title">📖 이곳은</div>
                        <div class="dp-desc" id="dpDescText"></div>
                    </div>
                    <div class="section-card" id="dpNearSection" style="display:none">
                        <div class="section-title" id="dpNearTitle"></div>
                        <div id="dpNearList"></div>
                    </div>
                </section>
                <section class="tab-panel" id="tab-reviews" hidden>
                    <div id="dpReviewList"></div>
                </section>
            </div>
            <div class="dp-action">
                <button class="dp-btn dp-btn-secondary" onclick="closeDetail()">← 목록으로</button>
                <button class="dp-btn dp-btn-swap" id="dpSwapBtn" style="display:none" onclick="confirmSwap()">🔄 이 장소로 교체</button>
            </div>
            <!-- 상세 패널 전용 토스트 -->
            <div class="toast dp-toast" id="dpToast"></div>
        </div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">지도에 일정을 그리는 중...</div>
</div>

<!-- 토스트 (상세 패널 안에서도 중앙 표시용 — detail-panel 내부로 이동됨) -->
<div class="toast" id="toast"></div>

<div class="reservation-modal" id="reservationModal" aria-hidden="true">
    <div class="reservation-dialog">
        <button class="reservation-close" type="button" onclick="closeReservationModal()">×</button>
        <h2>예약을 도와드릴까요?</h2>
        <p>예약 요청을 저장하면 내 일정에서 상태를 확인할 수 있습니다. 실제 예약 확정은 매장 확인이 필요합니다.</p>
        <label>장소<select id="reservationPlace"></select></label>
        <div class="reservation-row"><label>날짜<input id="reservationDate" type="date"></label><label>시간<input id="reservationTime" type="time"></label></div>
        <label>인원<input id="reservationParty" type="number" min="1" max="30" value="2"></label>
        <label>요청사항<textarea id="reservationNote" maxlength="500" placeholder="선택사항"></textarea></label>
        <div class="reservation-actions"><button type="button" class="reservation-later" onclick="closeReservationModal()">나중에</button><button type="button" class="reservation-submit" onclick="submitReservation()">예약 요청 저장</button></div>
    </div>
</div>

<script>
    const isLoggedIn = document.body.dataset.loggedIn === 'true';

    /* ─── 토스트 ─── */
    function showToast(msg, duration = 2500) {
        const panelOpen = document.getElementById('detailPanel')?.classList.contains('open');
        const t = document.getElementById(panelOpen ? 'dpToast' : 'toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    async function persistTripPlan(title, options = {}) {
        if (!tripResult || !tripRequest) {
            showToast('저장할 일정이 없습니다.');
            return null;
        }

        const button = document.getElementById('savePlanBtn');
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

        if (button && !options.silent) {
            button.disabled = true;
            button.textContent = '저장 중...';
        }
        try {
            const response = await fetch('/api/trip/plan/save', {
                method: 'POST',
                headers,
                body: JSON.stringify({ title: title.trim(), request: tripRequest, response: tripResult })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || '일정 저장에 실패했습니다.');

            sessionStorage.setItem('savedTripPlanId', data.planId);
            if (button) {
                button.textContent = '저장 완료';
                button.disabled = true;
            }
            if (!options.silent) {
                showToast('일정이 저장되었습니다. 마이페이지에서 확인할 수 있어요.');
            }
            return data.planId;
        } catch (error) {
            if (!options.silent) {
                showToast(error.message);
            }
            if (button && !options.silent) {
                button.disabled = false;
                button.textContent = '일정 저장';
            }
            return null;
        }
    }

    async function saveTripPlan() {
        const title = prompt('일정 제목을 입력해주세요.', defaultTripPlanTitle());
        if (title === null) return;
        await persistTripPlan(title);
    }

    function defaultTripPlanTitle() {
        const days = tripRequest?.travelDays || tripResult?.schedule?.length || 1;
        const areas = Array.isArray(tripRequest?.preferredAreas) && tripRequest.preferredAreas.length
            ? tripRequest.preferredAreas.slice(0, 2).join('·')
            : '부산';
        return `${areas} ${Math.max(0, days - 1)}박 ${days}일`;
    }

    function hideSaveButton() {
        const button = document.getElementById('savePlanBtn');
        if (button) button.style.display = 'none';
    }
    function showSaveButton() {
        const button = document.getElementById('savePlanBtn');
        if (!button) return;
        button.style.display = '';
        button.disabled = false;
        button.textContent = '일정 저장';
    }

    async function autoSaveTripPlan() {
        if (!isLoggedIn || !tripResult || !tripRequest) return;
        const saveKey = JSON.stringify({
            request: tripRequest,
            schedule: tripResult.schedule || []
        });
        if (sessionStorage.getItem('savedTripPlanKey') === saveKey) {
            // 이미 저장된 일정을 보러 들어온 것뿐이라 버튼을 눌러도 할 일이 없다.
            // "저장 완료"로 비활성화만 해두면 왜 안 눌리는지 헷갈리니 숨긴다.
            // (장소를 바꾸는 등 내용이 달라지면 showSaveButton()이 다시 보여준다)
            hideSaveButton();
            return;
        }
        const planId = await persistTripPlan(defaultTripPlanTitle(), {silent: true});
        if (planId) {
            sessionStorage.setItem('savedTripPlanKey', saveKey);
            showToast('일정이 자동 저장되었습니다. 마이페이지에서 확인할 수 있어요.');
        }
    }

    function openReservationModal(planId) {
        const modal = document.getElementById('reservationModal');
        modal.dataset.planId = planId;
        const slots = (tripResult.schedule || []).flatMap(day => (day.slots || []).map(slot => ({...slot, day: day.day})));
        document.getElementById('reservationPlace').innerHTML = slots.map(slot =>
            `<option value="${slot.placeName.replace(/"/g, '&quot;')}" data-time="${slot.time || '12:00'}" data-day="${slot.day}">Day ${slot.day} · ${slot.placeName}</option>`
        ).join('');
        const today = new Date().toISOString().slice(0, 10);
        const dateInput = document.getElementById('reservationDate');
        dateInput.min = today; dateInput.value = reservationDateForDay(slots[0]?.day || 1);
        document.getElementById('reservationTime').value = slots[0]?.time || '12:00';
        document.getElementById('reservationPlace').onchange = event => {
            const selected = event.target.selectedOptions[0];
            document.getElementById('reservationTime').value = selected?.dataset.time || '12:00';
            dateInput.value = reservationDateForDay(Number(selected?.dataset.day || 1));
        };
        modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
    }

    function reservationDateForDay(day) {
        const base = tripRequest.startDate ? new Date(`${tripRequest.startDate}T00:00:00`) : new Date();
        base.setDate(base.getDate() + day - 1);
        return base.toISOString().slice(0, 10);
    }

    function closeReservationModal() {
        const modal = document.getElementById('reservationModal');
        modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true');
    }

    async function submitReservation() {
        const modal = document.getElementById('reservationModal');
        const payload = {
            tripPlanId: Number(modal.dataset.planId),
            placeName: document.getElementById('reservationPlace').value,
            visitDate: document.getElementById('reservationDate').value,
            visitTime: document.getElementById('reservationTime').value,
            partySize: Number(document.getElementById('reservationParty').value),
            requestNote: document.getElementById('reservationNote').value.trim()
        };
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
        const headers = {'Content-Type':'application/json'}; if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        const response = await fetch('/api/trip/reservation', {method:'POST', headers, body:JSON.stringify(payload)});
        if (!response.ok) { showToast('예약 요청을 저장하지 못했습니다.'); return; }
        closeReservationModal(); showToast('예약 요청이 저장되었습니다.');
    }

    /* ─── 카카오 지도 초기화 ─── */
    const map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(35.1796, 129.0756), level: 8
    });
    document.getElementById('mcZI').onclick = () => map.setLevel(map.getLevel() - 1);
    document.getElementById('mcZO').onclick = () => map.setLevel(map.getLevel() + 1);

    const CAT = {
        tourism:{ color:'#3b9eff', icon:'🏛️', label:'관광' },
        food:   { color:'#f59e0b', icon:'🍽️', label:'음식' },
        cafe:   { color:'#10b981', icon:'☕',  label:'카페' },
        bar:    { color:'#8b5cf6', icon:'🍺',  label:'바'  }
    };

    let tripResult = null, tripRequest = null, currentDay = 1;
    let reservedPlaces = new Set();
    // myLoc은 지도 자체에서는 더 이상 자동으로 안 받아온다 — "교통 검색" 버튼 눌렀을 때만
    // (dpTransBtn 핸들러에서) 그때 필요해서 요청한다. 지도 진입하자마자 위치 권한 팝업 뜨는 게
    // 불편하다는 피드백으로 지도용 "내 위치" 버튼/자동 요청은 제거했다.
    let myLoc = null, activeOverlays = [], activeLines = [], dayCache = {};

    /* ─── 탭 전환 ─── */
    function switchTab(id, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + id).classList.add('active');
    }

    /* ─── 카카오 키워드 검색 → 좌표 ─── */
    // 변경 — size=3으로 늘리고, 첫 번째 결과가 서울 범위 내인지 확인
    function kakaoSearch(query) {
        return fetch(`/api/kakao/search?query=${encodeURIComponent(query + ' 부산')}&size=3`)
            .then(r => r.json())
            .then(d => {
                if (!d.documents?.length) return null;
                // 서울 범위(위도 37.4~37.7, 경도 126.7~127.2) 내 첫 번째 결과
                const busanDoc = d.documents.find(doc => {
                    const lat = parseFloat(doc.y), lng = parseFloat(doc.x);
                    return lat > 34.9 && lat < 35.4 && lng > 128.7 && lng < 129.35;
                });
                const doc = busanDoc || d.documents[0];
                return { lat: parseFloat(doc.y), lng: parseFloat(doc.x) };
            })
            .catch(() => null);
    }

    /* ─── 지도 초기화 ─── */
    function clearMap() {
        activeOverlays.forEach(o => o.setMap(null));
        activeLines.forEach(l => l.setMap(null));
        activeOverlays = []; activeLines = [];
        currentResolved = [];
    }

    function fitBounds(coords) {
        if (!coords.length) return;
        const b = new kakao.maps.LatLngBounds();
        coords.forEach(c => b.extend(new kakao.maps.LatLng(c.lat, c.lng)));
        map.setBounds(b);
    }

    let currentResolved = [];

    function latLngToPixel(lat, lng) {
        const proj = map.getProjection();
        return proj.pointFromCoords(new kakao.maps.LatLng(lat, lng));
    }

    function clusterItems(items, thresholdPx = 50) {
        const groups = [];
        const visited = new Array(items.length).fill(false);
        items.forEach((item, i) => {
            if (visited[i] || !item.lat || !item.lng) return;
            const group = [i];
            visited[i] = true;
            const pi = latLngToPixel(item.lat, item.lng);
            items.forEach((other, j) => {
                if (visited[j] || !other.lat || !other.lng) return;
                const pj = latLngToPixel(other.lat, other.lng);
                const dx = pi.x - pj.x, dy = pi.y - pj.y;
                if (Math.sqrt(dx*dx + dy*dy) < thresholdPx) { group.push(j); visited[j] = true; }
            });
            groups.push(group);
        });
        return groups;
    }

    function renderMarkers(resolved) {
        activeOverlays.forEach(o => o.setMap(null));
        activeOverlays = [];
        if (!resolved.length) return;
        const groups = clusterItems(resolved, Math.max(40, 120 / map.getLevel()));
        groups.forEach(group => {
            if (group.length === 1) {
                const item = resolved[group[0]], idx = group[0];
                const cfg  = CAT[item.slot.category] || CAT.tourism;
                const ov = new kakao.maps.CustomOverlay({
                    position: new kakao.maps.LatLng(item.lat, item.lng), yAnchor: 1.1, zIndex: 3,
                    content: `<div style="display:flex;flex-direction:column;align-items:center;cursor:pointer" onclick="focusSlot(${idx})">
                        <div style="width:34px;height:34px;border-radius:50%;background:${cfg.color};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.22);">${cfg.icon}</div>
                        <div style="margin-top:4px;background:${cfg.color};color:#fff;padding:3px 10px;border-radius:50px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18);font-family:'DM Sans',sans-serif;">${item.slot.placeName}</div>
                    </div>`
                });
                ov.setMap(map); activeOverlays.push(ov);
            } else {
                const avgLat = group.reduce((s,i) => s+resolved[i].lat, 0)/group.length;
                const avgLng = group.reduce((s,i) => s+resolved[i].lng, 0)/group.length;
                const ov = new kakao.maps.CustomOverlay({
                    position: new kakao.maps.LatLng(avgLat, avgLng), yAnchor: 0.5, zIndex: 4,
                    content: `<div onclick="zoomToCluster(${avgLat},${avgLng})" style="width:44px;height:44px;border-radius:50%;background:rgba(59,158,255,.9);border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(59,158,255,.45);font-family:'DM Sans',sans-serif;">
                        <div style="font-size:16px;font-weight:900;color:#fff;line-height:1">${group.length}</div>
                        <div style="font-size:8px;color:rgba(255,255,255,.8);margin-top:1px">장소</div>
                    </div>`
                });
                ov.setMap(map); activeOverlays.push(ov);
            }
        });
    }

    function zoomToCluster(lat, lng) {
        map.setLevel(map.getLevel() - 2);
        map.panTo(new kakao.maps.LatLng(lat, lng));
    }

    function renderMarkersOnly(resolved) {
        activeOverlays.forEach(o => o.setMap(null));
        activeOverlays = [];
        if (!resolved.length) return;
        clusterItems(resolved, Math.max(40, 120 / map.getLevel())).forEach(group => {
            if (group.length === 1) {
                const item = resolved[group[0]], idx = group[0];
                const cfg = CAT[item.slot.category] || CAT.tourism;
                const ov = new kakao.maps.CustomOverlay({
                    position: new kakao.maps.LatLng(item.lat, item.lng), yAnchor: 1.1, zIndex: 3,
                    content: `<div style="display:flex;flex-direction:column;align-items:center;cursor:pointer" onclick="focusSlot(${idx})">
                        <div style="width:34px;height:34px;border-radius:50%;background:${cfg.color};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.22);">${cfg.icon}</div>
                        <div style="margin-top:4px;background:${cfg.color};color:#fff;padding:3px 10px;border-radius:50px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18);font-family:'DM Sans',sans-serif;">${item.slot.placeName}</div>
                    </div>`
                });
                ov.setMap(map); activeOverlays.push(ov);
            } else {
                const avgLat = group.reduce((s,i) => s+resolved[i].lat, 0)/group.length;
                const avgLng = group.reduce((s,i) => s+resolved[i].lng, 0)/group.length;
                const ov = new kakao.maps.CustomOverlay({
                    position: new kakao.maps.LatLng(avgLat, avgLng), yAnchor: 0.5, zIndex: 4,
                    content: `<div onclick="zoomToCluster(${avgLat},${avgLng})" style="width:44px;height:44px;border-radius:50%;background:rgba(59,158,255,.9);border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(59,158,255,.45);font-family:'DM Sans',sans-serif;">
                        <div style="font-size:16px;font-weight:900;color:#fff;line-height:1">${group.length}</div>
                        <div style="font-size:8px;color:rgba(255,255,255,.8);margin-top:1px">장소</div>
                    </div>`
                });
                ov.setMap(map); activeOverlays.push(ov);
            }
        });
    }

    let _zoomTimer = null;
    kakao.maps.event.addListener(map, 'zoom_changed', () => {
        if (!currentResolved.length) return;
        clearTimeout(_zoomTimer);
        _zoomTimer = setTimeout(() => renderMarkersOnly(currentResolved), 150);
    });

    function drawRoute(coords) {
        if (coords.length < 2) return;
        // 카테고리별로 구간을 나눠 색상 적용
        for (let i = 0; i < coords.length - 1; i++) {
            const segPath = [
                new kakao.maps.LatLng(coords[i].lat, coords[i].lng),
                new kakao.maps.LatLng(coords[i+1].lat, coords[i+1].lng)
            ];
            const color = (CAT[coords[i].category] || CAT.tourism).color;
            const outline = new kakao.maps.Polyline({ path: segPath, strokeWeight:8, strokeColor:'#ffffff', strokeOpacity:.9,  strokeStyle:'solid' });
            const line    = new kakao.maps.Polyline({ path: segPath, strokeWeight:4, strokeColor:color,     strokeOpacity:.85, strokeStyle:'solid' });
            outline.setMap(map); line.setMap(map);
            activeLines.push(outline, line);
        }
    }

    async function drawDay(day) {
        clearMap(); closeDetail();
        const loadingOverlayEl = document.getElementById('loadingOverlay');
        loadingOverlayEl.querySelector('.loading-text').textContent = '지도에 일정을 그리는 중...';
        loadingOverlayEl.classList.add('show');

        const dayData = tripResult.schedule.find(d => d.day === day);
        if (!dayData || !dayData.slots.length) {
            document.getElementById('loadingOverlay').classList.remove('show');
            document.getElementById('scheduleList').innerHTML = '<div class="empty-msg">슬롯이 없어요</div>';
            return;
        }

        const resolved = [];
        for (const slot of dayData.slots) {
            let lat = slot.lat, lng = slot.lng;
            if (!lat || !lng) {
                const c = await kakaoSearch(slot.placeName);
                if (c) { lat = c.lat; lng = c.lng; }
            }
            resolved.push({ slot, lat, lng });
        }
        dayCache[day] = resolved;
        currentResolved = resolved;

        renderMarkers(resolved);
        const coords = resolved.filter(i => i.lat && i.lng).map(i => ({ lat: i.lat, lng: i.lng, category: i.slot.category }));
        if (coords.length > 1) drawRoute(coords);
        if (coords.length) fitBounds(coords);

        document.getElementById('loadingOverlay').classList.remove('show');
        renderSchedule(day);
    }

    function renderSchedule(day) {
        const dayData = tripResult.schedule.find(d => d.day === day);
        if (!dayData) return;
        renderTripInsight(dayData);
        document.getElementById('scheduleList').innerHTML = dayData.slots.map((slot, idx) => {
            const cfg = CAT[slot.category] || CAT.tourism;
            const isLast = idx === dayData.slots.length - 1;
            return `
        <div class="slot-card" id="sc${idx}" onclick="focusSlot(${idx})">
          <div class="slot-dot-wrap">
            <div class="slot-dot ${slot.category}">${cfg.icon}</div>
            ${!isLast ? '<div class="slot-line"></div>' : ''}
          </div>
          <div class="slot-info">
            <div class="slot-time">${slot.time} · ${cfg.label}${slot.durationMinutes ? ` · ${slot.durationMinutes}분` : ''}</div>
            <div class="slot-name">${slot.placeName}</div>
            ${(reservedPlaces.has(slot.placeName) || slot.locked) ? `<div class="slot-lock"><span>🔒 ${slot.lockReason || '예약 장소'}</span></div>` : ''}
            <div class="slot-reason">${slot.reason || ''}</div>
            <div class="slot-score">score ${(slot.score||0).toFixed(4)}</div>
            ${slot.alternatives?.length
                ? `<span class="alt-toggle" onclick="toggleAlt(event,${idx})">대체 후보 ▾</span>
                 <div class="alt-list" id="al${idx}">
                 ${slot.alternatives.map((a, ai) => `
                   <div class="alt-item" onclick="selectAlt(event,${idx},${ai})">
                     ${a.placeName}
                     <span style="color:var(--blue);font-weight:700"> ${a.score.toFixed(4)}</span>
                     ${a.distanceKm ? `<span style="color:var(--gray)"> · ${a.distanceKm}km</span>` : ''}
                   </div>`).join('')}
                 </div>` : ''}
          </div>
        </div>`;
        }).join('') || '<div class="empty-msg">슬롯이 없어요</div>';
    }

    function renderTripInsight(dayData) {
        const box = document.getElementById('tripInsight');
        const w = dayData.weather;
        document.getElementById('weatherLine').textContent = w
            ? `${weatherIcon(w)} Day ${dayData.day} · ${Math.round(w.temperature)}℃ · 강수 ${w.rainProbability}% · 바람 ${w.windSpeed.toFixed(1)}m/s · ${tripResult.forecastIssuedAt || ''} 발표`
            : `🌦️ Day ${dayData.day} · 제공 가능한 단기예보가 없습니다.`;
        const warning = document.getElementById('warningLine');
        warning.hidden = !tripResult.weatherWarning;
        warning.textContent = tripResult.weatherWarning ? `⚠️ ${tripResult.weatherWarning}` : '';
        renderFestivalLine();
        const air = document.getElementById('airLine');
        air.hidden = !tripResult.airQuality;
        air.textContent = tripResult.airQuality
            ? `😷 부산 대기질 ${tripResult.airQuality.grade} · PM10 ${tripResult.airQuality.pm10} · PM2.5 ${tripResult.airQuality.pm25}` : '';
        const health = document.getElementById('healthLine');
        health.hidden = !tripResult.healthRisk;
        health.textContent = tripResult.healthRisk
            ? `☀️ 자외선 ${tripResult.healthRisk.uvLevel}${tripResult.healthRisk.uvIndex != null ? `(${tripResult.healthRisk.uvIndex})` : ''}${tripResult.healthRisk.heatRisk ? ` · 폭염 ${tripResult.healthRisk.heatRisk}` : ''}${tripResult.healthRisk.coldRisk ? ` · 한파 ${tripResult.healthRisk.coldRisk}` : ''}` : '';
        document.getElementById('aiLine').textContent = tripResult.aiSummary ? `✨ ${tripResult.aiSummary}` : '';
        box.hidden = false;
    }

    function weatherIcon(w) {
        if (w.precipitationType === 'SNOW' || w.precipitationType === 'RAIN_SNOW') return '🌨️';
        if (w.precipitationType === 'RAIN' || w.precipitationType === 'SHOWER' || w.rainProbability >= 50) return '🌧️';
        if (w.sky === 'CLEAR') return '☀️';
        if (w.sky === 'CLOUDY') return '⛅';
        return '☁️';
    }

    /* ─── 여행 기간 축제 안내 — 일정에 실제로 뽑혔는지와 무관하게 항상 보여준다 ─── */
    function festivalRange(startDate, endDate) {
        if (!startDate) return '';
        const fmt = d => `${d.getMonth() + 1}/${d.getDate()}`;
        const s = new Date(startDate);
        const e = endDate ? new Date(endDate) : null;
        return (e && e.getTime() !== s.getTime()) ? `${fmt(s)}~${fmt(e)}` : fmt(s);
    }

    function renderFestivalLine() {
        const el = document.getElementById('festivalLine');
        const festivals = tripResult.festivals || [];
        if (!festivals.length) { el.hidden = true; el.innerHTML = ''; return; }
        el.hidden = false;
        el.innerHTML = '🎉 여행 기간 축제 · ' + festivals.map((f, i) => {
            const range = festivalRange(f.startDate, f.endDate);
            return `<span class="festival-pill" onclick="openFestivalDetail(${i})">${f.title}${range ? ` (${range})` : ''}</span>`;
        }).join('');
    }

    /** 축제 배지를 누르면 (일정에 안 뽑혔더라도) 기존 상세 패널로 바로 보여준다. */
    function openFestivalDetail(idx) {
        const f = (tripResult.festivals || [])[idx];
        if (!f) return;
        const slot = {
            placeName: f.title, category: 'tourism', address: f.address || '',
            imageUrl: f.imageUrl || '', reason: '여행 기간 중 열리는 축제',
            avgRating: 0, reviewCount: 0, reviews: [], alternatives: [],
            contentId: '', contentTypeId: ''
        };
        if (f.lat && f.lng) { map.setLevel(4); map.panTo(new kakao.maps.LatLng(f.lat, f.lng)); }
        openDetail(slot, f.lat, f.lng);
    }

    async function loadReservedPlaces() {
        try {
            const response = await fetch('/api/trip/reservation/list');
            if (!response.ok) return;
            const reservations = await response.json();
            reservedPlaces = new Set(reservations.filter(r => !['CANCELLED','REJECTED'].includes(r.status)).map(r => r.placeName));
        } catch (_) {}
    }

    async function reoptimizeRemaining() {
        const button = document.getElementById('reoptimizeBtn');
        button.disabled = true; button.textContent = '재조정 중...';
        try {
            const response = await fetch('/api/trip/reoptimize', {method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({request:tripRequest, current:tripResult, reservedPlaceNames:[...reservedPlaces]})});
            if (!response.ok) throw new Error('재조정 실패');
            tripResult = await response.json();
            sessionStorage.setItem('tripResult', JSON.stringify(tripResult));
            buildDaySelector(tripResult.schedule); await drawDay(currentDay);
        } catch (e) { alert(e.message); }
        finally { button.disabled = false; button.textContent = '현재 날씨로 남은 일정 다시 짜기'; }
    }

    function focusSlot(idx) {
        document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('active'));
        document.getElementById('sc' + idx)?.classList.add('active');
        const item = dayCache[currentDay]?.[idx];
        if (!item) return;
        if (item.lat && item.lng) { map.setLevel(3); map.panTo(new kakao.maps.LatLng(item.lat, item.lng)); }
        openDetail(item.slot, item.lat, item.lng);
    }

    function selectAlt(e, slotIdx, altIdx) {
        e.stopPropagation();
        const dayData = tripResult.schedule.find(d => d.day === currentDay);
        if (!dayData) return;
        const origSlot = dayData.slots[slotIdx];
        const alt = origSlot?.alternatives?.[altIdx];
        if (!alt) return;

        // alt 자체가 이제 category/주소/사진/평점/contentId까지 다 갖고 있어서
        // 예전처럼 일정·추천 리스트를 뒤져서 짝을 찾는 우회 로직이 필요 없다.
        const altSlot = {
            placeName:   alt.placeName,
            category:    alt.category || origSlot.category,
            time:        origSlot.time,
            reason:      `대체 후보 (원래: ${origSlot.placeName})`,
            score:       alt.score,
            avgRating:   alt.avgRating   || 0,
            reviewCount: alt.reviewCount || 0,
            address:     alt.address     || '',
            imageUrl:    alt.imageUrl    || '',
            reviews:     [],
            contentId:     alt.contentId     || '',
            contentTypeId: alt.contentTypeId || ''
        };

        if (alt.lat && alt.lng) { map.setLevel(3); map.panTo(new kakao.maps.LatLng(alt.lat, alt.lng)); }
        _pendingSwap = { dayIdx: currentDay, slotIdx, altSlot, alt };
        openDetail(altSlot, alt.lat, alt.lng, true);
    }

    function toggleAlt(e, idx) {
        e.stopPropagation();
        const el = document.getElementById('al' + idx);
        el?.classList.toggle('show');
        e.target.textContent = el?.classList.contains('show') ? '대체 후보 ▴' : '대체 후보 ▾';
    }

    /* ─── 교체 확정 ─── */
    let _pendingSwap = null;

    function confirmSwap() {
        if (!_pendingSwap) return;
        const { dayIdx, slotIdx, altSlot, alt } = _pendingSwap;
        const dayData = tripResult.schedule.find(d => d.day === dayIdx);
        if (!dayData) return;
        const orig = dayData.slots[slotIdx];
        dayData.slots[slotIdx] = {
            ...orig,
            placeName: altSlot.placeName, reason: altSlot.reason,
            score: altSlot.score, lat: alt.lat, lng: alt.lng,
            address: altSlot.address, imageUrl: altSlot.imageUrl,
            avgRating: altSlot.avgRating, reviewCount: altSlot.reviewCount,
            reviews: altSlot.reviews, alternatives: orig.alternatives,
            contentId: altSlot.contentId, contentTypeId: altSlot.contentTypeId
        };
        // 이미 저장된 일정을 보다가 장소를 바꾼 거라 저장 버튼을 숨겨뒀을 수 있는데,
        // 바뀐 내용을 저장할 수 있게 다시 보여준다.
        showSaveButton();
        if (dayCache[dayIdx]?.[slotIdx]) {
            dayCache[dayIdx][slotIdx].slot = dayData.slots[slotIdx];
            // alt 좌표 없으면 kakaoSearch로 보완
            if (alt.lat && alt.lng) {
                dayCache[dayIdx][slotIdx].lat = alt.lat;
                dayCache[dayIdx][slotIdx].lng = alt.lng;
            } else {
                kakaoSearch(alt.placeName).then(c => {
                    if (c) {
                        dayCache[dayIdx][slotIdx].lat = c.lat;
                        dayCache[dayIdx][slotIdx].lng = c.lng;
                    }
                });
            }
        }
        _pendingSwap = null;
        closeDetail();
        renderSchedule(dayIdx);
        activeLines.forEach(l => l.setMap(null));
        activeLines = [];
        const newResolved = dayCache[dayIdx];
        renderMarkers(newResolved);
        currentResolved = newResolved;
        const coords = newResolved.filter(i => i.lat && i.lng).map(i => ({ lat: i.lat, lng: i.lng, category: i.slot.category }));
        if (coords.length > 1) drawRoute(coords);
        if (coords.length) fitBounds(coords);
    }

    /* ─── 장소 상세 패널 (관광 페이지 상세 패널과 동일한 구조: 캐러셀·quick-actions·탭) ─── */
    let detailImages = [], detailImageIndex = 0;

    function setDetailImages(images) {
        detailImages = [...new Set((images || []).filter(Boolean))];
        detailImageIndex = 0;
        renderDetailImage();
    }
    function moveDetailImage(direction) {
        if (detailImages.length < 2) return;
        detailImageIndex = (detailImageIndex + direction + detailImages.length) % detailImages.length;
        renderDetailImage();
    }
    function renderDetailImage() {
        const hero = document.getElementById('dpHero');
        const hasImage = detailImages.length > 0;
        const current = hasImage ? detailImages[detailImageIndex] : '';
        hero.style.backgroundImage = current ? `url("${String(current).replace(/"/g, '%22')}")` : '';
        hero.classList.toggle('no-image', !hasImage);
        const multiple = detailImages.length > 1;
        document.getElementById('dpImgPrev').classList.toggle('dp-hero-hidden', !multiple);
        document.getElementById('dpImgNext').classList.toggle('dp-hero-hidden', !multiple);
        const counter = document.getElementById('dpImgCount');
        counter.classList.toggle('dp-hero-hidden', !multiple);
        counter.textContent = multiple ? `${detailImageIndex + 1} / ${detailImages.length}` : '';
    }
    function showDetailTab(name) {
        ['info', 'reviews'].forEach(tab => {
            const panel = document.getElementById('tab-' + tab);
            if (panel) panel.hidden = tab !== name;
            document.querySelector(`.dp-tab[data-tab="${tab}"]`)?.classList.toggle('active', tab === name);
        });
    }

    function openDetail(slot, lat, lng, isAlt = false) {
        const cfg = CAT[slot.category] || CAT.tourism;
        showDetailTab('info');
        setDetailImages([slot.imageUrl]);

        document.getElementById('dpTitle').textContent = slot.placeName;
        document.getElementById('dpName').textContent  = slot.placeName;

        const addrEl = document.getElementById('dpAddr');
        addrEl.textContent = slot.address || '부산';
        document.getElementById('dpSub').style.display = 'flex';

        const badges = document.getElementById('dpBadges');
        badges.innerHTML = `<span class="dp-badge db-blue">${cfg.label}</span>`;

        const ratingRow = document.getElementById('dpRatingRow');
        if (slot.avgRating && slot.avgRating > 0) {
            document.getElementById('dpStarScore').textContent = slot.avgRating.toFixed(1);
            document.getElementById('dpReviewCnt').textContent =
                slot.reviewCount ? `리뷰 ${slot.reviewCount.toLocaleString()}개` : '방문자 평점 기반';
            ratingRow.style.display = 'flex';
        } else {
            ratingRow.style.display = 'none';
        }

        const reasonEl = document.getElementById('dpReason');
        if (slot.reason) { reasonEl.textContent = '💡 ' + slot.reason; reasonEl.style.display = 'block'; }
        else { reasonEl.style.display = 'none'; }

        document.getElementById('dpInfoRow').innerHTML = '';
        document.getElementById('dpNearSection').style.display = 'none';
        document.getElementById('dpDescSection').style.display = 'none';
        loadPlaceFullDetail(slot.contentId, slot.contentTypeId);

        const revList = document.getElementById('dpReviewList');
        if (slot.reviews && slot.reviews.length > 0) {
            revList.innerHTML = slot.reviews.map((r, idx) => {
                const stars = '★'.repeat(Math.round(r.rating)) + '☆'.repeat(5 - Math.round(r.rating));
                const showTime = r.timeDesc && !r.timeDesc.includes('KoreaPoint');
                return `
          <div class="review-item">
            <div class="ri-top">
              <span class="ri-author">${r.author || '익명'}</span>
              <div class="ri-meta">
                <span class="ri-stars">${stars}</span>
                ${showTime ? `<span class="ri-time">${r.timeDesc}</span>` : ''}
              </div>
            </div>
            <div class="ri-text" id="riText${idx}">${r.text}</div>
            ${r.text && r.text.length > 80 ? `<span class="ri-more" onclick="toggleReview(${idx})">더 보기</span>` : ''}
          </div>`;
            }).join('');
        } else {
            revList.innerHTML = '<div class="no-review">등록된 리뷰가 없어요</div>';
        }

        // ── 근처 맛집/근처 카페 — 관광페이지는 목록 페이지로 이동시키지만 트립엔 그런 페이지가 없어서
        //    같은 자리에 인라인으로 후보를 보여주는 방식으로 대체한다.
        document.getElementById('dpNearFoodBtn').onclick = () => loadNearbyPlaces(lat, lng, 'food', '🍽️ 근처 맛집');
        document.getElementById('dpNearCafeBtn').onclick = () => loadNearbyPlaces(lat, lng, 'cafe', '☕ 근처 카페');
        document.getElementById('dpShareBtn').onclick = async () => {
            try {
                if (navigator.share) await navigator.share({ title: slot.placeName, url: location.href });
                else { await navigator.clipboard.writeText(location.href); showToast('링크를 복사했어요'); }
            } catch (e) { /* 공유 취소는 무시 */ }
        };

        // ── 교통 검색 버튼(길찾기) — 위치 권한 요청 전 토스트로 안내 ──
        document.getElementById('dpTransBtn').onclick = () => {
            const dest = encodeURIComponent(slot.placeName);
            const base = `/ko/transport/search?end=${dest}`;

            if (!navigator.geolocation) {
                location.href = base;
                return;
            }

            // 이미 위치 확보된 경우 바로 사용
            if (myLoc) {
                showToast('📍 현재 위치를 출발지로 사용합니다');
                location.href = `${base}&startLat=${myLoc.lat}&startLng=${myLoc.lng}`;
                return;
            }

            showToast('📍 현재 위치를 출발지로 사용합니다');

            const btn = document.getElementById('dpTransBtn');
            const orig = btn.innerHTML;
            btn.innerHTML = '📍 위치 확인 중...';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                pos => {
                    myLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    location.href = `${base}&startLat=${myLoc.lat}&startLng=${myLoc.lng}`;
                },
                () => {
                    btn.innerHTML = orig;
                    btn.disabled = false;
                    location.href = base;
                },
                { timeout: 5000 }
            );
        };

        document.getElementById('dpSwapBtn').style.display = isAlt ? 'flex' : 'none';
        document.getElementById('detailPanel').classList.add('open');
    }

    function toggleReview(idx) {
        const el = document.getElementById('riText' + idx);
        const btn = el.nextElementSibling;
        if (el.classList.contains('expanded')) { el.classList.remove('expanded'); btn.textContent = '더 보기'; }
        else { el.classList.add('expanded'); btn.textContent = '접기'; }
    }

    function closeDetail() {
        document.getElementById('detailPanel').classList.remove('open');
    }

    /* ─── 관광페이지 수준 상세정보(운영시간·전화번호·메뉴 등) — TourAPI contentId 있는 장소만 가능 ─── */
    const DETAIL_FIELD_LABELS = {
        usetime:'이용시간', restdate:'휴무일', infocenter:'문의처', parking:'주차',
        usetimeculture:'이용시간', restdateculture:'휴무일', usefee:'이용요금', parkingculture:'주차',
        eventstartdate:'시작일', eventenddate:'종료일', eventplace:'장소', playtime:'공연시간',
        usetimefestival:'이용시간', spendtimefestival:'관람 소요시간',
        distance:'거리', schedule:'일정', taketime:'소요시간', infocentertourcourse:'문의처',
        openperiod:'운영기간', usetimeleports:'이용시간', restdateleports:'휴무일', reservation:'예약안내',
        expagerangeleports:'체험 가능 연령', usefeeleports:'이용요금',
        checkintime:'체크인', checkouttime:'체크아웃', reservationurl:'예약', roomcount:'객실 수', parkinglodging:'주차',
        opentime:'영업시간', restdateshopping:'휴무일', saleitem:'판매 품목',
        firstmenu:'대표메뉴', opentimefood:'영업시간', restdatefood:'휴무일', reservationfood:'예약안내', treatmenu:'취급메뉴'
    };
    let fullDetailRequestId = 0;
    async function loadPlaceFullDetail(contentId, contentTypeId) {
        const infoRow = document.getElementById('dpInfoRow');
        const myRequestId = ++fullDetailRequestId;
        if (!contentId) return; // 큐레이션 장소는 상세조회 불가 — 사진 1장/개요/리뷰만으로 충분히 보여준다
        try {
            const params = new URLSearchParams({ contentId });
            if (contentTypeId) params.set('contentTypeId', contentTypeId);
            const response = await fetch(`/api/trip/place/full-detail?${params.toString()}`);
            if (myRequestId !== fullDetailRequestId) return;
            const data = response.ok ? await response.json() : {};
            const rows = [];
            if (data.tel) rows.push(['전화번호', data.tel]);
            const details = data.details || {};
            Object.entries(DETAIL_FIELD_LABELS).forEach(([key, label]) => {
                if (details[key]) rows.push([label, details[key]]);
            });
            if (data.homepage) rows.push(['홈페이지', data.homepage.replace(/<[^>]*>/g, '')]);
            infoRow.innerHTML = rows.map(([label, value]) =>
                `<div class="dp-info"><div class="dp-info-label">${label}</div><div class="dp-info-val">${value}</div></div>`
            ).join('');
            // 관광페이지처럼 실제 등록된 여러 장 사진이 있으면 캐러셀로 보여준다.
            if (data.images && data.images.length > 1) setDetailImages(data.images);
            // 장소 소개 — TourAPI 원문 개요(overview)를 그대로 보여준다. Gemini 생성 문구는 쓰지 않는다.
            const descSection = document.getElementById('dpDescSection');
            const descText = document.getElementById('dpDescText');
            if (myRequestId === fullDetailRequestId && data.overview) {
                descText.innerHTML = data.overview.replace(/<[^>]*>/g, '');
                descSection.style.display = 'block';
            } else if (myRequestId === fullDetailRequestId) {
                descSection.style.display = 'none';
            }
        } catch (e) { /* 실패해도 나머지(개요·리뷰)는 그대로 보여준다 */ }
    }

    /* ─── 근처 맛집/근처 카페 — 트립의 기존 후보 풀에서 가까운 순으로 몇 곳만 보여준다 ─── */
    let nearRequestId = 0;
    async function loadNearbyPlaces(lat, lng, category, title) {
        const section = document.getElementById('dpNearSection');
        const titleEl = document.getElementById('dpNearTitle');
        const listEl = document.getElementById('dpNearList');
        const myRequestId = ++nearRequestId;
        if (!lat || !lng) return;
        titleEl.textContent = title;
        section.style.display = 'block';
        listEl.innerHTML = '<div class="dp-detail-loading">근처를 찾는 중...</div>';
        // 이용시간·소개글 등으로 정보 탭이 길어지면 이 섹션이 화면 아래로 밀려서 눌러도
        // 아무 반응 없는 것처럼 보인다 — 채워 넣자마자 바로 눈에 보이게 스크롤한다.
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        try {
            const params = new URLSearchParams({ lat, lng, category, limit: 6 });
            const response = await fetch(`/api/trip/place/nearby?${params.toString()}`);
            if (myRequestId !== nearRequestId) return;
            const list = response.ok ? await response.json() : [];
            listEl.innerHTML = list.length
                ? list.map(p => `<div class="rec-card" onclick='openDetail(${JSON.stringify({
                    placeName: p.name, category: p.category, lat: p.lat, lng: p.lng, address: p.address,
                    imageUrl: p.imageUrl, avgRating: p.avgRating, reviewCount: p.reviewCount,
                    reason: '', reviews: [], durationMinutes: 0, alternatives: [],
                    contentId: p.contentId, contentTypeId: p.contentTypeId
                }).replace(/'/g, "&apos;")}, ${p.lat}, ${p.lng})'>
                    <div class="rec-info"><div class="rec-name">${p.name}</div>${p.address ? `<div class="rec-reason">${p.address}</div>` : ''}</div>
                  </div>`).join('')
                : '<div class="empty-msg">근처에서 못 찾았어요</div>';
        } catch (e) {
            if (myRequestId === nearRequestId) listEl.innerHTML = '<div class="empty-msg">근처를 불러오지 못했어요</div>';
        }
    }

    /* ─── 추천 리스트 렌더링 ─── */
    let recListCache = { tourismList: [], foodList: [], cafeList: [] };

    /** 추천 리스트(관광/음식/카페 탭)에서도 일정 슬롯이랑 똑같이 눌러서 바로 상세정보/경로검색 보이게. */
    function renderRecList(containerId, list) {
        recListCache[containerId] = list || [];
        document.getElementById(containerId).innerHTML = list?.length
            ? list.map((p, i) => `
          <div class="rec-card" onclick="openRecDetail('${containerId}', ${i})">
            <div class="rec-rank">${i+1}</div>
            <div class="rec-info">
              <div class="rec-name">${p.name}</div>
              <div class="rec-reason">${p.reason||''}</div>
              <div class="rec-score">score ${p.score?.toFixed(4)||'-'}</div>
            </div>
          </div>`).join('')
            : '<div class="empty-msg">추천 결과가 없어요</div>';
    }

    function openRecDetail(containerId, idx) {
        const p = recListCache[containerId]?.[idx];
        if (!p) return;
        if (p.lat && p.lng) { map.setLevel(3); map.panTo(new kakao.maps.LatLng(p.lat, p.lng)); }
        openDetail({
            placeName: p.name, category: p.category || 'tourism', lat: p.lat, lng: p.lng,
            address: p.address, imageUrl: p.imageUrl, avgRating: p.avgRating, reviewCount: p.reviewCount,
            reason: p.reason, reviews: [], durationMinutes: 0, alternatives: [],
            contentId: p.contentId, contentTypeId: p.contentTypeId
        }, p.lat, p.lng);
    }

    /* ─── 일차 버튼 생성 ─── */
    function buildDaySelector(schedule) {
        document.getElementById('daySelector').innerHTML = schedule.map(d => `
      <button class="day-btn${d.day===1?' active':''}" id="db${d.day}" onclick="selectDay(${d.day})">
        ${d.day}일차
      </button>`).join('');
    }

    function selectDay(day) {
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('db' + day)?.classList.add('active');
        currentDay = day;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector('.tab-btn').classList.add('active');
        document.getElementById('tab-schedule').classList.add('active');
        drawDay(day);
    }

    /* ─── 초기화 ─── */
    window.addEventListener('load', async () => {
        const raw = sessionStorage.getItem('tripResult');
        if (!raw) {
            document.getElementById('scheduleList').innerHTML =
                '<div class="empty-msg">결과가 없습니다.<br><a href="/ko/trip" style="color:var(--blue)">다시 설정하기</a></div>';
            return;
        }
        tripResult  = JSON.parse(raw);
        tripRequest = JSON.parse(sessionStorage.getItem('tripRequest') || '{}');
        // 예약 정보 조회(loadReservedPlaces)가 느리면 지도를 그리기 전까지 화면이 텅 비어
        // 보이던 문제 — 초기화 시작하자마자 로딩 스피너부터 띄운다.
        const loadingOverlayEl = document.getElementById('loadingOverlay');
        const loadingTextEl = loadingOverlayEl.querySelector('.loading-text');
        loadingTextEl.textContent = '일정을 불러오는 중...';
        loadingOverlayEl.classList.add('show');
        await loadReservedPlaces();

        const days = tripRequest.travelDays || tripResult.schedule.length;
        const area = (tripRequest.preferredAreas||[]).slice(0,2).join(', ') || '부산';
        document.getElementById('tripMeta').textContent = `${area} · ${days-1}박 ${days}일`;

        buildDaySelector(tripResult.schedule);
        renderRecList('tourismList', tripResult.tourismList);
        renderRecList('foodList',    tripResult.foodList);
        renderRecList('cafeList',    tripResult.cafeList);

        // 저장된 일정 목록(tripPlanList.html)에서 슬롯 하나를 눌러서 넘어온 경우 —
        // 그 날짜를 펼치고 상세 패널까지 자동으로 열어준다.
        const openReq = sessionStorage.getItem('openTripSlot');
        sessionStorage.removeItem('openTripSlot');
        let openDay = 1, openIdx = null;
        if (openReq) {
            try {
                const o = JSON.parse(openReq);
                if (o.day) openDay = o.day;
                if (typeof o.idx === 'number') openIdx = o.idx;
            } catch (_) {}
        }
        if (openDay !== 1) {
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('db' + openDay)?.classList.add('active');
            currentDay = openDay;
        }
        await drawDay(openDay);
        if (openIdx !== null) focusSlot(openIdx);

        await autoSaveTripPlan();
    });
</script>
</body>
</html>
