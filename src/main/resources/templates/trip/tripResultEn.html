<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Itinerary — KoreaPoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d784d3e5b07bb6954d7053a939f92184"></script>
  <link rel="stylesheet" th:href="@{/css/trip/trip-result.css}">
</head>
<body>

<!-- ─── 헤더 ─── -->
<header>
  <a class="logo" th:href="@{/}">Korea<span>Point</span></a>
  <div class="header-right">
    <a href="/en/trip/result" class="h-btn active">EN</a>
    <a href="/ko/trip/result" class="h-btn">KR</a>
        <th:block th:if="${isLoggedIn}">
            <span class="h-btn" th:text="${currentUserName}"></span>
            <a th:if="${isAdmin}" th:href="@{/admin}" class="h-btn">Admin</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="h-btn h-btn-fill">Logout</button>
            </form>
    </th:block>
    <th:block th:unless="${isLoggedIn}">
      <a th:href="@{/oauth2/authorization/google}" class="h-btn h-btn-fill">Login</a>
    </th:block>
  </div>
</header>

<!-- ─── 앱 바디 ─── -->
<div class="app-body">

  <div class="sidebar">
    <div class="back-bar">
      <a class="back-link" href="/en/trip">← Plan Again</a>
      <span class="trip-meta" id="tripMeta">Loading…</span>
    </div>
    <div class="day-selector" id="daySelector"></div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('schedule',this)">📅 Schedule</button>
      <button class="tab-btn" onclick="switchTab('tourism',this)">🏛️ Sights</button>
      <button class="tab-btn" onclick="switchTab('food',this)">🍽️ Food</button>
      <button class="tab-btn" onclick="switchTab('cafe',this)">☕ Cafés</button>
    </div>
    <div id="tab-schedule" class="tab-content active"><div id="scheduleList"><div class="empty-msg">Loading schedule…</div></div></div>
    <div id="tab-tourism" class="tab-content"><div id="tourismList"><div class="empty-msg">No recommendations</div></div></div>
    <div id="tab-food"    class="tab-content"><div id="foodList"><div class="empty-msg">No recommendations</div></div></div>
    <div id="tab-cafe"    class="tab-content"><div id="cafeList"><div class="empty-msg">No recommendations</div></div></div>
  </div>

  <!-- 지도 -->
  <div class="map-area">
    <div id="map"></div>

    <div class="map-legend">
      <div class="legend-title">Legend</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3b9eff"></div>Sightseeing</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Food</div>
      <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div>Café</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Bar</div>
    </div>

    <div class="map-controls">
      <div class="mc" id="mcZI">＋</div>
      <div class="mc" id="mcZO">－</div>
    </div>
    <button class="loc-btn" onclick="goMyLoc()">📍 My Location</button>

    <!-- 장소 상세 패널 -->
    <div class="detail-panel" id="detailPanel">
      <div class="dp-header">
        <button class="dp-back" onclick="closeDetail()">←</button>
        <div class="dp-title" id="dpTitle"></div>
      </div>
      <div class="dp-img" id="dpImg">🏙️</div>
      <div class="dp-body">
        <div class="dp-badge-row" id="dpBadges"></div>
        <div class="dp-name" id="dpName"></div>
        <div class="dp-sub" id="dpSub">
          <span class="dp-addr-icon">📍</span>
          <span id="dpAddr"></span>
        </div>
        <div class="dp-rating-row" id="dpRatingRow" style="display:none">
          <div class="dp-star-score" id="dpStarScore"></div>
          <div class="dp-star-wrap">
            <div class="dp-stars-visual" id="dpStarsVisual"></div>
            <div class="dp-review-cnt" id="dpReviewCnt"></div>
          </div>
        </div>
        <div class="dp-reason" id="dpReason"></div>
        <div class="dp-review-section" id="dpReviewSection" style="display:none">
          <div class="dp-section-title">💬 Reviews</div>
          <div id="dpReviewList"></div>
        </div>
      </div>
      <div class="dp-action">
        <button class="dp-btn dp-btn-secondary" onclick="closeDetail()">← Back to List</button>
        <button class="dp-btn dp-btn-swap" id="dpSwapBtn" style="display:none" onclick="confirmSwap()">🔄 Replace with this</button>
        <button class="dp-btn dp-btn-primary" id="dpTransBtn">🚇 Get Directions</button>
      </div>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Drawing your itinerary on the map…</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const KAKAO_KEY = 'KakaoAK 91fbd7e68922180d0fe82982e0a20c92';

  /* ─── 토스트 ─── */
  function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  /* ─── 카카오 지도 ─── */
  const map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7
  });
  document.getElementById('mcZI').onclick = () => map.setLevel(map.getLevel() - 1);
  document.getElementById('mcZO').onclick = () => map.setLevel(map.getLevel() + 1);

  const CAT = {
    tourism:{ color:'#3b9eff', icon:'🏛️', label:'Sightseeing' },
    food:   { color:'#f59e0b', icon:'🍽️', label:'Food' },
    cafe:   { color:'#10b981', icon:'☕',  label:'Café' },
    bar:    { color:'#8b5cf6', icon:'🍺',  label:'Bar'  }
  };

  let tripResult = null, tripRequest = null, currentDay = 1;
  let myLoc = null, activeOverlays = [], activeLines = [], dayCache = {};
  let currentResolved = [];

  /* ─── 내 위치 ─── */
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      myLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const img = new kakao.maps.MarkerImage(
              'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
              new kakao.maps.Size(24, 35)
      );
      new kakao.maps.Marker({ map, position: new kakao.maps.LatLng(myLoc.lat, myLoc.lng), image: img });
      new kakao.maps.CustomOverlay({
        map, position: new kakao.maps.LatLng(myLoc.lat, myLoc.lng), yAnchor: 2.5,
        content: `<div style="background:#3b9eff;color:#fff;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap;">📍 My Location</div>`
      });
    }, ()=>{});
  }
  function goMyLoc() {
    if (!myLoc) { alert('Still detecting your location…'); return; }
    map.setLevel(3); map.panTo(new kakao.maps.LatLng(myLoc.lat, myLoc.lng));
  }

  function switchTab(id, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + id).classList.add('active');
  }

  // 변경 — size=3으로 늘리고, 첫 번째 결과가 서울 범위 내인지 확인
  function kakaoSearch(query) {
    return fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(query + ' 서울')}&size=3`, {
      headers: { Authorization: KAKAO_KEY }
    })
            .then(r => r.json())
            .then(d => {
              if (!d.documents?.length) return null;
              // 서울 범위(위도 37.4~37.7, 경도 126.7~127.2) 내 첫 번째 결과
              const seoulDoc = d.documents.find(doc => {
                const lat = parseFloat(doc.y), lng = parseFloat(doc.x);
                return lat > 37.4 && lat < 37.7 && lng > 126.7 && lng < 127.2;
              });
              const doc = seoulDoc || d.documents[0];
              return { lat: parseFloat(doc.y), lng: parseFloat(doc.x) };
            })
            .catch(() => null);
  }

  function clearMap() {
    activeOverlays.forEach(o => o.setMap(null));
    activeLines.forEach(l => l.setMap(null));
    activeOverlays = []; activeLines = [];
    currentResolved = [];
  }

  function fitBounds(coords) {
    if (!coords.length) return;
    const b = new kakao.maps.LatLngBounds();
    coords.forEach(c => b.extend(new kakao.maps.LatLng(c.lat, c.lng)));
    map.setBounds(b);
  }

  function latLngToPixel(lat, lng) {
    return map.getProjection().pointFromCoords(new kakao.maps.LatLng(lat, lng));
  }

  function clusterItems(items, thresholdPx = 50) {
    const groups = [], visited = new Array(items.length).fill(false);
    items.forEach((item, i) => {
      if (visited[i] || !item.lat || !item.lng) return;
      const group = [i]; visited[i] = true;
      const pi = latLngToPixel(item.lat, item.lng);
      items.forEach((other, j) => {
        if (visited[j] || !other.lat || !other.lng) return;
        const pj = latLngToPixel(other.lat, other.lng);
        const dx = pi.x - pj.x, dy = pi.y - pj.y;
        if (Math.sqrt(dx*dx + dy*dy) < thresholdPx) { group.push(j); visited[j] = true; }
      });
      groups.push(group);
    });
    return groups;
  }

  function renderMarkers(resolved) {
    activeOverlays.forEach(o => o.setMap(null));
    activeOverlays = [];
    if (!resolved.length) return;
    clusterItems(resolved, Math.max(40, 120 / map.getLevel())).forEach(group => {
      if (group.length === 1) {
        const item = resolved[group[0]], idx = group[0];
        const cfg = CAT[item.slot.category] || CAT.tourism;
        const ov = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(item.lat, item.lng), yAnchor: 1.1, zIndex: 3,
          content: `<div style="display:flex;flex-direction:column;align-items:center;cursor:pointer" onclick="focusSlot(${idx})">
                        <div style="width:34px;height:34px;border-radius:50%;background:${cfg.color};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.22);">${cfg.icon}</div>
                        <div style="margin-top:4px;background:${cfg.color};color:#fff;padding:3px 10px;border-radius:50px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18);font-family:'DM Sans',sans-serif;">${item.slot.placeName}</div>
                    </div>`
        });
        ov.setMap(map); activeOverlays.push(ov);
      } else {
        const avgLat = group.reduce((s,i) => s+resolved[i].lat, 0)/group.length;
        const avgLng = group.reduce((s,i) => s+resolved[i].lng, 0)/group.length;
        const ov = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(avgLat, avgLng), yAnchor: 0.5, zIndex: 4,
          content: `<div onclick="zoomToCluster(${avgLat},${avgLng})" style="width:44px;height:44px;border-radius:50%;background:rgba(59,158,255,.9);border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(59,158,255,.45);font-family:'DM Sans',sans-serif;">
                        <div style="font-size:16px;font-weight:900;color:#fff;line-height:1">${group.length}</div>
                        <div style="font-size:8px;color:rgba(255,255,255,.8);margin-top:1px">places</div>
                    </div>`
        });
        ov.setMap(map); activeOverlays.push(ov);
      }
    });
  }

  function zoomToCluster(lat, lng) {
    map.setLevel(map.getLevel() - 2);
    map.panTo(new kakao.maps.LatLng(lat, lng));
  }

  let _zoomTimer = null;
  kakao.maps.event.addListener(map, 'zoom_changed', () => {
    if (!currentResolved.length) return;
    clearTimeout(_zoomTimer);
    _zoomTimer = setTimeout(() => {
      activeOverlays.forEach(o => o.setMap(null)); activeOverlays = [];
      renderMarkers(currentResolved);
    }, 150);
  });

  function drawRoute(coords) {
    if (coords.length < 2) return;
    const path = coords.map(c => new kakao.maps.LatLng(c.lat, c.lng));
    const outline = new kakao.maps.Polyline({ path, strokeWeight:8, strokeColor:'#ffffff', strokeOpacity:.9, strokeStyle:'solid' });
    const line    = new kakao.maps.Polyline({ path, strokeWeight:4, strokeColor:'#3b9eff', strokeOpacity:.85, strokeStyle:'solid' });
    outline.setMap(map); line.setMap(map);
    activeLines.push(outline, line);
  }

  // 슬롯별 색상으로 구간 선 그리기
  function drawRouteSegmented(resolved) {
    const items = resolved.filter(i => i.lat && i.lng);
    if (items.length < 2) return;
    for (let i = 0; i < items.length - 1; i++) {
      const from  = items[i];
      const to    = items[i + 1];
      const color = (CAT[from.slot.category] || CAT.tourism).color;
      const path  = [
        new kakao.maps.LatLng(from.lat, from.lng),
        new kakao.maps.LatLng(to.lat,   to.lng)
      ];
      const outline = new kakao.maps.Polyline({ path, strokeWeight:8, strokeColor:'#ffffff', strokeOpacity:.85, strokeStyle:'solid' });
      const line    = new kakao.maps.Polyline({ path, strokeWeight:4, strokeColor:color,     strokeOpacity:.9,  strokeStyle:'solid' });
      outline.setMap(map); line.setMap(map);
      activeLines.push(outline, line);
    }
  }

  async function drawDay(day) {
    clearMap(); closeDetail();
    document.getElementById('loadingOverlay').classList.add('show');

    const dayData = tripResult.schedule.find(d => d.day === day);
    if (!dayData || !dayData.slots.length) {
      document.getElementById('loadingOverlay').classList.remove('show');
      document.getElementById('scheduleList').innerHTML = '<div class="empty-msg">No slots for this day</div>';
      return;
    }

    const resolved = [];
    for (const slot of dayData.slots) {
      let lat = slot.lat, lng = slot.lng;
      if (!lat || !lng) {
        const c = await kakaoSearch(slot.placeName);
        if (c) { lat = c.lat; lng = c.lng; }
      }
      resolved.push({ slot, lat, lng });
    }
    dayCache[day] = resolved;
    currentResolved = resolved;

    renderMarkers(resolved);
    const coords = resolved.filter(i => i.lat && i.lng).map(i => ({ lat: i.lat, lng: i.lng }));
    if (coords.length > 1) drawRouteSegmented(resolved);
    if (coords.length) fitBounds(coords);

    document.getElementById('loadingOverlay').classList.remove('show');
    renderSchedule(day);
  }

  function renderSchedule(day) {
    const dayData = tripResult.schedule.find(d => d.day === day);
    if (!dayData) return;
    document.getElementById('scheduleList').innerHTML = dayData.slots.map((slot, idx) => {
      const cfg = CAT[slot.category] || CAT.tourism;
      const isLast = idx === dayData.slots.length - 1;
      return `
        <div class="slot-card" id="sc${idx}" onclick="focusSlot(${idx})">
          <div class="slot-dot-wrap">
            <div class="slot-dot ${slot.category}">${cfg.icon}</div>
            ${!isLast ? '<div class="slot-line"></div>' : ''}
          </div>
          <div class="slot-info">
            <div class="slot-time">${slot.time} · ${cfg.label}</div>
            <div class="slot-name">${slot.placeName}</div>
            <div class="slot-reason">${slot.reason || ''}</div>
            <div class="slot-score">score ${(slot.score||0).toFixed(4)}</div>
            ${slot.alternatives?.length
              ? `<span class="alt-toggle" onclick="toggleAlt(event,${idx})">Alternatives ▾</span>
                 <div class="alt-list" id="al${idx}">
                 ${slot.alternatives.map((a, ai) => `
                   <div class="alt-item" onclick="selectAlt(event,${idx},${ai})">
                     ${a.placeName}
                     <span style="color:var(--blue);font-weight:700"> ${a.score.toFixed(4)}</span>
                     ${a.distanceKm ? `<span style="color:var(--gray)"> · ${a.distanceKm}km</span>` : ''}
                   </div>`).join('')}
                 </div>` : ''}
          </div>
        </div>`;
    }).join('') || '<div class="empty-msg">No slots</div>';
  }

  function focusSlot(idx) {
    document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('active'));
    document.getElementById('sc' + idx)?.classList.add('active');
    const item = dayCache[currentDay]?.[idx];
    if (!item) return;
    if (item.lat && item.lng) { map.setLevel(3); map.panTo(new kakao.maps.LatLng(item.lat, item.lng)); }
    openDetail(item.slot, item.lat, item.lng);
  }

  function selectAlt(e, slotIdx, altIdx) {
    e.stopPropagation();
    const dayData = tripResult.schedule.find(d => d.day === currentDay);
    if (!dayData) return;
    const origSlot = dayData.slots[slotIdx];
    const alt = origSlot?.alternatives?.[altIdx];
    if (!alt) return;

    let matchSlot = null;
    for (const day of tripResult.schedule) {
      matchSlot = day.slots.find(s => s.placeName === alt.placeName);
      if (matchSlot) break;
    }
    if (!matchSlot) {
      const allRec = [...(tripResult.foodList||[]), ...(tripResult.tourismList||[]), ...(tripResult.cafeList||[])];
      const rec = allRec.find(r => r.name === alt.placeName);
      if (rec) matchSlot = { placeName: rec.name, avgRating: rec.avgRating, reviewCount: rec.reviewCount, address: rec.address, imageUrl: rec.imageUrl, reviews: [] };
    }

    const altSlot = {
      placeName:   alt.placeName,
      category:    origSlot.category,
      time:        origSlot.time,
      reason:      `Alternative (original: ${origSlot.placeName})`,
      score:       alt.score,
      avgRating:   matchSlot?.avgRating   || 0,
      reviewCount: matchSlot?.reviewCount || 0,
      address:     matchSlot?.address     || '',
      imageUrl:    matchSlot?.imageUrl    || '',
      reviews:     matchSlot?.reviews     || []
    };

    if (alt.lat && alt.lng) { map.setLevel(3); map.panTo(new kakao.maps.LatLng(alt.lat, alt.lng)); }
    _pendingSwap = { dayIdx: currentDay, slotIdx, altSlot, alt };
    openDetail(altSlot, alt.lat, alt.lng, true);
  }

  function toggleAlt(e, idx) {
    e.stopPropagation();
    const el = document.getElementById('al' + idx);
    el?.classList.toggle('show');
    e.target.textContent = el?.classList.contains('show') ? 'Alternatives ▴' : 'Alternatives ▾';
  }

  /* ─── Replace confirmation ─── */
  let _pendingSwap = null;

  function confirmSwap() {
    if (!_pendingSwap) return;
    const { dayIdx, slotIdx, altSlot, alt } = _pendingSwap;
    const dayData = tripResult.schedule.find(d => d.day === dayIdx);
    if (!dayData) return;
    const orig = dayData.slots[slotIdx];
    dayData.slots[slotIdx] = {
      ...orig,
      placeName: altSlot.placeName, reason: altSlot.reason,
      score: altSlot.score, lat: alt.lat, lng: alt.lng,
      address: altSlot.address, imageUrl: altSlot.imageUrl,
      avgRating: altSlot.avgRating, reviewCount: altSlot.reviewCount,
      reviews: altSlot.reviews, alternatives: orig.alternatives
    };
    if (dayCache[dayIdx]?.[slotIdx]) {
      dayCache[dayIdx][slotIdx].slot = dayData.slots[slotIdx];
      // alt 좌표 없으면 kakaoSearch로 보완
      if (alt.lat && alt.lng) {
        dayCache[dayIdx][slotIdx].lat = alt.lat;
        dayCache[dayIdx][slotIdx].lng = alt.lng;
      } else {
        kakaoSearch(alt.placeName).then(c => {
          if (c) {
            dayCache[dayIdx][slotIdx].lat = c.lat;
            dayCache[dayIdx][slotIdx].lng = c.lng;
          }
        });
      }
    }
    _pendingSwap = null;
    closeDetail();
    renderSchedule(dayIdx);
    activeLines.forEach(l => l.setMap(null));
    activeLines = [];
    const newResolved = dayCache[dayIdx];
    renderMarkers(newResolved);
    currentResolved = newResolved;
    if (newResolved.filter(i => i.lat && i.lng).length > 1) drawRouteSegmented(newResolved);
    const coords = newResolved.filter(i => i.lat && i.lng).map(i => ({ lat: i.lat, lng: i.lng }));
    if (coords.length) fitBounds(coords);
  }

  /* ─── 장소 상세 패널 ─── */
  function openDetail(slot, lat, lng, isAlt = false) {
    const cfg = CAT[slot.category] || CAT.tourism;

    const imgEl = document.getElementById('dpImg');
    if (slot.imageUrl) {
      imgEl.style.backgroundImage = `url('${slot.imageUrl}')`;
      imgEl.style.backgroundSize  = 'cover';
      imgEl.style.backgroundPosition = 'center';
      imgEl.textContent = '';
    } else {
      imgEl.style.backgroundImage = '';
      imgEl.textContent = cfg.icon;
      imgEl.style.fontSize = '52px';
    }

    document.getElementById('dpTitle').textContent = slot.placeName;
    document.getElementById('dpName').textContent  = slot.placeName;
    document.getElementById('dpAddr').textContent  = slot.address || 'Seoul';
    document.getElementById('dpSub').style.display = 'flex';
    document.getElementById('dpBadges').innerHTML  = `<span class="dp-badge db-blue">${cfg.label}</span>`;

    const ratingRow = document.getElementById('dpRatingRow');
    if (slot.avgRating && slot.avgRating > 0) {
      document.getElementById('dpStarScore').textContent = slot.avgRating.toFixed(1);
      const stars = document.getElementById('dpStarsVisual');
      stars.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const s = document.createElement('span');
        s.className = 'dp-star ' + (i <= Math.floor(slot.avgRating) ? 'filled' : (i - slot.avgRating < 1 && i - slot.avgRating > 0 ? 'half' : ''));
        s.textContent = '★';
        stars.appendChild(s);
      }
      document.getElementById('dpReviewCnt').textContent =
              slot.reviewCount
                      ? `${slot.reviewCount.toLocaleString()} ${slot.reviewCount === 1 ? 'review' : 'reviews'}`
                      : 'Rating based on visitors';
      ratingRow.style.display = 'flex';
    } else {
      ratingRow.style.display = 'none';
    }

    const reasonEl = document.getElementById('dpReason');
    if (slot.reason) { reasonEl.textContent = '💡 ' + slot.reason; reasonEl.style.display = 'block'; }
    else { reasonEl.style.display = 'none'; }

    const revSection = document.getElementById('dpReviewSection');
    const revList    = document.getElementById('dpReviewList');
    if (slot.reviews && slot.reviews.length > 0) {
      revList.innerHTML = slot.reviews.map((r, idx) => {
        const stars = '★'.repeat(Math.round(r.rating)) + '☆'.repeat(5 - Math.round(r.rating));
        const showTime = r.timeDesc && !r.timeDesc.includes('KoreaPoint');
        return `
          <div class="review-item">
            <div class="ri-top">
              <span class="ri-author">${r.author || 'Anonymous'}</span>
              <div class="ri-meta">
                <span class="ri-stars">${stars}</span>
                ${showTime ? `<span class="ri-time">${r.timeDesc}</span>` : ''}
              </div>
            </div>
            <div class="ri-text" id="riText${idx}">${r.text}</div>
            ${r.text && r.text.length > 80 ? `<span class="ri-more" onclick="toggleReview(${idx})">Read more</span>` : ''}
          </div>`;
      }).join('');
      revSection.style.display = 'block';
    } else {
      revList.innerHTML = '<div class="no-review">No reviews yet</div>';
      revSection.style.display = 'block';
    }

    // ── 교통 검색 버튼 — 위치 권한 요청 전 토스트로 안내 ──
    document.getElementById('dpTransBtn').onclick = () => {
      const dest = encodeURIComponent(slot.placeName);
      const base = `/en/transport/search?end=${dest}`;

      if (!navigator.geolocation) {
        location.href = base;
        return;
      }

      // ✅ 위치 권한 팝업 뜨기 전에 토스트로 먼저 안내
      showToast('📍 Using your current location as the starting point');

      const btn = document.getElementById('dpTransBtn');
      const orig = btn.textContent;
      btn.textContent = '📍 Detecting location…';
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
              pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                location.href = `${base}&startLat=${lat}&startLng=${lng}`;
              },
              () => {
                btn.textContent = orig;
                btn.disabled = false;
                location.href = base;
              },
              { timeout: 5000 }
      );
    };

    document.getElementById('dpSwapBtn').style.display = isAlt ? 'flex' : 'none';
    document.getElementById('detailPanel').classList.add('open');
  }

  function toggleReview(idx) {
    const el = document.getElementById('riText' + idx);
    const btn = el.nextElementSibling;
    if (el.classList.contains('expanded')) { el.classList.remove('expanded'); btn.textContent = 'Read more'; }
    else { el.classList.add('expanded'); btn.textContent = 'Show less'; }
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
  }

  function renderRecList(containerId, list) {
    document.getElementById(containerId).innerHTML = list?.length
            ? list.map((p, i) => `
          <div class="rec-card">
            <div class="rec-rank">${i+1}</div>
            <div class="rec-info">
              <div class="rec-name">${p.name}</div>
              <div class="rec-reason">${p.reason||''}</div>
              <div class="rec-score">score ${p.score?.toFixed(4)||'-'}</div>
            </div>
          </div>`).join('')
            : '<div class="empty-msg">No recommendations</div>';
  }

  function buildDaySelector(schedule) {
    document.getElementById('daySelector').innerHTML = schedule.map(d => `
      <button class="day-btn${d.day===1?' active':''}" id="db${d.day}" onclick="selectDay(${d.day})">
        Day ${d.day}
      </button>`).join('');
  }

  function selectDay(day) {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('db' + day)?.classList.add('active');
    currentDay = day;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector('.tab-btn').classList.add('active');
    document.getElementById('tab-schedule').classList.add('active');
    drawDay(day);
  }

  /* ─── 초기화 ─── */
  window.addEventListener('load', () => {
    const raw = sessionStorage.getItem('tripResult');
    if (!raw) {
      document.getElementById('scheduleList').innerHTML =
              '<div class="empty-msg">No results found.<br><a href="/en/trip" style="color:var(--blue)">Plan again</a></div>';
      return;
    }
    tripResult  = JSON.parse(raw);
    tripRequest = JSON.parse(sessionStorage.getItem('tripRequest') || '{}');

    const days = tripRequest.travelDays || tripResult.schedule.length;
    const area = (tripRequest.preferredAreas||[]).slice(0,2).join(', ') || 'Seoul';
    document.getElementById('tripMeta').textContent = `${area} · ${days-1}N ${days}D`;

    buildDaySelector(tripResult.schedule);
    renderRecList('tourismList', tripResult.tourismList);
    renderRecList('foodList',    tripResult.foodList);
    renderRecList('cafeList',    tripResult.cafeList);
    drawDay(1);
  });
</script>
</body>
</html>
