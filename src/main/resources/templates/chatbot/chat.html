<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korea Point | 부산 이야기 챗봇</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b9eff;
            --primary-dark: #1a7de0;
            --dark: #0f172a;
            --gray: #64748b;
            --light: #f0f7ff;
            --white: #ffffff;
            --border: #dbeafe;
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Sans KR", sans-serif;
            background: var(--light);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: "Playfair Display", serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--primary-dark);
            text-decoration: none;
        }
        .logo span { color: var(--dark); }
        .back-link {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray);
            text-decoration: none;
        }
        .back-link:hover { color: var(--primary); }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .chat-shell {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .intro {
            text-align: center;
            color: var(--gray);
            font-size: 14px;
            padding: 32px 16px;
        }
        .intro h1 {
            font-size: 22px;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .msg-row { display: flex; }
        .msg-row.user { justify-content: flex-end; }
        .msg-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-line;
        }
        .msg-row.user .msg-bubble {
            background: var(--primary);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .msg-row.bot .msg-bubble {
            background: var(--white);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg-sources {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .source-chip {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary-dark);
            background: var(--light);
            padding: 4px 10px;
            border-radius: 50px;
        }
        .typing { color: var(--gray); font-size: 13px; }
        footer {
            padding: 16px 24px 24px;
            background: var(--light);
        }
        .composer {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: 50px;
            padding: 8px 8px 8px 20px;
        }
        .composer input {
            flex: 1;
            border: none;
            outline: none;
            font: inherit;
            font-size: 14px;
        }
        .composer button {
            border: none;
            background: var(--primary);
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .composer button:hover { background: var(--primary-dark); }
        .composer button:disabled { background: var(--gray); cursor: not-allowed; }
    </style>
</head>
<body>
<header>
    <a class="logo" th:href="@{/ko}" href="/ko">Korea<span>Point</span></a>
    <a class="back-link" th:href="@{/ko}" href="/ko">← 홈으로</a>
</header>

<main id="chatMain">
    <div class="chat-shell" id="chatShell">
        <div class="intro">
            <h1>🤖 부산 이야기 챗봇</h1>
            <p>부산의 설화와 장소에 얽힌 이야기를 물어보세요.</p>
        </div>
    </div>
</main>

<footer>
    <form class="composer" id="chatForm">
        <input type="text" id="chatInput" placeholder="예) 해운대에 얽힌 전설 있어?" autocomplete="off" required>
        <button type="submit" id="chatSend">보내기</button>
    </form>
</footer>

<script th:inline="javascript">
    const form = document.getElementById('chatForm');
    const input = document.getElementById('chatInput');
    const shell = document.getElementById('chatShell');
    const sendBtn = document.getElementById('chatSend');
    const main = document.getElementById('chatMain');

    function addMessage(role, text) {
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = text;
        row.appendChild(bubble);
        shell.appendChild(row);
        main.scrollTop = main.scrollHeight;
        return bubble;
    }

    function addSources(bubble, sources) {
        if (!sources || sources.length === 0) return;
        const box = document.createElement('div');
        box.className = 'msg-sources';
        sources.forEach(source => {
            const chip = document.createElement('span');
            chip.className = 'source-chip';
            chip.textContent = '📖 ' + source.title;
            box.appendChild(chip);
        });
        bubble.appendChild(box);
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (!question) return;

        addMessage('user', question);
        input.value = '';
        sendBtn.disabled = true;
        const typingBubble = addMessage('bot', '');
        typingBubble.classList.add('typing');
        typingBubble.textContent = '이야기를 찾아보는 중...';

        try {
            const response = await fetch('/chatbot/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const data = await response.json();
            typingBubble.classList.remove('typing');
            typingBubble.textContent = data.answer || '답변을 받지 못했어요.';
            addSources(typingBubble, data.sources);
        } catch (error) {
            typingBubble.classList.remove('typing');
            typingBubble.textContent = '답변을 가져오지 못했어요. 잠시 후 다시 시도해 주세요.';
            console.error('chatbot ask error', error);
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    });
</script>
</body>
</html>
