<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="#{chatbot.page.title}">Korea Point | 부산 이야기 챗봇</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common/header-menu.css}">
    <style>
        :root {
            --primary: #3b9eff;
            --primary-dark: #1a7de0;
            --blue: #3b9eff;
            --blue-dk: #1a7de0;
            --dark: #0f172a;
            --gray: #64748b;
            --light: #f0f7ff;
            --white: #ffffff;
            --border: #dbeafe;
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Sans KR", sans-serif;
            background: var(--white);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            flex: none;
        }
        .logo {
            font-family: "Playfair Display", serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--primary-dark);
            text-decoration: none;
        }
        .logo span { color: var(--dark); }
        .back-link {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray);
            text-decoration: none;
        }
        .back-link:hover { color: var(--primary); }

        .layout {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* ===== 왼쪽: 지난 대화 목록 ===== */
        .sidebar {
            width: 260px;
            flex: none;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }
        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            padding: 10px;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            background: transparent;
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }
        .new-chat-btn:hover { background: var(--light); border-color: var(--primary); }
        .sidebar-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--gray);
            margin: 4px 4px 8px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .history-row {
            position: relative;
            display: flex;
            align-items: center;
            border-radius: 10px;
            transition: background 0.15s ease;
        }
        .history-row:hover { background: var(--light); }
        .history-row.active { background: var(--light); }
        .history-item {
            flex: 1;
            min-width: 0;
            display: block;
            text-align: left;
            padding: 10px 4px 10px 12px;
            border: none;
            background: transparent;
            font-size: 13px;
            color: var(--dark);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-row.active .history-item { color: var(--primary-dark); font-weight: 700; }
        /* GPT처럼 삭제/이름 바꾸기를 항상 보이는 두 아이콘 대신 "⋯" 버튼 하나로 묶고,
           눌렀을 때만 작은 메뉴로 두 항목을 보여준다. */
        .history-menu-btn {
            display: none;
            flex: none;
            width: 26px;
            height: 26px;
            margin-right: 4px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            border-radius: 6px;
            color: var(--gray);
            align-items: center;
            justify-content: center;
        }
        .history-menu-btn:hover { background: var(--border); color: var(--dark); }
        .history-row:hover .history-menu-btn,
        .history-row.menu-open .history-menu-btn { display: flex; }
        .history-row.editing .history-menu-btn { display: none; }
        /* 메뉴 팝오버는 공용 헤더(app-header)의 드롭다운과 같은 스타일(.user-menu-pop)을
           그대로 재사용한다 — 위치만 이 버튼 기준으로 다시 잡는다. */
        .history-menu-btn-wrap { position: relative; }
        .history-menu-btn-wrap .user-menu-pop { right: 0; left: auto; min-width: 140px; }
        .history-edit-input {
            flex: 1;
            min-width: 0;
            margin: 3px 6px;
            padding: 7px 8px;
            border: 1.5px solid var(--primary);
            border-radius: 8px;
            font: inherit;
            font-size: 13px;
            color: var(--dark);
            background: var(--white);
            outline: none;
        }
        .history-empty {
            font-size: 12px;
            color: #9aa7bd;
            padding: 8px 12px;
        }

        /* ===== 오른쪽: 채팅 영역 ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .chat-shell {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .intro {
            text-align: center;
            padding: 32px 16px;
        }
        .intro p {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
        }
        /* 대화 시작 전 — ChatGPT처럼 인사말+입력창을 화면 중앙에 두고, 첫 메시지를 보내는
           순간 입력창을 하단(footer)으로 옮긴다(moveComposerToFooter/Intro, 아래 JS). */
        .chat-area.empty main {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-area.empty footer { display: none; }
        /* .chat-shell은 원래 메시지 말풍선 폭(720px)에 맞춘 값이라, 대화 시작 전 이 안에 있는
           입력창까지 같이 좁아져 보였다(.composer 자체 max-width는 860px인데 부모가 더 좁아서
           못 넓어짐) — 빈 화면일 때만 말풍선이 아직 없으니 .composer 폭에 맞춰 넓혀준다. */
        .chat-area.empty .chat-shell { width: 100%; max-width: 860px; }
        .intro .composer { margin-top: 24px; }
        .msg-row { display: flex; }
        .msg-row.user { justify-content: flex-end; }
        .msg-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-line;
        }
        .msg-row.user .msg-bubble {
            background: var(--primary);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .msg-row.bot .msg-bubble {
            background: var(--white);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg-bubble.story-bubble {
            max-width: min(80%, 560px);
        }
        /* 봇 답변에 섞이는 가벼운 마크다운(강조/목록/표) — 글만 쭉 있으니 읽기 힘들다는
           피드백으로, 답변을 문단·목록·표로 정리해서 보여준다. */
        .msg-bubble p { margin: 0 0 8px; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble .md-list { margin: 4px 0 10px; padding-left: 20px; }
        .msg-bubble .md-list:last-child { margin-bottom: 0; }
        .msg-bubble .md-list li { margin-bottom: 4px; }
        .msg-bubble .md-table { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: 13px; }
        .msg-bubble .md-table:last-child { margin-bottom: 0; }
        .msg-bubble .md-table th, .msg-bubble .md-table td {
            border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top;
        }
        .msg-bubble .md-table th { background: var(--light); font-weight: 700; }
        /* 번역된 이야기의 핵심 요약 — 원문 전체를 펼치기 전에 먼저 보여줘서, 외국어 사용자가
           긴 글을 한 번에 마주하지 않고도 내용을 파악할 수 있게 한다. */
        .story-summary {
            padding: 10px 12px;
            margin-bottom: 10px;
            border-left: 3px solid var(--primary);
            background: var(--light);
            border-radius: 6px;
            font-weight: 600;
            line-height: 1.6;
        }
        .story-text {
            position: relative;
            overflow: hidden;
        }
        .story-text.collapsed {
            max-height: 130px;
        }
        .story-text.collapsed::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 44px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), var(--white));
        }
        .story-toggle {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--light);
            color: var(--primary-dark);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .story-toggle:hover { border-color: var(--primary); }
        .answer-hero-img, .source-hero-img {
            display: block;
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .msg-sources {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 8px;
        }
        .msg-sources-label {
            width: 100%;
            font-size: 11px;
            color: var(--gray);
            margin-bottom: 2px;
        }
        .source-card {
            display: flex;
            flex-direction: column;
            align-self: flex-start;
            width: 160px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--white);
            cursor: pointer;
            overflow: hidden;
            text-align: left;
            font: inherit;
            padding: 0;
            transition: all 0.15s ease;
        }
        .source-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(59, 158, 255, 0.18);
            transform: translateY(-1px);
        }
        /* 사진 자리는 사진이 없거나 로딩에 실패해도 항상 같은 높이를 차지해서
           카드 세 개가 항상 똑같은 크기·모양이 되게 한다(사진 유무로 카드 높이가 들쭉날쭉해지지 않게). */
        .source-card-img {
            width: 100%;
            height: 80px;
            overflow: hidden;
            background: var(--light);
        }
        .source-card-img img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .source-card-title {
            padding: 8px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--dark);
            line-height: 16px;
            /* height(고정)와 -webkit-line-clamp를 같이 쓰면 34px짜리 상자 안에서 line-clamp가
               2줄을 자르고 남은 여백이 브라우저마다 미묘하게 달라, 3번째 줄 윗부분이 살짝
               삐져나와 보였다(글자가 반토막). min-height로 바꿔서 "카드 높이를 맞추는 최소값"
               역할만 하게 하고, 실제 줄 자르기는 overflow:hidden + line-clamp에만 맡긴다. */
            min-height: 34px;
            overflow: hidden;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .typing { color: var(--gray); font-size: 13px; }
        footer {
            padding: 16px 24px 24px;
            background: var(--white);
            flex: none;
        }
        /* GPT 채팅창처럼 훨씬 넉넉한 폭 + 둥근 사각형(핏) 카드. 사진을 첨부하면 위쪽에
           미리보기 줄이 먼저 뜨고, 그 아래에 입력 줄(첨부/텍스트/음성/전송)이 온다. */
        .composer {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 8px;
            box-shadow: 0 2px 14px rgba(15, 23, 42, 0.06);
        }
        .composer-preview {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 6px 6px 10px;
        }
        .composer-preview.show { display: flex; }
        .preview-chip {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            flex: none;
        }
        .preview-chip img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .preview-chip .remove-chip {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            background: rgba(15, 23, 42, 0.65);
            color: #ffffff;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .composer-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .composer-row input[type="text"] {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            font: inherit;
            font-size: 16px;
            padding: 12px 6px;
        }
        /* 첨부(+) · 음성 버튼 공용 원형 아이콘 버튼 */
        .icon-btn {
            flex: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .icon-btn:hover { background: var(--light); color: var(--primary); }
        .icon-btn svg { width: 20px; height: 20px; }
        /* 음성 입력 버튼 — 듣는 동안은 빨갛게 펄스 애니메이션으로 상태를 알려준다. */
        .mic-btn.listening {
            background: #ef4444;
            color: #ffffff;
            animation: micPulse 1.3s ease-in-out infinite;
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }
        .composer .send-btn {
            flex: none;
            width: 42px;
            height: 42px;
            border: none;
            background: var(--primary);
            color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }
        .composer .send-btn svg { width: 19px; height: 19px; margin-left: -1px; }
        .composer .send-btn:hover { background: var(--primary-dark); }
        .composer .send-btn:disabled { background: var(--gray); cursor: not-allowed; }

        @media (max-width: 720px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/app-header :: header(${lang}, ${isLoggedIn}, ${currentUserName})}"></div>

<div class="layout">
    <aside class="sidebar">
        <button type="button" class="new-chat-btn" id="newChatBtn" th:text="#{chatbot.newChat}">+ 새 대화</button>
        <div class="sidebar-label" th:text="#{chatbot.history.label}">지난 대화</div>
        <div class="history-list" id="historyList">
            <div class="history-empty" id="historyEmpty" th:text="#{chatbot.history.empty}">아직 대화 기록이 없어요.</div>
        </div>
    </aside>

    <div class="chat-area empty" id="chatArea">
        <main id="chatMain">
            <div class="chat-shell" id="chatShell">
                <div class="intro" id="chatIntro">
                    <p th:text="#{chatbot.intro.subtitle}">부산의 설화와 장소에 얽힌 이야기를 물어보세요!</p>
                    <!-- 대화가 없을 때는 입력창이 여기(중앙)에 있다가, 첫 메시지를 보내면
                         JS(moveComposerToFooter)가 이 폼을 footer로 그대로 옮긴다. -->
                </div>
            </div>
        </main>

        <footer id="chatFooter">
        </footer>
    </div>
</div>

<form class="composer" id="chatForm">
    <div class="composer-preview" id="composerPreview"></div>
    <div class="composer-row">
        <input type="file" id="attachInput" accept="image/*" hidden>
        <button type="button" class="icon-btn" id="attachBtn" th:title="#{chatbot.attach.title}" title="사진 첨부하기" th:aria-label="#{chatbot.attach.title}" aria-label="사진 첨부하기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <input type="text" id="chatInput" th:placeholder="#{chatbot.input.placeholder}" placeholder="예) 해운대에 얽힌 전설 있어?" autocomplete="off">
        <button type="button" class="icon-btn mic-btn" id="micBtn" th:title="#{chatbot.voice.title}" title="음성으로 입력하기" th:aria-label="#{chatbot.voice.title}" aria-label="음성으로 입력하기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg>
        </button>
        <button type="submit" class="send-btn" id="chatSend" th:title="#{chatbot.send}" title="보내기" th:aria-label="#{chatbot.send}" aria-label="보내기">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>
</form>

<script th:inline="javascript">
    // switchLang()은 이제 공용 헤더 스크립트(/js/common/header-menu.js)가 제공한다.

    const CSRF_TOKEN = document.querySelector('meta[name="_csrf"]').content;
    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]').content;
    const STORAGE_KEY = 'chatbotConversations';
    const CURRENT_LANG = /*[[${lang}]]*/ 'ko';

    // JS가 동적으로 만드는 문구들 — 서버 렌더링(th:text)이 안 닿는 부분이라 현재 로케일 번역을
    // Thymeleaf 인라인으로 여기서 통째로 받아온다. {0} 자리는 askMore처럼 값을 끼워 넣을 때 쓴다.
    const I18N = {
        renameTitle:  /*[[#{chatbot.rename.title}]]*/ '이름 바꾸기',
        deleteTitle:  /*[[#{chatbot.delete.title}]]*/ '삭제',
        deleteConfirm:/*[[#{chatbot.delete.confirm}]]*/ '이 대화를 삭제할까요? 되돌릴 수 없어요.',
        storyNotFound:/*[[#{chatbot.story.notFound}]]*/ '이 이야기의 원문을 찾지 못했어요.',
        storyExpand:  /*[[#{chatbot.story.expand}]]*/ '이야기 전체 보기 ▾',
        storyCollapse:/*[[#{chatbot.story.collapse}]]*/ '접기 ▴',
        sourcesLabel: /*[[#{chatbot.sources.label}]]*/ '📖 참고한 이야기 (눌러서 더 보기)',
        sourcesAskMore:/*[[#{chatbot.sources.askMore}]]*/ '「{0}」 이야기 더 알려줄래?',
        typing:       /*[[#{chatbot.typing}]]*/ '이야기를 찾아보는 중...',
        answerMissing:/*[[#{chatbot.answer.missing}]]*/ '답변을 받지 못했어요.',
        answerError:  /*[[#{chatbot.answer.error}]]*/ '답변을 가져오지 못했어요. 잠시 후 다시 시도해 주세요.',
        voiceTitle:   /*[[#{chatbot.voice.title}]]*/ '음성으로 입력하기',
        voiceListening:/*[[#{chatbot.voice.listening}]]*/ '듣고 있어요...',
        voiceUnsupported:/*[[#{chatbot.voice.unsupported}]]*/ '이 브라우저는 음성 입력을 지원하지 않아요.',
        voiceError:   /*[[#{chatbot.voice.error}]]*/ '음성을 인식하지 못했어요. 다시 시도해 주세요.',
        moreTitle:    /*[[#{chatbot.more.title}]]*/ '더보기',
        attachTooLarge:  /*[[#{chatbot.attach.tooLarge}]]*/ '사진 용량이 너무 커요 (4MB 이하로 올려주세요).',
        attachInvalidType:/*[[#{chatbot.attach.invalidType}]]*/ '이미지 파일만 첨부할 수 있어요.',
        attachRemove: /*[[#{chatbot.attach.remove}]]*/ '첨부 취소',
        attachDefaultTitle: /*[[#{chatbot.attach.defaultTitle}]]*/ '📷 사진 문의'
    };

    /* ─── 챗봇 답변용 가벼운 마크다운 렌더러 ───
       글만 쭉 나오면 읽기 힘들다는 피드백으로, Gemini가 강조(**)/목록(-, 1.)/표(| | |)를
       섞어 답하면 그걸 실제 HTML로 그려준다. 외부 라이브러리 없이 직접 구현했고,
       텍스트는 항상 escapeHtml()을 거치므로(Gemini가 만든 텍스트라도) 안전하다. */
    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderInline(str) {
        // 굵게(**text**)만 지원 — 그 외 마크다운 문법은 안 쓰기로 프롬프트에서 지시했다.
        return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    function renderMarkdownLite(text) {
        if (!text) return '';
        const lines = String(text).replace(/\r\n/g, '\n').split('\n');
        const isTableRow = l => /^\s*\|.*\|\s*$/.test(l);
        const isTableSep = l => /^\s*\|[\s:|-]+\|\s*$/.test(l);
        const isListItem = l => /^\s*[-•]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l);
        const isOrdered = l => /^\s*\d+[.)]\s+/.test(l);
        let html = '';
        let i = 0;
        while (i < lines.length) {
            const line = lines[i];
            if (isTableRow(line)) {
                const rows = [];
                while (i < lines.length && isTableRow(lines[i])) { rows.push(lines[i].trim()); i++; }
                const dataRows = rows.filter(r => !isTableSep(r));
                if (dataRows.length) {
                    html += '<table class="md-table">';
                    dataRows.forEach((r, idx) => {
                        const cells = r.slice(1, -1).split('|').map(c => c.trim());
                        const tag = idx === 0 ? 'th' : 'td';
                        html += '<tr>' + cells.map(c => `<${tag}>${renderInline(c)}</${tag}>`).join('') + '</tr>';
                    });
                    html += '</table>';
                }
                continue;
            }
            if (isListItem(line)) {
                const ordered = isOrdered(line);
                const items = [];
                while (i < lines.length && isListItem(lines[i])) {
                    items.push(lines[i].replace(/^\s*([-•]|\d+[.)])\s+/, ''));
                    i++;
                }
                const tag = ordered ? 'ol' : 'ul';
                html += `<${tag} class="md-list">` + items.map(it => `<li>${renderInline(it)}</li>`).join('') + `</${tag}>`;
                continue;
            }
            if (line.trim() === '') { i++; continue; }
            html += `<p>${renderInline(line)}</p>`;
            i++;
        }
        return html;
    }

    const form = document.getElementById('chatForm');
    const input = document.getElementById('chatInput');
    const shell = document.getElementById('chatShell');
    const sendBtn = document.getElementById('chatSend');
    const micBtn = document.getElementById('micBtn');
    const attachBtn = document.getElementById('attachBtn');
    const attachInput = document.getElementById('attachInput');
    const composerPreview = document.getElementById('composerPreview');
    const main = document.getElementById('chatMain');
    const historyList = document.getElementById('historyList');
    const historyEmpty = document.getElementById('historyEmpty');
    const newChatBtn = document.getElementById('newChatBtn');
    const chatIntro = document.getElementById('chatIntro');
    const chatArea = document.getElementById('chatArea');
    const chatFooter = document.getElementById('chatFooter');

    /* ─── 입력창 위치 전환 — 대화 시작 전엔 화면 중앙(intro 안), 시작하면 하단(footer)으로 ───
       같은 <form id="chatForm"> 노드를 그대로 옮기는 방식이라(innerHTML 재작성이 아님)
       이벤트 리스너가 끊기지 않는다. */
    function moveComposerToIntro() {
        chatIntro.appendChild(form);
        chatArea.classList.add('empty');
    }
    function moveComposerToFooter() {
        chatFooter.appendChild(form);
        chatArea.classList.remove('empty');
    }
    moveComposerToIntro();

    // ── 지난 대화는 브라우저(localStorage)에만 저장한다. 서버엔 대화 기록을 안 남긴다.
    let conversations = loadConversations();
    let activeId = null;

    function loadConversations() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    function saveConversations() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
        } catch (e) { /* 저장 공간이 없으면 그냥 이번 세션만 유지 */ }
    }

    // 인라인으로 이름 편집 중인 대화 id (더블클릭 또는 ✏️ 클릭 시 설정됨)
    let editingId = null;

    function renderHistoryList() {
        historyList.querySelectorAll('.history-row').forEach(el => el.remove());
        historyEmpty.style.display = conversations.length ? 'none' : 'block';
        [...conversations].reverse().forEach(conv => {
            const row = document.createElement('div');
            const isEditing = conv.id === editingId;
            row.className = 'history-row'
                + (conv.id === activeId ? ' active' : '')
                + (isEditing ? ' editing' : '');

            if (isEditing) {
                const editInput = document.createElement('input');
                editInput.type = 'text';
                editInput.className = 'history-edit-input';
                editInput.value = conv.title;
                editInput.maxLength = 60;
                editInput.addEventListener('click', (e) => e.stopPropagation());
                editInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); commitRename(conv.id, editInput.value); }
                    else if (e.key === 'Escape') { e.preventDefault(); editingId = null; renderHistoryList(); }
                });
                editInput.addEventListener('blur', () => commitRename(conv.id, editInput.value));
                row.appendChild(editInput);
                historyList.appendChild(row);
                editInput.focus();
                editInput.select();
                return;
            }

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'history-item';
            btn.textContent = conv.title;
            btn.title = conv.title;
            btn.addEventListener('click', () => openConversation(conv.id));
            btn.addEventListener('dblclick', (e) => { e.stopPropagation(); startRename(conv.id); });

            // GPT처럼 "⋯" 버튼 하나 → 누르면 이름 바꾸기/삭제 두 항목이 담긴 작은 메뉴가 뜬다.
            const menuWrap = document.createElement('div');
            menuWrap.className = 'history-menu-btn-wrap';

            const moreBtn = document.createElement('button');
            moreBtn.type = 'button';
            moreBtn.className = 'history-menu-btn';
            moreBtn.textContent = '⋯';
            moreBtn.title = I18N.moreTitle;
            moreBtn.setAttribute('aria-haspopup', 'true');
            moreBtn.setAttribute('aria-expanded', 'false');

            const pop = document.createElement('div');
            pop.className = 'user-menu-pop';
            pop.setAttribute('role', 'menu');
            pop.hidden = true;

            const renameBtn = document.createElement('button');
            renameBtn.type = 'button';
            renameBtn.setAttribute('role', 'menuitem');
            renameBtn.textContent = I18N.renameTitle;
            renameBtn.addEventListener('click', (e) => { e.stopPropagation(); closeHistoryMenus(); startRename(conv.id); });

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.setAttribute('role', 'menuitem');
            deleteBtn.textContent = I18N.deleteTitle;
            deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); closeHistoryMenus(); deleteConversation(conv.id); });

            pop.appendChild(renameBtn);
            pop.appendChild(deleteBtn);

            moreBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const willOpen = pop.hidden;
                closeHistoryMenus();
                pop.hidden = !willOpen;
                row.classList.toggle('menu-open', willOpen);
                moreBtn.setAttribute('aria-expanded', String(willOpen));
            });

            menuWrap.appendChild(moreBtn);
            menuWrap.appendChild(pop);
            row.appendChild(btn);
            row.appendChild(menuWrap);
            historyList.appendChild(row);
        });
    }

    /** 열려 있는 대화 목록 "⋯" 메뉴를 전부 닫는다(다른 메뉴를 열 때 · 바깥 클릭 · Esc). */
    function closeHistoryMenus() {
        historyList.querySelectorAll('.history-row.menu-open').forEach(row => row.classList.remove('menu-open'));
        historyList.querySelectorAll('.user-menu-pop').forEach(pop => { pop.hidden = true; });
        historyList.querySelectorAll('.history-menu-btn').forEach(btn => btn.setAttribute('aria-expanded', 'false'));
    }
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.history-menu-btn-wrap')) closeHistoryMenus();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeHistoryMenus();
    });

    function startRename(id) {
        editingId = id;
        renderHistoryList();
    }

    function commitRename(id, rawValue) {
        // blur와 Enter가 겹쳐서 두 번 불릴 수 있어 editingId로 한 번만 처리한다.
        if (editingId !== id) return;
        editingId = null;
        const conv = conversations.find(c => c.id === id);
        const trimmed = (rawValue || '').trim();
        if (conv && trimmed) {
            conv.title = trimmed.length > 30 ? trimmed.slice(0, 30) + '…' : trimmed;
            saveConversations();
        }
        renderHistoryList();
    }

    function deleteConversation(id) {
        if (!window.confirm(I18N.deleteConfirm)) return;
        conversations = conversations.filter(c => c.id !== id);
        saveConversations();
        if (activeId === id) startNewConversation();
        else renderHistoryList();
    }

    function openConversation(id) {
        const conv = conversations.find(c => c.id === id);
        if (!conv) return;
        activeId = id;
        moveComposerToFooter();
        shell.innerHTML = '';
        conv.messages.forEach(msg => {
            const bubble = msg.isStory ? addStoryMessage(msg.text, msg.summary, false) : addMessage(msg.role, msg.text, false);
            if (msg.imgUrl) prependImage(bubble, msg.imgUrl);
            else if (msg.sources && msg.sources[0] && msg.sources[0].imgUrl) prependImage(bubble, msg.sources[0].imgUrl);
            if (msg.sources) addSources(bubble, msg.sources);
        });
        renderHistoryList();
    }

    function startNewConversation() {
        activeId = null;
        editingId = null;
        shell.innerHTML = '';
        shell.appendChild(chatIntro);
        moveComposerToIntro();
        renderHistoryList();
        input.focus();
    }

    function ensureActiveConversation(firstQuestion) {
        if (activeId) return conversations.find(c => c.id === activeId);
        const title = firstQuestion
            ? (firstQuestion.length > 24 ? firstQuestion.slice(0, 24) + '…' : firstQuestion)
            : I18N.attachDefaultTitle; // 질문 텍스트 없이 사진만 보낸 첫 메시지
        const conv = {
            id: Date.now().toString(36),
            title,
            messages: []
        };
        conversations.push(conv);
        activeId = conv.id;
        return conv;
    }

    function createMessageRow(role) {
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        row.appendChild(bubble);
        return { row, bubble };
    }

    function addMessage(role, text, removeIntro = true) {
        if (removeIntro && chatIntro.parentNode) { moveComposerToFooter(); chatIntro.remove(); }
        const { row, bubble } = createMessageRow(role);
        // 봇 답변만 마크다운 렌더링 — 사용자가 직접 입력한 질문은 그대로(escape 없이 텍스트로만) 보여준다.
        if (role === 'bot') bubble.innerHTML = renderMarkdownLite(text);
        else bubble.textContent = text;
        shell.appendChild(row);
        main.scrollTop = main.scrollHeight;
        return bubble;
    }

    /** 이야기 전문처럼 긴 글은 한 번에 다 보여주면 읽기 힘들어서, 일부만 보여주고
     *  "전체 보기" 버튼으로 펼치게 한다. */
    const STORY_COLLAPSE_CHARS = 220;

    function renderStoryBubble(bubble, text, summary) {
        bubble.classList.add('story-bubble');
        const content = text || I18N.storyNotFound;

        // 번역된 이야기는 요약(summary)이 같이 온다 — 원문을 통째로 펼치면 외국어 사용자
        // 입장에서 가독성이 떨어진다는 피드백으로, 이때는 요약을 항상 먼저 보여주고
        // 전문은 기본적으로 접어둔 채 원할 때만 펼치게 한다(글자 수와 무관하게).
        if (summary && summary.trim()) {
            const summaryEl = document.createElement('div');
            summaryEl.className = 'story-summary';
            summaryEl.innerHTML = renderMarkdownLite(summary);
            bubble.appendChild(summaryEl);

            const textEl = document.createElement('div');
            textEl.className = 'story-text collapsed story-text-full';
            textEl.innerHTML = renderMarkdownLite(content);
            bubble.appendChild(textEl);

            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'story-toggle';
            toggle.textContent = I18N.storyExpand;
            toggle.addEventListener('click', () => {
                const collapsed = textEl.classList.toggle('collapsed');
                toggle.textContent = collapsed ? I18N.storyExpand : I18N.storyCollapse;
                if (collapsed) {
                    const row = bubble.closest('.msg-row');
                    if (row) main.scrollTop = row.offsetTop - 12;
                }
            });
            bubble.appendChild(toggle);
            return;
        }

        // 요약이 없는(한국어) 경우엔 기존처럼 글자 수 기준으로 접어서 보여준다.
        const textEl = document.createElement('div');
        textEl.className = 'story-text';
        textEl.innerHTML = renderMarkdownLite(content);
        bubble.appendChild(textEl);

        if (content.length > STORY_COLLAPSE_CHARS) {
            textEl.classList.add('collapsed');
            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'story-toggle';
            toggle.textContent = I18N.storyExpand;
            toggle.addEventListener('click', () => {
                const collapsed = textEl.classList.toggle('collapsed');
                toggle.textContent = collapsed ? I18N.storyExpand : I18N.storyCollapse;
                // 접었을 때 방금 접은 말풍선이 화면 밖으로 사라지지 않게 위치를 잡아준다.
                if (collapsed) {
                    const row = bubble.closest('.msg-row');
                    if (row) main.scrollTop = row.offsetTop - 12;
                }
            });
            bubble.appendChild(toggle);
        }
    }

    function addStoryMessage(text, summary, removeIntro = true) {
        if (removeIntro && chatIntro.parentNode) { moveComposerToFooter(); chatIntro.remove(); }
        const { row, bubble } = createMessageRow('bot');
        renderStoryBubble(bubble, text, summary);
        shell.appendChild(row);
        main.scrollTop = main.scrollHeight;
        return bubble;
    }

    /** 답변/이야기 이미지를 말풍선 맨 위에 붙인다. 이미지가 깨지면 조용히 지운다. */
    function prependImage(bubble, url) {
        if (!url) return;
        const img = document.createElement('img');
        img.src = url;
        img.alt = '';
        img.className = 'answer-hero-img';
        img.addEventListener('error', () => img.remove());
        // 이미지가 늦게 로딩되면서 말풍선 높이가 나중에 또 늘어나 스크롤이 다시 짧아지는 경우 —
        // 이미지 붙이는 시점에 이미 맨 아래를 보고 있었을 때만, 로딩 완료 후 다시 맨 아래로 따라간다
        // (위쪽 메시지를 일부러 보고 있는 중이면 이미지 로딩 때문에 화면을 확 끌어내리지 않는다).
        const wasAtBottom = main.scrollTop + main.clientHeight >= main.scrollHeight - 40;
        img.addEventListener('load', () => { if (wasAtBottom) main.scrollTop = main.scrollHeight; });
        bubble.prepend(img);
    }

    function addSources(bubble, sources) {
        if (!sources || sources.length === 0) return;
        const label = document.createElement('div');
        label.className = 'msg-sources-label';
        label.textContent = I18N.sourcesLabel;
        const box = document.createElement('div');
        box.className = 'msg-sources';
        box.appendChild(label);
        sources.forEach(source => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'source-card';
            // 사진이 없거나(imgUrl 없음) 로딩에 실패해도 이 자리(80px)는 항상 남겨둬서
            // 카드 세 개 크기·모양이 항상 똑같게 한다.
            const imgWrap = document.createElement('div');
            imgWrap.className = 'source-card-img';
            if (source.imgUrl) {
                const img = document.createElement('img');
                img.src = source.imgUrl;
                img.alt = '';
                img.addEventListener('error', () => img.remove());
                imgWrap.appendChild(img);
            }
            card.appendChild(imgWrap);
            const title = document.createElement('span');
            title.className = 'source-card-title';
            title.textContent = source.title;
            card.appendChild(title);
            card.addEventListener('click', () => expandSource(source));
            box.appendChild(card);
        });
        bubble.appendChild(box);
    }

    /** 이야기 카드를 누르면 그 이야기 전문을 새 말풍선으로 보여준다. 추가 API 호출은 없다. */
    function expandSource(source) {
        const userText = I18N.sourcesAskMore.replace('{0}', source.title);
        const content = source.content || I18N.storyNotFound;
        const summary = source.summary || '';
        addMessage('user', userText);
        const bubble = addStoryMessage(content, summary);
        if (source.imgUrl) prependImage(bubble, source.imgUrl);

        if (activeId) {
            const conv = conversations.find(c => c.id === activeId);
            if (conv) {
                conv.messages.push({ role: 'user', text: userText });
                conv.messages.push({
                    role: 'bot',
                    text: content,
                    summary: summary,
                    imgUrl: source.imgUrl || null,
                    isStory: true
                });
                saveConversations();
            }
        }
    }

    newChatBtn.addEventListener('click', startNewConversation);

    /* ─── 입력창 자동완성 — 입력창이 비어 있을 때 예시 질문을 한 글자씩 썼다 지웠다 하며
       placeholder에 순환해서 보여주고, Tab을 누르면 지금 보이는 문장을 그대로 입력창에 채운다
       (바로 전송하지는 않음 — 수정하거나 Enter로 직접 보낼 수 있게). */
    const TYPEWRITER_PHRASES = [
        /*[[#{chatbot.suggest.1}]]*/ '해운대에 얽힌 전설이 있어?',
        /*[[#{chatbot.suggest.2}]]*/ '태종대 이름의 유래가 궁금해',
        /*[[#{chatbot.suggest.3}]]*/ '용두산공원엔 어떤 이야기가 있어?',
        /*[[#{chatbot.suggest.4}]]*/ '오륙도는 왜 그런 이름이 붙었어?'
    ];
    const BASE_PLACEHOLDER = input.placeholder;
    let twPhraseIndex = 0;
    let twTimer = null;
    let twCurrentPhrase = '';

    function typewriterStep(charIndex, deleting) {
        const phrase = TYPEWRITER_PHRASES[twPhraseIndex];
        twCurrentPhrase = phrase;
        input.placeholder = phrase.slice(0, charIndex);
        if (!deleting) {
            if (charIndex < phrase.length) {
                twTimer = setTimeout(() => typewriterStep(charIndex + 1, false), 65);
            } else {
                twTimer = setTimeout(() => typewriterStep(phrase.length, true), 1800); // 다 쓴 뒤 잠깐 멈춤
            }
        } else {
            if (charIndex > 0) {
                twTimer = setTimeout(() => typewriterStep(charIndex - 1, true), 30);
            } else {
                twPhraseIndex = (twPhraseIndex + 1) % TYPEWRITER_PHRASES.length;
                twTimer = setTimeout(() => typewriterStep(0, false), 400);
            }
        }
    }

    function startTypewriter() {
        if (twTimer) return; // 이미 돌고 있으면 다시 시작 안 함
        typewriterStep(0, false);
    }

    function stopTypewriter() {
        clearTimeout(twTimer);
        twTimer = null;
        input.placeholder = BASE_PLACEHOLDER;
    }

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && input.value.trim() === '' && twCurrentPhrase) {
            e.preventDefault();
            input.value = twCurrentPhrase;
            stopTypewriter();
        }
    });
    input.addEventListener('input', () => {
        if (input.value.trim() === '') startTypewriter();
        else stopTypewriter();
    });
    startTypewriter();

    /* ─── 사진 첨부 — + 버튼으로 고른 이미지를 base64로 들고 있다가 전송 시 질문과 함께 보낸다.
       대화 기록(localStorage)에는 용량 문제로 이미지 자체는 저장하지 않고, 이번 세션 화면에만 보여준다. */
    const MAX_ATTACH_BYTES = 4 * 1024 * 1024; // 4MB
    let pendingImage = null; // { dataUrl, base64, mimeType }

    attachBtn.addEventListener('click', () => attachInput.click());

    attachInput.addEventListener('change', () => {
        const file = attachInput.files?.[0];
        attachInput.value = ''; // 같은 파일을 다시 골라도 change가 또 발생하게
        if (!file) return;
        if (!file.type.startsWith('image/')) { alert(I18N.attachInvalidType); return; }
        if (file.size > MAX_ATTACH_BYTES) { alert(I18N.attachTooLarge); return; }

        const reader = new FileReader();
        reader.onload = () => {
            const dataUrl = reader.result;
            const commaIdx = dataUrl.indexOf(',');
            pendingImage = {
                dataUrl,
                base64: commaIdx >= 0 ? dataUrl.slice(commaIdx + 1) : dataUrl,
                mimeType: file.type || 'image/jpeg'
            };
            renderComposerPreview();
        };
        reader.readAsDataURL(file);
    });

    function renderComposerPreview() {
        composerPreview.innerHTML = '';
        if (!pendingImage) { composerPreview.classList.remove('show'); return; }
        composerPreview.classList.add('show');
        const chip = document.createElement('div');
        chip.className = 'preview-chip';
        const img = document.createElement('img');
        img.src = pendingImage.dataUrl;
        img.alt = '';
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-chip';
        removeBtn.textContent = '✕';
        removeBtn.title = I18N.attachRemove;
        removeBtn.setAttribute('aria-label', I18N.attachRemove);
        removeBtn.addEventListener('click', () => { pendingImage = null; renderComposerPreview(); });
        chip.appendChild(img);
        chip.appendChild(removeBtn);
        composerPreview.appendChild(chip);
    }

    /* ─── 음성 입력 — 마이크 버튼을 누르면 브라우저 음성 인식(Web Speech API)으로 받아쓰기.
       바로 전송하지 않고 입력창에 텍스트만 채워서, 잘못 알아들었을 때 고쳐 쓸 수 있게 한다. */
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    const VOICE_LANG_MAP = { ko: 'ko-KR', en: 'en-US', ja: 'ja-JP', zh: 'zh-CN', fr: 'fr-FR' };
    let recognizer = null;
    let listening = false;

    if (!SpeechRecognitionCtor) {
        micBtn.style.display = 'none';
    } else {
        micBtn.addEventListener('click', () => {
            if (listening) { recognizer?.stop(); return; }
            recognizer = new SpeechRecognitionCtor();
            recognizer.lang = VOICE_LANG_MAP[CURRENT_LANG] || 'ko-KR';
            recognizer.interimResults = false;
            recognizer.maxAlternatives = 1;

            recognizer.addEventListener('start', () => {
                listening = true;
                micBtn.classList.add('listening');
                micBtn.title = I18N.voiceListening;
            });
            recognizer.addEventListener('result', (e) => {
                const text = e.results?.[0]?.[0]?.transcript || '';
                if (text) {
                    input.value = input.value ? (input.value.trim() + ' ' + text) : text;
                    input.focus();
                }
            });
            recognizer.addEventListener('error', (e) => {
                if (e.error !== 'no-speech' && e.error !== 'aborted') alert(I18N.voiceError);
            });
            recognizer.addEventListener('end', () => {
                listening = false;
                micBtn.classList.remove('listening');
                micBtn.title = I18N.voiceTitle;
            });

            try { recognizer.start(); } catch (e) { /* 이미 듣고 있는 중이면 무시 */ }
        });
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = input.value.trim();
        const image = pendingImage; // fetch 진행 중에 바뀌지 않게 지금 값을 붙잡아둔다
        if (!question && !image) return;

        const conv = ensureActiveConversation(question);
        const userBubble = addMessage('user', question);
        if (image) prependImage(userBubble, image.dataUrl);
        // 대화 기록(localStorage)에는 이미지 자체는 안 남긴다 — base64 사진 몇 장만으로도
        // localStorage 용량 한도를 넘겨서 이후 저장이 통째로 실패할 수 있어서다.
        conv.messages.push({ role: 'user', text: question });
        renderHistoryList();

        input.value = '';
        startTypewriter(); // JS로 값을 비운 거라 input 이벤트가 안 떠서 직접 다시 돌려준다
        pendingImage = null;
        renderComposerPreview();
        sendBtn.disabled = true;
        const typingBubble = addMessage('bot', '');
        typingBubble.classList.add('typing');
        typingBubble.textContent = I18N.typing;

        try {
            const response = await fetch('/chatbot/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [CSRF_HEADER]: CSRF_TOKEN
                },
                body: JSON.stringify({
                    question,
                    image: image ? image.base64 : null,
                    imageMimeType: image ? image.mimeType : null
                })
            });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const data = await response.json();
            typingBubble.classList.remove('typing');
            typingBubble.innerHTML = renderMarkdownLite(data.answer || I18N.answerMissing);
            if (data.sources && data.sources[0]) prependImage(typingBubble, data.sources[0].imgUrl);
            addSources(typingBubble, data.sources);
            conv.messages.push({ role: 'bot', text: data.answer, sources: data.sources });
            saveConversations();
            // "타이핑 중..." 짧은 말풍선 기준으로 한 번 스크롤한 뒤로는 안 움직여서, 답변이 길게
            // 채워져도 화면이 그 답변 맨 앞부분에 멈춰 있다는 피드백 — 실제 내용이 다 채워진
            // 지금 다시 맨 아래로 스크롤한다(사진·출처 카드까지 렌더링된 뒤 높이 기준).
            main.scrollTop = main.scrollHeight;
        } catch (error) {
            typingBubble.classList.remove('typing');
            typingBubble.textContent = I18N.answerError;
            main.scrollTop = main.scrollHeight;
            console.error('chatbot ask error', error);
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    });

    renderHistoryList();
</script>
<script th:src="@{/js/common/header-menu.js}"></script>
</body>
</html>
