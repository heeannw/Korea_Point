<!DOCTYPE html>
<html lang="ko" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="#{login.success.pageTitle}">로그인 완료 - KoreaPoint</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #f8fbff;
            color: #0f172a;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        .status {
            color: #64748b;
            text-align: center;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.46);
        }

        .modal-panel {
            width: min(460px, 100%);
            padding: 28px;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.22);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #1a7de0;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            line-height: 1.3;
        }

        p {
            margin: 0;
            color: #64748b;
            line-height: 1.7;
        }

        form {
            display: grid;
            gap: 14px;
            margin-top: 20px;
        }

        label {
            display: grid;
            gap: 6px;
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
        }

        select {
            width: 100%;
            min-height: 44px;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            background: #ffffff;
            color: #0f172a;
            padding: 0 12px;
            font: inherit;
            outline: none;
        }

        select:focus {
            border-color: #3b9eff;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        button {
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid #3b9eff;
            border-radius: 8px;
            background: #3b9eff;
            color: #ffffff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button.secondary {
            border-color: #dbeafe;
            background: #ffffff;
            color: #1a7de0;
        }

        [hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <p class="status" th:text="#{login.success.status}">로그인 완료 중입니다.</p>
    <div id="nationalityModal" class="modal-backdrop" th:hidden="${!showNationalityPrompt}">
        <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="nationalityTitle">
            <p class="eyebrow" th:text="#{login.success.eyebrow}">Welcome</p>
            <h1 id="nationalityTitle" th:text="#{login.success.nationalityTitle}">국적을 선택해 주세요</h1>
            <p th:text="#{login.success.nationalityGuide}">여행 추천과 안내를 더 자연스럽게 맞추는 데 사용할 수 있어요. 지금 선택하지 않아도 괜찮아요.</p>
            <form id="nationalityForm" th:action="@{/ko/settings/nationality}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="redirect" th:value="${targetUrl}">
                <input type="hidden" name="lang" th:value="${lang}">
                <label>
                    <span th:text="#{settings.nationality.label}">국적</span>
                    <select name="nationality">
                        <option value="" th:text="#{settings.country.none}">선택 안 함</option>
                        <option value="KR" th:text="#{settings.country.kr}">대한민국</option>
                        <option value="US" th:text="#{settings.country.us}">미국</option>
                        <option value="JP" th:text="#{settings.country.jp}">일본</option>
                        <option value="CN" th:text="#{settings.country.cn}">중국</option>
                        <option value="TW" th:text="#{settings.country.tw}">대만</option>
                        <option value="HK" th:text="#{settings.country.hk}">홍콩</option>
                        <option value="TH" th:text="#{settings.country.th}">태국</option>
                        <option value="VN" th:text="#{settings.country.vn}">베트남</option>
                        <option value="PH" th:text="#{settings.country.ph}">필리핀</option>
                        <option value="ID" th:text="#{settings.country.id}">인도네시아</option>
                        <option value="MY" th:text="#{settings.country.my}">말레이시아</option>
                        <option value="SG" th:text="#{settings.country.sg}">싱가포르</option>
                        <option value="FR" th:text="#{settings.country.fr}">프랑스</option>
                        <option value="DE" th:text="#{settings.country.de}">독일</option>
                        <option value="GB" th:text="#{settings.country.gb}">영국</option>
                        <option value="CA" th:text="#{settings.country.ca}">캐나다</option>
                        <option value="AU" th:text="#{settings.country.au}">호주</option>
                    </select>
                </label>
                <div class="actions">
                    <button type="button" class="secondary" onclick="submitNationality(true)" th:text="#{login.success.skip}">건너뛰기</button>
                    <button type="submit" th:text="#{login.success.save}">저장하고 시작</button>
                </div>
            </form>
        </section>
    </div>
    <script th:inline="javascript">
        const targetUrl = /*[[${targetUrl}]]*/ "/ko";
        const loginProvider = /*[[${provider}]]*/ null;
        const showNationalityPrompt = /*[[${showNationalityPrompt}]]*/ false;
        const msg = {
            nationalitySaveFailed: /*[[#{login.success.nationalitySaveFailed}]]*/ '국적 설정을 저장하지 못했습니다.'
        };
        const providerLabels = {
            google: 'Google',
            naver: '네이버',
            kakao: '카카오'
        };
        if (loginProvider && providerLabels[loginProvider]) {
            localStorage.setItem('koreaPointLastSocialLogin', loginProvider);
        }

        function finishLogin() {
            if (window.opener && !window.opener.closed) {
                window.opener.location.href = targetUrl;
                window.close();
            } else {
                window.location.href = targetUrl;
            }
        }

        async function submitNationality(skip) {
            const form = document.getElementById('nationalityForm');
            if (!form) {
                finishLogin();
                return;
            }
            const formData = new FormData(form);
            if (skip) {
                formData.set('skip', 'true');
                formData.set('nationality', '');
            }
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                });
                if (!response.ok) {
                    alert(msg.nationalitySaveFailed);
                    return;
                }
                finishLogin();
            } catch (error) {
                alert(msg.nationalitySaveFailed);
            }
        }

        document.getElementById('nationalityForm')?.addEventListener('submit', event => {
            event.preventDefault();
            submitNationality(false);
        });

        if (!showNationalityPrompt) {
            finishLogin();
        }
    </script>
</body>
</html>
