<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In - KoreaConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] flex flex-col items-center justify-center">

    <div class="w-full max-w-[400px] px-6">

        <!-- 로고 -->
        <div class="flex flex-col items-center mb-8">
            <a th:href="@{/}" class="flex items-center gap-2 no-underline mb-6">
                <div class="w-10 h-10 bg-[#2563EB] rounded-xl flex items-center justify-center">
                    <i data-lucide="globe" class="w-6 h-6 text-white"></i>
                </div>
                <span class="text-[22px] text-gray-900 tracking-[-0.3px]" style="font-weight:700;">KoreaPoint</span>
            </a>
            <h1 class="text-[22px] text-gray-900 mb-1" style="font-weight:700;">Welcome back</h1>
            <p class="text-[14px] text-gray-500">Sign in to share your experiences</p>
        </div>

        <!-- 카드 -->
        <div class="bg-white rounded-2xl border border-gray-200/80 p-8 shadow-sm">

            <!-- 에러 메시지 (OAuth2 실패 시) -->
            <div th:if="${param.error}"
                 class="mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-[13px] text-red-600">
                로그인에 실패했습니다. 다시 시도해주세요.
            </div>

            <!-- Google 로그인 버튼 -->
            <a th:href="@{/oauth2/authorization/google}"
               class="flex items-center justify-center gap-3 w-full py-3 border border-gray-200 rounded-xl text-[14px] text-gray-700 no-underline hover:bg-gray-50 hover:border-gray-300 transition-all"
               style="font-weight:500;">
                <!-- Google 로고 SVG -->
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
                    <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </a>

            <p class="text-center text-[12px] text-gray-400 mt-5 leading-relaxed">
                By signing in, you agree to our<br/>
                Terms of Service and Privacy Policy.
            </p>
        </div>

        <!-- 뒤로가기 -->
        <div class="text-center mt-5">
            <a th:href="@{/community/post-list}"
               class="text-[13px] text-gray-500 no-underline hover:text-gray-800 transition-colors">
                ← Back to Community
            </a>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
