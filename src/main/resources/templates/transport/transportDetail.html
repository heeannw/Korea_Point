<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경로 상세 — KoreaPoint</title>
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d784d3e5b07bb6954d7053a939f92184"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Apple SD Gothic Neo', 'DM Sans', sans-serif; background: #f0f7ff; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 12px 16px;
            padding: 8px 18px;
            background: #64748b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #475569; }

        .info-box {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .info-box h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; color: #0f172a; }
        .info-box p  { font-size: 13px; color: #64748b; }

        .congestion-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: #fff7ed;
            border-bottom: 1px solid #fed7aa;
            font-size: 14px;
        }
        .congestion-banner .label { font-weight: 600; color: #64748b; }
        .congestion-chip {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
        }
        .congestion-chip.low  { background: #d1fae5; color: #065f46; }
        .congestion-chip.mid  { background: #fef3c7; color: #92400e; }
        .congestion-chip.high { background: #fee2e2; color: #991b1b; }
        .congestion-bar-wrap {
            flex: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            max-width: 160px;
        }
        .congestion-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s ease;
        }
        .congestion-bar-fill.low  { background: #10b981; }
        .congestion-bar-fill.mid  { background: #f59e0b; }
        .congestion-bar-fill.high { background: #ef4444; }

        #map { width: 100%; height: 55vh; }

        .tabs {
            display: flex;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .tab-btn {
            flex: 1;
            padding: 13px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            color: #64748b;
            border: none;
            border-bottom: 2px solid transparent;
            background: none;
            transition: all 0.2s;
        }
        .tab-btn.active { color: #3b9eff; border-bottom-color: #3b9eff; }

        .tab-content { display: none; padding: 16px; background: white; }
        .tab-content.active { display: block; }

        .step-item {
            display: flex;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #f1f5f9;
            align-items: flex-start;
        }
        .step-item:last-child { border-bottom: none; }
        .step-dot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            width: 32px;
        }
        .step-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: white;
            flex-shrink: 0;
        }
        .step-line {
            width: 2px;
            height: 24px;
            background: #e2e8f0;
            margin: 3px 0;
        }
        .step-info strong { display: block; font-size: 14px; margin-bottom: 3px; color: #0f172a; }
        .step-info span   { font-size: 12px; color: #94a3b8; }

        .arrival-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .arrival-card b { color: #0f172a; }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-size: 14px;
        }
        .error-box { padding: 20px; color: #ef4444; background: white; }
    </style>
</head>
<body>

<a class="back-btn"
   th:href="@{/transport/search(start=${route?.start}, end=${route?.end})}">← 뒤로</a>

<div class="info-box" th:if="${route != null}">
    <h3 th:text="${route.start} + ' → ' + ${route.end}"></h3>
    <p th:text="'총 ' + ${route.totalTime} + '분 · 환승 ' + ${route.transferCount} + '회 · 출발 ' + ${route.departTime}"></p>
</div>

<div th:if="${route == null}" class="error-box">
    경로 정보를 찾을 수 없습니다. 다시 검색해주세요.
</div>

<div class="congestion-banner">
    <span class="label">🚇 혼잡도</span>
    <span class="congestion-chip" id="congestionChip">불러오는 중...</span>
    <div class="congestion-bar-wrap">
        <div class="congestion-bar-fill" id="congestionBarFill" style="width:0%"></div>
    </div>
</div>

<div id="map"></div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('steps', this)">📋 이동 단계</button>
    <button class="tab-btn" onclick="switchTab('arrival', this)">🚇 실시간 도착정보</button>
</div>

<div id="tab-steps" class="tab-content active">
    <div id="stepList"><p class="no-data">로딩중...</p></div>
</div>

<div id="tab-arrival" class="tab-content">
    <div id="arrivalList"><p class="no-data">로딩중...</p></div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const routeId = /*[[${route?.routeId}]]*/ null;
    /*]]>*/
</script>

<script>
    function switchTab(id, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + id).classList.add('active');
    }

    var map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 6
    });

    if (!routeId) {
        document.getElementById('stepList').innerHTML = '<p class="no-data">경로 데이터 없음</p>';
        document.getElementById('congestionChip').textContent = '-';
    } else {
        fetch('/api/transport/route/' + routeId)
            .then(res => res.json())
            .then(routeData => {
                if (!routeData || !routeData.steps) {
                    document.getElementById('stepList').innerHTML = '<p class="no-data">경로 데이터 없음</p>';
                    return;
                }

                const steps = routeData.steps;
                let allCoords = [];
                let lastStation = "";
                let stepHtml = "";

                steps.forEach((step, idx) => {

                    // 지도 경로 그리기
                    if (step.path && step.path.length > 0) {
                        const color = step.color ||
                            (step.type === 'walk' ? '#f59e0b' :
                                step.type === 'bus'  ? '#10b981' : '#3b9eff');

                        const linePath = step.path.map(p =>
                            new kakao.maps.LatLng(p.lat, p.lng)
                        );
                        allCoords = allCoords.concat(linePath);

                        if (step.type === 'walk') {
                            new kakao.maps.Polyline({
                                path: linePath,
                                strokeWeight: 3,
                                strokeColor: color,
                                strokeOpacity: 0.7,
                                strokeStyle: 'dashed'
                            }).setMap(map);
                        } else {
                            new kakao.maps.Polyline({
                                path: linePath,
                                strokeWeight: 6,
                                strokeColor: color,
                                strokeOpacity: 0.9
                            }).setMap(map);
                        }

                        if ((step.type === 'subway' || step.type === 'bus') && linePath.length > 0) {
                            new kakao.maps.Circle({
                                center: linePath[0],
                                radius: 60,
                                strokeWeight: 2,
                                strokeColor: color,
                                strokeOpacity: 1,
                                fillColor: '#ffffff',
                                fillOpacity: 1
                            }).setMap(map);
                        }
                    }

                    // 마지막 지하철/버스역 수집
                    if ((step.type === 'subway' || step.type === 'bus') && step.toStation) {
                        lastStation = step.toStation;
                    }

                    // 단계 목록
                    const badgeColor = step.color ||
                        (step.type === 'walk'     ? '#f59e0b' :
                            step.type === 'bus'      ? '#10b981' :
                                step.type === 'transfer' ? '#94a3b8' : '#3b9eff');

                    const icon = step.type === 'walk'     ? '🚶' :
                        step.type === 'bus'      ? '🚌' :
                            step.type === 'transfer' ? '🔄' : '🚇';

                    const from = step.fromStation || '';
                    const to   = step.toStation   || '';
                    const line = step.line ? '[' + step.line + '] ' : '';
                    const isLastStep = idx === steps.length - 1;

                    stepHtml += `
                        <div class="step-item">
                            <div class="step-dot-wrap">
                                <div class="step-dot" style="background:${badgeColor}">${icon}</div>
                                ${!isLastStep ? '<div class="step-line"></div>' : ''}
                            </div>
                            <div class="step-info">
                                <strong>${line}${from} → ${to}</strong>
                                <span>${step.duration}분</span>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('stepList').innerHTML =
                    stepHtml || '<p class="no-data">단계 정보 없음</p>';

                // 지도 범위 조정
                if (allCoords.length > 0) {
                    new kakao.maps.Marker({ position: allCoords[0], map: map });
                    new kakao.maps.Marker({ position: allCoords[allCoords.length - 1], map: map });
                    var bounds = new kakao.maps.LatLngBounds();
                    allCoords.forEach(coord => bounds.extend(coord));
                    map.setBounds(bounds);
                }

                // 실시간 도착정보
                if (lastStation) {
                    fetch(`/api/transport/subway?station=${encodeURIComponent(lastStation)}`)
                        .then(res => res.json())
                        .then(data => {
                            const list = data.realtimeArrivalList || [];
                            if (list.length === 0) {
                                document.getElementById('arrivalList').innerHTML =
                                    '<p class="no-data">도착 정보 없음</p>';
                                return;
                            }
                            let html = '';
                            list.forEach(item => {
                                html += `
                                    <div class="arrival-card">
                                        <b>${item.trainLineNm}</b><br>
                                        ${item.arvlMsg2}
                                    </div>
                                `;
                            });
                            document.getElementById('arrivalList').innerHTML = html;
                        })
                        .catch(() => {
                            document.getElementById('arrivalList').innerHTML =
                                '<p class="no-data">도착정보 조회 실패</p>';
                        });
                } else {
                    document.getElementById('arrivalList').innerHTML =
                        '<p class="no-data">도착 정보 없음</p>';
                }

                // 혼잡도 API 호출 (반환값: 0=여유, 1=보통, 2=혼잡)
                const stationCode = lastStation
                    ? (lastStation.split('').reduce((a, c) => a + c.charCodeAt(0), 0) % 200) + 1
                    : 50;
                const hour = new Date().getHours();
                const day  = (new Date().getDay() === 0 || new Date().getDay() === 6) ? 0 : 1;

                fetch(`/api/transport/congestion?station=${stationCode}&hour=${hour}&day=${day}`)
                    .then(res => res.text())
                    .then(data => {
                        const label = parseInt(data); // 0=여유, 1=보통, 2=혼잡
                        const chip  = document.getElementById('congestionChip');
                        const fill  = document.getElementById('congestionBarFill');

                        let text, cls, pct;
                        if (label === 0) {
                            text = '여유'; cls = 'low'; pct = 20;
                        } else if (label === 1) {
                            text = '보통'; cls = 'mid'; pct = 50;
                        } else {
                            text = '혼잡'; cls = 'high'; pct = 80;
                        }

                        chip.textContent = text;
                        chip.className   = 'congestion-chip ' + cls;
                        fill.style.width = pct + '%';
                        fill.className   = 'congestion-bar-fill ' + cls;
                    })
                    .catch(() => {
                        document.getElementById('congestionChip').textContent = '조회 실패';
                    });
            })
            .catch(() => {
                document.getElementById('stepList').innerHTML =
                    '<p class="no-data">경로 데이터 로딩 실패</p>';
            });
    }
</script>

</body>
</html>
