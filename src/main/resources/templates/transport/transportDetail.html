<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>경로 상세</title>
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d784d3e5b07bb6954d7053a939f92184"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f0f7ff; }

        .back-btn {
            display: inline-block;
            margin: 12px 16px;
            padding: 8px 16px;
            background: #64748b;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
        }

        .info-box {
            padding: 14px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .info-box h3 { font-size: 16px; margin-bottom: 4px; }
        .info-box p  { font-size: 13px; color: #64748b; }

        #map { width: 100%; height: 55vh; }

        .tabs {
            display: flex;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            color: #64748b;
            border-bottom: 2px solid transparent;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .tab-btn.active { color: #3b9eff; border-bottom-color: #3b9eff; }

        .tab-content { display: none; padding: 16px; background: white; }
        .tab-content.active { display: block; }

        /* 단계 */
        .step-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            align-items: flex-start;
        }
        .step-item:last-child { border-bottom: none; }
        .step-dot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            width: 32px;
        }
        .step-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: white;
            flex-shrink: 0;
        }
        .step-line {
            width: 2px;
            height: 24px;
            background: #e2e8f0;
            margin: 3px 0;
        }
        .step-info strong { display: block; font-size: 14px; margin-bottom: 3px; }
        .step-info span   { font-size: 12px; color: #94a3b8; }

        /* 도착정보 */
        .arrival-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .arrival-card b { color: #0f172a; }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

<a class="back-btn"
   th:href="@{/transport/search(start=${route?.start}, end=${route?.end})}">← 뒤로</a>

<div class="info-box" th:if="${route != null}">
    <h3 th:text="${route.start} + ' → ' + ${route.end}"></h3>
    <p th:text="'총 ' + ${route.totalTime} + '분 · 환승 ' + ${route.transferCount} + '회 · 출발 ' + ${route.departTime}"></p>
</div>

<div th:if="${route == null}" style="padding:20px; color:#ef4444; background:white;">
    경로 정보를 찾을 수 없습니다.
</div>

<!-- 카카오 지도 -->
<div id="map"></div>

<!-- 탭 -->
<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('steps', this)">📋 이동 단계</button>
    <button class="tab-btn" onclick="switchTab('arrival', this)">🚇 실시간 도착정보</button>
</div>

<div id="tab-steps" class="tab-content active">
    <div id="stepList"><p class="no-data">로딩중...</p></div>
</div>

<div id="tab-arrival" class="tab-content">
    <div id="arrivalList"><p class="no-data">로딩중...</p></div>
</div>

<script th:inline="javascript">
    const routeData = [[${route}]];
</script>

<script>
    // ========================
    // 탭 전환
    // ========================
    function switchTab(id, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + id).classList.add('active');
    }

    // ========================
    // 지도 생성
    // ========================
    var map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 6
    });

    if (!routeData || !routeData.steps) {
        document.getElementById('stepList').innerHTML = '<p class="no-data">경로 데이터 없음</p>';
    } else {
        const steps = routeData.steps;
        let allCoords = [];
        let lastStation = "";
        let stepHtml = "";

        steps.forEach((step, idx) => {
            const isLast = idx === steps.size - 1;

            // ========================
            // 지도 경로 그리기 (버스+지하철+도보 모두)
            // ========================
            if (step.path && step.path.length > 0) {
                const color = step.color ||
                    (step.type === 'walk' ? '#f59e0b' :
                        step.type === 'bus'  ? '#10b981' : '#3b9eff');

                const linePath = step.path.map(p =>
                    new kakao.maps.LatLng(p.lat, p.lng)
                );
                allCoords = allCoords.concat(linePath);

                if (step.type === 'walk') {
                    // 도보는 점선으로 표시
                    new kakao.maps.Polyline({
                        path: linePath,
                        strokeWeight: 3,
                        strokeColor: color,
                        strokeOpacity: 0.7,
                        strokeStyle: 'dashed'
                    }).setMap(map);
                } else {
                    // 지하철/버스는 실선 + 두껍게
                    new kakao.maps.Polyline({
                        path: linePath,
                        strokeWeight: 6,
                        strokeColor: color,
                        strokeOpacity: 0.9
                    }).setMap(map);
                }

                // 환승/중간역 마커 (작은 원)
                if (step.type === 'subway' || step.type === 'bus') {
                    if (linePath.length > 0) {
                        var circle = new kakao.maps.Circle({
                            center: linePath[0],
                            radius: 60,
                            strokeWeight: 2,
                            strokeColor: color,
                            strokeOpacity: 1,
                            fillColor: '#ffffff',
                            fillOpacity: 1
                        });
                        circle.setMap(map);
                    }
                }
            }

            // 마지막 지하철/버스 역 수집
            if ((step.type === 'subway' || step.type === 'bus') && step.to_station) {
                lastStation = step.to_station;
            }

            // ========================
            // 단계 목록 생성 (버스+지하철+도보 모두)
            // ========================
            const badgeColor = step.color ||
                (step.type === 'walk'     ? '#f59e0b' :
                    step.type === 'bus'      ? '#10b981' :
                        step.type === 'transfer' ? '#94a3b8' : '#3b9eff');

            const icon = step.type === 'walk'     ? '🚶' :
                step.type === 'bus'      ? '🚌' :
                    step.type === 'transfer' ? '🔄' : '🚇';

            const from = step.from_station || '';
            const to   = step.to_station   || '';
            const line = step.line ? '[' + step.line + '] ' : '';
            const isLastStep = idx === steps.length - 1;

            stepHtml += `
                <div class="step-item">
                    <div class="step-dot-wrap">
                        <div class="step-dot" style="background:${badgeColor}">${icon}</div>
                        ${!isLastStep ? '<div class="step-line"></div>' : ''}
                    </div>
                    <div class="step-info">
                        <strong>${line}${from} → ${to}</strong>
                        <span>${step.duration}분</span>
                    </div>
                </div>
            `;
        });

        document.getElementById('stepList').innerHTML = stepHtml;

        // ========================
        // 지도 범위 자동 조정 (전체 경로 보이게)
        // ========================
        if (allCoords.length > 0) {
            // 출발 마커
            new kakao.maps.Marker({
                position: allCoords[0],
                map: map,
                title: routeData.start || '출발'
            });

            // 도착 마커
            new kakao.maps.Marker({
                position: allCoords[allCoords.length - 1],
                map: map,
                title: routeData.end || '도착'
            });

            // 전체 경로가 지도에 보이도록 범위 자동 조정
            var bounds = new kakao.maps.LatLngBounds();
            allCoords.forEach(coord => bounds.extend(coord));
            map.setBounds(bounds);
        }

        // ========================
        // 실시간 도착정보 (역 이름에서 "역" 제거는 서버에서 처리)
        // ========================
        if (lastStation) {
            fetch(`/api/transport/subway?station=${encodeURIComponent(lastStation)}`)
                .then(res => res.json())
                .then(data => {
                    const list = data.realtimeArrivalList || [];
                    if (list.length === 0) {
                        document.getElementById('arrivalList').innerHTML =
                            '<p class="no-data">도착 정보 없음</p>';
                        return;
                    }
                    let html = '';
                    list.forEach(item => {
                        html += `
                            <div class="arrival-card">
                                <b>${item.trainLineNm}</b><br>
                                ${item.arvlMsg2}
                            </div>
                        `;
                    });
                    document.getElementById('arrivalList').innerHTML = html;
                })
                .catch(() => {
                    document.getElementById('arrivalList').innerHTML =
                        '<p class="no-data">도착정보 조회 실패</p>';
                });
        } else {
            document.getElementById('arrivalList').innerHTML =
                '<p class="no-data">도착 정보 없음</p>';
        }
    }
</script>

</body>
</html>
