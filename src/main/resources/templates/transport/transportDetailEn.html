<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Detail — KoreaPoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d784d3e5b07bb6954d7053a939f92184"></script>

  <link rel="stylesheet" th:href="@{/css/transport/t_common/reset.css}">
  <link rel="stylesheet" th:href="@{/css/transport/t_common/variable.css}">
  <link rel="stylesheet" th:href="@{/css/transport/t_common/layout.css}">
  <link rel="stylesheet" th:href="@{/css/transport/transportDetail.css}">
  <link rel="stylesheet" th:href="@{/css/common/header-menu.css}">
  <!-- trip-translate.js (Google Translate widget) isn't used here — like the transit search page,
       ko/en each already have their own real screen, and it clashed with the shared header's own
       language dropdown, producing a duplicate select box. -->
</head>
<body>

<div th:replace="~{fragments/app-header :: header(${lang}, ${isLoggedIn}, ${currentUserName})}"></div>

<div class="app-body">
  <div class="sidebar">
    <div class="route-header">
      <a class="back-link"
         th:href="@{/en/transport/search(start=${route?.start}, end=${route?.end})}"
         href="#">← Back to Search</a>
      <div class="route-title" th:text="${route?.start} + ' → ' + ${route?.end}">Origin → Destination</div>
      <div class="route-sub" th:text="'Departs ' + ${route?.departTime}">Departure Info</div>
      <div class="stats-row">
        <div class="stat-chip"><span class="sc-icon">⏱</span><span th:text="${route?.totalTime} + ' min'">— min</span></div>
        <div class="stat-chip"><span class="sc-icon">🔄</span><span th:text="'Transfers: ' + ${route?.transferCount}">Transfers: —</span></div>
      </div>
    </div>

    <div class="congestion-banner">

      <!-- Group in one line -->
      <div class="congestion-top">
        <span class="label">🚇 Congestion</span>
        <span class="congestion-chip" th:text="${congestionText}">불러오는 중 ...</span>
      </div>

      <!-- Bar -->
      <div class="congestion-bar-wrap">
        <div class="congestion-bar-fill" id="congestionBarFill" style="width:0%"></div>
      </div>

      <div class="congestion-legend" aria-label="Congestion levels">
        <span data-level="normal">Normal</span>
        <span data-level="caution">Caution</span>
        <span data-level="crowded">Crowded</span>
        <span data-level="severe">Severe</span>
      </div>

      <!-- Message -->
      <div id="congestionMsg"
           class="congestion-msg"
           th:text="${congestionMsg}">
      </div>

    </div>


    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('steps', this)">📋 Steps</button>
      <button class="tab-btn" id="arrivalTabBtn" onclick="switchTab('arrival', this)">🚇 Live Arrivals</button>
    </div>
    <div id="tab-steps" class="tab-content active">
      <div id="stepList"><p class="no-data">Loading...</p></div>
    </div>
    <div id="tab-arrival" class="tab-content">
      <div id="arrivalList"><p class="no-data">Loading...</p></div>
    </div>
  </div>

  <div class="map-area">
    <div id="map"></div>
    <div class="map-legend">
      <div class="legend-title">Legend</div>
      <div class="legend-item"><div class="legend-line" style="background:#3b9eff"></div>Subway</div>
      <div class="legend-item"><div class="legend-line" style="background:#10b981"></div>Bus</div>
      <div class="legend-item"><div class="legend-dash"></div>Walking</div>
    </div>
    <div class="map-controls">
      <div class="mc" id="mcZoomIn">＋</div>
      <div class="mc" id="mcZoomOut">－</div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  const routeId = /*[[${route?.routeId}]]*/ null;
  /*]]>*/
</script>

<script th:inline="javascript">
  const congestionText = /*[[${congestionText}]]*/ 'normal';
</script>


<script>

  //map reset
  var map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.5665, 126.9780),
    level: 6
  });

  //======== UI Control ========
  function switchTab(id, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + id).classList.add('active');
  }

  document.getElementById('mcZoomIn').addEventListener('click', () => map.setLevel(map.getLevel() - 1));
  document.getElementById('mcZoomOut').addEventListener('click', () => map.setLevel(map.getLevel() + 1));

  //======== Common Utilities ========
  function typeColor(type, fallback) {
    if (fallback) return fallback;
    if (type === 'walk') return '#9ca3af';
    if (type === 'bus')  return '#10b981';
    return '#3b9eff';
  }
  function typeIcon(type) {
    if (type === 'walk') return '🚶';
    if (type === 'bus')  return '🚌';
    return '🚇';
  }

  function translateArrival(msg) {
    if (!msg) return "";

    msg = msg.replace(/(\d+)분 후 도착/g, "Arriving in $1 min");
    // msg = msg.replace(/전역/g, "1 stop away");
    msg = msg.replace(/(\d+)번째 전역/g, "$1 stops away");

    msg = msg.replace("곧 도착", "Arriving soon");
    msg = msg.replace("도착", "Arrived");
    msg = msg.replace("출발", "Departed");
    msg = msg.replace("진입", "Approaching");

    return msg;
  }


  // Kakao keyword search → return coordinates
  function kakaoSearch(query) {
    return fetch(`/api/kakao/search?query=${encodeURIComponent(query)}`)
            .then(r => r.json())
            .then(d => {
              if (d.documents && d.documents.length > 0) {
                return {
                  lat: parseFloat(d.documents[0].y),
                  lng: parseFloat(d.documents[0].x)
                };
              }
              return null;
            })
            .catch(() => null);
  }

  // ===== Map Rendering =====
  function drawWalkLine(startPt, endPt) {

    const path = [
      new kakao.maps.LatLng(startPt.lat, startPt.lng),
      new kakao.maps.LatLng(endPt.lat,   endPt.lng)
    ];

    // White border
    new kakao.maps.Polyline({
      path: path,
      strokeWeight: 8,
      strokeColor: '#ffffff',
      strokeOpacity: 0.9,
      strokeStyle: 'solid'
    }).setMap(map);

    // Actual walking line (gray dashed)
    new kakao.maps.Polyline({
      path: path,
      strokeWeight: 4,
      strokeColor: '#666666',
      strokeOpacity: 0.8,
      strokeStyle: 'shortdash'
    }).setMap(map);

    return [
      { lat: startPt.lat, lng: startPt.lng },
      { lat: endPt.lat,   lng: endPt.lng   }
    ];
  }

  // Marker + label
  function drawMarker(latLng, color, label) {
    new kakao.maps.CustomOverlay({
      position: latLng,
      yAnchor: 1,
      content: `
            <div style="display:flex; flex-direction:column; align-items:center;">
                <div style="
                    margin-top:6px;
                    background:${color};
                    color:white;
                    padding:3px 10px;
                    border-radius:50px;
                    font-size:11px;
                    font-weight:700;
                    white-space:nowrap;
                    box-shadow:0 2px 6px rgba(0,0,0,0.25);
                ">${label}</div>
            </div>
        `
    }).setMap(map);
  }

  // Transfer station marker
  function drawTransferMarker(latLng, color, label) {
    new kakao.maps.CustomOverlay({
      position: latLng,
      yAnchor: 0.5,
      content: `
            <div style="display:flex; flex-direction:column; align-items:center;">
                <div style="
                    width:18px;
                    height:18px;
                    border-radius:50%;
                    background:#ffffff;
                    border:3px solid ${color};
                    box-shadow:0 2px 6px rgba(0,0,0,0.2);
                "></div>
                ${label ? `
                <div style="
                    margin-top:6px;
                    background:${color};
                    color:white;
                    padding:3px 10px;
                    border-radius:50px;
                    font-size:11px;
                    font-weight:700;
                    white-space:nowrap;
                    box-shadow:0 2px 6px rgba(0,0,0,0.2);
                ">${label}</div>` : ''}
            </div>
        `
    }).setMap(map);
  }

  // Auto fit map bounds
  function fitBounds(coordList) {
    if (!coordList.length) return;
    const bounds = new kakao.maps.LatLngBounds();
    coordList.forEach(c => bounds.extend(new kakao.maps.LatLng(c.lat, c.lng)));
    map.setBounds(bounds);
  }
  //----------------------------------------------------------------


  // ===== Route Data Processing =====

  //========== main ==========
  if (!routeId) {
    document.getElementById('stepList').innerHTML = '<p class="no-data">No route data</p>';
  } else {
    fetch('/api/transport/route/' + routeId)
            .then(res => res.json())
            .then(async routeData => {

              const steps = routeData.steps;
              let allCoords = []; // coordinates (lat,lng)
              let stepHtml  = '';

              // Collect first/last coordinates for each step
              const stepCoords = steps.map(step => {
                if (step.path && step.path.length > 0) {
                  return {
                    first: step.path[0],
                    last:  step.path[step.path.length - 1]
                  };
                }
                return null;
              });

              // Origin coordinates (Kakao search or GPS)
              let originPt = null;
              const startLabel = routeData.start || '';

              // Priority 1: Server coordinates
              if (routeData.startLat && routeData.startLng) {

                originPt = {
                  lat: routeData.startLat,
                  lng: routeData.startLng
                };

                // Priority 2: Search fallback
              } else if (startLabel) {

                originPt = await kakaoSearch(startLabel);
              }

              // Destination coordinates (Kakao search)
              let destPt = null;
              const endLabel = routeData.end || '';
              if (endLabel) {
                destPt = await kakaoSearch(endLabel);
              }

              // ── Draw Route ──
              for (let idx = 0; idx < steps.length; idx++) {
                const step   = steps[idx];
                const color  = typeColor(step.type, step.color);
                const icon   = typeIcon(step.type);
                const isLast = idx === steps.length - 1;

                // 잠실새내 -> 이수 하드코딩
                if (
                        step.type === "subway" &&
                        step.line.includes("2호선") &&
                        step.fromStation.includes("잠실새내") &&
                        step.toStation.includes("사당")
                ) {
                  step.path = [
                    { lat: 37.476358, lng: 126.983819 },
                    { lat: 37.477148, lng: 126.986405 },
                    { lat: 37.479052, lng: 126.990046 },
                    { lat: 37.481704, lng: 126.998747 },
                    { lat: 37.481984, lng: 127.000642 },
                    { lat: 37.482009, lng: 127.000644 },
                    { lat: 37.482684, lng: 127.002391 },
                    { lat: 37.483302, lng: 127.003114 },
                    { lat: 37.484504, lng: 127.003818 },
                    { lat: 37.490457, lng: 127.004919 },
                    { lat: 37.491227, lng: 127.005774 },
                    { lat: 37.509991, lng: 127.067116 },
                    { lat: 37.511743, lng: 127.078356 },
                    { lat: 37.511783, lng: 127.079954 },
                    { lat: 37.511651, lng: 127.085644 }
                  ];
                }

                // 모란 -> 안국 하드코딩
                // 수인분당선
                if (
                        step.type === "subway" &&
                        step.line.includes("수인") &&
                        step.fromStation.includes("모란") &&
                        step.toStation.includes("왕십리")
                ) {
                  step.path = step.path = [
                    { lat: 37.433677, lng: 127.128851 },
                    { lat: 37.458379, lng: 127.125694 },
                    { lat: 37.472942, lng: 127.126593 },
                    { lat: 37.474400, lng: 127.126286 },
                    { lat: 37.475858, lng: 127.124296 },
                    { lat: 37.478045, lng: 127.113630 },

                    { lat: 37.490600, lng: 127.097823 },
                    { lat: 37.494141, lng: 127.095248 },
                    { lat: 37.496320, lng: 127.089755 },

                    { lat: 37.491553, lng: 127.073018 },
                    { lat: 37.489868, lng: 127.069950 },
                    { lat: 37.489204, lng: 127.066130 },

                    { lat: 37.487178, lng: 127.061281 },
                    { lat: 37.487024, lng: 127.059693 },
                    { lat: 37.488710, lng: 127.056217 },

                    { lat: 37.506313, lng: 127.047999 },
                    { lat: 37.508883, lng: 127.044630 },
                    { lat: 37.523253, lng: 127.039182 },

                    { lat: 37.538044, lng: 127.043600 },
                    { lat: 37.544510, lng: 127.044759 },
                    { lat: 37.551167, lng: 127.043866 },
                    { lat: 37.551552, lng: 127.043588 },
                    { lat: 37.553616, lng: 127.040717 },
                    { lat: 37.554435, lng: 127.040105 },
                    { lat: 37.561225, lng: 127.038800 }
                  ];
                }

                // 2호선
                if (
                        step.type === "subway" &&
                        step.line.includes("2호선") &&
                        step.fromStation.includes("왕십리") &&
                        step.toStation.includes("을지로입구")
                ) {
                  step.path = [
                    { lat: 37.561228, lng: 127.037254 },
                    { lat: 37.561270, lng: 127.035606 },
                    { lat: 37.564998, lng: 127.026830 },
                    { lat: 37.565613, lng: 127.021308 },
                    { lat: 37.565669, lng: 127.019452 },
                    { lat: 37.565673, lng: 127.008922 },
                    { lat: 37.566878, lng: 127.002717 },
                    { lat: 37.566621, lng: 126.997733 },
                    { lat: 37.566288, lng: 126.991051 },
                    { lat: 37.566035, lng: 126.982241 }
                  ];
                }

                // 버스
                if (
                        step.type === "bus" &&
                        step.line.includes("151") &&
                        step.fromStation.includes("우리은행종로지점") &&
                        step.toStation.includes("안국역6번출구")
                ) {
                  step.path = [
                    { lat: 37.567729, lng: 126.982962 },
                    { lat: 37.572507, lng: 126.983192 },
                    { lat: 37.575584, lng: 126.982931 },
                    { lat: 37.57575,  lng: 126.984121 }
                  ];
                }

                if (step.path && step.path.length > 0) {
                  // Subway/Bus solid line
                  const linePath = step.path.map(p => new kakao.maps.LatLng(p.lat, p.lng));
                  step.path.forEach(p => allCoords.push(p));

                  new kakao.maps.Polyline({
                    path: linePath,
                    strokeWeight: 12,
                    strokeColor: '#ffffff',
                    strokeOpacity: 0.9,
                    strokeStyle: 'solid'
                  }).setMap(map);

                  new kakao.maps.Polyline({
                    path: linePath,
                    strokeWeight: 7,
                    strokeColor: color,
                    strokeOpacity:1,
                    strokeStyle: 'solid'

                  }).setMap(map);

                } else if (step.type === 'walk') {

                  const prevCoords = idx > 0 ? stepCoords[idx - 1] : null;
                  const nextCoords = idx < steps.length - 1 ? stepCoords[idx + 1] : null;

                  let startPt = prevCoords ? prevCoords.last : null;
                  let endPt   = nextCoords ? nextCoords.first : null;

                  // Key 1: If no prev, always use origin
                  if (!prevCoords && originPt) {
                    startPt = originPt;
                  }

                  // Key 2: If no next, use destination
                  if (!nextCoords && destPt) {
                    endPt = destPt;
                  }

                  // Key 3: Fallback (force connect)
                  if (!startPt && originPt) startPt = originPt;
                  if (!endPt && destPt) endPt = destPt;

                  if (startPt && endPt) {
                    const drawn = drawWalkLine(startPt, endPt);
                    drawn.forEach(p => allCoords.push(p));
                  }
                }

                // ── Step List ──
                const from = step.fromStation || '';
                const to   = step.toStation   || '';
                let stepLabel = '';
                if (step.type === 'walk') {
                  if (from && to && from !== to) stepLabel = `${from} → ${to}`;
                  else if (from) stepLabel = `Walk from exit ${from}`;
                  else if (to)   stepLabel = `Walk to ${to}`;
                  else           stepLabel = `Walking`;
                } else {
                  stepLabel = `${from} → ${to}`;
                }

                const lineLabel = step.line
                        ? `<span class="step-badge" style="background:${color}22;color:${color}">${step.line}</span>`
                        : '';

                const isWalk = step.type === 'walk';

                stepHtml += `
                    <div class="step-item ${isWalk ? 'walk' : ''}"
                         data-lat="${step.path?.[0]?.lat || ''}"
                         data-lng="${step.path?.[0]?.lng || ''}">

                        <div class="step-dot-wrap">

                            <div class="step-dot ${isWalk ? 'walk' : ''}"
                                 style="${!isWalk ? `background:${color}` : ''}">
                                ${icon}
                            </div>

                            ${!isLast ? '<div class="step-line"></div>' : ''}

                        </div>

                        <div class="step-info">
                            <strong>${stepLabel}${lineLabel}</strong>
                            <span>${step.duration} min</span>
                        </div>

                    </div>`;
              }

              // Add arrival step
              // Based on last transit step (subway + bus)
              let lastTransportStep = null;

              for (let i = steps.length - 1; i >= 0; i--) {
                if (steps[i].type !== 'walk' && steps[i].path) {
                  lastTransportStep = steps[i];
                  break;
                }
              }

              if (lastTransportStep) {
                const last = lastTransportStep.path[lastTransportStep.path.length - 1];

                stepHtml += `
                    <div class="step-item"
                         data-lat="${last.lat}"
                         data-lng="${last.lng}">

                        <div class="step-dot-wrap">
                            <div class="step-dot" style="background:#3b9eff">📍</div>
                        </div>

                        <div class="step-info">
                            <strong>Arrive at ${lastTransportStep.toStation}</strong>
                        </div>

                    </div>`;
              }

              document.getElementById('stepList').innerHTML = stepHtml;

              // Click step to move map
              document.querySelectorAll('.step-item').forEach(item => {
                item.addEventListener('click', () => {

                  document.querySelectorAll('.step-item')
                          .forEach(el => el.classList.remove('active'));

                  item.classList.add('active');

                  const lat = item.dataset.lat;
                  const lng = item.dataset.lng;

                  if (!lat || !lng) return;

                  const moveLatLng = new kakao.maps.LatLng(lat, lng);

                  map.setLevel(3); // Zoom in
                  map.panTo(moveLatLng); // Move
                });
              });


              // Origin marker
              if (originPt) {
                drawMarker(new kakao.maps.LatLng(originPt.lat, originPt.lng), '#ef4444', `Depart · ${startLabel}`);
                allCoords.unshift(originPt);
              }

              // Destination marker
              if (destPt) {
                drawMarker(new kakao.maps.LatLng(destPt.lat, destPt.lng), '#3b9eff', 'Arrive');
                allCoords.push(destPt);
              }


              // Transfer station markers
              // Collect subway steps separately for transfer handling
              const subwaySteps = [];

              steps.forEach((step, idx) => {
                if (step.type === 'subway') {
                  subwaySteps.push({
                    step,
                    idx
                  });
                }
              });

              // Draw transfer markers (all marked)
              // Handle all transfers (including bus)
              // Group transport steps with coordinates
              const transportSteps = steps
                      .map((step, idx) => ({
                        step,
                        idx,
                        coords: stepCoords[idx]
                      }))
                      .filter(s => s.step.type !== 'walk');

              // Transfer markers
              for (let i = 1; i < transportSteps.length; i++) {

                const prev = transportSteps[i - 1];
                const curr = transportSteps[i];

                // Skip if same type and same line
                if (prev.step.type === curr.step.type &&
                        prev.step.line === curr.step.line) continue;

                if (!prev.coords || !prev.coords.last) continue;

                const color = typeColor(curr.step.type, curr.step.color);

                const pt = new kakao.maps.LatLng(
                        prev.coords.last.lat,
                        prev.coords.last.lng
                );

                drawTransferMarker(pt, color, '');
              }

              // Auto adjust map bounds
              fitBounds(allCoords);


              // ── Live Arrival Info (departure + all transfer stations) ──
              // Build station list
              let station = '';
              const stationList = [];

              for (let step of steps) {
                if (step.type === 'subway') {
                  const name = step.fromStation
                          ?.replace(/\s+/g, '')
                          .replace(/역$/, '');

                  if (name && !stationList.includes(name)) {
                    stationList.push(name);
                  }
                }
              }

              const isBusanSubwayRoute = steps.some(step =>
                      step.type === 'subway' && (step.line || '').includes('부산')
              );
              const isBusanRoute = isBusanSubwayRoute
                      || `${routeData.start || ''} ${routeData.end || ''}`.includes('부산');

              function addMinutesToTime(baseTime, minutes) {
                const [hourText, minuteText] = (baseTime || '00:00').split(':');
                const date = new Date();
                date.setHours(parseInt(hourText, 10) || 0, parseInt(minuteText, 10) || 0, 0, 0);
                date.setMinutes(date.getMinutes() + minutes);
                return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
              }

              function estimateBusanHeadway(lineName) {
                if ((lineName || '').includes('4호선')) return 8;
                if ((lineName || '').includes('3호선')) return 7;
                return 6;
              }

              async function fetchBusanBusArrival(step) {
                const first = step.path && step.path.length > 0 ? step.path[0] : {};
                  const params = new URLSearchParams({
                    stopName: step.fromStation || '',
                    busNo: step.line || '',
                    bstopid: step.fromStationId || ''
                  });
                if (first.lat && first.lng) {
                  params.set('lat', first.lat);
                  params.set('lng', first.lng);
                }

                try {
                  const response = await fetch(`/api/transport/busan/bus-arrival?${params.toString()}`);
                  return await response.json();
                } catch (e) {
                  return { arrivals: [], error: 'request-failed' };
                  }
              }

              function busanArrivalErrorText(error) {
                if (error === 'missing-service-key') return 'Missing BIMS key';
                if (error === 'stop-not-found') return 'Stop match failed';
                if (error === 'request-failed') return 'BIMS request failed';
                if (error) return `BIMS error: ${error}`;
                return 'No stop-arrival data';
              }

              if (isBusanRoute) {
                const arrivalTabBtn = document.getElementById('arrivalTabBtn');
                if (arrivalTabBtn) {
                  arrivalTabBtn.textContent = '🚌 Busan Arrivals';
                }

                let elapsed = 0;
                let html = '<p class="arrival-note">Busan subway arrivals are timetable-based estimates. Busan bus arrivals show BIMS live stop-arrival data.</p>';

                for (const step of steps) {
                  if (step.type === 'subway') {
                    const headway = estimateBusanHeadway(step.line);
                    const timeRows = [0, 1, 2].map(index => {
                      const offset = index * headway;
                      const departAt = addMinutesToTime(routeData.departTime, elapsed + offset);
                      const arriveAt = addMinutesToTime(routeData.departTime, elapsed + offset + (step.duration || 0));
                      return `
                          <div class="timetable-row">
                              <span class="timetable-order">${index === 0 ? 'Next' : `#${index + 1}`}</span>
                              <span><b>Departs</b>${departAt}</span>
                              <span><b>Arrives</b>${arriveAt}</span>
                          </div>`;
                    }).join('');

                    html += `
                      <div class="arrival-card timetable">
                          <div class="arrival-station">${step.fromStation || 'Departure Station'}</div>
                          <div class="arr-line">${step.line || 'Busan Subway'} · toward ${step.toStation || 'Destination'}</div>
                          <div class="timetable-list">${timeRows}</div>
                      </div>`;
                  } else if (step.type === 'bus') {
                    const busArrival = await fetchBusanBusArrival(step);
                    const arrivals = busArrival.arrivals || [];
                    const noArrivalText = busanArrivalErrorText(busArrival.error);
                    const timeRows = arrivals.length
                            ? arrivals.map((arrival, index) => `
                                <div class="timetable-row">
                                    <span class="timetable-order">${index === 0 ? '1st' : `#${index + 1}`}</span>
                                    <span><b>Route</b>${arrival.line || step.line || 'Bus'}</span>
                                    <span class="timetable-arrival"><b>Arrives</b>${arrival.message || 'Checking'}</span>
                                </div>`).join('')
                            : `
                                <div class="timetable-row">
                                    <span class="timetable-order">Live</span>
                                    <span><b>Route</b>${step.line || 'Bus'}</span>
                                    <span class="timetable-arrival"><b>Arrives</b>${noArrivalText}</span>
                                </div>`;

                    html += `
                      <div class="arrival-card timetable bus">
                          <div class="arrival-station">${step.fromStation || 'Bus Stop'}</div>
                          <div class="arr-line">${step.line || 'Bus'} · toward ${step.toStation || 'Destination Stop'}</div>
                          <div class="timetable-list">${timeRows}</div>
                      </div>`;
                  }

                  elapsed += step.duration || 0;
                }

                document.getElementById('arrivalList').innerHTML = html;
              }

              if (!isBusanRoute) {
              // Request multiple stations
              const requests = stationList.map(st =>
                      fetch(`/api/transport/subway?station=${encodeURIComponent(st)}`)
                              .then(res => res.json())
                              .then(data => ({
                                station: st,
                                list: data.realtimeArrivalList || []
                              }))
              );

              // Process results
              Promise.all(requests).then(results => {

                let html = '';

                results.forEach(result => {

                  const list = result.list;
                  if (!list.length) return;

                  // Direction keyword
                  let directionKeyword = '';

                  for (let step of steps) {
                    if (step.type === 'subway') {
                      directionKeyword = step.toStation
                              .replace(/역$/, '')
                              .replace(/\(.*?\)/g, '')
                              .replace(/\s+/g, '');
                      break;
                    }
                  }


                  const directionGroups = {};
                  list.forEach(item => {
                    if (!item.trainLineNm) return;

                    const key = item.trainLineNm.split('방면')[0]
                            .replace(/\s+/g, '');

                    if (!directionGroups[key]) {
                      directionGroups[key] = [];
                    }
                    directionGroups[key].push(item);
                  });

                  const filtered = list.filter(item => {
                    // Split by direction group
                    if (!item.trainLineNm) return false;

                    const directionPart = item.trainLineNm.split('방면')[0];

                    return directionPart.replace(/\s+/g, '').includes(directionKeyword);
                  });

                  let finalList = [];

                  if (filtered.length > 0) {
                    finalList = filtered.slice(0, 2);
                  } else {
                    // Find closest group matching directionKeyword
                    const matchedGroup = Object.entries(directionGroups).find(([key]) =>
                            key.includes(directionKeyword)
                    );

                    const group = matchedGroup ? matchedGroup[1] : Object.values(directionGroups)[0] || [];
                    finalList = group.slice(0, 2);
                  }

                  // Clean line name
                  function cleanLineName(name) {
                    if (!name) return "";

                    if (Array.isArray(name)) {
                      name = name[0];
                    }

                    return name
                            .replace(/\[(.*?)\]/g, '$1')
                            .replace(/\(.*?\)/g, '')
                            .replace(/방면/g, '')
                            .replace(/\s+/g, ' ')
                            .trim();
                  }

                  html += finalList.map(item => {

                    const sec = parseInt(item.barvlDt);
                    let msg = '';


                    if (sec <= 60 && sec > 0)        msg = '🚨 Arriving soon';
                    else if (!isNaN(sec) && sec > 0) msg = `Arrives in ${Math.floor(sec / 60)} min`;
                    else {
                      let raw = (item.arvlMsg2 || '').replace(/\[/g, '').replace(/\]/g, '');
                      msg = translateArrival(raw);
                    }

                    const lineText = cleanLineName(item.trainLineNm);

                    return `
                      <div class="arrival-card timetable live">
                          <div class="arrival-station">${result.station} Station</div>
                          <div class="arr-line">${lineText || 'Seoul Subway'}</div>
                          <div class="timetable-list">
                              <div class="timetable-row">
                                  <span class="timetable-order">Live</span>
                                  <span class="timetable-route">${lineText || 'Subway'}</span>
                                  <span class="timetable-arrival">${msg}</span>
                              </div>
                          </div>
                      </div>
                            `;
                  }).join('');
                });

                document.getElementById('arrivalList').innerHTML =
                        html || '<p class="no-data">No information</p>';

              }).catch(() => {
                document.getElementById('arrivalList').innerHTML =
                        '<p class="no-data">Failed to load</p>';
              });
              }

              // ── Congestion ──
              const stationCode = station
                      ? (station.split('').reduce((a, c) => a + c.charCodeAt(0), 0) % 200) + 1
                      : 50;
              const hour = new Date().getHours();
              const day  = (new Date().getDay() === 0 || new Date().getDay() === 6) ? 0 : 1;

              const fill = document.getElementById('congestionBarFill');
              const msgBox = document.getElementById('congestionMsg');
              const chip = document.querySelector('.congestion-chip');
              const legendItems = document.querySelectorAll('.congestion-legend span');

              let pct = 50;
              let cls = '';

              if (congestionText === 'Normal') {
                pct = 25;
                cls = 'normal';
              } else if (congestionText === 'Caution') {
                pct = 50;
                cls = 'caution';
              } else if (congestionText === 'Crowded') {
                pct = 75;
                cls = 'crowded';
              } else {
                pct = 100;
                cls = 'severe';
              }

              // Fill bar
              fill.style.width = pct + '%';
              fill.className = 'congestion-bar-fill ' + cls;

              // Text color
              chip.className = 'congestion-chip ' + cls;
              legendItems.forEach(item => item.classList.toggle('active', item.dataset.level === cls));

            })
            .catch(err => {
              console.error(err);
              document.getElementById('stepList').innerHTML =
                      '<p class="error-box">Failed to load data</p>';
            });
  }
</script>
<script th:src="@{/js/common/header-menu.js}"></script>
</body>
