<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>교통 경로 검색</title>
    <style>
        :root {
            --blue: #3b9eff; --blue-dk: #1a7de0; --blue-lt: #eff6ff;
            --dark: #0f172a; --mid: #334155; --gray: #64748b;
            --border: #dbeafe; --white: #fff; --light: #f0f7ff;
            --gold: #f59e0b; --green: #16a34a;
            --r: 12px; --sh: 0 2px 16px rgba(59,158,255,.10);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--dark); display: flex; flex-direction: column; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f0f7ff; min-height: 100vh; }

        .search-wrap {
            background: linear-gradient(135deg, #0a1628, #0d4a8a);
            padding: 40px 20px 60px;
            text-align: center;
        }
        .search-wrap h1 { color: white; font-size: 26px; margin-bottom: 6px; }
        .search-wrap p  { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 28px; }

        .search-form {
            display: flex;
            gap: 10px;
            max-width: 680px;
            margin: 0 auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .search-form input[type="text"] {
            flex: 1;
            min-width: 160px;
            padding: 13px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        .start-wrap {
            display: flex;
            gap: 6px;
            flex: 1;
            min-width: 200px;
        }
        .start-wrap input {
            flex: 1;
            padding: 13px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        .location-btn {
            padding: 13px 14px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .location-btn:hover { background: #059669; }
        .location-btn:disabled { background: #0f172a; cursor: default; }

        .search-btn {
            padding: 13px 28px;
            background: #3b9eff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover { background: #1a7de0; }

        .result-wrap {
            max-width: 680px;
            margin: -20px auto 40px;
            padding: 0 16px;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .route-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .route-card:hover {
            border-color: #3b9eff;
            box-shadow: 0 6px 20px rgba(59,158,255,0.15);
            transform: translateY(-2px);
        }
        .route-type {
            font-size: 12px;
            font-weight: bold;
            color: #3b9eff;
            margin-bottom: 8px;
        }
        .route-time {
            font-size: 28px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .route-time small {
            font-size: 14px;
            font-weight: normal;
            color: #64748b;
        }
        .route-info {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .route-stations {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .step-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .pill {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: bold;
            color: white;
        }
        .pill-arrow {
            color: #94a3b8;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 14px; }
        .empty-state h3 { font-size: 18px; color: #475569; margin-bottom: 6px; }
        .empty-state p  { font-size: 14px; }

        /* ── HEADER ── */
        header {
            height: 56px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; border-bottom: 1px solid var(--border);
            background: var(--white); flex-shrink: 0; z-index: 100;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; color: var(--blue-dk); text-decoration: none; }
        .logo span { color: var(--dark); }
        .header-right { display: flex; gap: 8px; align-items: center; }
        .h-btn {
            padding: 7px 16px; border-radius: 50px; border: 1.5px solid var(--border);
            background: transparent; font-size: 12px; font-weight: 600; cursor: pointer;
            font-family: 'DM Sans', sans-serif; color: var(--dark); transition: all .2s;
        }
        .h-btn:hover, .h-btn.active { border-color: var(--blue); color: var(--blue); }
        .h-btn-fill { background: var(--blue); color: #fff; border-color: var(--blue); }
        .h-btn-fill:hover { background: var(--blue-dk); color: #fff; }

    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <a class="logo" th:href="@{/home}">Korea<span>Point</span></a>
    <div class="header-right">
        <button class="h-btn active">EN</button>
        <button class="h-btn">KR</button>
        <button class="h-btn h-btn-fill">Login</button>
    </div>
</header>

<!-- 검색 폼 -->
<div class="search-wrap">
    <h1>🚇 교통 경로 검색</h1>
    <p>출발지와 도착지를 입력하세요</p>

    <form class="search-form" th:action="@{/transport/search}" method="get">

        <!-- 출발지 + 현재위치 버튼 -->
        <div class="start-wrap">
            <input type="text" name="start" id="startInput"
                   placeholder="📍 출발지 (예: 서울역)"
                   th:value="${start}">
            <button type="button" class="location-btn"
                    id="locationBtn" onclick="useMyLocation()">
                📡 현재위치
            </button>
        </div>

        <!-- hidden 좌표 필드 -->
        <input type="hidden" name="startLat" id="startLat">
        <input type="hidden" name="startLng" id="startLng">

        <!-- 도착지 -->
        <input type="text" name="end" placeholder="🏁 도착지 (예: 강남역)"
               th:value="${end}" required>

        <button type="submit" class="search-btn">검색 →</button>
    </form>
</div>

<!-- 결과 영역 -->
<div class="result-wrap">

    <!-- 에러 -->
    <div class="error-box" th:if="${error}">
        ⚠️ <span th:text="${error}"></span>
    </div>

    <!-- 경로 카드 -->
    <div th:if="${routes != null and !#lists.isEmpty(routes)}">
        <br>
        <div style="padding: 16px 0 10px; font-size: 13px; color: #64748b;">
            <b th:text="${start}"></b> → <b th:text="${end}"></b> ·
            출발 <span th:text="${routes[0].departTime}"></span> 기준
        </div>

        <div th:each="route : ${routes}">
            <div class="route-card"
                 th:data-route-id="${route.routeId}"
                 onclick="goDetail(this)">

                <div class="route-type"
                     th:text="${route.type == 'fast'} ? '⚡ 빠른 경로' :
                               (${route.type == 'comfort'} ? '😊 편한 경로' : '⭐ 추천 경로')">
                </div>

                <div class="route-time">
                    <span th:text="${route.totalTime}"></span>
                    <small>분</small>
                </div>

                <div class="route-info">
                    환승 <span th:text="${route.transferCount}"></span>회 ·
                    도보 <span th:text="${#numbers.formatDecimal(route.walkTime, 1, 1)}"></span>분
                </div>

                <!-- 경유 역 정보 -->
                <div class="route-stations">
                    <span th:each="step, stat : ${route.steps}"
                          th:if="${step.type == 'subway' or step.type == 'bus'}">
                        <span th:if="${!stat.first}"> → </span>
                        <span th:text="${step.fromStation}"></span>
                        <span th:text="'(' + ${step.line} + ')'"></span>
                    </span>
                    <span th:if="${!#lists.isEmpty(route.steps)}">
                        → <span th:text="${route.steps[route.steps.size()-1].toStation}"></span>
                    </span>
                </div>

                <!-- 노선 pills -->
                <div class="step-pills">
                    <span th:each="step, stat : ${route.steps}"
                          th:if="${step.type == 'subway' or step.type == 'bus'}">
                        <span th:if="${!stat.first}" class="pill-arrow">›</span>
                        <span class="pill"
                              th:style="'background:' + ${step.color}"
                              th:text="${step.line}">
                        </span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- 결과 없음 -->
    <div class="empty-state"
         th:if="${routes != null and #lists.isEmpty(routes)}">
        <div class="icon">🔍</div>
        <h3>경로를 찾을 수 없습니다</h3>
        <p>출발지/도착지를 다시 확인해주세요</p>
    </div>

    <!-- 초기 상태 -->
    <div class="empty-state" th:if="${routes == null and error == null}">
        <div class="icon">🗺️</div>
        <h3>경로를 검색해보세요</h3>
        <p>출발지와 도착지를 입력하고 검색 버튼을 누르세요</p>
    </div>

</div>

<script>
    // 카드 클릭 → 상세 페이지
    function goDetail(el) {
        const routeId = el.getAttribute('data-route-id');
        location.href = '/transport/detail?routeId=' + routeId;
    }

    // 현재위치 가져오기
    function useMyLocation() {
        if (!navigator.geolocation) {
            alert('이 브라우저는 위치 서비스를 지원하지 않아요.');
            return;
        }

        const btn = document.getElementById('locationBtn');
        btn.textContent = '📡 위치 확인중...';
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(
            function(pos) {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;

                // hidden 필드에 좌표 저장
                document.getElementById('startLat').value = lat;
                document.getElementById('startLng').value = lng;

                // 카카오 역지오코딩 API로 주소 변환
                fetch(`https://dapi.kakao.com/v2/local/geo/coord2address.json?x=${lng}&y=${lat}`, {
                    headers: {
                        'Authorization': 'KakaoAK 91fbd7e68922180d0fe82982e0a20c92'
                    }
                })
                    .then(res => res.json())
                    .then(data => {
                        const docs = data.documents;
                        if (docs && docs.length > 0) {
                            const addr = docs[0];

                            // 도로명 주소 우선, 없으면 지번 주소 사용
                            let displayAddr = '';
                            if (addr.road_address) {
                                // 도로명: "서울 강남구 테헤란로 123" 형태
                                displayAddr = addr.road_address.address_name;
                            } else if (addr.address) {
                                // 지번: "서울 강남구 역삼동" 형태
                                const a = addr.address;
                                displayAddr = a.region_1depth_name + ' '
                                    + a.region_2depth_name + ' '
                                    + a.region_3depth_name;
                            }

                            document.getElementById('startInput').value = displayAddr;
                        } else {
                            document.getElementById('startInput').value = '현재위치';
                        }

                        btn.textContent = '✅ 위치 확인됨';
                        btn.style.background = '#0f172a';
                    })
                    .catch(() => {
                        // API 실패해도 좌표는 저장됨
                        document.getElementById('startInput').value = '현재위치';
                        btn.textContent = '✅ 위치 확인됨';
                        btn.style.background = '#0f172a';
                    });
            },
            function(err) {
                alert('위치를 가져올 수 없어요. 직접 입력해주세요.');
                btn.textContent = '📡 현재위치';
                btn.disabled = false;
            }
        );
    }

    // 출발지 직접 입력하면 좌표 초기화
    document.getElementById('startInput').addEventListener('input', function() {
        document.getElementById('startLat').value = '';
        document.getElementById('startLng').value = '';
        const btn = document.getElementById('locationBtn');
        btn.textContent = '📡 현재위치';
        btn.disabled = false;
        btn.style.background = '#10b981';
    });
</script>

</body>
</html>
