<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교통 경로 검색 — KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common/variables.css}">
    <link rel="stylesheet" th:href="@{/css/common/reset.css}">
    <link rel="stylesheet" th:href="@{/css/common/layout.css}">
    <link rel="stylesheet" th:href="@{/css/transport/transportSearch.css}">
    <style>
        /*공통 CSS와 다른 부분만 오버라이드 */
        :root { --green: #10b981; }
        html, body { height: auto; overflow: auto; }
        body { background: var(--light); min-height: 100vh; display: block; }
        header { position: sticky; top: 0; padding: 0 24px; box-shadow: 0 1px 8px rgba(0,0,0,.05); }
        .h-btn { text-decoration: none; display: inline-flex; align-items: center; }
        .swap-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--green);
            background: #fff;
            color: var(--green);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, color 0.2s;
        }
        .swap-btn:hover {
            background: var(--green);
            color: #fff;
        }
    </style>
</head>
<body>

<header>
    <a class="logo" th:href="@{/home}">Korea<span>Point</span></a>
    <div class="header-right">
        <!-- EN -->
        <a th:href="${route != null}
                ? @{/en/transport/detail(routeId=${route.routeId})}
                : @{/en/transport/search}"
           class="h-btn"
           th:classappend="${lang == 'en'} ? ' active'">
            EN
        </a>

        <!-- KR -->
        <a th:href="${route != null}
                ? @{/ko/transport/detail(routeId=${route.routeId})}
                : @{/ko/transport/search}"
           class="h-btn"
           th:classappend="${lang == 'ko'} ? ' active'">
            KR
        </a>

        <th:block th:if="${isLoggedIn}">
            <span class="h-btn" th:text="${currentUserName}"></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="h-btn h-btn-fill">Logout</button>
            </form>
        </th:block>

        <th:block th:unless="${isLoggedIn}">
            <a th:href="@{/oauth2/authorization/google}" class="h-btn h-btn-fill">Login</a>
        </th:block>
    </div>
</header>

<div class="hero">
    <h1>🚇 교통 경로 검색</h1>
    <p>출발지와 도착지를 입력하세요</p>

    <div class="search-card">
        <!-- 폼 액션 /ko로 수정 -->
        <form th:action="@{/ko/transport/search}" method="get" id="searchForm">
            <div class="input-group">
                <div class="input-row">
                    <div class="input-icon">🚩</div>
                    <div class="input-wrap">
                        <input type="text" name="start" id="startInput"
                               placeholder="출발지 입력 (예: 서울역)"
                               th:value="${start}" autocomplete="off">
                        <div class="autocomplete-list" id="startAcList"></div>
                    </div>
                    <button type="button" class="location-btn"
                            id="locationBtn" onclick="useMyLocation()">
                        📡 현재위치
                    </button>
                </div>
                <div class="route-divider">
                    <div class="route-divider-line"></div>
                    <button type="button" class="swap-btn" onclick="swapLocations()" title="출발/도착 교체">⇅</button>
                    <div class="route-divider-line"></div>
                </div>
                <div class="input-row">
                    <div class="input-icon">🏁</div>
                    <div class="input-wrap">
                        <input type="text" name="end" id="endInput"
                               placeholder="도착지 입력 (예: 강남역)"
                               th:value="${end}" autocomplete="off" required>
                        <div class="autocomplete-list" id="endAcList"></div>
                    </div>
                </div>
            </div>
            <input type="hidden" name="startLat" id="startLat">
            <input type="hidden" name="startLng" id="startLng">
            <button type="submit" class="search-btn">경로 검색 →</button>
        </form>
    </div>
</div>

<div class="main-content">

    <div class="error-box" th:if="${error}">
        ⚠️ <span th:text="${error}"></span>
    </div>

    <div th:if="${routes != null and !#lists.isEmpty(routes)}">
        <a class="re-search" th:href="@{/ko/transport/search}">← 다시 검색하기</a>
        <div class="result-header">
            <b th:text="${start}"></b> → <b th:text="${end}"></b> ·
            출발 <span th:text="${routes[0].departTime}"></span> 기준
        </div>
        <div th:each="route : ${routes}">
            <div class="route-card" th:data-route-id="${route.routeId}" onclick="goDetail(this)">
                <div class="route-type"
                     th:text="${route.type == 'fast'} ? '⚡ 빠른 경로' :
                               (${route.type == 'comfort'} ? '😊 편한 경로' : '⭐ 추천 경로')">
                </div>
                <div class="route-time" th:data-minutes="${route.totalTime}"></div>
                <div class="route-info">
                    환승 <span th:text="${route.transferCount}"></span>회 ·
                    도보 <span th:text="${#numbers.formatDecimal(route.walkTime, 1, 1)}"></span>분
                </div>
                <div class="route-stations">
                    <span th:each="step, stat : ${route.steps}"
                          th:if="${step.type == 'subway' or step.type == 'bus'}">
                        <span th:if="${!stat.first}"> → </span>
                        <span th:text="${step.fromStation}"></span>
                        <span th:text="'(' + ${step.line} + ')'"></span>
                    </span>
                    <span th:if="${!#lists.isEmpty(route.steps)}">
                        → <span th:text="${route.steps[route.steps.size()-1].toStation}"></span>
                    </span>
                </div>
                <div class="step-pills">
                    <span th:each="step, stat : ${route.steps}"
                          th:if="${step.type == 'subway' or step.type == 'bus'}">
                        <span th:if="${!stat.first}" class="pill-arrow">›</span>
                        <span class="pill" th:style="'background:' + ${step.color}"
                              th:text="${step.line}"></span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${routes != null and #lists.isEmpty(routes)}">
        <div class="icon">🔍</div>
        <h3>경로를 찾을 수 없습니다</h3>
        <p>출발지/도착지를 다시 확인해주세요</p>
    </div>

    <div th:if="${routes == null and error == null}">
        <div th:if="${recentRoutes != null and !#lists.isEmpty(recentRoutes)}">
            <div style="display:flex; align-items:center; justify-content:space-between; margin: 24px 0 12px;">
                <div class="section-title">🕐 최근 검색</div>
                <button onclick="clearAllHistory()"
                        style="font-size:12px; color:var(--gray); background:none; border:none; cursor:pointer; font-family:'DM Sans',sans-serif;">
                    전체 삭제
                </button>
            </div>
            <div th:each="r : ${recentRoutes}" class="recent-card"
                 th:id="'recent-' + ${r.id}"
                 th:data-start="${r.startPlace}"
                 th:data-end="${r.endPlace}"
                 onclick="fillSearch(this.dataset.start, this.dataset.end)">
                <div class="recent-icon">🚇</div>
                <div class="recent-info">
                    <div class="recent-route" th:text="${r.startPlace} + ' → ' + ${r.endPlace}"></div>
                    <div class="recent-meta"
                         th:text="${r.routeType == 'fast'} ? '⚡ 빠른 경로' :
                                   (${r.routeType == 'comfort'} ? '😊 편한 경로' : '⭐ 추천 경로')">
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="recent-time" th:data-minutes="${r.totalTime}"></div>
                    <button class="delete-btn" th:data-id="${r.id}"
                            onclick="deleteHistory(this, event)">×</button>
                </div>
            </div>
        </div>
        <div class="empty-state" th:if="${recentRoutes == null or #lists.isEmpty(recentRoutes)}">
            <div class="icon">🗺️</div>
            <h3>경로를 검색해보세요</h3>
            <p>출발지와 도착지를 입력하고 검색 버튼을 누르세요</p>
        </div>
    </div>

</div>

<script>
    const KAKAO_KEY = 'KakaoAK 91fbd7e68922180d0fe82982e0a20c92';
    let acTimer = null;

    function formatMinutes(min) {
        if (min >= 60) {
            const h = Math.floor(min / 60);
            const m = min % 60;
            return m > 0 ? `<span>${h}시간 ${m}분</span>` : `<span>${h}시간</span>`;
        }
        return `<span>${min}분</span>`;
    }

    function applyTimeFormat() {
        document.querySelectorAll('.route-time[data-minutes]').forEach(el => {
            el.innerHTML = formatMinutes(parseInt(el.getAttribute('data-minutes')));
        });
        document.querySelectorAll('.recent-time[data-minutes]').forEach(el => {
            el.innerHTML = formatMinutes(parseInt(el.getAttribute('data-minutes')));
        });
    }
    applyTimeFormat();

    function deleteHistory(btn, event) {
        event.stopPropagation();
        const id = btn.getAttribute('data-id');
        fetch(`/api/transport/history/${id}`, { method: 'DELETE' })
            .then(() => {
                const card = document.getElementById('recent-' + id);
                if (card) card.remove();
            });
    }

    function clearAllHistory() {
        fetch('/api/transport/history', { method: 'DELETE' })
            .then(() => location.reload());
    }

    function setupAutocomplete(inputId, listId) {
        const input = document.getElementById(inputId);
        const list  = document.getElementById(listId);

        input.addEventListener('input', () => {
            clearTimeout(acTimer);
            const q = input.value.trim();
            if (q.length < 1) { list.classList.remove('show'); return; }

            acTimer = setTimeout(() => {
                const subwaySearch = fetch(
                    `https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&category_group_code=SW8&size=4`,
                    { headers: { 'Authorization': KAKAO_KEY } }
                ).then(r => r.json());

                const keywordSearch = fetch(
                    `https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&size=4`,
                    { headers: { 'Authorization': KAKAO_KEY } }
                ).then(r => r.json());

                Promise.all([subwaySearch, keywordSearch]).then(([subway, keyword]) => {
                    const subwayDocs  = subway.documents  || [];
                    const keywordDocs = keyword.documents || [];
                    const seen = new Set();
                    const merged = [...subwayDocs, ...keywordDocs].filter(d => {
                        if (seen.has(d.id)) return false;
                        seen.add(d.id);
                        return true;
                    }).slice(0, 6);

                    if (!merged.length) { list.classList.remove('show'); return; }

                    list.innerHTML = merged.map(d => {
                        const icon = d.category_group_code === 'SW8' ? '🚇' :
                            d.category_group_code === 'BK9' ? '🏦' :
                                d.category_group_code === 'FD6' ? '🍽️' :
                                    d.category_group_code === 'HP8' ? '🏥' :
                                        d.category_group_code === 'CS2' ? '🏪' :
                                            d.category_group_code === 'PK6' ? '🅿️' : '📍';
                        const escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const name = d.place_name.replace(
                            new RegExp(escapedQ, 'gi'),
                            m => `<b style="color:var(--blue)">${m}</b>`
                        );
                        return `
                            <div class="autocomplete-item"
                                 onclick="selectAc('${inputId}', '${listId}', '${d.place_name.replace(/'/g,"\\'")}')">
                                <span class="ac-icon">${icon}</span>
                                <div>
                                    <div class="ac-name">${name}</div>
                                    <div class="ac-addr">${d.road_address_name || d.address_name || ''}</div>
                                </div>
                            </div>`;
                    }).join('');
                    list.classList.add('show');
                })
                    .catch(() => list.classList.remove('show'));
            }, 200);
        });

        document.addEventListener('click', e => {
            if (!input.contains(e.target) && !list.contains(e.target)) {
                list.classList.remove('show');
            }
        });

        if (inputId === 'startInput') {
            input.addEventListener('input', () => {
                document.getElementById('startLat').value = '';
                document.getElementById('startLng').value = '';
                const btn = document.getElementById('locationBtn');
                btn.textContent = '📡 현재위치';
                btn.disabled = false;
                btn.style.background = '#10b981';
            });
        }
    }

    function selectAc(inputId, listId, name) {
        document.getElementById(inputId).value = name;
        document.getElementById(listId).classList.remove('show');
    }

    setupAutocomplete('startInput', 'startAcList');
    setupAutocomplete('endInput', 'endAcList');

    function goDetail(el) {
        const routeId = el.getAttribute('data-route-id');

        // 카드의 데이터 수집
        const typeText = el.querySelector('.route-type').textContent.trim();
        const minutes  = parseInt(el.querySelector('.route-time').getAttribute('data-minutes'));
        const infoText = el.querySelector('.route-info').textContent.trim();

        // 환승 횟수 파싱 (예: "환승 2회 · 도보 3.5분")
        const transferMatch = infoText.match(/(\d+)회/);
        const transferCount = transferMatch ? parseInt(transferMatch[1]) : 0;

        let routeType = 'recommend';
        if (typeText.includes('빠른') || typeText.includes('Fastest'))     routeType = 'fast';
        if (typeText.includes('편한') || typeText.includes('Comfortable')) routeType = 'comfort';

        const startEl = document.getElementById('startInput');
        const endEl   = document.getElementById('endInput');

        // 클릭한 경로만 저장
        fetch('/api/transport/history', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                startPlace:    startEl ? startEl.value : '',
                endPlace:      endEl   ? endEl.value   : '',
                totalTime:     minutes,
                transferCount: transferCount,
                routeType:     routeType
            })
        }).then(() => {
            // 저장 후 상세 페이지 이동
            const lang = location.pathname.split('/')[1];
            location.href = `/${lang}/transport/detail?routeId=` + routeId;
        }).catch(() => {
            // 저장 실패해도 이동
            const lang = location.pathname.split('/')[1];
            location.href = `/${lang}/transport/detail?routeId=` + routeId;
        });
    }

    function fillSearch(start, end) {
        document.getElementById('startInput').value = start;
        document.getElementById('endInput').value = end;
        document.getElementById('searchForm').submit();
    }

    function useMyLocation() {
        if (!navigator.geolocation) {
            alert('이 브라우저는 위치 서비스를 지원하지 않아요.');
            return;
        }
        const btn = document.getElementById('locationBtn');
        btn.textContent = '📡 확인중...';
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(
            pos => {
                const { latitude: lat, longitude: lng } = pos.coords;
                document.getElementById('startLat').value = lat;
                document.getElementById('startLng').value = lng;

                fetch(`https://dapi.kakao.com/v2/local/geo/coord2address.json?x=${lng}&y=${lat}`, {
                    headers: { 'Authorization': KAKAO_KEY }
                })
                    .then(r => r.json())
                    .then(data => {
                        const docs = data.documents;
                        if (docs && docs.length > 0) {
                            const addr = docs[0];
                            const displayAddr = addr.road_address
                                ? addr.road_address.address_name
                                : (addr.address
                                    ? `${addr.address.region_1depth_name} ${addr.address.region_2depth_name} ${addr.address.region_3depth_name}`
                                    : '현재위치');
                            document.getElementById('startInput').value = displayAddr;
                        } else {
                            document.getElementById('startInput').value = '현재위치';
                        }
                        btn.textContent = '✅ 확인됨';
                        btn.style.background = '#0f172a';
                    })
                    .catch(() => {
                        document.getElementById('startInput').value = '현재위치';
                        btn.textContent = '✅ 확인됨';
                        btn.style.background = '#0f172a';
                    });
            },
            () => {
                alert('위치를 가져올 수 없어요. 직접 입력해주세요.');
                btn.textContent = '📡 현재위치';
                btn.disabled = false;
            }
        );
    }
    function swapLocations() {
        const startInput = document.getElementById('startInput');
        const endInput   = document.getElementById('endInput');
        const startLat   = document.getElementById('startLat');
        const startLng   = document.getElementById('startLng');

        // 현재위치 사용 중이면 좌표도 같이 초기화
        const tmpVal = startInput.value;
        startInput.value = endInput.value;
        endInput.value   = tmpVal;

        // 현재위치 좌표는 도착지로 이동하면 의미 없으므로 초기화
        startLat.value = '';
        startLng.value = '';
    }
</script>

</body>
</html>
