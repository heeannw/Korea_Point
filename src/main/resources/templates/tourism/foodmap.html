<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${lang == 'en' ? 'en' : 'ko'}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>Food Map — KoreaPoint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- ✅ CSS 분리: 테마 변수(foodmap.css) → 공통 스타일(map-common.css) 순서로 로드 -->
  <link rel="stylesheet" th:href="@{/css/tourism/foodmap.css}">
  <link rel="stylesheet" th:href="@{/css/tourism/map-common.css}">
</head>
<body>

<header>
  <a class="logo" th:href="@{/}">Korea<span>Point</span></a>
  <div class="header-right">
    <!-- 언어 버튼: th:if로 분기 (th:onclick SpEL 이스케이프 오류 방지) -->
    <th:block th:if="${lang == 'en'}">
      <button class="h-btn"        onclick="switchLang('ko')">KR</button>
      <button class="h-btn active">EN</button>
    </th:block>
    <th:block th:unless="${lang == 'en'}">
      <button class="h-btn active">KR</button>
      <button class="h-btn"        onclick="switchLang('en')">EN</button>
    </th:block>
        <th:block th:if="${isLoggedIn}">
            <span class="h-btn" th:text="${currentUserName}"></span>
            <a th:if="${isAdmin}" th:href="@{/admin}" class="h-btn">Admin</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="h-btn h-btn-fill">Logout</button>
            </form>
    </th:block>
    <th:block th:unless="${isLoggedIn}">
      <a th:href="@{/oauth2/authorization/google}" class="h-btn h-btn-fill">Login</a>
    </th:block>
  </div>
</header>

<div class="app-body">
  <div class="sidebar">

    <!-- 검색창 -->
    <div class="search-bar">
      <div class="search-wrap">
        <input type="text" id="searchInput"
               th:value="${keyword}"
               th:placeholder="${lang == 'en' ? 'Search restaurant name...' : '음식점 이름 검색...'}"
               autocomplete="off"
               onkeydown="handleSearchKey(event)"
               oninput="handleSearchInput()"
               onfocus="showDropdown()"
               onblur="scheduleHideDropdown()">
        <button class="si" type="button" onclick="goSearch()">🔍</button>
      </div>
      <div class="suggest-dropdown" id="suggestDropdown">
        <div id="suggestContent"></div>
      </div>
    </div>

    <!-- 카테고리 필터 -->
    <div class="filter-wrap">
      <button class="scroll-btn left" id="scrollLeft" onclick="scrollFilter(-1)" disabled>‹</button>
      <div class="filter-row" id="filterRow">
        <!-- KO 카테고리 -->
        <th:block th:unless="${lang == 'en'}">
          <div class="chip active" data-cat="ALL"          onclick="switchCategory('ALL')">🍽️ 전체</div>
          <div class="chip" data-cat="한식"                onclick="switchCategory('한식')">🍚 한식</div>
          <div class="chip" data-cat="중식"                onclick="switchCategory('중식')">🥟 중식</div>
          <div class="chip" data-cat="일식"                onclick="switchCategory('일식')">🍣 일식</div>
          <div class="chip" data-cat="양식"                onclick="switchCategory('양식')">🍝 양식</div>
          <div class="chip" data-cat="고기_해산물"         onclick="switchCategory('고기_해산물')">🥩 고기·해산물</div>
          <div class="chip" data-cat="바"                  onclick="switchCategory('바')">🍺 바</div>
          <div class="chip" data-cat="기타"                onclick="switchCategory('기타')">🍴 기타</div>
        </th:block>
        <!-- EN 카테고리 — data-cat·switchCategory는 서버 DB값(한국어)과 일치시켜야 필터 작동 -->
        <th:block th:if="${lang == 'en'}">
          <div class="chip active" data-cat="ALL"          onclick="switchCategory('ALL')">🍽️ All</div>
          <div class="chip" data-cat="한식"                onclick="switchCategory('한식')">🍚 Korean</div>
          <div class="chip" data-cat="중식"                onclick="switchCategory('중식')">🥟 Chinese</div>
          <div class="chip" data-cat="일식"                onclick="switchCategory('일식')">🍣 Japanese</div>
          <div class="chip" data-cat="양식"                onclick="switchCategory('양식')">🍝 Western</div>
          <div class="chip" data-cat="고기_해산물"         onclick="switchCategory('고기_해산물')">🥩 Meat·Seafood</div>
          <div class="chip" data-cat="바"                  onclick="switchCategory('바')">🍺 Bar</div>
          <div class="chip" data-cat="기타"                onclick="switchCategory('기타')">🍴 Other</div>
        </th:block>
      </div>
      <button class="scroll-btn right" id="scrollRight" onclick="scrollFilter(1)">›</button>
    </div>

    <div class="sort-row">
      <div class="result-count">
        <strong id="countDisplay">0</strong>
        <span th:text="${lang == 'en' ? ' places' : ' 개 음식점'}"> 개 음식점</span>
      </div>
      <div class="sort-btns">
        <button class="sort-btn active" onclick="setSort('recommended')" th:text="${lang == 'en' ? '⭐ AI Pick' : '⭐ AI추천'}">⭐ AI추천</button>
        <button class="sort-btn"        onclick="setSort('distance')"    th:text="${lang == 'en' ? '📍 Distance' : '📍 거리순'}">📍 거리순</button>
      </div>
    </div>

    <div class="list-loading" id="listLoading">
      <div class="spinner"></div>
      <span th:text="${lang == 'en' ? 'Loading...' : '불러오는 중...'}">불러오는 중...</span>
    </div>

    <div class="place-list" id="placeList">
      <div class="vs-spacer" id="vsSpacer"></div>
      <div class="vs-window" id="vsWindow"></div>
    </div>
  </div>

  <div class="map-area" id="mapArea">
    <div id="kakaoMap" style="position:absolute;inset:0;z-index:1;"></div>
    <div class="map-controls">
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()-1)">＋</div>
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()+1)">－</div>
    </div>
    <button class="loc-btn" type="button" onclick="getLocation()"
            th:text="${lang == 'en' ? '📍 Near Me' : '📍 현재 위치로 추천'}">📍 현재 위치로 추천</button>

    <!-- 상세 패널 -->
    <div class="detail-panel" id="detailPanel">
      <div class="dp-header">
        <button class="dp-back" onclick="closeDetail()">←</button>
        <div class="dp-title" id="dpTitle"></div>
      </div>
      <div class="dp-img" id="dpImg"></div>
      <div class="dp-body">
        <div class="dp-badge-row" id="dpBadges"></div>
        <div class="dp-name"      id="dpName"></div>
        <div class="dp-sub"       id="dpSub"></div>
        <div class="dp-stars"     id="dpStars"></div>
        <div class="dp-info-row"  id="dpInfoRow"></div>
        <div class="dp-section-title" th:text="${lang == 'en' ? 'Reviews' : '리뷰'}">리뷰</div>
        <div class="rev-summary"  id="dpRevSummary"></div>
        <div id="dpReviews"></div>
      </div>
      <div class="dp-action">
        <button class="dp-action-btn dp-btn-transport" onclick="openTransportMap()"
                th:text="${lang == 'en' ? '🚇 Directions' : '🚇 교통'}">🚇 교통</button>
        <button class="dp-action-btn dp-btn-tour" onclick="openTourMap()"
                th:text="${lang == 'en' ? '🗺️ Tourism' : '🗺️ 근처 관광지'}">🗺️ 근처 관광지</button>
        <button class="dp-action-btn" onclick="openCafeMap()"
                style="background:#6f4e37;color:#fff;border:none"
                th:text="${lang == 'en' ? '☕ Nearby Cafes' : '☕ 근처 카페'}">☕ 근처 카페</button>
      </div>
    </div>
  </div>
</div>

<!-- Thymeleaf → JS 변수 주입 -->
<script th:inline="javascript">
  const userLat       = /*[[${userlat}]]*/ 37.5665;
  const userLon       = /*[[${userlon}]]*/ 126.9780;
  const PLACES        = /*[[${list}]]*/    [];
  const INIT_CATEGORY = /*[[${category}]]*/ 'ALL';
  const LANG          = /*[[${lang}]]*/    'ko';  // 'ko' 또는 'en'
  const FOOD_THUMB_MAP   = /*[[${foodThumbMap}]]*/   {};  // ✅ 카드용 썸네일 리스트 (10장)
  const FOOD_REGULAR_MAP = /*[[${foodRegularMap}]]*/ {};  // ✅ 상세패널용 고화질 리스트 (10장)
  // 인덱스 기반으로 이미지 선택 (% 로 순환)
  const getFoodThumb   = (cat, idx) => { const l = FOOD_THUMB_MAP[cat];   return l?.length ? l[idx % l.length]   : ''; };
  const getFoodRegular = (cat, idx) => { const l = FOOD_REGULAR_MAP[cat]; return l?.length ? l[idx % l.length]   : getFoodThumb(cat, idx); };
  // ── 파파고 번역 캐시 & 함수 ────────────────────────────
  // localStorage 영구 캐시: 한 번 번역한 이름은 다음 방문 시 즉시 표시
  const _LS_KEY = 'tCache_food_en';
  const _tCache = LANG === 'en'
          ? (() => { try { return JSON.parse(localStorage.getItem(_LS_KEY) || '{}'); } catch { return {}; } })()
          : {};

  function _saveCache() {
    try { localStorage.setItem(_LS_KEY, JSON.stringify(_tCache)); } catch {}
  }

  // 단건 번역 (상세 패널 이름·리뷰 등 개별 텍스트용)
  async function tr(text) {
    if (!text || !text.trim() || LANG !== 'en') return text;
    if (_tCache[text] !== undefined) return _tCache[text];
    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text, source: 'ko', target: 'en' })
      });
      const data = await res.json();
      _tCache[text] = data.translatedText || text;
      _saveCache();
    } catch { _tCache[text] = text; }
    return _tCache[text];
  }

  // 청크 단위 배치 번역: 10개씩 묶어서 API 호출 (파파고 글자수 제한 회피)
  async function _trChunk(arr) {
    const valid = arr.filter(t => t && t.trim());
    if (!valid.length) return;
    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text: valid.join('\n'), source: 'ko', target: 'en' })
      });
      const data = await res.json();
      const translated = (data.translatedText || '').split('\n');
      valid.forEach((t, i) => { _tCache[t] = translated[i]?.trim() || t; });
      _saveCache();
    } catch { valid.forEach(t => { _tCache[t] = t; }); }
  }

  // 가시 영역 N개만 번역 (스크롤/카테고리 전환 시 호출)
  async function trAll(arr) {
    if (!arr.length || LANG !== 'en') return arr;
    const uncached = [...new Set(arr.filter(t => t && t.trim() && _tCache[t] === undefined))];
    if (uncached.length) {
      // 10개씩 청크로 나눠 순차 호출 → 파파고 글자수 제한 회피
      const CHUNK = 10;
      for (let i = 0; i < uncached.length; i += CHUNK) {
        await _trChunk(uncached.slice(i, i + CHUNK));
      }
    }
    return arr.map(t => _tCache[t] || t);
  }


  // 언어별 UI 텍스트
  const T = {
    searchSuggestion : LANG === 'en' ? '🔍 Suggestions'   : '🔍 연관 검색어',
    recentKeywords   : LANG === 'en' ? '🕐 Recent'        : '🕐 최근 검색어',
    clearAll         : LANG === 'en' ? 'Clear all'         : '전체 삭제',
    searchEmpty      : LANG === 'en' ? 'Type to search...' : '검색어를 입력하세요',
    emptyState       : LANG === 'en' ? 'Press "Near Me" or search a restaurant name'
            : '현재 위치 버튼을 누르거나<br>음식점 이름을 검색해보세요',
    popularBadge     : LANG === 'en' ? 'Popular'           : '인기',
    reviewLabel      : LANG === 'en' ? 'reviews'           : '개',
    labelAvgReview   : LANG === 'en' ? 'Avg. Review'       : '평균 리뷰 별점',
    labelDistance    : LANG === 'en' ? 'Distance'          : '거리',
    labelAiScore     : LANG === 'en' ? 'AI Score'          : 'AI 추천 점수',
    labelCategory    : LANG === 'en' ? 'Category'          : '카테고리',
    noReviews        : LANG === 'en' ? 'No reviews yet.'   : '등록된 리뷰가 없습니다.',
    detailsBtn       : LANG === 'en' ? 'Details →'         : '상세보기 →',
    defaultCat       : LANG === 'en' ? 'Restaurant'        : '음식점',
    reviewerLabel    : LANG === 'en' ? 'Reviewer'          : '리뷰어',
    aiPt             : LANG === 'en' ? 'pt'                : '점',
    myLocation       : LANG === 'en' ? 'My Location'       : '내 위치',
  };

  // URL prefix
  const PREFIX           = LANG === 'en' ? '/en' : '';
  const TRANSPORT_PREFIX = LANG === 'en' ? '/en' : '/ko';
  const TOUR_LANG        = LANG === 'en' ? 'EN'  : 'KR';

  // 카테고리 색상/이모지 — data-cat이 한국어로 통일되었으므로 KO 키만 사용
  const CAT_COLOR = {
    '한식':'#ef4444','중식':'#f97316','일식':'#3b82f6',
    '양식':'#8b5cf6','고기_해산물':'#f59e0b','바':'#6366f1','기타':'#64748b'
  };
  const CAT_EMOJI = {
    '한식':'🍚','중식':'🥟','일식':'🍣','양식':'🍝','고기_해산물':'🥩','바':'🍺','기타':'🍴'
  };
</script>

<script>
  let activeCategory    = INIT_CATEGORY;
  let activeSort        = 'recommended';
  let activePinName     = null;
  let currentPopupPlace = null;
  let popupOverlay      = null;
  let map;
  let clusterer;

  const catColor = cat => CAT_COLOR[cat] ?? '#f472b6';
  const catEmoji = cat => CAT_EMOJI[cat]  ?? '🍽️';

  function makeSVGMarker(color, emoji) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
      <ellipse cx="16" cy="38" rx="6" ry="2.5" fill="rgba(0,0,0,0.18)"/>
      <path d="M16 2 C8.268 2 2 8.268 2 16 C2 26 16 38 16 38 C16 38 30 26 30 16 C30 8.268 23.732 2 16 2Z"
            fill="${color}" stroke="white" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="7" fill="white" opacity="0.9"/>
      <text x="16" y="20" text-anchor="middle" font-size="10" font-family="sans-serif">${emoji}</text>
    </svg>`;
    return new kakao.maps.MarkerImage(
            'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
            new kakao.maps.Size(32, 40)
    );
  }

  /* ── 최근 검색어 ── */
  const RECENT_KEY = LANG === 'en' ? 'food_en_recent_keywords' : 'food_recent_keywords';
  const getRecent  = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; } };
  function saveRecent(kw) {
    if (!kw.trim()) return;
    let list = getRecent().filter(k => k !== kw);
    list.unshift(kw);
    if (list.length > 8) list = list.slice(0, 8);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
  }
  function deleteRecent(kw, e) {
    e.stopPropagation();
    localStorage.setItem(RECENT_KEY, JSON.stringify(getRecent().filter(k => k !== kw)));
    renderDropdown(document.getElementById('searchInput').value);
  }
  function clearAllRecent() {
    localStorage.removeItem(RECENT_KEY);
    renderDropdown('');
  }

  /* ── 자동완성 드롭다운 ── */
  function getSuggestions(q) {
    if (!q) return [];
    const lower = q.toLowerCase();
    return PLACES
            .filter(p => (p.name ?? '').toLowerCase().includes(lower) || (p.googleName ?? '').toLowerCase().includes(lower))
            .slice(0, 6).map(p => p.name);
  }

  function renderDropdown(q) {
    const box = document.getElementById('suggestContent');
    const suggestions = getSuggestions(q);
    const recent = getRecent();
    let html = '';
    if (suggestions.length > 0) {
      html += `<div class="suggest-section-title"><span>${T.searchSuggestion}</span></div>`;
      suggestions.forEach(s => {
        const cat = (PLACES.find(p => p.name === s) || {}).category ?? '';
        html += `<div class="suggest-item" onmousedown="doSearch('${escJS(s)}')">
          <div class="suggest-item-kw">
            <span class="icon" style="color:${catColor(cat)}">${catEmoji(cat)}</span>
            <span>${s}</span>
          </div>
        </div>`;
      });
      if (recent.length > 0) html += `<hr class="suggest-divider">`;
    }
    if (recent.length > 0) {
      html += `<div class="suggest-section-title"><span>${T.recentKeywords}</span>
        <button type="button" onmousedown="clearAllRecent()">${T.clearAll}</button></div>`;
      recent.forEach(kw => {
        html += `<div class="suggest-item">
          <div class="suggest-item-kw" onmousedown="doSearch('${escJS(kw)}')">
            <span class="icon">🕐</span><span>${kw}</span>
          </div>
          <button class="suggest-del" onmousedown="deleteRecent('${escJS(kw)}', event)">✕</button>
        </div>`;
      });
    }
    if (!html) html = `<div class="suggest-empty">${T.searchEmpty}</div>`;
    box.innerHTML = html;
  }

  function showDropdown() {
    renderDropdown(document.getElementById('searchInput').value);
    document.getElementById('suggestDropdown').classList.add('show');
  }
  let hideTimer;
  function scheduleHideDropdown() {
    hideTimer = setTimeout(() => document.getElementById('suggestDropdown').classList.remove('show'), 200);
  }
  function handleSearchInput() {
    renderDropdown(document.getElementById('searchInput').value);
    document.getElementById('suggestDropdown').classList.add('show');
    render();
  }
  function handleSearchKey(e) {
    if (e.key === 'Enter') goSearch();
    if (e.key === 'Escape') document.getElementById('suggestDropdown').classList.remove('show');
  }
  function doSearch(kw) {
    document.getElementById('searchInput').value = kw;
    document.getElementById('suggestDropdown').classList.remove('show');
    saveRecent(kw);
    location.href = `${PREFIX}/foodmap/search?keyword=${encodeURIComponent(kw)}&category=${encodeURIComponent(activeCategory)}`;
  }
  function goSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) { saveRecent(q); location.href = `${PREFIX}/foodmap/search?keyword=${encodeURIComponent(q)}&category=${encodeURIComponent(activeCategory)}`; }
  }

  /* ── 필터 스크롤 ── */
  function scrollFilter(dir) {
    document.getElementById('filterRow').scrollLeft += dir * 120;
    setTimeout(updateScrollBtns, 150);
  }
  function updateScrollBtns() {
    const row = document.getElementById('filterRow');
    document.getElementById('scrollLeft').disabled  = row.scrollLeft <= 0;
    document.getElementById('scrollRight').disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 1;
  }
  document.getElementById('filterRow').addEventListener('scroll', updateScrollBtns);

  /* ── 카테고리 Ajax 전환 ── */
  async function switchCategory(cat) {
    if (cat === activeCategory) return;
    activeCategory = cat;

    document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
    const activeChip = document.querySelector(`.chip[data-cat="${cat}"]`);
    if (activeChip) activeChip.classList.add('active');

    document.getElementById('listLoading').classList.add('show');
    document.getElementById('vsWindow').innerHTML    = '';
    document.getElementById('vsSpacer').style.height = '0px';

    const path = location.pathname;
    let apiUrl;
    if (path.includes('/foodmap/mylocation')) {
      apiUrl = `/foodmap/api/places?lat=${userLat}&lng=${userLon}&category=${encodeURIComponent(cat)}`;
    } else if (path.includes('/foodmap/search') && document.getElementById('searchInput').value.trim()) {
      const ref = PLACES[0];
      apiUrl = ref
              ? `/foodmap/api/places?lat=${ref.lat}&lng=${ref.lng}&category=${encodeURIComponent(cat)}`
              : `/foodmap/api/places?category=${encodeURIComponent(cat)}`;
    } else {
      apiUrl = `/foodmap/api/places?category=${encodeURIComponent(cat)}`;
    }

    try {
      const res  = await fetch(apiUrl);
      const data = await res.json();
      PLACES.length = 0;
      data.forEach(d => PLACES.push(d));
    } catch (e) {
      console.error('카테고리 전환 실패:', e);
    }

    document.getElementById('listLoading').classList.remove('show');
    render();
    redrawMarkers();
  }

  function initChips() {
    document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
    const activeChip = document.querySelector(`.chip[data-cat="${activeCategory}"]`);
    if (activeChip) activeChip.classList.add('active');
  }

  /* ── 정렬 ── */
  function setSort(s) {
    activeSort = s;
    document.querySelectorAll('.sort-btn').forEach((b, i) =>
            b.classList.toggle('active', (s === 'recommended' && i === 0) || (s === 'distance' && i === 1))
    );
    render();
  }

  /* ── 필터/정렬 ── */
  function getFiltered() {
    let list = [...PLACES];
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    if (q) list = list.filter(p =>
            (p.name ?? '').toLowerCase().includes(q) || (p.googleName ?? '').toLowerCase().includes(q)
    );
    if (activeSort === 'distance') list.sort((a,b) => (a.distance ?? 9999) - (b.distance ?? 9999));
    else                           list.sort((a,b) => (b.finalScore ?? 0) - (a.finalScore ?? 0));
    return list;
  }

  /* ── 가상 스크롤 렌더 ── */
  const ITEM_H   = 100;
  const OVERSCAN = 3;

  function render() {
    const list = getFiltered();
    window._currentList = list;
    document.getElementById('countDisplay').textContent = list.length;

    const container = document.getElementById('placeList');
    const spacer    = document.getElementById('vsSpacer');
    const window_   = document.getElementById('vsWindow');

    if (list.length === 0) {
      spacer.style.height = '0px';
      window_.innerHTML = `<div class="empty-state"><div class="ei">🍽️</div>
        <p>${T.emptyState}</p></div>`;
      return;
    }

    spacer.style.height = (list.length * ITEM_H) + 'px';

    function paintVisible() {
      const scrollTop = container.scrollTop;
      const viewH     = container.clientHeight;
      const startIdx  = Math.max(0, Math.floor(scrollTop / ITEM_H) - OVERSCAN);
      const endIdx    = Math.min(list.length - 1, Math.ceil((scrollTop + viewH) / ITEM_H) + OVERSCAN);

      window_.style.top = (startIdx * ITEM_H) + 'px';
      window_.innerHTML = list.slice(startIdx, endIdx + 1).map((p, rel) => {
        const i = startIdx + rel;
        return `
          <div class="place-card${activePinName === p.name ? ' active' : ''}"
               id="card-${encodeId(p.name)}"
               onclick="selectPlace('${escJS(p.name)}')">
            <div class="thumb">
              <div class="rank" style="background:${catColor(p.category)}">${i + 1}</div>
              ${getFoodThumb(p.category, i)
                ? `<img src="${getFoodThumb(p.category, i)}" alt="${p.category}"
                        style="width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;"
                        onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span style=\\'font-size:28px;display:flex;align-items:center;justify-content:center;width:100%;height:100%\\'>${catEmoji(p.category)}</span>')">`
                : `<span style="font-size:28px;display:flex;align-items:center;justify-content:center;width:100%;height:100%">${catEmoji(p.category)}</span>`}
            </div>
            <div class="card-info">
              <div class="card-cat" style="color:${catColor(p.category)}">${(LANG==='en' ? (p.categoryEn ?? p.category) : p.category) ?? T.defaultCat} · AI ${((p.finalScore ?? 0) * 100).toFixed(0)}${T.aiPt}</div>
              <div class="card-name">${LANG==='en' ? (p.nameEn || _tCache[p.name] || p.name || '-') : (p.name || '-')}</div>
              <div class="card-meta">
                <span class="stars-s">★</span>${(p.avgStar ?? 0).toFixed(1)}
                (${LANG === 'en' ? (p.reviewCount ?? 0) + ' reviews' : '리뷰 ' + (p.reviewCount ?? 0) + '개'})
                <span class="card-dist">📍 ${distStr(p.distance)}</span>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    container.onscroll = () => {
      paintVisible();
      // 스크롤 시 새로 보이는 항목 번역
      if (LANG === 'en') {
        const scrollTop = container.scrollTop;
        const viewH     = container.clientHeight;
        const si = Math.max(0, Math.floor(scrollTop / ITEM_H) - OVERSCAN);
        const ei = Math.min(list.length - 1, Math.ceil((scrollTop + viewH) / ITEM_H) + OVERSCAN);
        const visibleNames = list.slice(si, ei + 1).map(p => p.name ?? '').filter(n => n && !_tCache[n]);
        if (visibleNames.length) {
          trAll(visibleNames).then(() => paintVisible());
        }
      }
    };
    container.scrollTop = 0;

    if (LANG === 'en') {
      // ✅ nameEn이 이미 있으면 파파고 호출 없이 즉시 렌더
      const needTranslate = list.slice(0, 10).filter(p => !p.nameEn && p.name && !_tCache[p.name]).map(p => p.name);
      if (needTranslate.length) {
        trAll(needTranslate).then(() => paintVisible());
      }
      paintVisible();
    } else {
      paintVisible();
    }
  }

  /* ── 선택 / 팝업 ── */
  function selectPlace(name) {
    closeDetail();
    activePinName = name;
    render();
    const list = window._currentList || PLACES;
    const p = list.find(x => x.name === name) || PLACES.find(x => x.name === name);
    if (!p) return;
    const idx = list.findIndex(x => x.name === name);
    if (idx >= 0) document.getElementById('placeList').scrollTop = idx * ITEM_H;
    if (p.lat && p.lng && map) map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
    showPopupOverlay(p);
  }

  function showPopupOverlay(p) {
    closePopup();
    currentPopupPlace = p;
    if (!map || !p.lat || !p.lng) return;
    const color = catColor(p.category);
    const emoji = catEmoji(p.category);
    const content = `
      <div style="background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);
                  width:240px;overflow:hidden;border:1px solid #fce7f3;">
        <div style="height:90px;background:#fdf2f8;display:flex;align-items:center;
                    justify-content:center;font-size:36px;position:relative;overflow:hidden;">
          ${getFoodThumb(p.category, 0)
            ? `<img src="${getFoodThumb(p.category, 0)}" alt="${p.category}"
                    style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;"
                    onerror="this.style.display='none'">`
            : emoji}
          <button onmousedown="closePopup()"
            style="position:absolute;top:6px;right:8px;background:rgba(0,0,0,.4);
                   color:#fff;border:none;border-radius:50%;width:22px;height:22px;
                   cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">×</button>
        </div>
        <div style="padding:12px;">
          <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:2px;">${LANG==='en' ? (p.categoryEn ?? p.category ?? T.defaultCat) : (p.category ?? T.defaultCat)}</div>
          <div style="font-size:14px;font-weight:700;margin-bottom:3px;">${LANG==='en' ? (p.nameEn || p.name || '-') : (p.name ?? '-')}</div>
          <div style="font-size:12px;color:#64748b;margin-bottom:8px;">
            ★ ${(p.avgStar ?? 0).toFixed(1)} · ${distStr(p.distance)} · AI ${((p.finalScore??0)*100).toFixed(0)}${T.aiPt}
          </div>
          <a href="#" onmousedown="openDetailFromPopup(event)"
             style="display:block;width:100%;padding:8px;background:${color};color:#fff;
                    border-radius:8px;font-size:13px;font-weight:600;text-align:center;text-decoration:none;">
            ${T.detailsBtn}
          </a>
        </div>
      </div>`;
    popupOverlay = new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(p.lat, p.lng), content, yAnchor: 1.45, zIndex: 40 });
  }

  function closePopup() {
    if (popupOverlay) { popupOverlay.setMap(null); popupOverlay = null; }
    currentPopupPlace = null;
    activePinName = null;
    render();
  }
  function openDetailFromPopup(e) {
    e.preventDefault();
    if (currentPopupPlace) openDetail(currentPopupPlace);
  }

  /* ── 상세 패널 (리뷰 지연 로딩) ── */
  async function openDetail(p) {
    if (!p) return;
    if (popupOverlay) { popupOverlay.setMap(null); popupOverlay = null; }

    const color = catColor(p.category);
    const stars = Math.round(p.avgStar ?? 0);

    // ✅ nameEn이 있으면 파파고 호출 없이 즉시 사용
    const dispName = LANG === 'en' ? (p.nameEn || await tr(p.name ?? '')) : (p.name ?? '');
    const dispSub  = LANG === 'en' ? (p.googleName ?? '') : (p.googleName ?? '');

    document.getElementById('dpTitle').textContent = dispName;
    document.getElementById('dpName').textContent  = dispName;
    document.getElementById('dpSub').textContent   = dispSub;
    document.getElementById('dpImg').innerHTML = (() => {
      const _placeIdx = PLACES.indexOf(p);
      const _imgUrl   = getFoodRegular(p.category, _placeIdx >= 0 ? _placeIdx : 0);
      return _imgUrl
              ? `<img src="${_imgUrl}" alt="${p.category}"
                style="width:100%;height:100%;object-fit:cover;border-radius:12px 12px 0 0;"
                onerror="this.outerHTML='<span style=\\'font-size:56px;display:flex;align-items:center;justify-content:center;width:100%;height:100%\\'>${catEmoji(p.category)}</span>'">`
              : `<span style="font-size:56px">${catEmoji(p.category)}</span>`;
    })();

    document.getElementById('dpBadges').innerHTML =
            `<span class="dp-badge" style="background:${color}22;color:${color}">${LANG==='en' ? (p.categoryEn ?? p.category ?? T.defaultCat) : (p.category ?? T.defaultCat)}</span>
       <span class="dp-badge db-gold">🏆 ${((p.finalScore ?? 0) * 100).toFixed(0)}${T.aiPt}</span>
       ${(p.reviewCount ?? 0) >= 10 ? `<span class="dp-badge db-green">${T.popularBadge}</span>` : ''}`;

    document.getElementById('dpStars').innerHTML =
            `<span class="s" style="color:var(--gold)">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span>
       <span class="sc">${(p.avgStar ?? 0).toFixed(1)}</span>
       <span class="sm">/ 5.0 &nbsp;·&nbsp; ${LANG === 'en' ? (p.reviewCount ?? 0) + ' reviews' : '리뷰 ' + (p.reviewCount ?? 0) + '개'}</span>`;

    document.getElementById('dpInfoRow').innerHTML =
            `<div class="dp-info"><div class="dp-info-label">${T.labelAvgReview}</div>
         <div class="dp-info-val">★ ${(p.reviewMean ?? p.avgStar ?? 0).toFixed(1)} / 5.0</div></div>
       <div class="dp-info"><div class="dp-info-label">${T.labelDistance}</div>
         <div class="dp-info-val">${distStr(p.distance)}</div></div>
       <div class="dp-info"><div class="dp-info-label">${T.labelAiScore}</div>
         <div class="dp-info-val">🏆 ${((p.finalScore ?? 0) * 100).toFixed(1)} / 100</div></div>
       <div class="dp-info"><div class="dp-info-label">${T.labelCategory}</div>
         <div class="dp-info-val" style="color:${color};font-weight:700">${LANG==='en' ? (p.categoryEn ?? p.category ?? T.defaultCat) : (p.category ?? T.defaultCat)}</div></div>`;

    document.getElementById('dpRevSummary').innerHTML =
            `<div class="review-skeleton" style="flex:1">
         <div class="sk-line" style="width:30%"></div>
         <div class="sk-line" style="width:60%"></div>
         <div class="sk-line short"></div>
       </div>`;
    document.getElementById('dpReviews').innerHTML =
            `<div class="review-skeleton">
         <div class="sk-line"></div><div class="sk-line short"></div>
         <div class="sk-line"></div><div class="sk-line short"></div>
       </div>`;

    window._detailPlace = p;
    document.getElementById('detailPanel').classList.add('open');

    try {
      const res    = await fetch(`/foodmap/detail/${encodeURIComponent(p.name)}`);
      const detail = await res.json();
      renderReviews(detail.reviews ?? []);
    } catch (e) {
      renderReviews([]);
    }
  }

  function renderReviews(reviews) {
    const avg = reviews.length
            ? (reviews.reduce((s, r) => s + (r.rating ?? 0), 0) / reviews.length).toFixed(1)
            : (window._detailPlace?.reviewMean ?? window._detailPlace?.avgStar ?? 0).toFixed(1);

    document.getElementById('dpRevSummary').innerHTML =
            `<div><div class="rev-score">${avg}</div>
         <div style="color:var(--gold);font-size:14px;margin-top:4px">${'★'.repeat(Math.round(parseFloat(avg)))}</div>
       </div>
       <div class="rev-right"><div class="rev-bars">
         ${[5,4,3,2,1].map(s => {
              const cnt = reviews.filter(r => Math.round(r.rating ?? 0) === s).length;
              const pct = reviews.length ? Math.round(cnt / reviews.length * 100) : 0;
              return `<div class="rev-row"><span>${s}</span>
             <div class="rev-track"><div class="rev-fill" style="width:${pct}%"></div></div>
             <span>${pct}%</span></div>`;
            }).join('')}
       </div></div>`;

    // ✅ EN이면 리뷰 번역
    if (reviews.length > 0 && LANG === 'en') {
      trAll(reviews.slice(0, 5).map(r => r.content ?? '')).then(tContents => {
        document.getElementById('dpReviews').innerHTML = reviews.slice(0, 5).map((r, i) => `
          <div class="review-item">
            <div class="ri-top"><div><div class="ri-name">${T.reviewerLabel}</div></div>
              <div class="ri-stars">${'★'.repeat(Math.round(r.rating ?? 0))}</div></div>
            <div class="ri-text">${tContents[i] || r.content || ''}</div>
          </div>`).join('');
      });
    } else {
      document.getElementById('dpReviews').innerHTML = reviews.length > 0
              ? reviews.slice(0, 5).map(r => `
          <div class="review-item">
            <div class="ri-top"><div><div class="ri-name">${T.reviewerLabel}</div></div>
              <div class="ri-stars">${'★'.repeat(Math.round(r.rating ?? 0))}</div></div>
            <div class="ri-text">${r.content ?? ''}</div>
          </div>`).join('')
              : `<p style="color:var(--gray);font-size:13px;padding:12px 0">${T.noReviews}</p>`;
    }
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
    window._detailPlace = null;
  }

  /* ── 버튼 액션 ── */
  function openTransportMap() {
    const p = window._detailPlace || currentPopupPlace;
    if (!p) return;
    const endTitle  = encodeURIComponent(p.name);
    // ✅ BUG3 FIX: 이름만 넘기면 카카오 지오코딩이 동명 장소로 오작동
    //   → 음식점의 실제 좌표(endLat, endLng)도 함께 전달
    const endCoords = `&endLat=${p.lat}&endLng=${p.lng}`;
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${pos.coords.latitude}&startLng=${pos.coords.longitude}&end=${endTitle}${endCoords}`,
              ()   => location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${userLat}&startLng=${userLon}&end=${endTitle}${endCoords}`
      );
    } else {
      location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${userLat}&startLng=${userLon}&end=${endTitle}${endCoords}`;
    }
  }
  function openTourMap() {
    const p = window._detailPlace || currentPopupPlace;
    if (!p) return;
    location.href = `/tour/mylocation/${p.lat}/${p.lng}?lang=${TOUR_LANG}`;
  }
  function openCafeMap() {
    const p = window._detailPlace || currentPopupPlace;
    if (!p) return;
    location.href = `${PREFIX}/cafe/mylocation/${p.lat}/${p.lng}`;
  }

  /* ── 현위치 ── */
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${PREFIX}/foodmap/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?category=${encodeURIComponent(activeCategory)}`,
              ()  => location.href = `${PREFIX}/foodmap/mylocation/37.5665/126.9780?category=${encodeURIComponent(activeCategory)}`
      );
    } else {
      location.href = `${PREFIX}/foodmap/mylocation/37.5665/126.9780?category=${encodeURIComponent(activeCategory)}`;
    }
  }

  /* ── 언어 전환 ── */
  function switchLang(toLang) {
    // ✅ 언어 설정 localStorage에 저장 → 다른 페이지 갔다와도 유지
    localStorage.setItem('site_lang', toLang);
    const path = location.pathname;
    if (toLang === 'en') {
      location.href = path.replace('/foodmap/', '/en/foodmap/');
    } else {
      location.href = path.replace('/en/foodmap/', '/foodmap/');
    }
  }

  // ✅ 페이지 진입 시 저장된 언어와 현재 언어가 다르면 자동 전환
  // (다른 페이지 갔다 돌아왔을 때 언어 유지)
  (function autoLang() {
    const saved = localStorage.getItem('site_lang');
    if (!saved) { localStorage.setItem('site_lang', LANG); return; }
    if (saved === 'en' && LANG !== 'en' && !location.pathname.startsWith('/en/')) {
      location.href = location.pathname.replace('/foodmap/', '/en/foodmap/');
    } else if (saved === 'ko' && LANG === 'en') {
      location.href = location.pathname.replace('/en/foodmap/', '/foodmap/');
    }
  })();

  /* ── 유틸 ── */
  function distStr(d) {
    if (d == null || d === 0) return '-';
    return d < 1 ? (d * 1000).toFixed(0) + 'm' : d.toFixed(1) + 'km';
  }
  function encodeId(name) { return btoa(encodeURIComponent(name || '')).replace(/[^a-zA-Z0-9]/g, ''); }
  function escJS(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

  /* ── 마커 재그리기 ── */
  function redrawMarkers() {
    if (!map || !clusterer) return;
    clusterer.clear();
    const markers = PLACES.filter(p => p.lat && p.lng).map(p => {
      const marker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(p.lat, p.lng),
        title:    p.name,
        image:    makeSVGMarker(catColor(p.category), catEmoji(p.category))
      });
      kakao.maps.event.addListener(marker, 'click', () => selectPlace(p.name));
      return marker;
    });
    clusterer.addMarkers(markers);
  }

  document.getElementById('mapArea').addEventListener('click', function(e) {
    // ✅ BUG FIX: CustomOverlay는 별도 DOM이라 closest('.detail-panel') 체크가 안 됨
    // popupOverlay가 살아있을 때 mapArea 클릭은 무시 (CustomOverlay 내부 클릭 보호)
    if (popupOverlay) return;
    if (!e.target.closest('.detail-panel')) closePopup();
  });

  /* ── 초기 실행 ── */
  initChips();
  render();
  setTimeout(updateScrollBtns, 100);

  // ✅ ?continue 파라미터가 붙으면 제거 (무한 리다이렉트 방지)
  if (location.search.includes('continue')) {
    history.replaceState(null, '', location.pathname);
  }

  // PLACES가 없고 mylocation 페이지도 아닐 때만 현위치로 이동
  if (PLACES.length === 0 && !location.pathname.includes('/foodmap/mylocation')) {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${PREFIX}/foodmap/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?category=${encodeURIComponent(activeCategory)}`,
              ()  => location.href = `${PREFIX}/foodmap/mylocation/37.5665/126.9780?category=${encodeURIComponent(activeCategory)}`
      );
    }
  }
</script>

<script defer th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoKey}&autoload=false&libraries=clusterer|"></script>
<script>
  function initMap() {
    kakao.maps.load(function () {
      map = new kakao.maps.Map(document.getElementById('kakaoMap'), {
        center: new kakao.maps.LatLng(userLat, userLon),
        level:  5
      });

      const myMarkerImg = new kakao.maps.MarkerImage(
              'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
              new kakao.maps.Size(30, 40)
      );
      new kakao.maps.Marker({ map, position: new kakao.maps.LatLng(userLat, userLon), title: T.myLocation, image: myMarkerImg });

      clusterer = new kakao.maps.MarkerClusterer({
        map,
        averageCenter: true,
        minLevel: 4,
        disableClickZoom: false,
        styles: [{
          width:'44px', height:'44px', background:'rgba(244,114,182,.85)',
          borderRadius:'50%', color:'#fff', textAlign:'center',
          fontWeight:'700', lineHeight:'44px', fontSize:'13px',
          border:'2.5px solid #db2777'
        }]
      });

      const markers = PLACES.filter(p => p.lat && p.lng).map(p => {
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(p.lat, p.lng),
          title:    p.name,
          image:    makeSVGMarker(catColor(p.category), catEmoji(p.category))
        });
        kakao.maps.event.addListener(marker, 'click', () => selectPlace(p.name));
        return marker;
      });
      clusterer.addMarkers(markers);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMap);
  } else {
    initMap();
  }
</script>
</body>
</html>
