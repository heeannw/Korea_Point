<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${lang == 'en' ? 'en' : 'ko'}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>Food Map — KoreaPoint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent:#f472b6; --accent-dk:#db2777; --accent-lt:#fdf2f8;
      --border-col:#fce7f3; --light-bg:#fdf2f8; --sh:0 2px 16px rgba(244,114,182,.12);
      --dark:#0f172a; --mid:#334155; --gray:#64748b;
      --white:#fff; --gold:#f59e0b; --green:#16a34a; --r:12px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--dark);display:flex;flex-direction:column}

    header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border-col);background:var(--white);flex-shrink:0;z-index:100}
    .logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--accent-dk);text-decoration:none}
    .logo span{color:var(--dark)}
    .header-right{display:flex;gap:8px;align-items:center}
    .h-btn{padding:7px 16px;border-radius:50px;border:1.5px solid var(--border-col);background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--dark);text-decoration:none;display:inline-flex;align-items:center;transition:all .2s}
    .h-btn:hover,.h-btn.active{border-color:var(--accent);color:var(--accent)}
    .h-btn-fill{background:var(--accent);color:#fff;border-color:var(--accent)}
    .h-btn-fill:hover{background:var(--accent-dk);color:#fff}

    .app-body{flex:1;display:flex;overflow:hidden}
    .sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border-col);background:var(--white)}

    .search-bar{padding:14px 16px 0;flex-shrink:0;position:relative}
    .search-wrap{position:relative}
    .search-wrap input{width:100%;padding:10px 42px 10px 16px;border:1.5px solid var(--border-col);border-radius:50px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:var(--light-bg);transition:border .2s;color:var(--dark)}
    .search-wrap input:focus{border-color:var(--accent);background:#fff}
    .search-wrap .si{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray);font-size:15px;cursor:pointer;padding:0}

    .suggest-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--border-col);border-radius:var(--r);box-shadow:var(--sh);z-index:300;display:none;max-height:280px;overflow-y:auto}
    .suggest-dropdown.show{display:block}
    .suggest-section-title{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;padding:10px 14px 4px;display:flex;justify-content:space-between;align-items:center}
    .suggest-section-title button{background:none;border:none;font-size:11px;color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600}
    .suggest-item{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;transition:background .15s}
    .suggest-item:hover{background:var(--light-bg)}
    .suggest-item-kw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dark);flex:1}
    .suggest-item-kw .icon{color:var(--gray)}
    .suggest-del{background:none;border:none;color:var(--gray);cursor:pointer;font-size:14px;padding:2px 6px}
    .suggest-del:hover{color:var(--dark)}
    .suggest-empty{padding:14px;text-align:center;font-size:13px;color:var(--gray)}
    .suggest-divider{border:none;border-top:1px solid var(--border-col);margin:4px 0}

    .filter-wrap{padding:10px 0 0;display:flex;align-items:center;flex-shrink:0}
    .scroll-btn{flex-shrink:0;width:28px;height:28px;border:1.5px solid var(--border-col);border-radius:50%;background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gray);transition:all .2s;box-shadow:0 1px 6px rgba(0,0,0,.06)}
    .scroll-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--light-bg)}
    .scroll-btn:disabled{opacity:.3;cursor:default;pointer-events:none}
    .scroll-btn.left{margin-left:8px}
    .scroll-btn.right{margin-right:8px}
    .filter-row{flex:1;display:flex;gap:6px;overflow-x:auto;padding:0 6px;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
    .filter-row::-webkit-scrollbar{display:none}
    .chip{padding:5px 14px;border-radius:50px;border:1.5px solid var(--border-col);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:'DM Sans',sans-serif;color:var(--gray);transition:all .2s}
    .chip:hover,.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    /* 카테고리별 색상 — KO 키 */
    .chip[data-cat="한식"]:hover,.chip[data-cat="한식"].active{background:#ef4444;border-color:#ef4444;color:#fff}
    .chip[data-cat="중식"]:hover,.chip[data-cat="중식"].active{background:#f97316;border-color:#f97316;color:#fff}
    .chip[data-cat="일식"]:hover,.chip[data-cat="일식"].active{background:#3b82f6;border-color:#3b82f6;color:#fff}
    .chip[data-cat="양식"]:hover,.chip[data-cat="양식"].active{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
    .chip[data-cat="고기_해산물"]:hover,.chip[data-cat="고기_해산물"].active{background:#f59e0b;border-color:#f59e0b;color:#fff}
    .chip[data-cat="바"]:hover,.chip[data-cat="바"].active{background:#6366f1;border-color:#6366f1;color:#fff}
    .chip[data-cat="기타"]:hover,.chip[data-cat="기타"].active{background:#64748b;border-color:#64748b;color:#fff}
    /* 카테고리별 색상 — EN 키 */
    .chip[data-cat="Korean"]:hover,.chip[data-cat="Korean"].active{background:#ef4444;border-color:#ef4444;color:#fff}
    .chip[data-cat="Chinese"]:hover,.chip[data-cat="Chinese"].active{background:#f97316;border-color:#f97316;color:#fff}
    .chip[data-cat="Japanese"]:hover,.chip[data-cat="Japanese"].active{background:#3b82f6;border-color:#3b82f6;color:#fff}
    .chip[data-cat="Western"]:hover,.chip[data-cat="Western"].active{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
    .chip[data-cat="Meat/Seafood"]:hover,.chip[data-cat="Meat/Seafood"].active{background:#f59e0b;border-color:#f59e0b;color:#fff}
    .chip[data-cat="Other"]:hover,.chip[data-cat="Other"].active{background:#64748b;border-color:#64748b;color:#fff}

    .sort-row{padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .result-count{font-size:13px;color:var(--gray)}
    .result-count strong{color:var(--dark)}
    .sort-btns{display:flex;gap:4px}
    .sort-btn{padding:4px 12px;border-radius:50px;border:1.5px solid var(--border-col);background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--gray);transition:all .2s}
    .sort-btn.active{background:var(--accent-lt);color:var(--accent);border-color:var(--accent)}

    .place-list{flex:1;overflow-y:auto;padding:0 12px 12px;position:relative}
    .place-list::-webkit-scrollbar{width:4px}
    .place-list::-webkit-scrollbar-track{background:transparent}
    .place-list::-webkit-scrollbar-thumb{background:var(--border-col);border-radius:2px}
    .vs-spacer{position:absolute;top:0;left:0;width:1px;pointer-events:none}
    .vs-window{position:absolute;left:12px;right:12px}

    .place-card{display:flex;gap:12px;padding:12px;border-radius:var(--r);cursor:pointer;transition:background .15s,box-shadow .15s;margin-bottom:4px;border:1.5px solid transparent}
    .place-card:hover{background:var(--light-bg)}
    .place-card.active{border:1.5px solid var(--accent);background:var(--accent-lt)}
    .place-card.active .card-name{color:var(--accent-dk)}
    .place-card .thumb{width:72px;height:72px;border-radius:10px;flex-shrink:0;position:relative;background-color:var(--light-bg);display:flex;align-items:center;justify-content:center;font-size:28px}
    .place-card .rank{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--accent)}
    .card-info{flex:1;min-width:0}
    .card-name{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-cat{font-size:11px;font-weight:600;margin-bottom:4px}
    .card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray)}
    .stars-s{color:var(--gold);font-size:11px}
    .card-dist{font-size:11px;color:var(--gray);background:var(--light-bg);padding:2px 8px;border-radius:50px;white-space:nowrap}

    .list-loading{display:none;align-items:center;justify-content:center;padding:40px 0;gap:10px;font-size:13px;color:var(--gray)}
    .list-loading.show{display:flex}
    .spinner{width:18px;height:18px;border:2.5px solid var(--border-col);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .map-area{flex:1;position:relative;overflow:hidden}
    #kakaoMap{position:absolute;inset:0;z-index:1}
    .map-controls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:30}
    .mc{width:36px;height:36px;background:#fff;border:1px solid var(--border-col);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;box-shadow:var(--sh);transition:background .2s}
    .mc:hover{background:var(--light-bg)}
    .loc-btn{position:absolute;bottom:24px;right:16px;background:#fff;border:1px solid var(--border-col);border-radius:50px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--sh);color:var(--dark);font-family:'DM Sans',sans-serif;z-index:30;transition:all .2s}
    .loc-btn:hover{border-color:var(--accent);color:var(--accent)}

    .detail-panel{position:absolute;inset:0;background:#fff;z-index:50;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;pointer-events:none}
    .detail-panel.open{transform:translateX(0);pointer-events:auto}
    .dp-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-col);position:sticky;top:0;background:#fff;z-index:5}
    .dp-back{background:none;border:none;font-size:20px;cursor:pointer;color:var(--dark);padding:4px;line-height:1}
    .dp-title{font-size:16px;font-weight:700;flex:1}
    .dp-img{width:100%;height:160px;background-color:var(--light-bg);display:flex;align-items:center;justify-content:center;font-size:56px}
    .dp-body{padding:16px}
    .dp-badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .dp-badge{padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700}
    .db-rest{background:var(--accent-lt);color:var(--accent-dk)}
    .db-gold{background:#fef3c7;color:#92400e}
    .db-green{background:#f0fdf4;color:#166534}
    .dp-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;margin-bottom:2px}
    .dp-sub{font-size:14px;color:var(--gray);margin-bottom:12px}
    .dp-stars{display:flex;align-items:center;gap:6px;margin-bottom:14px}
    .dp-stars .s{color:var(--gold);font-size:16px}
    .dp-stars .sc{font-size:18px;font-weight:700}
    .dp-stars .sm{font-size:13px;color:var(--gray)}
    .dp-info-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .dp-info{background:var(--light-bg);border-radius:10px;padding:12px 14px}
    .dp-info-label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
    .dp-info-val{font-size:13px;font-weight:500;line-height:1.4}
    .dp-section-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--dark)}
    .rev-summary{display:flex;align-items:center;gap:16px;background:var(--light-bg);border-radius:10px;padding:14px 16px;margin-bottom:12px}
    .rev-score{font-size:42px;font-weight:900;font-family:'Playfair Display',serif;line-height:1}
    .rev-right{flex:1}
    .rev-bars{display:flex;flex-direction:column;gap:5px}
    .rev-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray)}
    .rev-track{flex:1;height:6px;background:var(--border-col);border-radius:3px;overflow:hidden}
    .rev-fill{height:100%;background:var(--gold);border-radius:3px}
    .review-item{padding:12px 0;border-bottom:1px solid var(--border-col)}
    .review-item:last-child{border-bottom:none}
    .ri-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
    .ri-name{font-size:13px;font-weight:600}
    .ri-stars{font-size:12px;color:var(--gold)}
    .ri-text{font-size:13px;color:var(--mid);line-height:1.6}
    .review-skeleton{padding:16px 0}
    .sk-line{height:12px;background:linear-gradient(90deg,var(--border-col) 25%,var(--light-bg) 50%,var(--border-col) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:6px;margin-bottom:8px}
    .sk-line.short{width:40%}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .dp-action{position:sticky;bottom:0;padding:12px 16px;background:#fff;border-top:1px solid var(--border-col);display:flex;gap:8px}
    .dp-action-btn{flex:1;padding:12px;border:none;border-radius:50px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s}
    .dp-btn-transport{background:var(--accent);color:#fff}
    .dp-btn-transport:hover{background:var(--accent-dk)}
    .dp-btn-tour{background:#2563eb;color:#fff;border:none}
    .dp-btn-tour:hover{background:#1e40af}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--gray);gap:8px;text-align:center;padding:20px}
    .empty-state .ei{font-size:40px}
    .empty-state p{font-size:14px;line-height:1.6}
  </style>
</head>
<body>

<header>
  <a class="logo" th:href="@{/home}">Korea<span>Point</span></a>
  <div class="header-right">
    <!-- 언어 버튼: th:if로 분기 (th:onclick SpEL 이스케이프 오류 방지) -->
    <th:block th:if="${lang == 'en'}">
      <button class="h-btn"        onclick="switchLang('ko')">KR</button>
      <button class="h-btn active">EN</button>
    </th:block>
    <th:block th:unless="${lang == 'en'}">
      <button class="h-btn active">KR</button>
      <button class="h-btn"        onclick="switchLang('en')">EN</button>
    </th:block>
    <th:block th:if="${isLoggedIn}">
      <span class="h-btn" th:text="${currentUserName}"></span>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="h-btn h-btn-fill">Logout</button>
      </form>
    </th:block>
    <th:block th:unless="${isLoggedIn}">
      <a th:href="@{/oauth2/authorization/google}" class="h-btn h-btn-fill">Login</a>
    </th:block>
  </div>
</header>

<div class="app-body">
  <div class="sidebar">

    <!-- 검색창 -->
    <div class="search-bar">
      <div class="search-wrap">
        <input type="text" id="searchInput"
               th:value="${keyword}"
               th:placeholder="${lang == 'en' ? 'Search restaurant name...' : '음식점 이름 검색...'}"
               autocomplete="off"
               onkeydown="handleSearchKey(event)"
               oninput="handleSearchInput()"
               onfocus="showDropdown()"
               onblur="scheduleHideDropdown()">
        <button class="si" type="button" onclick="goSearch()">🔍</button>
      </div>
      <div class="suggest-dropdown" id="suggestDropdown">
        <div id="suggestContent"></div>
      </div>
    </div>

    <!-- 카테고리 필터 -->
    <div class="filter-wrap">
      <button class="scroll-btn left" id="scrollLeft" onclick="scrollFilter(-1)" disabled>‹</button>
      <div class="filter-row" id="filterRow">
        <!-- KO 카테고리 -->
        <th:block th:unless="${lang == 'en'}">
          <div class="chip active" data-cat="ALL"          onclick="switchCategory('ALL')">🍽️ 전체</div>
          <div class="chip" data-cat="한식"                onclick="switchCategory('한식')">🍚 한식</div>
          <div class="chip" data-cat="중식"                onclick="switchCategory('중식')">🥟 중식</div>
          <div class="chip" data-cat="일식"                onclick="switchCategory('일식')">🍣 일식</div>
          <div class="chip" data-cat="양식"                onclick="switchCategory('양식')">🍝 양식</div>
          <div class="chip" data-cat="고기_해산물"         onclick="switchCategory('고기_해산물')">🥩 고기·해산물</div>
          <div class="chip" data-cat="바"                  onclick="switchCategory('바')">🍺 바</div>
          <div class="chip" data-cat="기타"                onclick="switchCategory('기타')">🍴 기타</div>
        </th:block>
        <!-- EN 카테고리 -->
        <th:block th:if="${lang == 'en'}">
          <div class="chip active" data-cat="ALL"          onclick="switchCategory('ALL')">🍽️ All</div>
          <div class="chip" data-cat="Korean"              onclick="switchCategory('Korean')">🍚 Korean</div>
          <div class="chip" data-cat="Chinese"             onclick="switchCategory('Chinese')">🥟 Chinese</div>
          <div class="chip" data-cat="Japanese"            onclick="switchCategory('Japanese')">🍣 Japanese</div>
          <div class="chip" data-cat="Western"             onclick="switchCategory('Western')">🍝 Western</div>
          <div class="chip" data-cat="Meat/Seafood"        onclick="switchCategory('Meat/Seafood')">🥩 Meat·Seafood</div>
          <div class="chip" data-cat="바"                  onclick="switchCategory('바')">🍺 Bar</div>
          <div class="chip" data-cat="Other"               onclick="switchCategory('Other')">🍴 Other</div>
        </th:block>
      </div>
      <button class="scroll-btn right" id="scrollRight" onclick="scrollFilter(1)">›</button>
    </div>

    <div class="sort-row">
      <div class="result-count">
        <strong id="countDisplay">0</strong>
        <span th:text="${lang == 'en' ? ' places' : ' 개 음식점'}"> 개 음식점</span>
      </div>
      <div class="sort-btns">
        <button class="sort-btn active" onclick="setSort('recommended')" th:text="${lang == 'en' ? '⭐ AI Pick' : '⭐ AI추천'}">⭐ AI추천</button>
        <button class="sort-btn"        onclick="setSort('distance')"    th:text="${lang == 'en' ? '📍 Distance' : '📍 거리순'}">📍 거리순</button>
      </div>
    </div>

    <div class="list-loading" id="listLoading">
      <div class="spinner"></div>
      <span th:text="${lang == 'en' ? 'Loading...' : '불러오는 중...'}">불러오는 중...</span>
    </div>

    <div class="place-list" id="placeList">
      <div class="vs-spacer" id="vsSpacer"></div>
      <div class="vs-window" id="vsWindow"></div>
    </div>
  </div>

  <div class="map-area" id="mapArea">
    <div id="kakaoMap" style="position:absolute;inset:0;z-index:1;"></div>
    <div class="map-controls">
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()-1)">＋</div>
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()+1)">－</div>
    </div>
    <button class="loc-btn" type="button" onclick="getLocation()"
            th:text="${lang == 'en' ? '📍 Near Me' : '📍 현재 위치로 추천'}">📍 현재 위치로 추천</button>

    <!-- 상세 패널 -->
    <div class="detail-panel" id="detailPanel">
      <div class="dp-header">
        <button class="dp-back" onclick="closeDetail()">←</button>
        <div class="dp-title" id="dpTitle"></div>
      </div>
      <div class="dp-img" id="dpImg"></div>
      <div class="dp-body">
        <div class="dp-badge-row" id="dpBadges"></div>
        <div class="dp-name"      id="dpName"></div>
        <div class="dp-sub"       id="dpSub"></div>
        <div class="dp-stars"     id="dpStars"></div>
        <div class="dp-info-row"  id="dpInfoRow"></div>
        <div class="dp-section-title" th:text="${lang == 'en' ? 'Reviews' : '리뷰'}">리뷰</div>
        <div class="rev-summary"  id="dpRevSummary"></div>
        <div id="dpReviews"></div>
      </div>
      <div class="dp-action">
        <button class="dp-action-btn dp-btn-transport" onclick="openTransportMap()"
                th:text="${lang == 'en' ? '🚇 Directions' : '🚇 교통'}">🚇 교통</button>
        <button class="dp-action-btn dp-btn-tour" onclick="openTourMap()"
                th:text="${lang == 'en' ? '🗺️ Tourism' : '🗺️ 근처 관광지'}">🗺️ 근처 관광지</button>
        <button class="dp-action-btn" onclick="openCafeMap()"
                style="background:#6f4e37;color:#fff;border:none"
                th:text="${lang == 'en' ? '☕ Nearby Cafes' : '☕ 근처 카페'}">☕ 근처 카페</button>
      </div>
    </div>
  </div>
</div>

<!-- Thymeleaf → JS 변수 주입 -->
<script th:inline="javascript">
  const userLat       = /*[[${userlat}]]*/ 37.5665;
  const userLon       = /*[[${userlon}]]*/ 126.9780;
  const PLACES        = /*[[${list}]]*/    [];
  const INIT_CATEGORY = /*[[${category}]]*/ 'ALL';
  const LANG          = /*[[${lang}]]*/    'ko';  // 'ko' 또는 'en'

  // 언어별 UI 텍스트
  const T = {
    searchSuggestion : LANG === 'en' ? '🔍 Suggestions'   : '🔍 연관 검색어',
    recentKeywords   : LANG === 'en' ? '🕐 Recent'        : '🕐 최근 검색어',
    clearAll         : LANG === 'en' ? 'Clear all'         : '전체 삭제',
    searchEmpty      : LANG === 'en' ? 'Type to search...' : '검색어를 입력하세요',
    emptyState       : LANG === 'en' ? 'Press "Near Me" or search a restaurant name'
            : '현재 위치 버튼을 누르거나<br>음식점 이름을 검색해보세요',
    popularBadge     : LANG === 'en' ? 'Popular'           : '인기',
    reviewLabel      : LANG === 'en' ? 'reviews'           : '개',
    labelAvgReview   : LANG === 'en' ? 'Avg. Review'       : '평균 리뷰 별점',
    labelDistance    : LANG === 'en' ? 'Distance'          : '거리',
    labelAiScore     : LANG === 'en' ? 'AI Score'          : 'AI 추천 점수',
    labelCategory    : LANG === 'en' ? 'Category'          : '카테고리',
    noReviews        : LANG === 'en' ? 'No reviews yet.'   : '등록된 리뷰가 없습니다.',
    detailsBtn       : LANG === 'en' ? 'Details →'         : '상세보기 →',
    defaultCat       : LANG === 'en' ? 'Restaurant'        : '음식점',
    reviewerLabel    : LANG === 'en' ? 'Reviewer'          : '리뷰어',
    aiPt             : LANG === 'en' ? 'pt'                : '점',
    myLocation       : LANG === 'en' ? 'My Location'       : '내 위치',
  };

  // URL prefix
  const PREFIX           = LANG === 'en' ? '/en' : '';
  const TRANSPORT_PREFIX = LANG === 'en' ? '/en' : '/ko';
  const TOUR_LANG        = LANG === 'en' ? 'EN'  : 'KR';

  // 카테고리 색상/이모지 — KO·EN 키 모두 포함
  const CAT_COLOR = {
    '한식':'#ef4444','중식':'#f97316','일식':'#3b82f6',
    '양식':'#8b5cf6','고기_해산물':'#f59e0b','바':'#6366f1','기타':'#64748b',
    'Korean':'#ef4444','Chinese':'#f97316','Japanese':'#3b82f6',
    'Western':'#8b5cf6','Meat/Seafood':'#f59e0b','Other':'#64748b'
  };
  const CAT_EMOJI = {
    '한식':'🍚','중식':'🥟','일식':'🍣','양식':'🍝','고기_해산물':'🥩','바':'🍺','기타':'🍴',
    'Korean':'🍚','Chinese':'🥟','Japanese':'🍣','Western':'🍝','Meat/Seafood':'🥩','Other':'🍴'
  };
</script>

<script>
  let activeCategory    = INIT_CATEGORY;
  let activeSort        = 'recommended';
  let activePinName     = null;
  let currentPopupPlace = null;
  let popupOverlay      = null;
  let map;
  let clusterer;

  const catColor = cat => CAT_COLOR[cat] ?? '#f472b6';
  const catEmoji = cat => CAT_EMOJI[cat]  ?? '🍽️';

  function makeSVGMarker(color, emoji) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
      <ellipse cx="16" cy="38" rx="6" ry="2.5" fill="rgba(0,0,0,0.18)"/>
      <path d="M16 2 C8.268 2 2 8.268 2 16 C2 26 16 38 16 38 C16 38 30 26 30 16 C30 8.268 23.732 2 16 2Z"
            fill="${color}" stroke="white" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="7" fill="white" opacity="0.9"/>
      <text x="16" y="20" text-anchor="middle" font-size="10" font-family="sans-serif">${emoji}</text>
    </svg>`;
    return new kakao.maps.MarkerImage(
            'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
            new kakao.maps.Size(32, 40)
    );
  }

  /* ── 최근 검색어 ── */
  const RECENT_KEY = LANG === 'en' ? 'food_en_recent_keywords' : 'food_recent_keywords';
  const getRecent  = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; } };
  function saveRecent(kw) {
    if (!kw.trim()) return;
    let list = getRecent().filter(k => k !== kw);
    list.unshift(kw);
    if (list.length > 8) list = list.slice(0, 8);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
  }
  function deleteRecent(kw, e) {
    e.stopPropagation();
    localStorage.setItem(RECENT_KEY, JSON.stringify(getRecent().filter(k => k !== kw)));
    renderDropdown(document.getElementById('searchInput').value);
  }
  function clearAllRecent() {
    localStorage.removeItem(RECENT_KEY);
    renderDropdown('');
  }

  /* ── 자동완성 드롭다운 ── */
  function getSuggestions(q) {
    if (!q) return [];
    const lower = q.toLowerCase();
    return PLACES
            .filter(p => (p.name ?? '').toLowerCase().includes(lower) || (p.googleName ?? '').toLowerCase().includes(lower))
            .slice(0, 6).map(p => p.name);
  }

  function renderDropdown(q) {
    const box = document.getElementById('suggestContent');
    const suggestions = getSuggestions(q);
    const recent = getRecent();
    let html = '';
    if (suggestions.length > 0) {
      html += `<div class="suggest-section-title"><span>${T.searchSuggestion}</span></div>`;
      suggestions.forEach(s => {
        const cat = (PLACES.find(p => p.name === s) || {}).category ?? '';
        html += `<div class="suggest-item" onmousedown="doSearch('${escJS(s)}')">
          <div class="suggest-item-kw">
            <span class="icon" style="color:${catColor(cat)}">${catEmoji(cat)}</span>
            <span>${s}</span>
          </div>
        </div>`;
      });
      if (recent.length > 0) html += `<hr class="suggest-divider">`;
    }
    if (recent.length > 0) {
      html += `<div class="suggest-section-title"><span>${T.recentKeywords}</span>
        <button type="button" onmousedown="clearAllRecent()">${T.clearAll}</button></div>`;
      recent.forEach(kw => {
        html += `<div class="suggest-item">
          <div class="suggest-item-kw" onmousedown="doSearch('${escJS(kw)}')">
            <span class="icon">🕐</span><span>${kw}</span>
          </div>
          <button class="suggest-del" onmousedown="deleteRecent('${escJS(kw)}', event)">✕</button>
        </div>`;
      });
    }
    if (!html) html = `<div class="suggest-empty">${T.searchEmpty}</div>`;
    box.innerHTML = html;
  }

  function showDropdown() {
    renderDropdown(document.getElementById('searchInput').value);
    document.getElementById('suggestDropdown').classList.add('show');
  }
  let hideTimer;
  function scheduleHideDropdown() {
    hideTimer = setTimeout(() => document.getElementById('suggestDropdown').classList.remove('show'), 200);
  }
  function handleSearchInput() {
    renderDropdown(document.getElementById('searchInput').value);
    document.getElementById('suggestDropdown').classList.add('show');
    render();
  }
  function handleSearchKey(e) {
    if (e.key === 'Enter') goSearch();
    if (e.key === 'Escape') document.getElementById('suggestDropdown').classList.remove('show');
  }
  function doSearch(kw) {
    document.getElementById('searchInput').value = kw;
    document.getElementById('suggestDropdown').classList.remove('show');
    saveRecent(kw);
    location.href = `${PREFIX}/foodmap/search?keyword=${encodeURIComponent(kw)}&category=${encodeURIComponent(activeCategory)}`;
  }
  function goSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) { saveRecent(q); location.href = `${PREFIX}/foodmap/search?keyword=${encodeURIComponent(q)}&category=${encodeURIComponent(activeCategory)}`; }
  }

  /* ── 필터 스크롤 ── */
  function scrollFilter(dir) {
    document.getElementById('filterRow').scrollLeft += dir * 120;
    setTimeout(updateScrollBtns, 150);
  }
  function updateScrollBtns() {
    const row = document.getElementById('filterRow');
    document.getElementById('scrollLeft').disabled  = row.scrollLeft <= 0;
    document.getElementById('scrollRight').disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 1;
  }
  document.getElementById('filterRow').addEventListener('scroll', updateScrollBtns);

  /* ── 카테고리 Ajax 전환 ── */
  async function switchCategory(cat) {
    if (cat === activeCategory) return;
    activeCategory = cat;

    document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
    const activeChip = document.querySelector(`.chip[data-cat="${cat}"]`);
    if (activeChip) activeChip.classList.add('active');

    document.getElementById('listLoading').classList.add('show');
    document.getElementById('vsWindow').innerHTML    = '';
    document.getElementById('vsSpacer').style.height = '0px';

    const path = location.pathname;
    let apiUrl;
    if (path.includes('/foodmap/mylocation')) {
      apiUrl = `/foodmap/api/places?lat=${userLat}&lng=${userLon}&category=${encodeURIComponent(cat)}`;
    } else if (path.includes('/foodmap/search') && document.getElementById('searchInput').value.trim()) {
      const ref = PLACES[0];
      apiUrl = ref
              ? `/foodmap/api/places?lat=${ref.lat}&lng=${ref.lng}&category=${encodeURIComponent(cat)}`
              : `/foodmap/api/places?category=${encodeURIComponent(cat)}`;
    } else {
      apiUrl = `/foodmap/api/places?category=${encodeURIComponent(cat)}`;
    }

    try {
      const res  = await fetch(apiUrl);
      const data = await res.json();
      PLACES.length = 0;
      data.forEach(d => PLACES.push(d));
    } catch (e) {
      console.error('카테고리 전환 실패:', e);
    }

    document.getElementById('listLoading').classList.remove('show');
    render();
    redrawMarkers();
  }

  function initChips() {
    document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
    const activeChip = document.querySelector(`.chip[data-cat="${activeCategory}"]`);
    if (activeChip) activeChip.classList.add('active');
  }

  /* ── 정렬 ── */
  function setSort(s) {
    activeSort = s;
    document.querySelectorAll('.sort-btn').forEach((b, i) =>
            b.classList.toggle('active', (s === 'recommended' && i === 0) || (s === 'distance' && i === 1))
    );
    render();
  }

  /* ── 필터/정렬 ── */
  function getFiltered() {
    let list = [...PLACES];
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    if (q) list = list.filter(p =>
            (p.name ?? '').toLowerCase().includes(q) || (p.googleName ?? '').toLowerCase().includes(q)
    );
    if (activeSort === 'distance') list.sort((a,b) => (a.distance ?? 9999) - (b.distance ?? 9999));
    else                           list.sort((a,b) => (b.finalScore ?? 0) - (a.finalScore ?? 0));
    return list;
  }

  /* ── 가상 스크롤 렌더 ── */
  const ITEM_H   = 100;
  const OVERSCAN = 3;

  function render() {
    const list = getFiltered();
    window._currentList = list;
    document.getElementById('countDisplay').textContent = list.length;

    const container = document.getElementById('placeList');
    const spacer    = document.getElementById('vsSpacer');
    const window_   = document.getElementById('vsWindow');

    if (list.length === 0) {
      spacer.style.height = '0px';
      window_.innerHTML = `<div class="empty-state"><div class="ei">🍽️</div>
        <p>${T.emptyState}</p></div>`;
      return;
    }

    spacer.style.height = (list.length * ITEM_H) + 'px';

    function paintVisible() {
      const scrollTop = container.scrollTop;
      const viewH     = container.clientHeight;
      const startIdx  = Math.max(0, Math.floor(scrollTop / ITEM_H) - OVERSCAN);
      const endIdx    = Math.min(list.length - 1, Math.ceil((scrollTop + viewH) / ITEM_H) + OVERSCAN);

      window_.style.top = (startIdx * ITEM_H) + 'px';
      window_.innerHTML = list.slice(startIdx, endIdx + 1).map((p, rel) => {
        const i = startIdx + rel;
        return `
          <div class="place-card${activePinName === p.name ? ' active' : ''}"
               id="card-${encodeId(p.name)}"
               onclick="selectPlace('${escJS(p.name)}')">
            <div class="thumb">
              <div class="rank" style="background:${catColor(p.category)}">${i + 1}</div>
              ${catEmoji(p.category)}
            </div>
            <div class="card-info">
              <div class="card-cat" style="color:${catColor(p.category)}">${p.category ?? T.defaultCat} · AI ${((p.finalScore ?? 0) * 100).toFixed(0)}${T.aiPt}</div>
              <div class="card-name">${p.name ?? '-'}</div>
              <div class="card-meta">
                <span class="stars-s">★</span>${(p.avgStar ?? 0).toFixed(1)}
                (${LANG === 'en' ? (p.reviewCount ?? 0) + ' reviews' : '리뷰 ' + (p.reviewCount ?? 0) + '개'})
                <span class="card-dist">📍 ${distStr(p.distance)}</span>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    container.onscroll = paintVisible;
    container.scrollTop = 0;
    paintVisible();
  }

  /* ── 선택 / 팝업 ── */
  function selectPlace(name) {
    closeDetail();
    activePinName = name;
    render();
    const list = window._currentList || PLACES;
    const p = list.find(x => x.name === name) || PLACES.find(x => x.name === name);
    if (!p) return;
    const idx = list.findIndex(x => x.name === name);
    if (idx >= 0) document.getElementById('placeList').scrollTop = idx * ITEM_H;
    if (p.lat && p.lng && map) map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
    showPopupOverlay(p);
  }

  function showPopupOverlay(p) {
    closePopup();
    currentPopupPlace = p;
    if (!map || !p.lat || !p.lng) return;
    const color = catColor(p.category);
    const emoji = catEmoji(p.category);
    const content = `
      <div style="background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);
                  width:240px;overflow:hidden;border:1px solid #fce7f3;">
        <div style="height:90px;background:#fdf2f8;display:flex;align-items:center;
                    justify-content:center;font-size:36px;position:relative;">
          ${emoji}
          <button onmousedown="closePopup()"
            style="position:absolute;top:6px;right:8px;background:rgba(0,0,0,.4);
                   color:#fff;border:none;border-radius:50%;width:22px;height:22px;
                   cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">×</button>
        </div>
        <div style="padding:12px;">
          <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:2px;">${p.category ?? T.defaultCat}</div>
          <div style="font-size:14px;font-weight:700;margin-bottom:3px;">${p.name ?? '-'}</div>
          <div style="font-size:12px;color:#64748b;margin-bottom:8px;">
            ★ ${(p.avgStar ?? 0).toFixed(1)} · ${distStr(p.distance)} · AI ${((p.finalScore??0)*100).toFixed(0)}${T.aiPt}
          </div>
          <a href="#" onmousedown="openDetailFromPopup(event)"
             style="display:block;width:100%;padding:8px;background:${color};color:#fff;
                    border-radius:8px;font-size:13px;font-weight:600;text-align:center;text-decoration:none;">
            ${T.detailsBtn}
          </a>
        </div>
      </div>`;
    popupOverlay = new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(p.lat, p.lng), content, yAnchor: 1.45, zIndex: 40 });
  }

  function closePopup() {
    if (popupOverlay) { popupOverlay.setMap(null); popupOverlay = null; }
    currentPopupPlace = null;
    activePinName = null;
    render();
  }
  function openDetailFromPopup(e) {
    e.preventDefault();
    if (currentPopupPlace) openDetail(currentPopupPlace);
  }

  /* ── 상세 패널 (리뷰 지연 로딩) ── */
  async function openDetail(p) {
    if (!p) return;
    if (popupOverlay) { popupOverlay.setMap(null); popupOverlay = null; }

    const color = catColor(p.category);
    const stars = Math.round(p.avgStar ?? 0);

    document.getElementById('dpTitle').textContent = p.name ?? '-';
    document.getElementById('dpName').textContent  = p.name ?? '-';
    document.getElementById('dpSub').textContent   = p.googleName ?? '';
    document.getElementById('dpImg').innerHTML     = `<span style="font-size:56px">${catEmoji(p.category)}</span>`;

    document.getElementById('dpBadges').innerHTML =
            `<span class="dp-badge" style="background:${color}22;color:${color}">${p.category ?? T.defaultCat}</span>
       <span class="dp-badge db-gold">🏆 ${((p.finalScore ?? 0) * 100).toFixed(0)}${T.aiPt}</span>
       ${(p.reviewCount ?? 0) >= 10 ? `<span class="dp-badge db-green">${T.popularBadge}</span>` : ''}`;

    document.getElementById('dpStars').innerHTML =
            `<span class="s" style="color:var(--gold)">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span>
       <span class="sc">${(p.avgStar ?? 0).toFixed(1)}</span>
       <span class="sm">/ 5.0 &nbsp;·&nbsp; ${LANG === 'en' ? (p.reviewCount ?? 0) + ' reviews' : '리뷰 ' + (p.reviewCount ?? 0) + '개'}</span>`;

    document.getElementById('dpInfoRow').innerHTML =
            `<div class="dp-info"><div class="dp-info-label">${T.labelAvgReview}</div>
         <div class="dp-info-val">★ ${(p.reviewMean ?? p.avgStar ?? 0).toFixed(1)} / 5.0</div></div>
       <div class="dp-info"><div class="dp-info-label">${T.labelDistance}</div>
         <div class="dp-info-val">${distStr(p.distance)}</div></div>
       <div class="dp-info"><div class="dp-info-label">${T.labelAiScore}</div>
         <div class="dp-info-val">🏆 ${((p.finalScore ?? 0) * 100).toFixed(1)} / 100</div></div>
       <div class="dp-info"><div class="dp-info-label">${T.labelCategory}</div>
         <div class="dp-info-val" style="color:${color};font-weight:700">${p.category ?? T.defaultCat}</div></div>`;

    document.getElementById('dpRevSummary').innerHTML =
            `<div class="review-skeleton" style="flex:1">
         <div class="sk-line" style="width:30%"></div>
         <div class="sk-line" style="width:60%"></div>
         <div class="sk-line short"></div>
       </div>`;
    document.getElementById('dpReviews').innerHTML =
            `<div class="review-skeleton">
         <div class="sk-line"></div><div class="sk-line short"></div>
         <div class="sk-line"></div><div class="sk-line short"></div>
       </div>`;

    window._detailPlace = p;
    document.getElementById('detailPanel').classList.add('open');

    try {
      const res    = await fetch(`/foodmap/detail/${encodeURIComponent(p.name)}`);
      const detail = await res.json();
      renderReviews(detail.reviews ?? []);
    } catch (e) {
      renderReviews([]);
    }
  }

  function renderReviews(reviews) {
    const avg = reviews.length
            ? (reviews.reduce((s, r) => s + (r.rating ?? 0), 0) / reviews.length).toFixed(1)
            : (window._detailPlace?.reviewMean ?? window._detailPlace?.avgStar ?? 0).toFixed(1);

    document.getElementById('dpRevSummary').innerHTML =
            `<div><div class="rev-score">${avg}</div>
         <div style="color:var(--gold);font-size:14px;margin-top:4px">${'★'.repeat(Math.round(parseFloat(avg)))}</div>
       </div>
       <div class="rev-right"><div class="rev-bars">
         ${[5,4,3,2,1].map(s => {
              const cnt = reviews.filter(r => Math.round(r.rating ?? 0) === s).length;
              const pct = reviews.length ? Math.round(cnt / reviews.length * 100) : 0;
              return `<div class="rev-row"><span>${s}</span>
             <div class="rev-track"><div class="rev-fill" style="width:${pct}%"></div></div>
             <span>${pct}%</span></div>`;
            }).join('')}
       </div></div>`;

    document.getElementById('dpReviews').innerHTML = reviews.length > 0
            ? reviews.slice(0, 5).map(r => `
          <div class="review-item">
            <div class="ri-top"><div><div class="ri-name">${T.reviewerLabel}</div></div>
              <div class="ri-stars">${'★'.repeat(Math.round(r.rating ?? 0))}</div></div>
            <div class="ri-text">${r.content ?? ''}</div>
          </div>`).join('')
            : `<p style="color:var(--gray);font-size:13px;padding:12px 0">${T.noReviews}</p>`;
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
    window._detailPlace = null;
  }

  /* ── 버튼 액션 ── */
  function openTransportMap() {
    const p = window._detailPlace || currentPopupPlace;
    if (!p) return;
    const endTitle = encodeURIComponent(p.name);
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${pos.coords.latitude}&startLng=${pos.coords.longitude}&end=${endTitle}`,
              ()   => location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${userLat}&startLng=${userLon}&end=${endTitle}`
      );
    } else {
      location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${userLat}&startLng=${userLon}&end=${endTitle}`;
    }
  }
  function openTourMap() {
    const p = window._detailPlace || currentPopupPlace;
    if (!p) return;
    location.href = `/tour/all?lang=${TOUR_LANG}&lat=${p.lat}&lon=${p.lng}`;
  }
  function openCafeMap() {
    const p = window._detailPlace || currentPopupPlace;
    if (!p) return;
    location.href = `${PREFIX}/cafe/mylocation/${p.lat}/${p.lng}`;
  }

  /* ── 현위치 ── */
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${PREFIX}/foodmap/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?category=${encodeURIComponent(activeCategory)}`,
              ()  => location.href = `${PREFIX}/foodmap/mylocation/37.5665/126.9780?category=${encodeURIComponent(activeCategory)}`
      );
    } else {
      location.href = `${PREFIX}/foodmap/mylocation/37.5665/126.9780?category=${encodeURIComponent(activeCategory)}`;
    }
  }

  /* ── 언어 전환 ── */
  function switchLang(toLang) {
    const path   = location.pathname;
    const search = location.search;
    if (toLang === 'en') {
      location.href = path.replace('/foodmap/', '/en/foodmap/') + search;
    } else {
      location.href = path.replace('/en/foodmap/', '/foodmap/') + search;
    }
  }

  /* ── 유틸 ── */
  function distStr(d) {
    if (d == null || d === 0) return '-';
    return d < 1 ? (d * 1000).toFixed(0) + 'm' : d.toFixed(1) + 'km';
  }
  function encodeId(name) { return btoa(encodeURIComponent(name || '')).replace(/[^a-zA-Z0-9]/g, ''); }
  function escJS(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

  /* ── 마커 재그리기 ── */
  function redrawMarkers() {
    if (!map || !clusterer) return;
    clusterer.clear();
    const markers = PLACES.filter(p => p.lat && p.lng).map(p => {
      const marker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(p.lat, p.lng),
        title:    p.name,
        image:    makeSVGMarker(catColor(p.category), catEmoji(p.category))
      });
      kakao.maps.event.addListener(marker, 'click', () => selectPlace(p.name));
      return marker;
    });
    clusterer.addMarkers(markers);
  }

  document.getElementById('mapArea').addEventListener('click', function(e) {
    if (!e.target.closest('.detail-panel')) closePopup();
  });

  /* ── 초기 실행 ── */
  initChips();
  render();
  setTimeout(updateScrollBtns, 100);

  if (PLACES.length === 0 && !location.pathname.includes('/foodmap/mylocation')) {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${PREFIX}/foodmap/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?category=${encodeURIComponent(activeCategory)}`,
              ()  => location.href = `${PREFIX}/foodmap/mylocation/37.5665/126.9780?category=${encodeURIComponent(activeCategory)}`
      );
    }
  }
</script>

<script defer th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoKey}&autoload=false&libraries=clusterer|"></script>
<script>
  function initMap() {
    kakao.maps.load(function () {
      map = new kakao.maps.Map(document.getElementById('kakaoMap'), {
        center: new kakao.maps.LatLng(userLat, userLon),
        level:  5
      });

      const myMarkerImg = new kakao.maps.MarkerImage(
              'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
              new kakao.maps.Size(30, 40)
      );
      new kakao.maps.Marker({ map, position: new kakao.maps.LatLng(userLat, userLon), title: T.myLocation, image: myMarkerImg });

      clusterer = new kakao.maps.MarkerClusterer({
        map,
        averageCenter: true,
        minLevel: 4,
        disableClickZoom: false,
        styles: [{
          width:'44px', height:'44px', background:'rgba(244,114,182,.85)',
          borderRadius:'50%', color:'#fff', textAlign:'center',
          fontWeight:'700', lineHeight:'44px', fontSize:'13px',
          border:'2.5px solid #db2777'
        }]
      });

      const markers = PLACES.filter(p => p.lat && p.lng).map(p => {
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(p.lat, p.lng),
          title:    p.name,
          image:    makeSVGMarker(catColor(p.category), catEmoji(p.category))
        });
        kakao.maps.event.addListener(marker, 'click', () => selectPlace(p.name));
        return marker;
      });
      clusterer.addMarkers(markers);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMap);
  } else {
    initMap();
  }
</script>
