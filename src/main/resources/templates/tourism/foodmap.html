<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Food Map — KoreaPoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════
           ROOT 변수 — 전체(ALL) 기본값 = 파란 계열
           카페 선택 시 JS로 --accent 계열을 갈색으로 교체
           음식점 선택 시 JS로 --accent 계열을 핑크로 교체
        ═══════════════════════════════════════════════ */
        :root {
            /* ALL (파란 계열) — 기본 */
            --accent:     #3b9eff;
            --accent-dk:  #1a7de0;
            --accent-lt:  #eff6ff;
            --border-col: #dbeafe;
            --light-bg:   #f0f7ff;
            --sh:         0 2px 16px rgba(59,158,255,.10);

            /* 카페 (갈색) */
            --brown:      #6f4e37;
            --brown-dk:   #4a3220;
            --brown-lt:   #fdf6f0;
            --border-brn: #e8d5c4;

            /* 음식점 (연한 핑크) */
            --pink:       #f472b6;
            --pink-dk:    #db2777;
            --pink-lt:    #fdf2f8;
            --border-pnk: #fce7f3;

            /* 공통 */
            --dark:  #0f172a;
            --mid:   #334155;
            --gray:  #64748b;
            --white: #fff;
            --gold:  #f59e0b;
            --green: #16a34a;
            --r:     12px;
        }

        /* 카테고리별 테마 클래스 */
        body.theme-cafe {
            --accent:     var(--brown);
            --accent-dk:  var(--brown-dk);
            --accent-lt:  var(--brown-lt);
            --border-col: var(--border-brn);
            --light-bg:   var(--brown-lt);
            --sh:         0 2px 16px rgba(111,78,55,.12);
        }
        body.theme-restaurant {
            --accent:     var(--pink);
            --accent-dk:  var(--pink-dk);
            --accent-lt:  var(--pink-lt);
            --border-col: var(--border-pnk);
            --light-bg:   var(--pink-lt);
            --sh:         0 2px 16px rgba(244,114,182,.12);
        }

        /* ── 리셋 & 기본 ── */
        * { margin:0; padding:0; box-sizing:border-box }
        html, body { height:100%; overflow:hidden }
        body { font-family:'DM Sans',sans-serif; background:var(--white); color:var(--dark); display:flex; flex-direction:column; transition: background .3s }

        /* ── 헤더 ── */
        header { height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--border-col); background:var(--white); flex-shrink:0; z-index:100; transition:border-color .3s }
        .logo { font-family:'Playfair Display',serif; font-size:20px; font-weight:900; color:var(--accent-dk,#1a7de0); text-decoration:none; transition:color .3s }
        .logo span { color:var(--dark) }
        .header-right { display:flex; gap:8px; align-items:center }
        .h-btn { padding:7px 16px; border-radius:50px; border:1.5px solid var(--border-col); background:transparent; font-size:12px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; color:var(--dark); text-decoration:none; display:inline-flex; align-items:center; transition:all .2s }
        .h-btn:hover, .h-btn.active { border-color:var(--accent); color:var(--accent) }
        .h-btn-fill { background:var(--accent); color:#fff; border-color:var(--accent) }
        .h-btn-fill:hover { background:var(--accent-dk); color:#fff }

        /* ── 레이아웃 ── */
        .app-body { flex:1; display:flex; overflow:hidden }

        /* ── 사이드바 ── */
        .sidebar { width:380px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--border-col); background:var(--white); transition:border-color .3s }

        /* 검색창 */
        .search-bar { padding:14px 16px 0; flex-shrink:0 }
        .search-wrap { position:relative }
        .search-wrap input {
            width:100%; padding:10px 42px 10px 16px;
            border:1.5px solid var(--border-col); border-radius:50px;
            font-size:14px; font-family:'DM Sans',sans-serif;
            outline:none; background:var(--light-bg);
            transition:border .2s, background .3s; color:var(--dark)
        }
        .search-wrap input:focus { border-color:var(--accent); background:#fff }
        .search-wrap .si { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--gray); font-size:15px; cursor:pointer; padding:0; line-height:1 }

        /* ── 카테고리 탭 ── */
        .cat-tabs { padding:12px 16px 0; display:flex; gap:6px; flex-shrink:0 }
        .cat-tab {
            flex:1; padding:8px 0; border-radius:50px;
            border:1.5px solid var(--border-col);
            background:var(--white); font-size:12px; font-weight:700;
            cursor:pointer; font-family:'DM Sans',sans-serif;
            color:var(--gray); text-align:center; transition:all .2s
        }
        .cat-tab:hover { border-color:var(--accent); color:var(--accent) }

        /* 탭 활성 — 각 카테고리별 색상 고정 */
        .cat-tab.active-all  { background:#3b9eff; color:#fff; border-color:#3b9eff }
        .cat-tab.active-cafe { background:var(--brown); color:#fff; border-color:var(--brown) }
        .cat-tab.active-rest { background:var(--pink); color:#fff; border-color:var(--pink) }

        /* 정렬/카운트 */
        .sort-row { padding:10px 16px 8px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0 }
        .result-count { font-size:13px; color:var(--gray) }
        .result-count strong { color:var(--dark) }
        .sort-btns { display:flex; gap:4px }
        .sort-btn { padding:4px 12px; border-radius:50px; border:1.5px solid var(--border-col); background:transparent; font-size:12px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; color:var(--gray); transition:all .2s }
        .sort-btn.active { background:var(--accent-lt); color:var(--accent); border-color:var(--accent) }

        /* ── 카드 리스트 ── */
        .place-list { flex:1; overflow-y:auto; padding:0 12px 12px }
        .place-list::-webkit-scrollbar { width:4px }
        .place-list::-webkit-scrollbar-track { background:transparent }
        .place-list::-webkit-scrollbar-thumb { background:var(--border-col); border-radius:2px }

        .place-card {
            display:flex; gap:12px; padding:12px; border-radius:var(--r);
            cursor:pointer; transition:background .15s, box-shadow .15s;
            margin-bottom:4px; border:1.5px solid transparent
        }
        .place-card:hover { background:var(--light-bg) }
        .place-card.active { border:1.5px solid var(--accent); background:var(--accent-lt) }
        .place-card.active .card-name { color:var(--accent-dk); text-decoration:underline; text-underline-offset:3px }

        .place-card .thumb {
            width:72px; height:72px; border-radius:10px;
            flex-shrink:0; position:relative;
            background-color:var(--light-bg);
            display:flex; align-items:center; justify-content:center; font-size:28px;
            transition:background .3s
        }

        /* 랭크 뱃지 — 카테고리별 색상 */
        .place-card .rank {
            position:absolute; top:-6px; left:-6px;
            width:20px; height:20px; border-radius:50%;
            font-size:10px; font-weight:700;
            display:flex; align-items:center; justify-content:center;
            color:#fff; background:var(--accent); transition:background .3s
        }
        .place-card .rank.rank-cafe { background:var(--brown) }
        .place-card .rank.rank-rest { background:var(--pink) }

        .card-info { flex:1; min-width:0 }
        .card-name { font-size:14px; font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
        .card-cat { font-size:11px; font-weight:600; margin-bottom:4px }
        .card-cat.cat-all  { color:#3b9eff }
        .card-cat.cat-cafe { color:var(--brown) }
        .card-cat.cat-rest { color:var(--pink-dk) }
        .card-meta { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--gray) }
        .stars-s { color:var(--gold); font-size:11px }
        .card-dist { font-size:11px; color:var(--gray); background:var(--light-bg); padding:2px 8px; border-radius:50px; white-space:nowrap; transition:background .3s }

        /* ── 현위치 버튼 (하단) ── */
        .loc-bottom { padding:12px 16px; border-top:1px solid var(--border-col); flex-shrink:0; transition:border-color .3s }
        .loc-bottom button {
            width:100%; padding:10px; background:var(--accent); color:#fff;
            border:none; border-radius:50px; font-size:13px; font-weight:600;
            cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .3s
        }
        .loc-bottom button:hover { background:var(--accent-dk) }

        /* ── 지도 영역 ── */
        .map-area { flex:1; position:relative; overflow:hidden }
        #kakaoMap { position:absolute; inset:0; z-index:1 }
        .map-controls { position:absolute; top:16px; right:16px; display:flex; flex-direction:column; gap:4px; z-index:30 }
        .mc { width:36px; height:36px; background:#fff; border:1px solid var(--border-col); border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; box-shadow:var(--sh); transition:background .2s }
        .mc:hover { background:var(--light-bg) }

        /* ── 팝업 ── */
        .map-popup { position:absolute; z-index:40; background:#fff; border-radius:var(--r); box-shadow:0 8px 32px rgba(0,0,0,.18); width:240px; display:none; overflow:hidden; animation:popIn .2s ease }
        .map-popup.show { display:block }
        @keyframes popIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .popup-img { height:90px; background-color:var(--light-bg); position:relative; display:flex; align-items:center; justify-content:center; font-size:36px; transition:background .3s }
        .popup-close { position:absolute; top:6px; right:8px; background:rgba(0,0,0,.4); color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; line-height:1 }
        .popup-body { padding:12px }
        .popup-name { font-size:14px; font-weight:700; margin-bottom:3px }
        .popup-meta { font-size:12px; color:var(--gray); margin-bottom:8px }
        .popup-btn { display:block; width:100%; padding:8px; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; text-align:center; text-decoration:none; transition:background .2s }
        .popup-btn.btn-all  { background:#3b9eff }
        .popup-btn.btn-all:hover  { background:#1a7de0 }
        .popup-btn.btn-cafe { background:var(--brown) }
        .popup-btn.btn-cafe:hover { background:var(--brown-dk) }
        .popup-btn.btn-rest { background:var(--pink) }
        .popup-btn.btn-rest:hover { background:var(--pink-dk) }

        /* ── 상세 패널 ── */
        .detail-panel { position:absolute; inset:0; background:#fff; z-index:50; transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1); overflow-y:auto; pointer-events:none }
        .detail-panel.open { transform:translateX(0); pointer-events:auto }
        .dp-header { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border-col); position:sticky; top:0; background:#fff; z-index:5; transition:border-color .3s }
        .dp-back { background:none; border:none; font-size:20px; cursor:pointer; color:var(--dark); padding:4px; line-height:1 }
        .dp-title { font-size:16px; font-weight:700; flex:1 }
        .dp-img { width:100%; height:160px; background-color:var(--light-bg); display:flex; align-items:center; justify-content:center; font-size:56px; transition:background .3s }
        .dp-body { padding:16px }
        .dp-badge-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px }
        .dp-badge { padding:3px 10px; border-radius:50px; font-size:11px; font-weight:700 }
        .db-accent { background:var(--accent-lt); color:var(--accent-dk) }
        .db-cafe   { background:var(--brown-lt); color:var(--brown-dk) }
        .db-rest   { background:var(--pink-lt);  color:var(--pink-dk)  }
        .db-gold   { background:#fef3c7; color:#92400e }
        .db-green  { background:#f0fdf4; color:#166534 }
        .dp-name { font-family:'Playfair Display',serif; font-size:24px; font-weight:900; margin-bottom:2px }
        .dp-sub  { font-size:14px; color:var(--gray); margin-bottom:12px }
        .dp-stars { display:flex; align-items:center; gap:6px; margin-bottom:14px }
        .dp-stars .s  { color:var(--gold); font-size:16px }
        .dp-stars .sc { font-size:18px; font-weight:700 }
        .dp-stars .sm { font-size:13px; color:var(--gray) }
        .dp-info-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px }
        .dp-info { background:var(--light-bg); border-radius:10px; padding:12px 14px; transition:background .3s }
        .dp-info-label { font-size:10px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px }
        .dp-info-val { font-size:13px; font-weight:500; line-height:1.4 }
        .dp-section-title { font-size:14px; font-weight:700; margin-bottom:10px; color:var(--dark) }
        .rev-summary { display:flex; align-items:center; gap:16px; background:var(--light-bg); border-radius:10px; padding:14px 16px; margin-bottom:12px; transition:background .3s }
        .rev-score { font-size:42px; font-weight:900; font-family:'Playfair Display',serif; line-height:1 }
        .rev-right { flex:1 }
        .rev-bars { display:flex; flex-direction:column; gap:5px }
        .rev-row { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--gray) }
        .rev-track { flex:1; height:6px; background:var(--border-col); border-radius:3px; overflow:hidden }
        .rev-fill { height:100%; background:var(--gold); border-radius:3px }
        .review-item { padding:12px 0; border-bottom:1px solid var(--border-col) }
        .review-item:last-child { border-bottom:none }
        .ri-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px }
        .ri-name { font-size:13px; font-weight:600 }
        .ri-stars { font-size:12px; color:var(--gold) }
        .ri-text { font-size:13px; color:var(--mid); line-height:1.6 }
        .dp-action { position:sticky; bottom:0; padding:12px 16px; background:#fff; border-top:1px solid var(--border-col) }
        .dp-action-btn {
            width:100%; padding:13px; background:var(--accent); color:#fff;
            border:none; border-radius:50px; font-size:14px; font-weight:700;
            cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .3s
        }
        .dp-action-btn:hover { background:var(--accent-dk) }

        /* 빈 상태 */
        .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:200px; color:var(--gray); gap:8px; text-align:center; padding:20px }
        .empty-state .ei { font-size:40px }
        .empty-state p { font-size:14px; line-height:1.6 }
    </style>
</head>
<body class="theme-all">

<!-- ── 헤더 ── -->
<header>
    <a class="logo" th:href="@{/home}">Korea<span>Point</span></a>
    <div class="header-right">
        <a th:href="@{/en/transport/detail(routeId=${route?.routeId})}" class="h-btn">EN</a>
        <a th:href="@{/ko/transport/detail(routeId=${route?.routeId})}" class="h-btn active">KR</a>

        <th:block th:if="${isLoggedIn}">
            <span class="h-btn" th:text="${currentUserName}"></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="h-btn h-btn-fill">Logout</button>
            </form>
        </th:block>

        <th:block th:unless="${isLoggedIn}">
            <a th:href="@{/oauth2/authorization/google}" class="h-btn h-btn-fill">Login</a>
        </th:block>
    </div>
</header>

<!-- ── 본문 ── -->
<div class="app-body">

    <!-- 사이드바 -->
    <div class="sidebar">

        <!-- 검색창 -->
        <div class="search-bar">
            <div class="search-wrap">
                <input type="text" id="searchInput"
                       th:value="${keyword}"
                       placeholder="카페·음식점 이름 검색..."
                       autocomplete="off"
                       onkeydown="if(event.key==='Enter') goSearch()">
                <button class="si" type="button" onclick="goSearch()">🔍</button>
            </div>
        </div>

        <!-- 카테고리 탭 -->
        <div class="cat-tabs">
            <button class="cat-tab" id="tabAll"  onclick="switchCategory('ALL')">🍽️ 전체</button>
            <button class="cat-tab" id="tabCafe" onclick="switchCategory('CAFE')">☕ 카페</button>
            <button class="cat-tab" id="tabRest" onclick="switchCategory('RESTAURANT')">🍜 음식점</button>
        </div>

        <!-- 정렬 + 카운트 -->
        <div class="sort-row">
            <div class="result-count"><strong id="countDisplay">0</strong> 개 장소</div>
            <div class="sort-btns">
                <button class="sort-btn active" onclick="setSort('recommended')">⭐ AI추천</button>
                <button class="sort-btn"        onclick="setSort('distance')">📍 거리순</button>
            </div>
        </div>

        <!-- 장소 리스트 -->
        <div class="place-list" id="placeList"></div>

        <!-- 현위치 버튼 -->
        <div class="loc-bottom">
            <button type="button" onclick="getLocation()">📍 현재 위치로 추천받기</button>
        </div>
    </div>

    <!-- 지도 영역 -->
    <div class="map-area" id="mapArea">
        <div id="kakaoMap" style="position:absolute;inset:0;z-index:1;"></div>

        <div class="map-controls">
            <div class="mc" onclick="map&&map.setLevel(map.getLevel()-1)">＋</div>
            <div class="mc" onclick="map&&map.setLevel(map.getLevel()+1)">－</div>
        </div>

        <!-- 팝업 (CustomOverlay 방식 사용, 이 div는 fallback) -->
        <div class="map-popup" id="mapPopup">
            <div class="popup-img" id="popupImg">
                <button class="popup-close" onclick="closePopup()">×</button>
            </div>
            <div class="popup-body">
                <div class="popup-name" id="popupName"></div>
                <div class="popup-meta" id="popupMeta"></div>
                <a class="popup-btn" id="popupDetailBtn" href="#"
                   onclick="openDetailFromPopup(event)">상세보기 →</a>
            </div>
        </div>

        <!-- 상세 패널 -->
        <div class="detail-panel" id="detailPanel">
            <div class="dp-header">
                <button class="dp-back" onclick="closeDetail()">←</button>
                <div class="dp-title" id="dpTitle"></div>
                <div style="font-size:20px;cursor:pointer" onclick="openKakaoMapLink()">🗺️</div>
            </div>
            <div class="dp-img" id="dpImg"></div>
            <div class="dp-body">
                <div class="dp-badge-row" id="dpBadges"></div>
                <div class="dp-name"      id="dpName"></div>
                <div class="dp-sub"       id="dpSub"></div>
                <div class="dp-stars"     id="dpStars"></div>
                <div class="dp-info-row"  id="dpInfoRow"></div>
                <div class="dp-section-title">리뷰</div>
                <div class="rev-summary"  id="dpRevSummary"></div>
                <div id="dpReviews"></div>
            </div>
            <div class="dp-action">
                <button class="dp-action-btn" id="dpActionBtn" onclick="openKakaoMapLink()">
                    🗺️ 카카오맵으로 보기
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ── Thymeleaf 데이터 주입 ── -->
<script th:inline="javascript">
    const userLat       = /*[[${userlat}]]*/ 37.5665;
    const userLon       = /*[[${userlon}]]*/ 126.9780;
    const PLACES        = /*[[${list}]]*/ [];
    const INIT_CATEGORY = /*[[${category}]]*/ 'ALL';
</script>

<!-- ── JS 로직 ── -->
<script>
    // ── 상태 ──────────────────────────────────────────────────────────────────
    let activeCategory  = INIT_CATEGORY;
    let activeSort      = 'recommended';
    let activePinName   = null;
    let currentPopupPlace = null;
    let popupOverlay    = null;
    let map;
    let markerObjects   = []; // {name, marker, overlay}

    // ── 테마 전환 ─────────────────────────────────────────────────────────────
    function applyTheme(cat) {
        document.body.classList.remove('theme-all', 'theme-cafe', 'theme-restaurant');
        if (cat === 'CAFE')       document.body.classList.add('theme-cafe');
        else if (cat === 'RESTAURANT') document.body.classList.add('theme-restaurant');
        else                      document.body.classList.add('theme-all');
    }

    // ── 탭 초기화 ─────────────────────────────────────────────────────────────
    function initTabs() {
        document.getElementById('tabAll').className  = 'cat-tab';
        document.getElementById('tabCafe').className = 'cat-tab';
        document.getElementById('tabRest').className = 'cat-tab';
        if (activeCategory === 'CAFE')       document.getElementById('tabCafe').className = 'cat-tab active-cafe';
        else if (activeCategory === 'RESTAURANT') document.getElementById('tabRest').className = 'cat-tab active-rest';
        else                                 document.getElementById('tabAll').className  = 'cat-tab active-all';
        applyTheme(activeCategory);
    }

    function switchCategory(cat) {
        const q   = document.getElementById('searchInput').value.trim();
        const path = location.pathname;
        if (q) {
            location.href = `/foodmap/search?keyword=${encodeURIComponent(q)}&category=${cat}`;
        } else if (path.startsWith('/foodmap/mylocation')) {
            location.href = `/foodmap/mylocation/${userLat}/${userLon}?category=${cat}`;
        } else {
            location.href = `/foodmap/all`;
        }
    }

    // ── 필터 + 정렬 ───────────────────────────────────────────────────────────
    function getFiltered() {
        let list = [...PLACES];
        const q = (document.getElementById('searchInput').value || '').toLowerCase();
        if (q) list = list.filter(p =>
            (p.name ?? '').toLowerCase().includes(q) ||
            (p.googleName ?? '').toLowerCase().includes(q)
        );
        if (activeSort === 'distance') {
            list.sort((a, b) => (a.distance ?? 99) - (b.distance ?? 99));
        } else {
            list.sort((a, b) => (b.finalScore ?? 0) - (a.finalScore ?? 0));
        }
        return list;
    }

    function setSort(s) {
        activeSort = s;
        document.querySelectorAll('.sort-btn').forEach(b =>
            b.classList.toggle('active',
                (s === 'recommended' && b.textContent.includes('AI추천')) ||
                (s === 'distance'    && b.textContent.includes('거리순'))
            )
        );
        render();
    }

    // ── 유틸 ─────────────────────────────────────────────────────────────────
    function distStr(d) {
        if (d == null || d === 0) return '-';
        return d < 1 ? (d * 1000).toFixed(0) + 'm' : d.toFixed(1) + 'km';
    }
    function emoji(cat) { return cat === 'CAFE' ? '☕' : '🍜'; }
    function encodeId(name) { return btoa(encodeURIComponent(name || '')).replace(/[^a-zA-Z0-9]/g, ''); }
    function escQ(s)  { return (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
    function escJS(s) { return (s||'').replace(/'/g, "\\'"); }

    // ── 카드 색상 결정 ────────────────────────────────────────────────────────
    function catCssClass(cat) {
        if (cat === 'CAFE')       return 'cat-cafe';
        if (cat === 'RESTAURANT') return 'cat-rest';
        return 'cat-all';
    }
    function rankCssClass(cat) {
        if (cat === 'CAFE')       return 'rank rank-cafe';
        if (cat === 'RESTAURANT') return 'rank rank-rest';
        return 'rank';
    }
    function catLabel(cat) {
        if (cat === 'CAFE')       return '카페';
        if (cat === 'RESTAURANT') return '음식점';
        return '장소';
    }

    // ── 렌더 ─────────────────────────────────────────────────────────────────
    function render() {
        const list = getFiltered();
        window._currentList = list;
        document.getElementById('countDisplay').textContent = list.length;
        const el = document.getElementById('placeList');

        if (list.length === 0) {
            el.innerHTML = `
        <div class="empty-state">
          <div class="ei">🍽️</div>
          <p>현재 위치 버튼을 누르거나<br>장소 이름을 검색해보세요</p>
        </div>`;
            return;
        }

        el.innerHTML = list.map((p, i) => `
      <div class="place-card${activePinName === p.name ? ' active' : ''}"
           id="card-${encodeId(p.name)}"
           onclick="selectPlace('${escJS(p.name)}')">
        <div class="thumb">
          <div class="${rankCssClass(p.category)}">${i + 1}</div>
          ${emoji(p.category)}
        </div>
        <div class="card-info">
          <div class="card-cat ${catCssClass(p.category)}">${catLabel(p.category)} · AI ${((p.finalScore ?? 0) * 100).toFixed(0)}점</div>
          <div class="card-name">${p.name ?? '-'}</div>
          <div class="card-meta">
            <span class="stars-s">★</span>${(p.avgStar ?? 0).toFixed(1)}
            (리뷰 ${p.reviewCount ?? 0}개)
            <span class="card-dist">📍 ${distStr(p.distance)}</span>
          </div>
        </div>
      </div>`
        ).join('');
    }

    // ── 선택 ─────────────────────────────────────────────────────────────────
    function selectPlace(name) {
        activePinName = name;
        render();

        const list = window._currentList || PLACES;
        const p = list.find(x => x.name === name) || PLACES.find(x => x.name === name);
        if (!p) return;

        document.getElementById('card-' + encodeId(name))?.scrollIntoView({ behavior:'smooth', block:'nearest' });

        if (p.lat && p.lng && map) {
            map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
        }
        showPopupOverlay(p);
    }

    // ── 팝업 오버레이 (카카오 CustomOverlay) ─────────────────────────────────
    function popupBtnClass(cat) {
        if (cat === 'CAFE')       return 'btn-cafe';
        if (cat === 'RESTAURANT') return 'btn-rest';
        return 'btn-all';
    }

    function showPopupOverlay(p) {
        closePopup();
        currentPopupPlace = p;
        if (!map || !p.lat || !p.lng) return;

        const btnCls = popupBtnClass(p.category);
        const content = `
      <div style="background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);
                  width:240px;overflow:hidden;border:1px solid #e2e8f0;position:relative;">
        <div style="height:90px;background:#f8fafc;display:flex;align-items:center;
                    justify-content:center;font-size:36px;position:relative;">
          ${emoji(p.category)}
          <button onclick="closePopup()"
            style="position:absolute;top:6px;right:8px;background:rgba(0,0,0,.4);
                   color:#fff;border:none;border-radius:50%;width:22px;height:22px;
                   cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">×</button>
        </div>
        <div style="padding:12px;">
          <div style="font-size:14px;font-weight:700;margin-bottom:3px;">${escQ(p.name ?? '-')}</div>
          <div style="font-size:12px;color:#64748b;margin-bottom:8px;">
            ★ ${(p.avgStar ?? 0).toFixed(1)} · ${distStr(p.distance)} · AI ${((p.finalScore ?? 0) * 100).toFixed(0)}점
          </div>
          <a href="#" onclick="openDetailFromPopup(event)"
             class="popup-btn ${btnCls}"
             style="display:block;width:100%;padding:8px;color:#fff;border:none;border-radius:8px;
                    font-size:13px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;
                    background:${p.category==='CAFE'?'#6f4e37':(p.category==='RESTAURANT'?'#f472b6':'#3b9eff')}">
            상세보기 →
          </a>
        </div>
      </div>`;

        popupOverlay = new kakao.maps.CustomOverlay({
            map: map,
            position: new kakao.maps.LatLng(p.lat, p.lng),
            content: content,
            yAnchor: 1.45,
            zIndex: 40
        });
    }

    function closePopup() {
        if (popupOverlay) { popupOverlay.setMap(null); popupOverlay = null; }
        currentPopupPlace = null;
        activePinName = null;
        render();
    }

    function openDetailFromPopup(e) {
        e.preventDefault();
        if (currentPopupPlace) openDetail(currentPopupPlace);
    }

    // ── 상세 패널 ─────────────────────────────────────────────────────────────
    function openDetail(p) {
        if (!p) return;
        closePopup();

        const isCafe = p.category === 'CAFE';
        const isRest = p.category === 'RESTAURANT';
        const badgeCls = isCafe ? 'db-cafe' : (isRest ? 'db-rest' : 'db-accent');

        document.getElementById('dpTitle').textContent = p.name ?? '-';
        document.getElementById('dpName').textContent  = p.name ?? '-';
        document.getElementById('dpSub').textContent   = p.googleName ?? '';
        document.getElementById('dpImg').innerHTML     = `<span style="font-size:56px">${emoji(p.category)}</span>`;

        document.getElementById('dpBadges').innerHTML =
            `<span class="dp-badge ${badgeCls}">${catLabel(p.category)}</span>
       <span class="dp-badge db-gold">🏆 ${((p.finalScore ?? 0) * 100).toFixed(0)}점</span>
       ${(p.reviewCount ?? 0) >= 10 ? '<span class="dp-badge db-green">인기</span>' : ''}`;

        const stars = Math.round(p.avgStar ?? 0);
        document.getElementById('dpStars').innerHTML =
            `<span class="s">${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</span>
       <span class="sc">${(p.avgStar ?? 0).toFixed(1)}</span>
       <span class="sm">/ 5.0 &nbsp;·&nbsp; 리뷰 ${p.reviewCount ?? 0}개</span>`;

        document.getElementById('dpInfoRow').innerHTML = `
      <div class="dp-info">
        <div class="dp-info-label">평균 리뷰 별점</div>
        <div class="dp-info-val">★ ${(p.reviewMean ?? p.avgStar ?? 0).toFixed(1)} / 5.0</div>
      </div>
      <div class="dp-info">
        <div class="dp-info-label">거리</div>
        <div class="dp-info-val">${distStr(p.distance)}</div>
      </div>
      <div class="dp-info">
        <div class="dp-info-label">AI 추천 점수</div>
        <div class="dp-info-val">🏆 ${((p.finalScore ?? 0) * 100).toFixed(1)} / 100</div>
      </div>
      <div class="dp-info">
        <div class="dp-info-label">카테고리</div>
        <div class="dp-info-val">${catLabel(p.category)}</div>
      </div>`;

        const reviews = p.reviews ?? [];
        const avg = (p.reviewMean ?? p.avgStar ?? 0).toFixed(1);
        document.getElementById('dpRevSummary').innerHTML = `
      <div>
        <div class="rev-score">${avg}</div>
        <div style="color:var(--gold);font-size:14px;margin-top:4px">${'★'.repeat(Math.round(parseFloat(avg)))}</div>
      </div>
      <div class="rev-right"><div class="rev-bars">
        ${[5,4,3,2,1].map(s => {
            const cnt = reviews.filter(r => Math.round(r.rating ?? 0) === s).length;
            const pct = reviews.length ? Math.round(cnt / reviews.length * 100) : 0;
            return `<div class="rev-row"><span>${s}</span>
            <div class="rev-track"><div class="rev-fill" style="width:${pct}%"></div></div>
            <span>${pct}%</span></div>`;
        }).join('')}
      </div></div>`;

        document.getElementById('dpReviews').innerHTML = reviews.length > 0
            ? reviews.slice(0, 5).map(r => `
        <div class="review-item">
          <div class="ri-top">
            <div><div class="ri-name">리뷰어</div></div>
            <div class="ri-stars">${'★'.repeat(Math.round(r.rating ?? 0))}</div>
          </div>
          <div class="ri-text">${r.content ?? ''}</div>
        </div>`).join('')
            : '<p style="color:var(--gray);font-size:13px;padding:12px 0">등록된 리뷰가 없습니다.</p>';

        // 현재 열려있는 장소 저장 (카카오맵 링크용)
        window._detailPlace = p;
        document.getElementById('detailPanel').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detailPanel').classList.remove('open');
    }

    function openKakaoMapLink() {
        const p = window._detailPlace || currentPopupPlace;
        if (!p) return;
        window.open(`https://map.kakao.com/link/map/${encodeURIComponent(p.name)},${p.lat},${p.lng}`, '_blank');
    }

    // ── 검색 ─────────────────────────────────────────────────────────────────
    function goSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if (q) location.href = `/foodmap/search?keyword=${encodeURIComponent(q)}&category=${activeCategory}`;
    }

    // ── 현위치 ───────────────────────────────────────────────────────────────
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => location.href = `/foodmap/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?category=${activeCategory}`,
                ()  => location.href = `/foodmap/mylocation/37.5665/126.9780?category=${activeCategory}`
            );
        } else {
            location.href = `/foodmap/mylocation/37.5665/126.9780?category=${activeCategory}`;
        }
    }

    // 지도 바깥 클릭 → 팝업 닫기
    document.getElementById('mapArea').addEventListener('click', function(e) {
        if (!e.target.closest('.detail-panel') &&
            !e.target.closest('.map-controls') &&
            !e.target.closest('.place-card')) {
            // CustomOverlay 내부 클릭은 이벤트 버블이 안되므로 안전
        }
    });

    // ── 초기 실행 ─────────────────────────────────────────────────────────────
    initTabs();
    render();

    // /foodmap/all 일 때 자동 현위치 요청
    if (PLACES.length === 0 && !location.pathname.startsWith('/foodmap/mylocation')) {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => location.href = `/foodmap/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?category=${activeCategory}`,
                ()  => location.href = `/foodmap/mylocation/37.5665/126.9780?category=${activeCategory}`
            );
        }
    }
</script>

<!-- ── 카카오맵 SDK ── -->
<script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoKey}&autoload=false|"></script>
<script>
    kakao.maps.load(function () {
        map = new kakao.maps.Map(document.getElementById('kakaoMap'), {
            center: new kakao.maps.LatLng(userLat, userLon),
            level: 5
        });

        // 내 위치 마커
        const myMarkerImg = new kakao.maps.MarkerImage(
            'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png',
            new kakao.maps.Size(40, 42)
        );
        new kakao.maps.Marker({
            map: map,
            position: new kakao.maps.LatLng(userLat, userLon),
            title: '내 위치',
            image: myMarkerImg
        });

        // 장소 마커 + 라벨 오버레이
        PLACES.forEach(p => {
            if (!p.lat || !p.lng) return;

            const isCafe = p.category === 'CAFE';
            const isRest = p.category === 'RESTAURANT';

            // 마커 색상: 카페=갈색, 음식점=핑크, 전체=파랑
            const markerColor = isCafe ? '#6f4e37' : (isRest ? '#f472b6' : '#3b9eff');
            const markerBorder = isCafe ? '#4a3220' : (isRest ? '#db2777' : '#1a7de0');

            // SVG 커스텀 마커
            const svgMarker = `
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
          <ellipse cx="16" cy="38" rx="6" ry="2.5" fill="rgba(0,0,0,0.18)"/>
          <path d="M16 2 C8.268 2 2 8.268 2 16 C2 26 16 38 16 38 C16 38 30 26 30 16 C30 8.268 23.732 2 16 2Z"
                fill="${markerColor}" stroke="${markerBorder}" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="7" fill="white" opacity="0.9"/>
          <text x="16" y="20" text-anchor="middle" font-size="10" font-family="sans-serif"
                fill="${markerColor}">${isCafe ? '☕' : (isRest ? '🍜' : '🍽')}</text>
        </svg>`;

            const markerSize = new kakao.maps.Size(32, 40);
            const markerImage = new kakao.maps.MarkerImage(
                'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMarker),
                markerSize
            );

            const marker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(p.lat, p.lng),
                title: p.name,
                image: markerImage
            });

            // 라벨 오버레이
            const labelColor = markerColor;
            const overlay = new kakao.maps.CustomOverlay({
                position: new kakao.maps.LatLng(p.lat, p.lng),
                content: `<div onclick="selectPlace('${escQ(p.name)}')" style="
          background:#fff;
          border:1.5px solid ${labelColor};
          border-radius:8px;
          padding:3px 8px;
          font-size:11px;
          font-weight:700;
          color:${labelColor};
          white-space:nowrap;
          box-shadow:0 2px 8px rgba(0,0,0,.15);
          cursor:pointer;
          font-family:'DM Sans',sans-serif;
          transform:translateY(-2px);
        ">${(p.name || '').substring(0, 8)}</div>`,
                yAnchor: 3.2,
                zIndex: 5
            });
            overlay.setMap(map);
            //확인

            markerObjects.push({ name: p.name, marker, overlay });

            kakao.maps.event.addListener(marker, 'click', () => selectPlace(p.name));
        });
    });

    function escQ(s) { return (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
</script>
