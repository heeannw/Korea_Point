<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음식 지도 — FoodMap</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        /* ── 색상 변수 (map.html 동일 + 음식점 accent) ── */
        :root {
            --brown:#6f4e37; --brown-dk:#4a3220; --brown-lt:#fdf6f0;
            --dark:#0f172a;  --mid:#334155;      --gray:#64748b;
            --border:#e8d5c4; --white:#fff;      --light:#fdf6f0;
            --gold:#f59e0b;  --green:#16a34a;
            --red:#ef4444;   --red-lt:#fef2f2;
            /* 카테고리별 accent */
            --cat-all:#6f4e37;
            --cat-cafe:#6f4e37;
            --cat-rest:#ef4444;
            --r:12px; --sh:0 2px 16px rgba(111,78,55,.12);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden}
        body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--dark);display:flex;flex-direction:column}

        /* ── 헤더 ── */
        header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);background:var(--white);flex-shrink:0;z-index:100}
        .logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--brown-dk);text-decoration:none}
        .logo span{color:var(--dark)}
        .header-right{display:flex;gap:8px;align-items:center}
        .h-btn{padding:7px 16px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--dark);transition:all .2s}
        .h-btn:hover,.h-btn.active{border-color:var(--brown);color:var(--brown)}
        .h-btn-fill{background:var(--brown);color:#fff;border-color:var(--brown)}
        .h-btn-fill:hover{background:var(--brown-dk);color:#fff}

        /* ── 레이아웃 ── */
        .app-body{flex:1;display:flex;overflow:hidden}

        /* ── 사이드바 ── */
        .sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--white)}
        .search-bar{padding:14px 16px 0;flex-shrink:0}
        .search-wrap{position:relative}
        .search-wrap input{width:100%;padding:10px 42px 10px 16px;border:1.5px solid var(--border);border-radius:50px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:var(--light);transition:border .2s;color:var(--dark)}
        .search-wrap input:focus{border-color:var(--brown);background:#fff}
        .search-wrap .si{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:15px;cursor:pointer}
        .search-wrap .si:hover{color:var(--brown)}

        /* ── 카테고리 탭 (신규) ── */
        .cat-tabs{padding:12px 16px 0;display:flex;gap:6px;flex-shrink:0}
        .cat-tab{flex:1;padding:8px 0;border-radius:50px;border:1.5px solid var(--border);background:var(--white);font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--gray);transition:all .2s;text-align:center}
        .cat-tab:hover{border-color:var(--brown);color:var(--brown)}
        .cat-tab.active-all{background:var(--brown);color:#fff;border-color:var(--brown)}
        .cat-tab.active-cafe{background:var(--brown);color:#fff;border-color:var(--brown)}
        .cat-tab.active-rest{background:var(--red);color:#fff;border-color:var(--red)}

        /* ── 필터 칩 ── */
        .filter-row{padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
        .filter-row::-webkit-scrollbar{display:none}
        .chip{padding:5px 14px;border-radius:50px;border:1.5px solid var(--border);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:'DM Sans',sans-serif;color:var(--gray)}
        .chip:hover{border-color:var(--brown);color:var(--brown)}
        .chip.active{background:var(--brown);color:#fff;border-color:var(--brown)}

        /* ── 정렬·카운트 ── */
        .sort-row{padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
        .result-count{font-size:13px;color:var(--gray)}
        .result-count strong{color:var(--dark)}
        .sort-btns{display:flex;gap:4px}
        .sort-btn{padding:4px 12px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--gray);transition:all .2s}
        .sort-btn.active{background:var(--brown-lt);color:var(--brown);border-color:var(--brown)}

        /* ── 카드 리스트 ── */
        .place-list{flex:1;overflow-y:auto;padding:0 12px 12px}
        .place-list::-webkit-scrollbar{width:4px}
        .place-list::-webkit-scrollbar-track{background:transparent}
        .place-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

        .place-card{display:flex;gap:12px;padding:12px;border-radius:var(--r);cursor:pointer;transition:background .15s,box-shadow .15s;margin-bottom:4px;border:1.5px solid transparent}
        .place-card:hover{background:var(--light)}
        .place-card.active{background:var(--brown-lt);border-color:var(--brown)}
        .place-card .thumb{width:72px;height:72px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0;position:relative;background-color:var(--light);display:flex;align-items:center;justify-content:center;font-size:28px}
        .place-card .rank{position:absolute;top:-6px;left:-6px;width:20px;height:20px;background:var(--brown);color:#fff;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
        .place-card .rank.rest{background:var(--red)}
        .card-info{flex:1;min-width:0}
        .card-name{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .card-cat{font-size:11px;font-weight:600;margin-bottom:4px}
        .card-cat.cafe{color:var(--brown)}
        .card-cat.rest{color:var(--red)}
        .card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray)}
        .stars-s{color:var(--gold);font-size:11px}
        .card-dist{font-size:11px;color:var(--gray);background:var(--light);padding:2px 8px;border-radius:50px;white-space:nowrap}

        /* ── 지도 영역 ── */
        .map-area{flex:1;position:relative;overflow:hidden}
        #kakaoMap{position:absolute;inset:0;z-index:1}

        .map-controls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:30}
        .mc{width:36px;height:36px;background:#fff;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;box-shadow:var(--sh);transition:background .2s}
        .mc:hover{background:var(--light)}

        .loc-btn{position:absolute;bottom:24px;right:16px;background:#fff;border:1px solid var(--border);border-radius:50px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--sh);color:var(--dark);font-family:'DM Sans',sans-serif;z-index:30;transition:all .2s}
        .loc-btn:hover{border-color:var(--brown);color:var(--brown)}

        /* ── 팝업 ── */
        .map-popup{position:absolute;z-index:40;background:#fff;border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.18);width:240px;display:none;overflow:hidden;animation:popIn .2s ease}
        .map-popup.show{display:block}
        @keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .popup-img{height:90px;background-size:cover;background-position:center;position:relative;background-color:var(--light);display:flex;align-items:center;justify-content:center;font-size:36px}
        .popup-close{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;line-height:1}
        .popup-body{padding:12px}
        .popup-name{font-size:14px;font-weight:700;margin-bottom:3px}
        .popup-meta{font-size:12px;color:var(--gray);margin-bottom:8px}
        .popup-btn{display:block;width:100%;padding:8px;background:var(--brown);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s;text-align:center;text-decoration:none}
        .popup-btn:hover{background:var(--brown-dk)}
        .popup-btn.rest{background:var(--red)}
        .popup-btn.rest:hover{background:#b91c1c}

        /* ── 상세 패널 ── */
        .detail-panel{position:absolute;inset:0;background:#fff;z-index:50;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto}
        .detail-panel.open{transform:translateX(0)}
        .dp-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:5}
        .dp-back{background:none;border:none;font-size:20px;cursor:pointer;color:var(--dark);padding:4px;line-height:1}
        .dp-title{font-size:16px;font-weight:700;flex:1}
        .dp-img{width:100%;height:160px;background-size:cover;background-position:center;background-color:var(--light);display:flex;align-items:center;justify-content:center;font-size:56px}
        .dp-body{padding:16px}
        .dp-badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
        .dp-badge{padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700}
        .db-brown{background:var(--brown-lt);color:var(--brown-dk)}
        .db-red{background:var(--red-lt);color:#991b1b}
        .db-gold{background:#fef3c7;color:#92400e}
        .db-green{background:#f0fdf4;color:#166534}
        .dp-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;margin-bottom:2px}
        .dp-sub{font-size:14px;color:var(--gray);margin-bottom:12px}
        .dp-stars{display:flex;align-items:center;gap:6px;margin-bottom:14px}
        .dp-stars .s{color:var(--gold);font-size:16px}
        .dp-stars .sc{font-size:18px;font-weight:700}
        .dp-stars .sm{font-size:13px;color:var(--gray)}
        .dp-info-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
        .dp-info{background:var(--light);border-radius:10px;padding:12px 14px}
        .dp-info-label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
        .dp-info-val{font-size:13px;font-weight:500;line-height:1.4}
        .dp-section-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--dark)}
        .rev-summary{display:flex;align-items:center;gap:16px;background:var(--light);border-radius:10px;padding:14px 16px;margin-bottom:12px}
        .rev-score{font-size:42px;font-weight:900;font-family:'Playfair Display',serif;line-height:1}
        .rev-right{flex:1}
        .rev-bars{display:flex;flex-direction:column;gap:5px}
        .rev-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray)}
        .rev-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
        .rev-fill{height:100%;background:var(--gold);border-radius:3px}
        .review-item{padding:12px 0;border-bottom:1px solid var(--border)}
        .review-item:last-child{border-bottom:none}
        .ri-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
        .ri-name{font-size:13px;font-weight:600}
        .ri-stars{font-size:12px;color:var(--gold)}
        .ri-text{font-size:13px;color:var(--mid);line-height:1.6}
        .dp-action{position:sticky;bottom:0;padding:12px 16px;background:#fff;border-top:1px solid var(--border)}
        .dp-action-btn{width:100%;padding:13px;background:var(--brown);color:#fff;border:none;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s}
        .dp-action-btn:hover{background:var(--brown-dk)}
        .dp-action-btn.rest{background:var(--red)}
        .dp-action-btn.rest:hover{background:#b91c1c}

        /* ── 빈 상태 ── */
        .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--gray);gap:8px;text-align:center;padding:20px}
        .empty-state .ei{font-size:40px}
        .empty-state p{font-size:14px;line-height:1.6}
    </style>
</head>
<body>

<!-- ── 헤더 ── -->
<header>
    <a class="logo" href="/foodmap/all">🍽️ Food<span>Map</span></a>
    <div class="header-right">
        <button class="h-btn" onclick="goSearch()">🔍 검색</button>
        <button class="h-btn h-btn-fill" onclick="getLocation()">📍 현재 위치</button>
    </div>
</header>

<!-- ── 본문 ── -->
<div class="app-body">

    <!-- 사이드바 -->
    <div class="sidebar">

        <!-- 검색바 -->
        <div class="search-bar">
            <div class="search-wrap">
                <input type="text" id="searchInput"
                       th:value="${keyword}"
                       placeholder="카페·음식점 이름 검색..."
                       onkeydown="if(event.key==='Enter') goSearch()">
                <span class="si" onclick="goSearch()">🔍</span>
            </div>
        </div>

        <!-- ── 카테고리 탭 (핵심: 전체/카페/음식점) ── -->
        <div class="cat-tabs">
            <button class="cat-tab" id="tabAll"  onclick="switchCategory('ALL')">🍽️ 전체</button>
            <button class="cat-tab" id="tabCafe" onclick="switchCategory('CAFE')">☕ 카페</button>
            <button class="cat-tab" id="tabRest" onclick="switchCategory('RESTAURANT')">🍜 음식점</button>
        </div>

        <!-- 필터 칩 -->
        <div class="filter-row" id="filterRow">
            <div class="chip active" onclick="setSubFilter('전체')">전체</div>
            <div class="chip" onclick="setSubFilter('고평점')">⭐ 고평점</div>
            <div class="chip" onclick="setSubFilter('리뷰많음')">💬 리뷰많음</div>
            <div class="chip" onclick="setSubFilter('가까운순')">📍 가까운</div>
        </div>

        <!-- 정렬 + 개수 -->
        <div class="sort-row">
            <div class="result-count"><strong id="countDisplay">0</strong> 개 장소</div>
            <div class="sort-btns">
                <button class="sort-btn active" onclick="setSort('recommended')">⭐ AI추천</button>
                <button class="sort-btn"        onclick="setSort('distance')">📍 거리순</button>
            </div>
        </div>

        <!-- 장소 리스트 -->
        <div class="place-list" id="placeList"></div>
    </div>

    <!-- 지도 영역 -->
    <div class="map-area" id="mapArea">
        <div id="kakaoMap"></div>

        <div class="map-controls" style="z-index:30">
            <div class="mc">＋</div>
            <div class="mc">－</div>
        </div>

        <button class="loc-btn" onclick="getLocation()">📍 현재 위치로 추천</button>

        <!-- 팝업 -->
        <div class="map-popup" id="mapPopup">
            <div class="popup-img" id="popupImg">
                <button class="popup-close" onclick="closePopup()">×</button>
            </div>
            <div class="popup-body">
                <div class="popup-name" id="popupName"></div>
                <div class="popup-meta" id="popupMeta"></div>
                <a class="popup-btn" id="popupDetailBtn" href="#" onclick="openDetail(currentPopup);return false">상세보기 →</a>
            </div>
        </div>

        <!-- 상세 패널 -->
        <div class="detail-panel" id="detailPanel">
            <div class="dp-header">
                <button class="dp-back" onclick="closeDetail()">←</button>
                <div class="dp-title" id="dpTitle"></div>
                <div style="font-size:20px;cursor:pointer" onclick="openKakaoMap()">🗺️</div>
            </div>
            <div class="dp-img" id="dpImg"></div>
            <div class="dp-body">
                <div class="dp-badge-row" id="dpBadges"></div>
                <div class="dp-name"      id="dpName"></div>
                <div class="dp-sub"       id="dpSub"></div>
                <div class="dp-stars"     id="dpStars"></div>
                <div class="dp-info-row"  id="dpInfoRow"></div>
                <div class="dp-section-title">리뷰</div>
                <div class="rev-summary"  id="dpRevSummary"></div>
                <div id="dpReviews"></div>
            </div>
            <div class="dp-action">
                <button class="dp-action-btn" id="dpActionBtn" onclick="openKakaoMap()">🗺️ 카카오맵으로 보기</button>
            </div>
        </div>
    </div>
</div>

<!-- ── Thymeleaf 데이터 주입 ── -->
<script th:inline="javascript">
    const userLat      = /*[[${userlat}]]*/ 37.5665;
    const userLon      = /*[[${userlon}]]*/ 126.9780;
    const PLACES       = /*[[${list}]]*/ [];
    const INIT_CATEGORY = /*[[${category}]]*/ 'ALL';
</script>

<!-- ── JS 로직 ── -->
<script>
    // ── 상태 ──────────────────────────────────────────────────────────────────
    let activeCategory = INIT_CATEGORY;  // 'ALL' | 'CAFE' | 'RESTAURANT'
    let activeSubFilter = '전체';
    let activeSort      = 'recommended';
    let activePinId     = null;
    let currentPopup    = null;

    // ── 카테고리 탭 초기화 ────────────────────────────────────────────────────
    function initTabs() {
        ['All','Cafe','Rest'].forEach(t => document.getElementById('tab'+t).className = 'cat-tab');
        if (activeCategory === 'CAFE') {
            document.getElementById('tabCafe').className = 'cat-tab active-cafe';
        } else if (activeCategory === 'RESTAURANT') {
            document.getElementById('tabRest').className = 'cat-tab active-rest';
        } else {
            document.getElementById('tabAll').className = 'cat-tab active-all';
        }
    }

    // 탭 클릭 → URL 이동 (서버에서 필터링)
    function switchCategory(cat) {
        const q = document.getElementById('searchInput').value.trim();
        const lat = userLat, lng = userLon;

        // 현재 URL 경로 판단
        const path = location.pathname;
        if (q) {
            location.href = `/foodmap/search?keyword=${encodeURIComponent(q)}&category=${cat}`;
        } else if (path.startsWith('/foodmap/mylocation')) {
            location.href = `/foodmap/mylocation/${lat}/${lng}?category=${cat}`;
        } else {
            location.href = `/foodmap/all`;
        }
    }

    // ── 필터 + 정렬 ───────────────────────────────────────────────────────────
    function getFiltered() {
        let list = [...PLACES];
        const q = (document.getElementById('searchInput').value || '').toLowerCase();

        // 서브 필터 (클라이언트 측)
        if (activeSubFilter === '고평점')  list = list.filter(p => (p.avgStar ?? 0) >= 4.3);
        if (activeSubFilter === '리뷰많음') list = list.filter(p => (p.reviewCount ?? 0) >= 5);

        if (q) list = list.filter(p =>
            (p.name ?? '').toLowerCase().includes(q) ||
            (p.googleName ?? '').toLowerCase().includes(q)
        );

        if (activeSubFilter === '가까운순' || activeSort === 'distance') {
            list.sort((a, b) => (a.distance ?? 99) - (b.distance ?? 99));
        } else {
            list.sort((a, b) => (b.finalScore ?? 0) - (a.finalScore ?? 0));
        }
        return list;
    }

    function setSubFilter(f) {
        activeSubFilter = f;
        document.querySelectorAll('.chip').forEach(ch =>
            ch.classList.toggle('active', ch.textContent.trim() === f)
        );
        render();
    }

    function setSort(s) {
        activeSort = s;
        document.querySelectorAll('.sort-btn').forEach(b =>
            b.classList.toggle('active',
                (s === 'recommended' && b.textContent.includes('AI추천')) ||
                (s === 'distance'    && b.textContent.includes('거리순'))
            )
        );
        render();
    }

    // ── 거리 포맷 ─────────────────────────────────────────────────────────────
    function distStr(d) {
        if (d == null || d === 0) return '-';
        return d < 1 ? (d * 1000).toFixed(0) + 'm' : d.toFixed(1) + 'km';
    }

    // ── 이모지 (카테고리별) ───────────────────────────────────────────────────
    function emoji(cat) { return cat === 'CAFE' ? '☕' : '🍜'; }

    // ── 렌더 ─────────────────────────────────────────────────────────────────
    function render() {
        const list = getFiltered();
        document.getElementById('countDisplay').textContent = list.length;
        const el = document.getElementById('placeList');

        if (list.length === 0) {
            el.innerHTML = `
        <div class="empty-state">
          <div class="ei">🍽️</div>
          <p>현재 위치 버튼을 누르거나<br>장소 이름을 검색해보세요</p>
        </div>`;
            return;
        }

        el.innerHTML = list.map((p, i) => {
            const isCafe = p.category === 'CAFE';
            const rankCls = isCafe ? '' : ' rest';
            const catCls  = isCafe ? 'cafe' : 'rest';
            const catLabel = isCafe ? '카페' : '음식점';
            return `
        <div class="place-card${activePinId === p.name ? ' active' : ''}"
             id="card-${encodeId(p.name)}"
             onclick="selectPlace('${escapeQ(p.name)}')">
          <div class="thumb">
            <div class="rank${rankCls}">${i + 1}</div>
            ${emoji(p.category)}
          </div>
          <div class="card-info">
            <div class="card-cat ${catCls}">${catLabel} · AI ${((p.finalScore ?? 0) * 100).toFixed(0)}점</div>
            <div class="card-name">${p.name ?? '-'}</div>
            <div class="card-meta">
              <span class="stars-s">★</span>${(p.avgStar ?? 0).toFixed(1)}
              (리뷰 ${p.reviewCount ?? 0}개)
              <span class="card-dist">📍 ${distStr(p.distance)}</span>
            </div>
          </div>
        </div>`;
        }).join('');
    }

    // ── 선택 ─────────────────────────────────────────────────────────────────
    function selectPlace(name) {
        activePinId = name;
        render();
        document.getElementById('card-' + encodeId(name))?.scrollIntoView({behavior:'smooth', block:'nearest'});
        showPopup(name);
    }

    function showPopup(name) {
        const p = PLACES.find(x => x.name === name);
        if (!p) return;
        currentPopup = name;
        const isCafe = p.category === 'CAFE';

        const imgEl = document.getElementById('popupImg');
        imgEl.style.backgroundImage = '';
        imgEl.innerHTML = `<button class="popup-close" onclick="closePopup()">×</button>${emoji(p.category)}`;

        document.getElementById('popupName').textContent = p.name ?? '-';
        document.getElementById('popupMeta').textContent =
            `★ ${(p.avgStar ?? 0).toFixed(1)} · ${distStr(p.distance)} · AI ${((p.finalScore ?? 0) * 100).toFixed(0)}점`;

        const btn = document.getElementById('popupDetailBtn');
        btn.className = 'popup-btn' + (isCafe ? '' : ' rest');

        const popup = document.getElementById('mapPopup');
        popup.style.left = '20px';
        popup.style.top  = '20px';
        popup.classList.add('show');
    }

    function closePopup() {
        document.getElementById('mapPopup').classList.remove('show');
        activePinId = null;
        render();
    }

    // ── 상세 패널 ─────────────────────────────────────────────────────────────
    function openDetail(name) {
        const p = PLACES.find(x => x.name === name);
        if (!p) return;
        document.getElementById('mapPopup').classList.remove('show');

        const isCafe  = p.category === 'CAFE';
        const catLabel = isCafe ? '카페' : '음식점';
        const badgeCls = isCafe ? 'db-brown' : 'db-red';

        document.getElementById('dpTitle').textContent = p.name ?? '-';
        document.getElementById('dpName').textContent  = p.name ?? '-';
        document.getElementById('dpSub').textContent   = p.googleName ?? '';
        document.getElementById('dpImg').innerHTML     = `<span style="font-size:56px">${emoji(p.category)}</span>`;

        document.getElementById('dpBadges').innerHTML =
            `<span class="dp-badge ${badgeCls}">${catLabel}</span>
       <span class="dp-badge db-gold">🏆 ${((p.finalScore ?? 0) * 100).toFixed(0)}점</span>
       ${(p.reviewCount ?? 0) >= 10 ? '<span class="dp-badge db-green">인기</span>' : ''}`;

        const stars = Math.round(p.avgStar ?? 0);
        document.getElementById('dpStars').innerHTML =
            `<span class="s">${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</span>
       <span class="sc">${(p.avgStar ?? 0).toFixed(1)}</span>
       <span class="sm">/ 5.0 &nbsp;·&nbsp; 리뷰 ${p.reviewCount ?? 0}개</span>`;

        document.getElementById('dpInfoRow').innerHTML = `
      <div class="dp-info">
        <div class="dp-info-label">평균 리뷰 별점</div>
        <div class="dp-info-val">★ ${(p.reviewMean ?? 0).toFixed(1)} / 5.0</div>
      </div>
      <div class="dp-info">
        <div class="dp-info-label">거리</div>
        <div class="dp-info-val">${distStr(p.distance)} 거리</div>
      </div>
      <div class="dp-info">
        <div class="dp-info-label">AI 추천 점수</div>
        <div class="dp-info-val">🏆 ${((p.finalScore ?? 0) * 100).toFixed(1)} / 100</div>
      </div>
      <div class="dp-info">
        <div class="dp-info-label">좌표</div>
        <div class="dp-info-val">${(p.lat ?? 0).toFixed(4)}, ${(p.lng ?? 0).toFixed(4)}</div>
      </div>`;

        // 리뷰 섹션
        const reviews = p.reviews ?? [];
        const avg     = (p.reviewMean ?? p.avgStar ?? 0).toFixed(1);
        document.getElementById('dpRevSummary').innerHTML = `
      <div>
        <div class="rev-score">${avg}</div>
        <div style="color:var(--gold);font-size:14px;margin-top:4px">
          ${'★'.repeat(Math.round(parseFloat(avg)))}
        </div>
      </div>
      <div class="rev-right"><div class="rev-bars">
        ${[5,4,3,2,1].map(s => {
            const cnt = reviews.filter(r => Math.round(r.rating ?? 0) === s).length;
            const pct = reviews.length ? Math.round(cnt / reviews.length * 100) : 0;
            return `<div class="rev-row"><span>${s}</span>
            <div class="rev-track"><div class="rev-fill" style="width:${pct}%"></div></div>
            <span>${pct}%</span></div>`;
        }).join('')}
      </div></div>`;

        document.getElementById('dpReviews').innerHTML = reviews.length > 0
            ? reviews.slice(0, 5).map(r => `
        <div class="review-item">
          <div class="ri-top">
            <div><div class="ri-name">리뷰어</div></div>
            <div class="ri-stars">${'★'.repeat(Math.round(r.rating ?? 0))}</div>
          </div>
          <div class="ri-text">${r.content ?? ''}</div>
        </div>`).join('')
            : '<p style="color:var(--gray);font-size:13px;padding:12px 0">등록된 리뷰가 없습니다.</p>';

        // 상세 버튼 색상
        document.getElementById('dpActionBtn').className =
            'dp-action-btn' + (isCafe ? '' : ' rest');

        document.getElementById('detailPanel').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detailPanel').classList.remove('open');
    }

    function openKakaoMap() {
        const p = PLACES.find(x => x.name === currentPopup);
        if (!p) return;
        window.open(`https://map.kakao.com/link/map/${encodeURIComponent(p.name)},${p.lat},${p.lng}`, '_blank');
    }

    // ── 검색 ─────────────────────────────────────────────────────────────────
    function goSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if (q) location.href = `/foodmap/search?keyword=${encodeURIComponent(q)}&category=${activeCategory}`;
    }

    // ── 현위치 ───────────────────────────────────────────────────────────────
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => location.href = `/foodmap/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?category=${activeCategory}`,
                ()  => location.href = `/foodmap/mylocation/37.5665/126.9780?category=${activeCategory}`
            );
        } else {
            location.href = `/foodmap/mylocation/37.5665/126.9780?category=${activeCategory}`;
        }
    }

    // 지도 클릭 → 팝업 닫기
    document.getElementById('mapArea').addEventListener('click', function(e) {
        if (!e.target.closest('.map-popup') && !e.target.closest('.detail-panel')) closePopup();
    });

    function encodeId(name) { return btoa(encodeURIComponent(name)).replace(/[^a-zA-Z0-9]/g,''); }
    function escapeQ(s)      { return s.replace(/'/g, "\\'"); }

    // ── 초기 실행 ────────────────────────────────────────────────────────────
    initTabs();
    render();

    // /foodmap/all 일 때만 자동 현위치 요청
    const isMylocation = location.pathname.startsWith('/foodmap/mylocation');
    if (PLACES.length === 0 && !isMylocation) {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => location.href = `/foodmap/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?category=${activeCategory}`,
                ()  => location.href = `/foodmap/mylocation/37.5665/126.9780?category=${activeCategory}`
            );
        } else {
            location.href = `/foodmap/mylocation/37.5665/126.9780?category=${activeCategory}`;
        }
    }
</script>

<!-- ── 카카오맵 SDK ── -->
<script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoKey}&autoload=false|"></script>
<script>
    kakao.maps.load(function () {
        const map = new kakao.maps.Map(document.getElementById('kakaoMap'), {
            center: new kakao.maps.LatLng(userLat, userLon),
            level: 5
        });

        // 내 위치 마커
        const myMarkerImg = new kakao.maps.MarkerImage(
            'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
            new kakao.maps.Size(24, 35)
        );
        new kakao.maps.Marker({
            map: map,
            position: new kakao.maps.LatLng(userLat, userLon),
            title: '내 위치',
            image: myMarkerImg
        });

        // 장소 마커
        PLACES.forEach(p => {
            if (!p.lat || !p.lng) return;
            const isCafe = p.category === 'CAFE';

            const marker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(p.lat, p.lng),
                title: p.name
            });

            // 라벨 오버레이 (카페: 갈색, 음식점: 빨간색)
            const labelColor = isCafe ? '#6f4e37' : '#ef4444';
            const labelBg    = isCafe ? '#fff' : '#fff';
            const overlay = new kakao.maps.CustomOverlay({
                position: new kakao.maps.LatLng(p.lat, p.lng),
                content: `<div style="
          background:${labelBg};
          border:1.5px solid ${labelColor};
          border-radius:8px;
          padding:3px 8px;
          font-size:11px;
          font-weight:700;
          color:${labelColor};
          white-space:nowrap;
          box-shadow:0 2px 8px rgba(0,0,0,.15);
          transform:translateY(-110%);
          cursor:pointer;
          font-family:'DM Sans',sans-serif"
          onclick="selectPlace('${escQ(p.name)}')">${p.name.substring(0, 8)}</div>`,
                yAnchor: 1.5,
                zIndex: 5
            });
            overlay.setMap(map);

            kakao.maps.event.addListener(marker, 'click', () => selectPlace(p.name));
        });
    });

    function escQ(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
</script>
