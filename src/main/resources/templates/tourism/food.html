<!DOCTYPE html>
<html th:lang="${lang}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="#{tour.food.pageTitle} + ' — KoreaPoint'">Taste — KoreaPoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#3b9eff; --blue-dk:#1a7de0; --dark:#0f172a; --mid:#334155; --gray:#64748b;
      --border:#dbeafe; --white:#fff; --light:#f0f7ff; --r:12px; --hdr-h:60px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--dark);display:flex;flex-direction:column}
    header{position:absolute;top:0;left:0;right:0;height:var(--hdr-h);display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 20px;
      background:var(--white);border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(16,24,40,.06);z-index:100}

    .body-row{flex:1;display:flex;min-height:0}
    .sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;
      border-right:1px solid var(--border);background:var(--white);padding-top:var(--hdr-h)}
    .search-wrap{padding:12px}
    .search-box{display:flex;gap:6px}
    .search-box input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:50px;
      font-size:13px;font-family:inherit;outline:none}
    .search-box input:focus{border-color:var(--blue)}
    .search-box button{padding:10px 16px;border:none;border-radius:50px;background:var(--blue);
      color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

    .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:12px 12px 0;padding:4px;
      border-radius:12px;background:var(--light);border:1px solid var(--border)}
    .mode-tab{padding:8px 10px;border-radius:9px;text-align:center;text-decoration:none;color:var(--gray);
      font-size:12px;font-weight:700;transition:background .15s,color .15s,box-shadow .15s}
    .mode-tab:hover{color:var(--blue-dk)}
    .mode-tab.active{background:var(--white);color:var(--blue-dk);box-shadow:0 2px 8px rgba(59,158,255,.15)}

    .filter-wrap{display:flex;align-items:center;padding:0 0 10px;flex-shrink:0}
    .filter-wrap[hidden]{display:none!important}
    .scroll-btn{flex:none;width:28px;height:28px;border:1.5px solid var(--border);border-radius:50%;
      background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-size:13px;color:var(--gray);box-shadow:0 1px 6px rgba(0,0,0,.08);z-index:2}
    .scroll-btn:hover{border-color:var(--blue);color:var(--blue)}
    .scroll-btn:disabled{opacity:.3;cursor:default;pointer-events:none}
    .scroll-btn.left{margin-left:8px}
    .scroll-btn.right{margin-right:8px}
    .filter-row{flex:1;display:flex;gap:6px;overflow-x:auto;padding:0 6px;
      scrollbar-width:none;scroll-behavior:smooth}
    .filter-row::-webkit-scrollbar{display:none}
    .chip{flex:none;padding:6px 13px;border:1.5px solid var(--border);border-radius:50px;
      font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--white)}
    .chip.active{background:var(--blue);border-color:var(--blue);color:#fff}

    .near-note{margin:0 12px 10px;padding:8px 11px;border-radius:10px;background:var(--light);
      border:1px solid var(--border);font-size:12px;color:var(--mid);line-height:1.5}
    .near-note b{color:var(--blue-dk)}
    .list-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px}
    .list-count{font-size:12px;color:var(--gray)}
    .sort-btns{display:flex;gap:4px;max-width:270px;overflow-x:auto;scrollbar-width:none}
    .sort-btns::-webkit-scrollbar{display:none}
    .sort-btn{padding:5px 11px;border:1.5px solid var(--border);border-radius:50px;background:var(--white);
      font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--mid)}
    .sort-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}

    .place-list{flex:1;overflow-y:auto;padding:0 12px 12px}
    .place-card{position:relative;display:flex;gap:10px;padding:10px;border:1.5px solid transparent;border-radius:var(--r);
      cursor:pointer;margin-bottom:6px;content-visibility:auto;contain-intrinsic-size:0 94px}
    .place-card:hover{background:var(--light)}
    .card-save{position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;border-radius:50%;
      background:rgba(255,255,255,.92);color:#cbd5e1;font-size:15px;line-height:1;cursor:pointer;
      display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.14);z-index:2;
      transition:color .15s,transform .1s}
    .card-save:hover{color:#ef4444;transform:scale(1.1)}
    .card-save.saved{color:#ef4444}
    .place-card.active{border-color:var(--blue);background:var(--light)}
    .thumb{width:72px;height:72px;flex:none;border-radius:10px;background:#e2e8f0 center/cover no-repeat}
    .card-info{flex:1;min-width:0}
    .card-cat{font-size:11px;font-weight:700;margin-bottom:2px}
    .scroll-sentinel{height:40px}
    .card-name{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.3}
    .card-meta{font-size:11px;color:var(--gray);display:flex;gap:8px;flex-wrap:wrap}
    .empty{padding:30px 14px;text-align:center;color:var(--gray);font-size:13px;line-height:1.6}

    .map-area{flex:1;position:relative;background:#e8f0fe;overflow:hidden}
    #map{width:100%;height:100%}

    /* ── Detail Panel (Naver-style) ── */
    .detail-panel{position:absolute;top:var(--hdr-h);left:0;width:390px;max-width:50%;height:calc(100% - var(--hdr-h));
      background:#fff;transform:translateX(-100%);transition:transform .25s ease;
      z-index:60;display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,.12)}
    .detail-panel.open{transform:translateX(0)}
    .dp-header{height:48px;display:flex;align-items:center;padding:0 8px;gap:4px;
      background:#fff;border-bottom:1px solid #f0f0f0;flex-shrink:0;z-index:5}
    .dp-back{width:36px;height:36px;border:none;background:transparent;border-radius:50%;
      font-size:17px;cursor:pointer;color:#333;display:flex;align-items:center;justify-content:center}
    .dp-back:hover{background:#f3f4f6}
    .dp-title{flex:1;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dark);padding:0 4px}
    .dp-header-right{display:flex;gap:2px}
    /* 저장(하트)은 헤더가 아니라 장소명 블록 우측 상단에 겹쳐 놓는다. */
    .summary-save{position:absolute;top:12px;right:12px;width:36px;height:36px;border:none;border-radius:50%;background:transparent;
      color:#bbb;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:2}
    .summary-save:hover{color:#ef4444;background:#fef2f2}
    .summary-save.saved{color:#ef4444}

    .dp-hero{width:100%;height:195px;background:#eef2f7 center/cover no-repeat;
      flex-shrink:0;position:relative;overflow:hidden;cursor:pointer}
    .dp-hero.no-image{height:0;visibility:hidden;pointer-events:none}
    .dp-hero-count{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);
      color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px}

    .dp-body{flex:1;overflow-y:auto}
    .dp-summary{position:relative;padding:16px 44px 14px 16px;border-bottom:1px solid #f0f0f0}
    .dp-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .dp-badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:700}
    .dp-badge-detail{background:#f1f5f9;color:var(--mid)}
    .dp-badge-certified{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
    .dp-name{font-size:21px;font-weight:800;color:#111;line-height:1.25;margin-bottom:4px}
    .dp-sub{font-size:12px;color:#999;line-height:1.4;margin-bottom:5px}
    .dp-rating{display:flex;align-items:center;gap:5px;font-size:12px;margin-top:4px}
    .dp-rating-stars{color:#facc15;font-size:14px}
    .dp-rating-score{font-weight:700;color:#222;font-size:13px}
    .dp-rating-count{color:#aaa}

    .quick-actions{display:flex;justify-content:space-around;align-items:flex-start;padding:14px 4px;border-bottom:1px solid #f0f0f0}
    .quick-btn{display:flex;flex-direction:column;align-items:center;gap:5px;
      border:none;background:transparent;cursor:pointer;padding:4px 6px;font-family:inherit}
    .quick-btn[hidden]{display:none!important}
    .qb-icon{width:44px;height:44px;border-radius:50%;border:1.5px solid #e8e8e8;background:#fff;
      display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s,border-color .15s}
    .quick-btn:hover .qb-icon{background:#f3f4f6;border-color:#d1d5db}
    .qb-label{font-size:10px;font-weight:600;color:#555;white-space:nowrap}

    .dp-tabs{position:sticky;top:0;z-index:4;display:flex;background:#fff;
      border-bottom:2px solid #f0f0f0;flex-shrink:0;padding:0 8px}
    .dp-tab{flex:1;border:0;border-bottom:2px solid transparent;margin-bottom:-2px;
      background:transparent;padding:12px 4px;color:#999;font:700 13px inherit;cursor:pointer;
      transition:color .15s,border-color .15s}
    .dp-tab.active{border-bottom-color:var(--blue-dk);color:var(--blue-dk)}
    .dp-tab:hover:not(.active){color:#333}
    .tab-panel[hidden]{display:none!important}

    .section-card{padding:18px 16px;border-bottom:8px solid #f5f7fa}
    .section-card:last-child{border-bottom:0}
    .section-title{font-size:14px;font-weight:800;color:#111;margin-bottom:12px}
    .section-title small{color:#aaa;font-weight:500;font-size:12px}
    .dp-info-row{padding:0 16px}
    .dp-info-row:empty{display:none}
    .dp-info{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid #f5f7fa;align-items:flex-start}
    .dp-info:last-child{border-bottom:0}
    .dp-info-label{font-size:11px;color:#aaa;font-weight:600;min-width:50px;flex:none;padding-top:1px}
    .dp-info-val{font-size:13px;color:#333;flex:1;line-height:1.5;font-weight:500}
    /* 장소 소개는 위 운영정보(dp-info-row)와 한 블록으로 이어 붙인다 — 따로 노는 카드처럼 안 보이게 */
    .dp-desc-block{padding:14px 16px 4px;border-bottom:8px solid #f5f7fa}
    .dp-desc{font-size:13px;color:#555;line-height:1.75;word-break:keep-all;position:relative}
    .dp-desc.collapsed{max-height:96px;overflow:hidden}
    .dp-desc.collapsed::after{content:'';position:absolute;left:0;right:0;bottom:0;height:32px;
      background:linear-gradient(transparent,#fff)}
    .dp-desc-toggle{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;
      margin-top:6px;padding:8px 0 2px;background:none;border:0;color:#8a94a3;
      font:700 12px inherit;cursor:pointer}
    .dp-desc-toggle:hover{color:#555}
    .dp-desc-toggle .dp-desc-caret{font-size:10px;transition:transform .2s}
    .dp-desc-toggle.open .dp-desc-caret{transform:rotate(180deg)}
    .empty-state{text-align:center;padding:36px 16px;color:#aaa;display:flex;flex-direction:column;align-items:center;gap:3px}
    .empty-state strong{display:block;color:#555;font-size:14px;margin:6px 0 2px}
    .outline-btn{display:inline-block;margin-top:12px;padding:9px 18px;border:1.5px solid var(--blue);
      border-radius:6px;color:var(--blue-dk);background:#fff;font:700 12px inherit;text-decoration:none;cursor:pointer}
    .outline-btn:hover{background:var(--light)}
    .rv-wrap{padding:0}
    .rv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 10px}
    .rv-head .section-title{margin-bottom:0}
    .rv-avg{color:#f59e0b;font-weight:800;font-size:13px;margin-left:3px}
    .rv-cnt{font-size:11px;color:#aaa;font-weight:600;margin-left:1px}
    .rv-open{border:0;background:none;color:var(--blue-dk);font:700 13px inherit;cursor:pointer;padding:4px 2px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
    .rv-open:hover{text-decoration:underline}
    .rv-form{padding:0 16px 14px}
    .rv-stars{display:flex;gap:4px;font-size:26px;line-height:1;color:#d7dde5;cursor:pointer;user-select:none;margin-bottom:10px}
    .rv-stars span{transition:transform .1s ease,color .1s ease}
    .rv-stars span.on{color:#facc15}
    .rv-stars span:active{transform:scale(1.2)}
    .rv-form textarea{width:100%;box-sizing:border-box;border:1.5px solid #e5e7eb;border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;line-height:1.6;resize:vertical;outline:none;background:#fff;transition:border-color .12s}
    .rv-form textarea:focus{border-color:var(--blue)}
    .rv-submit{margin-top:9px;width:100%;padding:10px;border:0;border-radius:9px;background:var(--blue-dk);color:#fff;font:700 13px inherit;cursor:pointer;transition:background .12s}
    .rv-submit:hover{background:var(--blue)}
    .rv-actions{display:flex;gap:12px;margin-top:6px}
    .rv-form .rv-actions{margin-top:8px;justify-content:center}
    .rv-actions button{border:0;background:none;padding:2px 4px;font-size:11px;font-weight:600;cursor:pointer;color:#9aa5b1}
    .rv-actions button:hover{color:#4b5563}
    .review-card{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:14px 16px;border-bottom:1px solid #f5f7fa}
    .review-card:last-child{border-bottom:0}
    .rv-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-lt,#e8f3ff);color:var(--blue-dk);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
    .review-head{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
    .review-head .rv-actions{margin-left:auto;margin-top:0;gap:10px}
    .review-author{font-size:13px;font-weight:700;color:#222}
    .review-date{font-size:11px;color:#aaa}
    .review-edited{font-size:10px;color:#c2c2c2;font-weight:500}
    .review-star{font-size:12px;color:#facc15;letter-spacing:1px;margin-bottom:5px}
    .review-text{font-size:12.5px;color:#555;line-height:1.65;white-space:pre-wrap;word-break:break-word}
    .community-card{display:block;padding:14px 16px;border-bottom:1px solid #f5f7fa;
      color:inherit;text-decoration:none;transition:background .12s}
    .community-card:hover{background:#f9fafb}
    .community-card:last-child{border-bottom:0}
    .community-meta{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:3px}
    .community-title{font-size:13px;font-weight:700;color:#222;margin-bottom:3px}
    .community-preview{font-size:12px;color:#777;line-height:1.5}
    .media-viewer{position:fixed;inset:0;background:#fff;z-index:300;display:none;flex-direction:column}.media-viewer.open{display:flex}
    .media-viewer-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e5e7eb;font-weight:800}
    .media-viewer-close{border:0;background:transparent;font-size:25px;cursor:pointer}.media-viewer-grid{padding:12px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .media-viewer-grid img,.media-viewer-grid video{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px;background:#e8eef5}
  </style>
  <link rel="stylesheet" th:href="@{/css/common/header-menu.css}">
</head>
<body>
<div th:replace="~{fragments/app-header :: header(${lang}, ${isLoggedIn}, ${currentUserName})}"></div>

<div class="body-row">
  <aside class="sidebar">
    <nav class="mode-tabs" th:aria-label="#{tour.food.modeTabsLabel}" aria-label="맛집 유형">
      <a class="mode-tab" th:classappend="${cafeOnly} ? '' : 'active'"
         th:href="@{/tour/food(lang=${lang}, lat=${userlat}, lon=${userlon}, near=${near})}" id="tabFood">음식점</a>
      <a class="mode-tab" th:classappend="${cafeOnly} ? 'active' : ''"
         th:href="@{/tour/cafe(lang=${lang}, lat=${userlat}, lon=${userlon}, near=${near})}" id="tabCafe">카페</a>
    </nav>
    <div class="search-wrap">
      <form class="search-box" th:action="@{/tour/food/search}" method="get" id="searchForm">
        <input type="hidden" name="lang" th:value="${lang}">
        <input type="hidden" name="cafeOnly" th:value="${cafeOnly}">
        <input type="text" name="keyword" id="searchInput" th:value="${keyword}" placeholder="검색" oninput="onSearchInput()">
        <button type="submit" id="searchBtn">검색</button>
      </form>
    </div>
    <div class="filter-wrap" th:hidden="${cafeOnly}">
      <button class="scroll-btn left" id="scrollLeft" type="button" onclick="scrollFilter(-1)" disabled>‹</button>
      <div class="filter-row" id="filterRow"></div>
      <button class="scroll-btn right" id="scrollRight" type="button" onclick="scrollFilter(1)">›</button>
    </div>
    <div class="near-note" id="nearNote" hidden></div>
    <div class="list-head">
      <span class="list-count"><b id="countDisplay">0</b> <span id="countUnit">곳</span></span>
      <div class="sort-btns">
        <button class="sort-btn" id="sortPopular" onclick="setSort('popular')" hidden>인기 TOP 20</button>
        <button class="sort-btn" id="sortRating" onclick="setSort('rating')" hidden>별점순</button>
        <button class="sort-btn" id="sortReviews" onclick="setSort('reviews')" hidden>리뷰순</button>
        <button class="sort-btn active" id="sortRec" onclick="setSort('recommended')">추천순</button>
        <button class="sort-btn" id="sortDist" onclick="setSort('distance')">거리순</button>
      </div>
    </div>
    <div class="place-list" id="placeList"></div>
  </aside>

  <div class="map-area">
    <div id="map"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="dp-header">
        <button class="dp-back" onclick="closeDetail()">←</button>
        <div class="dp-title" id="dpTitle"></div>
      </div>
      <div class="dp-hero no-image" id="dpHero"></div>
      <div class="dp-body">
        <section class="dp-summary">
          <button class="summary-save" id="btnSave" type="button" aria-label="장소 저장">♡</button>
          <div class="dp-badges" id="dpBadge"></div>
          <div class="dp-name" id="dpName"></div>
          <div class="dp-sub" id="dpSub"></div>
          <div class="dp-rating" id="dpRating"></div>
        </section>
        <div class="quick-actions">
          <button class="quick-btn" id="btnRoute" type="button">
            <div class="qb-icon">🚊</div><span class="qb-label">길찾기</span>
          </button>
          <button class="quick-btn" id="btnNearTour" type="button">
            <div class="qb-icon">🗺️</div><span class="qb-label">근처 관광지</span>
          </button>
          <button class="quick-btn" id="btnReservation" type="button" hidden>
            <div class="qb-icon">📞</div><span class="qb-label">예약 문의</span>
          </button>
          <button class="quick-btn" id="btnShare" type="button">
            <div class="qb-icon">🔗</div><span class="qb-label">공유</span>
          </button>
        </div>
        <nav class="dp-tabs">
          <button class="dp-tab active" type="button" data-tab="info" onclick="showDetailTab('info')">정보</button>
          <button class="dp-tab" type="button" data-tab="reviews" onclick="showDetailTab('reviews')">리뷰</button>
          <button class="dp-tab" type="button" data-tab="community" onclick="showDetailTab('community')">커뮤니티</button>
        </nav>
        <section class="tab-panel" id="tab-info">
          <div class="dp-info-row" id="dpInfoRow"></div>
          <div class="dp-desc-block" id="dpDescBlock">
            <div class="section-title" id="aboutTitle">장소 소개</div>
            <div class="dp-desc" id="dpDesc"></div>
            <button type="button" class="dp-desc-toggle" id="dpDescToggle" onclick="toggleDpDesc()" hidden>
              <span id="dpDescToggleLabel"></span><span class="dp-desc-caret">▾</span>
            </button>
          </div>
        </section>
        <section class="tab-panel" id="tab-reviews" hidden><div id="dpReviews"></div></section>
        <section class="tab-panel" id="tab-community" hidden><div id="dpCommunity"></div></section>
      </div>
    </div>
  </div>
</div>

<div class="media-viewer" id="mediaViewer" role="dialog" aria-modal="true" aria-label="사진과 영상">
  <div class="media-viewer-head"><span id="mediaViewerTitle">사진</span>
    <button class="media-viewer-close" type="button" onclick="closeMediaViewer()" aria-label="닫기">×</button></div>
  <div class="media-viewer-grid" id="mediaViewerGrid"></div>
</div>

<script th:inline="javascript">
  const PLACES    = /*[[${list}]]*/ [];
  const LANG      = /*[[${lang}]]*/ 'ko';
  const KAKAO_KEY = /*[[${kakaoKey}]]*/ '';
  const userLat   = /*[[${userlat}]]*/ null;

    document.getElementById('btnReservation').querySelector('.qb-label').textContent = T.reservationLabel;
    document.getElementById('btnShare').querySelector('.qb-label').textContent = T.shareLabel;
    document.getElementById('btnSave').setAttribute('aria-label', T.saveAria);
    document.querySelectorAll('.dp-tab').forEach(tab => {
      const k = { info:'infoTab', reviews:'reviewsTab', community:'communityTab' }[tab.dataset.tab];
      if (k) tab.textContent = T[k];
    });
    const aboutTitle = document.getElementById('aboutTitle');
    if (aboutTitle) aboutTitle.textContent = T.about;
    const mediaTitle = document.getElementById('mediaViewerTitle');
    if (mediaTitle) mediaTitle.textContent = T.photos;
    document.getElementById('tabFood').textContent = T.foodTab;
    document.getElementById('tabCafe').textContent = T.cafeTab;
    document.getElementById('sortRec').classList.toggle('active', activeSort === 'recommended');
    document.getElementById('sortDist').classList.toggle('active', activeSort === 'distance');
    popularButton.classList.toggle('active', activeSort === 'popular');
    // 카페·찻집·음료점은 모두 카페로 묶으므로 카페 화면에서는 하위 필터를 숨긴다.
    document.querySelector('.filter-wrap').hidden = CAFE_ONLY;
    // 음식점은 데이터에 실제로 존재하는 분류만 칩으로 만든다.
    const present = new Set(PLACES.map(p => p.foodCategory));
    document.getElementById('filterRow').innerHTML = CATEGORIES
      .filter(c => c === 'all' || present.has(c))
      .map(c => `<div class="chip${c === activeCategory ? ' active' : ''}" data-cat="${c}"
                   onclick="setCategory('${c}')">${c === 'all' ? '🍽️' : EMOJI[c]} ${label(c)}</div>`)
      .join('');

    if (NEAR_TITLE) {
      const note = document.getElementById('nearNote');
      note.innerHTML = fmt(T.nearNoteFmt, escapeHtml(NEAR_TITLE));
      note.hidden = false;
    }
  }

  // 분류가 사이드바 폭을 넘겨서 잘리므로 관광 화면과 같은 좌우 이동 버튼을 둔다.
  function scrollFilter(dir) {
    const row = document.getElementById('filterRow');
    row.scrollLeft += dir * 120;
    setTimeout(updateScrollBtns, 150);
  }

  function updateScrollBtns() {
    const row = document.getElementById('filterRow');
    document.getElementById('scrollLeft').disabled = row.scrollLeft <= 0;
    document.getElementById('scrollRight').disabled =
      row.scrollLeft + row.clientWidth >= row.scrollWidth - 1;
  }

  function distStr(d) {
    if (d == null) return '-';
    return d < 1 ? Math.round(d * 1000) + 'm' : d.toFixed(1) + 'km';
  }

  function reviewCount(p) {
    return Math.max(p.user_ratings_total ?? 0, Array.isArray(p.reviews) ? p.reviews.length : 0);
  }

  function getMatchingPlaces() {
    let list = [...PLACES];
    if (activeCategory !== 'all') list = list.filter(p => p.foodCategory === activeCategory);
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (q) list = list.filter(p =>
      (p.title || '').toLowerCase().includes(q) || (p.addr || '').toLowerCase().includes(q));
    return list;
  }

  // 타이핑하는 동안 로드된 목록을 즉시 필터. Enter/버튼은 폼 submit → 서버 검색.
  let searchFilterTimer;
  function onSearchInput() {
    clearTimeout(searchFilterTimer);
    searchFilterTimer = setTimeout(render, 150);
  }

  function updateSortAvailability() {
    const matching = getMatchingPlaces();
    const availability = {
      popular: matching.filter(p => p.popularRank != null).length >= 5,
      rating: matching.filter(p => p.rating != null && reviewCount(p) >= 10).length >= 5,
      reviews: matching.filter(p => reviewCount(p) > 0).length >= 5
    };
    document.getElementById('sortPopular').hidden = !availability.popular;
    document.getElementById('sortRating').hidden = !availability.rating;
    document.getElementById('sortReviews').hidden = !availability.reviews;
    // 거리순은 "근처 맛집/카페"처럼 기준 장소가 있을 때만 의미가 있다. 현위치 기능이 없어져서
    // 평소엔 기준점이 없어 눌러도 정렬이 안 먹힌다 — 그럴 땐 버튼 자체를 숨긴다.
    document.getElementById('sortDist').hidden = !NEAR_TITLE;
    if (availability[activeSort] === false) activeSort = 'recommended';
    if (activeSort === 'distance' && !NEAR_TITLE) activeSort = 'recommended';
  }

  function getFiltered() {
    let list = getMatchingPlaces();
    if (activeSort === 'distance') list.sort((a, b) => (a.distance ?? 9e9) - (b.distance ?? 9e9));
    else if (activeSort === 'popular') {
      list = list.filter(p => p.popularRank != null)
        .sort((a, b) => a.popularRank - b.popularRank)
        .slice(0, 20);
    } else if (activeSort === 'rating') {
      list = list.filter(p => p.rating != null && reviewCount(p) >= 10)
        .sort((a, b) => (b.rating - a.rating) || (reviewCount(b) - reviewCount(a)));
    } else if (activeSort === 'reviews') {
      list = list.filter(p => reviewCount(p) > 0)
        .sort((a, b) => reviewCount(b) - reviewCount(a));
    } else list.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
    return list;
  }

  function setCategory(c) {
    activeCategory = c;
    activePinId = null;
    document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('active', ch.dataset.cat === c));
    render();
  }

  function setSort(s) {
    activeSort = s;
    document.getElementById('sortRec').classList.toggle('active', s === 'recommended');
    document.getElementById('sortDist').classList.toggle('active', s === 'distance');
    document.getElementById('sortPopular').classList.toggle('active', s === 'popular');
    document.getElementById('sortRating').classList.toggle('active', s === 'rating');
    document.getElementById('sortReviews').classList.toggle('active', s === 'reviews');
    render();
  }

  function escapeHtml(v) {
    return String(v ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[ch]);
  }

  /** 카드 한 장의 마크업. 전체 다시 그리기·스크롤 이어 그리기 둘 다 이 함수를 쓴다. */
  function cardHtml(p, i) {
    return `
      <div class="place-card${activePinId === i ? ' active' : ''}" id="card-${i}" onclick="selectPlace(${i})">
        <button class="card-save${savedIds.has(String(p.id)) ? ' saved' : ''}" type="button"
                data-id="${escapeHtml(String(p.id ?? ''))}" data-type="${escapeHtml(p.type ?? '39')}"
                onclick="cardSaveClick(event, this)">${savedIds.has(String(p.id)) ? '♥' : '♡'}</button>
        <div class="thumb" style="background-image:url('${escapeHtml(p.image ?? '')}')"></div>
        <div class="card-info">
          <div class="card-cat" style="color:${cardColorOf(p)}">${cardEmojiOf(p)} ${escapeHtml(catLabel(p))}</div>
          <div class="card-name">${escapeHtml(p.title ?? '-')}</div>
          <div class="card-meta">
            ${NEAR_TITLE ? `<span>📍 ${distStr(p.distance)}</span>` : ''}
            <span>${escapeHtml((p.addr ?? '').slice(0, 24))}</span>
          </div>
        </div>
      </div>`;
  }

  let scrollObserver = null;

  /** 목록 아래로 내리면 다음 배치를 이어 그린다 — render()를 다시 부르면 지금까지 그린
   *  만큼을 매번 통째로 다시 그리게 돼서 비싸지니, 새 카드만 덧붙인다. */
  function appendMorePlaces() {
    const list = window._currentList || [];
    const start = renderLimit;
    const end = Math.min(start + RENDER_BATCH, list.length);
    if (start >= end) return;
    let html = '';
    for (let i = start; i < end; i++) html += cardHtml(list[i], i);
    const sentinel = document.getElementById('scrollSentinel');
    if (sentinel) sentinel.insertAdjacentHTML('beforebegin', html); else document.getElementById('placeList').insertAdjacentHTML('beforeend', html);
    renderLimit = end;
    if (end >= list.length && sentinel) sentinel.remove();
  }

  function setupScrollSentinel(hasMore) {
    if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
    if (!hasMore) return;
    const sentinel = document.getElementById('scrollSentinel');
    const root = document.getElementById('placeList');
    if (!sentinel || !root) return;
    scrollObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) appendMorePlaces();
    }, { root, rootMargin: '400px' });
    scrollObserver.observe(sentinel);
  }

  function render() {
    updateSortAvailability();
    document.getElementById('sortRec').classList.toggle('active', activeSort === 'recommended');
    document.getElementById('sortDist').classList.toggle('active', activeSort === 'distance');
    document.getElementById('sortPopular').classList.toggle('active', activeSort === 'popular');
    document.getElementById('sortRating').classList.toggle('active', activeSort === 'rating');
    document.getElementById('sortReviews').classList.toggle('active', activeSort === 'reviews');
    const list = getFiltered();
    window._currentList = list;
    document.getElementById('countDisplay').textContent = list.length;
    updateMarkerVisibility();
    const box = document.getElementById('placeList');
    if (list.length === 0) { box.innerHTML = `<div class="empty">${T.empty}</div>`; return; }

    // 필터 조건이 바뀐 경우에만 쌓아 온 범위를 처음으로 되돌린다.
    const filterKey = activeCategory + '|' + activeSort + '|' + document.getElementById('searchInput').value;
    if (filterKey !== lastRenderKey) { renderLimit = RENDER_BATCH; lastRenderKey = filterKey; }
    const visibleCount = Math.min(renderLimit, list.length);

    let html = '';
    for (let i = 0; i < visibleCount; i++) html += cardHtml(list[i], i);
    if (list.length > visibleCount) html += '<div id="scrollSentinel" class="scroll-sentinel"></div>';
    box.innerHTML = html;
    setupScrollSentinel(list.length > visibleCount);
  }

  function markerImage(p, active) {
    // 카카오 지도는 숫자가 클수록 멀리 보이는 축척이다.
    const level = map?.getLevel?.() ?? 8;
    if (!active && level >= 8) {
      const size = 14;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 14 14">
        <circle cx="7" cy="7" r="5" fill="#3b9eff" stroke="white" stroke-width="2"/></svg>`;
      return new kakao.maps.MarkerImage(
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
        new kakao.maps.Size(size, size),
        { offset: new kakao.maps.Point(size / 2, size / 2) });
    }

    if (!active) {
      const size = level >= 6 ? 22 : 26;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 22 22">
        <circle cx="11" cy="11" r="10" fill="#3b9eff" stroke="white" stroke-width="2"/>
        <g transform="translate(3 3) scale(.667)" fill="none" stroke="white" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">${markerIconOf(p)}</g></svg>`;
      return new kakao.maps.MarkerImage(
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
        new kakao.maps.Size(size, size),
        { offset: new kakao.maps.Point(size / 2, size / 2) });
    }

    const size = 44;
    const height = size * 52 / 44;
    const strokeWidth = active ? 3 : 2;
    const borderColor = active ? '#0f6fcf' : 'white';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${height}" viewBox="0 0 44 52">
      <defs>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="${active ? '.32' : '.18'}"/>
        </filter>
      </defs>
      <g filter="url(#shadow)">
        <rect x="2" y="2" width="40" height="40" rx="12" fill="#3b9eff"
              stroke="${borderColor}" stroke-width="${strokeWidth}"/>
        <path d="M17 40 L22 49 L27 40 Z" fill="#3b9eff" stroke="${borderColor}"
              stroke-width="${strokeWidth}" stroke-linejoin="round"/>
        <path d="M17 39 H27" stroke="#3b9eff" stroke-width="5"/>
      </g>
      <g transform="translate(10 10)" fill="none" stroke="white" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">${markerIconOf(p)}</g>
    </svg>`;
    return new kakao.maps.MarkerImage(
      'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
      new kakao.maps.Size(size, height),
      { offset: new kakao.maps.Point(size / 2, height) });
  }

  function refreshMarkerImages(selectedId = currentDetailPlace?.id) {
    markerMap.forEach(m => {
      const selected = m.id === selectedId;
      m.marker.setImage(markerImage(m.place, selected));
      m.marker.setZIndex(selected ? 1000 : 1);
    });
  }

  function centerPlaceBesideDetail(p) {
    if (!map || !p?.lat || !p?.lng) return;
    const pos = new kakao.maps.LatLng(p.lat, p.lng);
    // 멀리 축소돼 있으면 위치가 보이도록 확대. 이미 가까우면 그대로 둔다.
    if (map.getLevel() > 5) map.setLevel(5, { anchor: pos });
    map.panTo(pos);
    // 상세 패널이 왼쪽을 덮으므로 남은 지도 영역의 가운데로 핀을 옮긴다.
    setTimeout(() => {
      const panelWidth = document.getElementById('detailPanel').getBoundingClientRect().width;
      map.panBy(-Math.round(panelWidth / 2), 0);
    }, 280);
  }

  function updateMarkerVisibility() {
    if (markerMap.length === 0) return;
    const visible = new Set(getFiltered().map(p => p.id));
    markerMap.forEach(m => m.marker.setMap(visible.has(m.id) ? map : null));
  }

  function selectPlace(idx) {
    const list = window._currentList || PLACES;
    const p = list[idx];
    if (!p) return;
    activePinId = idx;
    // 지도 핀은 목록에 그려둔 범위 밖도 클릭할 수 있다 — 그 카드가 실제로 그려져 있어야
    // 아래서 하이라이트·스크롤이 맞는 카드로 간다.
    if (idx >= renderLimit) renderLimit = idx + 1;
    render();
    refreshMarkerImages(p.id);
    openDetail(p);
    centerPlaceBesideDetail(p);
    // 목록 아래쪽 카드처럼 거리가 멀면 smooth 스크롤이 몇 초씩 걸리거나 도중에 멈춘다 — 즉시 이동.
    document.getElementById('card-' + idx)?.scrollIntoView({ behavior:'auto', block:'nearest' });
  }

  /**
   * 홈이나 관광 상세에서 특정 음식점을 눌러 넘어온 경우(?focus=contentId)
   * 그 장소의 상세 패널을 바로 연다. 필터에 걸려 목록에서 빠졌으면 전체로 되돌린다.
   */
  // "근처 음식점/카페" 등으로 특정 장소를 기준으로 들어왔을 때 그 위치로 지도를 당겨 온다.
  // 개별 장소 상세(?focus=)로 들어온 경우는 그쪽이 이미 자기 위치로 지도를 맞추니 건드리지 않는다.
  const ORIGIN_PIN_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="38" viewBox="0 0 30 38">'
    + '<path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 23 15 23s15-12.5 15-23C30 6.7 23.3 0 15 0z" fill="#ef4444" stroke="white" stroke-width="2"/>'
    + '<circle cx="15" cy="15" r="6" fill="white"/></svg>';

  function centerOnNearOrigin() {
    if (!map || !NEAR_TITLE || userLat == null || userLon == null) return;
    if (new URLSearchParams(location.search).get('focus')) return;
    const pos = new kakao.maps.LatLng(userLat, userLon);
    if (map.getLevel() > 5) map.setLevel(5, { anchor: pos });
    map.panTo(pos);
    new kakao.maps.Marker({
      map: map, position: pos, title: NEAR_TITLE, zIndex: 10,
      image: new kakao.maps.MarkerImage(
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ORIGIN_PIN_SVG),
        new kakao.maps.Size(30, 38), { offset: new kakao.maps.Point(15, 38) })
    });
  }

  function focusInitialPlace() {
    const focusId = new URLSearchParams(location.search).get('focus');
    if (!focusId) return;
    const target = PLACES.find(p => String(p.id) === String(focusId));
    if (!target) return;
    if (activeCategory !== 'all' && target.foodCategory !== activeCategory) {
      activeCategory = 'all';
      document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('active', ch.dataset.cat === 'all'));
      render();
    }
    const list = window._currentList || PLACES;
    const idx = list.findIndex(p => String(p.id) === String(focusId));
    if (idx >= 0) {
      selectPlace(idx);
    } else {
      openDetail(target);
      centerPlaceBesideDetail(target);
    }
  }

  const DETAIL_LABELS = {
    ko:{ firstmenu:'대표 메뉴', opentimefood:'영업시간', restdatefood:'휴무일',
         reservationfood:'예약', treatmenu:'취급 메뉴' },
    en:{ firstmenu:'Signature', opentimefood:'Hours', restdatefood:'Closed',
         reservationfood:'Reservation', treatmenu:'Menu' },
    ja:{ firstmenu:'代表メニュー', opentimefood:'営業時間', restdatefood:'休業日',
         reservationfood:'予約', treatmenu:'取扱メニュー' },
    zh:{ firstmenu:'招牌菜', opentimefood:'营业时间', restdatefood:'休息日',
         reservationfood:'预约', treatmenu:'经营菜品' },
    fr:{ firstmenu:'Plat signature', opentimefood:'Horaires', restdatefood:'Jour de fermeture',
         reservationfood:'Réservation', treatmenu:'Menu proposé' }
  };

  function openDetail(p) {
    currentDetailPlace = p;
    showDetailTab('info');
    document.getElementById('dpTitle').textContent = p.title ?? '-';
    document.getElementById('dpName').textContent = p.title ?? '-';
    document.getElementById('dpSub').textContent = p.addr ?? '';
    const hero = document.getElementById('dpHero');
    hero.classList.toggle('no-image', !p.image);
    hero.style.backgroundImage = p.image ? `url('${escapeHtml(p.image)}')` : '';
    document.getElementById('dpBadge').innerHTML = detailBadges(p);
    renderDpRating(p.userReviewCount ? Number(p.userRating) : Number(p.rating || 0),
                   p.userReviewCount || Number(p.user_ratings_total || 0));
    document.getElementById('dpInfoRow').innerHTML = '';   // 주소는 이름 밑에 있으므로 정보 탭엔 운영정보만
    document.getElementById('dpDesc').textContent = T.loading;
    document.getElementById('dpDesc').classList.remove('collapsed');
    document.getElementById('dpDescToggle').hidden = true;
    const reservationButton = document.getElementById('btnReservation');
    reservationButton.hidden = true;
    reservationButton.dataset.tel = '';
    updateSaveButton(p);
    renderVisitorReviews(p);
    loadCommunityPosts(p);
    document.getElementById('detailPanel').classList.add('open');
    loadDetail(p);
  }

  function showDetailTab(name) {
    ['info','reviews','community'].forEach(tab => {
      document.getElementById('tab-' + tab).hidden = tab !== name;
      document.querySelector(`.dp-tab[data-tab="${tab}"]`)?.classList.toggle('active', tab === name);
    });
  }

  let rvRating = 0;
  let rvFormOpen = false;
  let rvFormPlace = null;

  // 상세 헤더 별점(방문자 리뷰 평균).
  function renderDpRating(score, count) {
    const el = document.getElementById('dpRating');
    if (!el) return;
    el.innerHTML = (score > 0 && count > 0)
      ? `<span class="dp-rating-stars">★</span>
         <span class="dp-rating-score">${score.toFixed(1)}</span>
         <span class="dp-rating-count">${count.toLocaleString()}${T.reviewsSuffix}</span>`
      : `<span style="color:#bbb;font-size:11px">${T.noRating}</span>`;
  }

  async function renderVisitorReviews(p) {
    const root = document.getElementById('dpReviews');
    root.innerHTML = `<div class="section-card empty-state">${T.rvLoading}</div>`;
    let reviews = [];
    try {
      const res = await fetch(`/tour/api/reviews/${encodeURIComponent(p.id)}`);
      if (res.ok) reviews = await res.json();
    } catch (e) {}
    if (currentDetailPlace !== p) return;

    if (rvFormPlace !== p) { rvFormOpen = false; rvFormPlace = p; }

    const mine = reviews.find(r => r.mine);
    const editing = rvFormOpen && !!mine;
    rvRating = editing ? mine.rating : 0;

    const fmtDate = s => (s || '').slice(0, 10).replace(/-/g, '.');
    const initial = n => (n || T.visitor || '?').trim().charAt(0).toUpperCase() || '?';
    const avg = reviews.length ? reviews.reduce((s, r) => s + r.rating, 0) / reviews.length : 0;

    const form = (LOGGED_IN && rvFormOpen) ? `
      <div class="rv-form" data-content="${escapeHtml(String(p.id))}" data-type="${escapeHtml(p.type ?? '39')}">
        <div class="rv-stars" id="rvStars">${[1,2,3,4,5].map(n =>
          `<span data-n="${n}" class="${n <= rvRating ? 'on' : ''}">★</span>`).join('')}</div>
        <textarea id="rvText" rows="3" placeholder="${escapeHtml(T.rvPlaceholder)}">${editing ? escapeHtml(mine.text || '') : ''}</textarea>
        <button type="button" class="rv-submit" onclick="submitReview()">${editing ? T.rvEdit : T.rvWrite}</button>
        <div class="rv-actions"><button type="button" onclick="closeReviewForm()">${T.rvCancel}</button></div>
      </div>` : '';

    const writeBtn = (LOGGED_IN && !mine && !rvFormOpen)
      ? `<button type="button" class="rv-open" onclick="openReviewForm()">✏️ ${T.rvWrite}</button>` : '';

    const others = reviews.filter(r => !r.mine);
    const shown = editing ? others : (mine ? [mine, ...others] : others);   // 내 리뷰는 항상 맨 위
    const list = shown.length ? shown.map(r => `<article class="review-card">
        <div class="rv-avatar">${escapeHtml(initial(r.authorName))}</div>
        <div>
          <div class="review-head">
            <span class="review-author">${escapeHtml(r.authorName || T.visitor)}</span>
            <span class="review-date">${escapeHtml(fmtDate(r.createdAt))}</span>
            ${r.edited ? `<span class="review-edited">${T.rvEdited}</span>` : ''}
            ${r.mine ? `<span class="rv-actions">
              <button type="button" onclick="openReviewForm()">${T.rvEdit}</button>
              <button type="button" onclick="deleteReview(${r.id})">${T.rvDelete}</button>
            </span>` : ''}
          </div>
          <div class="review-star">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
          <p class="review-text">${escapeHtml(r.text || '')}</p>
        </div>
      </article>`).join('')
      : (reviews.length ? '' : `<div class="empty-state" style="padding:24px 16px"><strong>${T.reviewsEmptyTitle}</strong>${T.reviewsEmptyBody}</div>`);

    const titleMeta = reviews.length
      ? `<span class="rv-avg">★ ${avg.toFixed(1)}</span> <span class="rv-cnt">(${reviews.length})</span>`
      : `<span class="rv-cnt">(0)</span>`;
    root.innerHTML = `<div class="section-card rv-wrap"><div class="rv-head"><div class="section-title">${T.reviewsTitle} ${titleMeta}</div>${writeBtn}</div>${form}${list}</div>`;

    renderDpRating(avg, reviews.length);

    const tabBtn = document.querySelector('.dp-tab[data-tab="reviews"]');
    if (tabBtn) {
      tabBtn.dataset.baseLabel = tabBtn.dataset.baseLabel || tabBtn.textContent.trim();
      tabBtn.textContent = tabBtn.dataset.baseLabel + (reviews.length ? ` (${reviews.length})` : '');
    }

    const starBox = document.getElementById('rvStars');
    if (starBox) {
      const paint = v => starBox.querySelectorAll('span').forEach(s => s.classList.toggle('on', +s.dataset.n <= v));
      starBox.querySelectorAll('span').forEach(s => {
        s.addEventListener('mouseenter', () => paint(+s.dataset.n));
        s.addEventListener('click', () => { rvRating = +s.dataset.n; paint(rvRating); });
      });
      starBox.addEventListener('mouseleave', () => paint(rvRating));
    }
  }

  function openReviewForm() {
    rvFormOpen = true;
    if (currentDetailPlace) renderVisitorReviews(currentDetailPlace);
  }

  function closeReviewForm() {
    rvFormOpen = false;
    if (currentDetailPlace) renderVisitorReviews(currentDetailPlace);
  }

  async function submitReview() {
    const box = document.querySelector('.rv-form');
    if (!box) return;
    if (!rvRating) { alert(T.rvPickRating); return; }
    try {
      await csrfFetch('/tour/api/reviews', 'POST', {
        contentId: box.dataset.content, contentTypeId: box.dataset.type,
        rating: rvRating, text: document.getElementById('rvText').value
      });
      rvFormOpen = false;
      if (currentDetailPlace) renderVisitorReviews(currentDetailPlace);
    } catch (e) { alert(T.rvSaveFail); }
  }

  async function deleteReview(id) {
    if (!confirm(T.rvDeleteConfirm)) return;
    try {
      await csrfFetch(`/tour/api/reviews/${id}`, 'DELETE');
      rvFormOpen = false;
      if (currentDetailPlace) renderVisitorReviews(currentDetailPlace);
    } catch (e) {}
  }

  async function loadCommunityPosts(p) {
    const root = document.getElementById('dpCommunity');
    const writeUrl = `/community/post/write?placeContentId=${encodeURIComponent(p.id || '')}`
      + `&placeContentTypeId=${encodeURIComponent(p.type || '')}&placeTitle=${encodeURIComponent(p.title || '')}`;
    root.innerHTML = `<div class="section-card empty-state">${T.communityLoading}</div>`;
    try {
      const res = await fetch(`/tour/api/community/${encodeURIComponent(p.id)}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const posts = await res.json();
      if (currentDetailPlace !== p) return;
      if (!posts.length) {
        root.innerHTML = `<div class="section-card empty-state"><span style="font-size:25px">💬</span>
          <strong>${T.communityEmptyTitle}</strong>
          ${T.communityEmptyBody}<br>
          <a class="outline-btn" href="${writeUrl}">${T.communityWrite}</a></div>`;
        return;
      }
      root.innerHTML = `<div class="section-card"><div class="section-title">${T.communityTitle} <small>${posts.length}</small></div>`
        + posts.map(post => `<a class="community-card" href="/community/post/${post.postId}">
            <div class="community-meta"><span>${escapeHtml(post.authorName || '')}</span><span>${T.views} ${Number(post.viewCount || 0).toLocaleString()} · ${T.comments} ${Number(post.commentCount || 0).toLocaleString()}</span></div>
            <div class="community-title">${escapeHtml((isEn && post.titleEn) || post.title || '')}</div>
            <p class="community-preview">${escapeHtml((isEn && post.contentEnPreview) || post.contentPreview || '')}</p>
          </a>`).join('') + `<a class="outline-btn" href="${writeUrl}">${T.communityWriteThis}</a></div>`;
    } catch (e) {
      root.innerHTML = `<div class="section-card empty-state">${T.communityLoadFail}</div>`;
      console.error('community posts error', e);
    }
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
    currentDetailPlace = null;
    activePinId = null;
    refreshMarkerImages(null);
    render();
  }

  async function loadDetail(p) {
    const desc = document.getElementById('dpDesc');
    try {
      const res = await fetch(`/tour/api/detail/${encodeURIComponent(p.id)}`
        + `?contentTypeId=${encodeURIComponent(p.type)}&lang=${encodeURIComponent(LANG_KEY)}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      if (currentDetailPlace !== p) return;            // 그 사이 다른 곳을 눌렀으면 버린다
      const labels = DETAIL_LABELS[LANG_KEY] || DETAIL_LABELS.en;
      const reservationText = stripTags(d.details?.reservationfood || '');
      const rows = Object.entries(d.details || {})
        .map(([k, v]) => `<div class="dp-info"><div class="dp-info-label">${labels[k] ?? k}</div>
             <div class="dp-info-val">${escapeHtml(stripTags(v))}</div></div>`).join('');
      const tel = d.tel ? `<p style="margin-top:10px"><b>${T.tel}:</b> ${escapeHtml(d.tel)}</p>` : '';
      desc.innerHTML = `<p style="line-height:1.75;white-space:pre-line">${escapeHtml(stripTags(d.overview) || T.none)}</p>` + tel;
      // 영업시간·휴무일 등을 별도 제목 없이 주소 바로 밑에 이어 붙인다.
      if (rows) document.getElementById('dpInfoRow').insertAdjacentHTML('beforeend', rows);
      if (reservationText) {
        const phone = reservationText.match(/0\d{1,2}-\d{3,4}-\d{4}/)?.[0] || '';
        const reservationButton = document.getElementById('btnReservation');
        reservationButton.hidden = false;
        reservationButton.dataset.tel = phone;
        reservationButton.querySelector('.qb-label').textContent = T.reservationLabel;
      }
      if (d.image) {
        const hero = document.getElementById('dpHero');
        hero.style.backgroundImage = `url('${d.image}')`;
        hero.classList.remove('no-image');
      }
      setupDpDescToggle();
    } catch (e) {
      desc.textContent = T.failed;
      console.error('detail error', e);
    }
  }

  // 장소 소개가 길면 접어 두고 '더보기'로 펼친다. 짧으면 버튼 자체를 숨긴다.
  const DP_DESC_COLLAPSE_PX = 96;
  function setupDpDescToggle() {
    const desc = document.getElementById('dpDesc');
    const toggle = document.getElementById('dpDescToggle');
    if (!desc || !toggle) return;
    desc.classList.remove('collapsed');
    const isLong = desc.scrollHeight > DP_DESC_COLLAPSE_PX + 4;
    toggle.hidden = !isLong;
    toggle.classList.remove('open');
    if (isLong) {
      desc.classList.add('collapsed');
      document.getElementById('dpDescToggleLabel').textContent = T.showMore;
    }
  }

  function toggleDpDesc() {
    const desc = document.getElementById('dpDesc');
    const toggle = document.getElementById('dpDescToggle');
    const collapsed = desc.classList.toggle('collapsed');
    toggle.classList.toggle('open', !collapsed);
    document.getElementById('dpDescToggleLabel').textContent = collapsed ? T.showMore : T.showLess;
  }

  function stripTags(v) {
    if (!v) return '';
    const holder = document.createElement('div');
    holder.innerHTML = String(v);
    return (holder.textContent || '').trim();
  }


  document.getElementById('btnRoute').onclick = function () {
    const p = currentDetailPlace;
    if (!p) return;
    const end = encodeURIComponent(p.title ?? '');
    const base = isEn ? '/en/transport/search' : '/ko/transport/search';
    location.href = `${base}?end=${end}`;
  };

  document.getElementById('btnNearTour').onclick = function () {
    const p = currentDetailPlace;
    if (!p || !p.lat || !p.lng) return;
    const q = new URLSearchParams({ lang: LANG_KEY, lat: p.lat, lon: p.lng, near: p.title ?? '' });
    location.href = '/tour/all?' + q.toString();
  };


  document.getElementById('btnReservation').onclick = function () {
    const tel = this.dataset.tel;
    if (tel) location.href = `tel:${tel}`;
    else showDetailTab('info');
  };

  // ── 저장(찜) ── 로그인 시 서버(saved_place), 아니면 안내만.
  let savedIds = new Set();
  async function csrfFetch(url, method, jsonBody) {
    const token  = document.querySelector('meta[name="_csrf"]')?.content ?? '';
    const header = document.querySelector('meta[name="_csrf_header"]')?.content ?? 'X-CSRF-TOKEN';
    const opts = { method, headers: { [header]: token } };
    if (jsonBody !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(jsonBody);
    }
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res;
  }
  async function loadSavedIds() {
    if (!LOGGED_IN) return;
    try {
      const res = await fetch('/tour/api/saved-places/ids');
      savedIds = new Set((await res.json()).map(String));
    } catch (e) { savedIds = new Set(); }
  }
  function updateSaveButton(p) {
    const btn = document.getElementById('btnSave');
    const on = p && p.id != null && savedIds.has(String(p.id));
    btn.classList.toggle('saved', on);
    btn.textContent = on ? '♥' : '♡';
  }
  async function toggleSave(p) {
    if (!p || p.id == null) return;
    if (!LOGGED_IN) { alert(T.saveAlert); return; }
    const key = String(p.id);
    const wasOn = savedIds.has(key);
    if (wasOn) savedIds.delete(key); else savedIds.add(key);
    updateSaveButton(p);
    try {
      if (wasOn) {
        await csrfFetch(`/tour/api/saved-places/${encodeURIComponent(key)}`, 'DELETE');
      } else {
        await csrfFetch('/tour/api/saved-places', 'POST',
          { contentId: key, contentTypeId: p.type ?? '39', kind: CAFE_ONLY ? 'cafe' : 'food' });
      }
    } catch (e) {
      if (wasOn) savedIds.add(key); else savedIds.delete(key);
      updateSaveButton(p);
    }
  }
  document.getElementById('btnSave').onclick = () => toggleSave(currentDetailPlace);

  /** 목록 카드의 하트. 상세를 열지 않고 저장만 토글한다. */
  async function cardSaveClick(event, btn) {
    event.stopPropagation();
    const id = String(btn.dataset.id || '');
    if (!id) return;
    const p = (window._currentList || PLACES).find(x => String(x.id) === id)
      || { id, type: btn.dataset.type || '39' };
    await toggleSave(p);
    const on = savedIds.has(id);
    btn.classList.toggle('saved', on);
    btn.textContent = on ? '♥' : '♡';
  }

  document.getElementById('btnShare').onclick = async function () {
    const p = currentDetailPlace;
    if (!p) return;
    const shareData = { title:p.title || 'KoreaPoint', text:p.title || '', url:location.href };
    try {
      if (navigator.share) await navigator.share(shareData);
      else {
        await navigator.clipboard.writeText(location.href);
        alert(T.linkCopied);
      }
    } catch (e) {
      if (e?.name !== 'AbortError') console.error('share error', e);
    }
  };

  function initMap() {
    const container = document.getElementById('map');
    map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(centerLat, centerLon), level: 8
    });
    markerMap = [];
    PLACES.forEach(p => {
      if (!p.lat || !p.lng) return;
      const marker = new kakao.maps.Marker({
        map: map, position: new kakao.maps.LatLng(p.lat, p.lng),
        title: p.title ?? '', image: markerImage(p, false)
      });
      markerMap.push({ id: p.id, place: p, marker: marker });
      kakao.maps.event.addListener(marker, 'click', () => {
        const list = window._currentList || PLACES;
        const idx = list.findIndex(x => x.id === p.id);
        if (idx >= 0) selectPlace(idx);
      });
    });
    kakao.maps.event.addListener(map, 'zoom_changed', refreshMarkerImages);
    updateMarkerVisibility();
    focusInitialPlace();
    centerOnNearOrigin();
  }

  applyStaticLabels();
  render();
  loadSavedIds().then(() => {
    render();   // 서버에서 받은 저장 상태를 카드 하트에 반영
    if (currentDetailPlace) updateSaveButton(currentDetailPlace);
  });
  document.getElementById('filterRow').addEventListener('scroll', updateScrollBtns);
  updateScrollBtns();
  if (KAKAO_KEY) {
    const s = document.createElement('script');
    s.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&autoload=false`;
    s.onload = () => kakao.maps.load(initMap);
    document.head.appendChild(s);
  } else {
    // 지도 키가 없어도 홈에서 넘어온 상세는 열어 준다.
    focusInitialPlace();
  }
</script>
<script th:src="@{/js/common/header-menu.js}"></script>
</body>
</html>
