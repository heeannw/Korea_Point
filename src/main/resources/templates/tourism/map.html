<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${lang == 'en' ? 'en' : 'ko'}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${lang == 'en' ? 'Cafe Map — KoreaPoint' : '카페 추천 지도 — KoreaPoint'}">카페 추천 지도 — KoreaPoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <!-- ✅ CSS 분리: 테마 변수(cafemap.css) → 공통 스타일(map-common.css) 순서로 로드 -->
  <link rel="stylesheet" th:href="@{/css/tourism/cafemap.css}">
  <link rel="stylesheet" th:href="@{/css/tourism/map-common.css}">
    <script defer th:src="@{/js/trip/trip-translate.js}"></script>
</head>
<body>

<header>
  <th:block th:if="${lang == 'en'}">
    <a class="logo" th:href="@{/}">Korea<span>Point</span></a>
  </th:block>
  <th:block th:unless="${lang == 'en'}">
    <a class="logo" th:href="@{/ko}">Korea<span>Point</span></a>
  </th:block>
  <div class="header-right">
    <!-- KO 버튼: ko일 때 active(클릭 불가), en일 때 클릭하면 ko로 전환 -->
    <th:block th:if="${lang == 'en'}">
      <button class="h-btn active">EN</button>
      <button class="h-btn"        onclick="switchLang('ko')">KR</button>
    </th:block>
    <th:block th:unless="${lang == 'en'}">
      <button class="h-btn"        onclick="switchLang('en')">EN</button>
      <button class="h-btn active">KR</button>
    </th:block>
        <th:block th:if="${isLoggedIn}">
            <span class="h-btn" th:text="${currentUserName}"></span>
            <a th:if="${isAdmin}" th:href="@{/admin}" class="h-btn">Admin</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="h-btn h-btn-fill">Logout</button>
            </form>
    </th:block>
    <th:block th:unless="${isLoggedIn}">
      <a th:href="@{/oauth2/authorization/google}" class="h-btn h-btn-fill">Login</a>
    </th:block>
  </div>
</header>

<div class="app-body">
  <div class="sidebar">

    <!-- 검색창 -->
    <div class="search-bar">
      <div class="search-wrap">
        <input type="text" id="searchInput"
               th:value="${keyword}"
               th:placeholder="${lang == 'en' ? 'Search cafe name...' : '카페 이름으로 검색...'}"
               autocomplete="off"
               onkeydown="handleSearchKey(event)"
               oninput="handleSearchInput()"
               onfocus="showDropdown()"
               onblur="scheduleHideDropdown()">
        <button class="si" type="button" onclick="goSearch()">🔍</button>
      </div>
      <div class="suggest-dropdown" id="suggestDropdown">
        <div id="suggestContent"></div>
      </div>
    </div>

    <!-- 카테고리 필터 -->
    <div class="filter-wrap">
      <button class="scroll-btn left" id="scrollLeft" onclick="scrollFilter(-1)" disabled>‹</button>
      <div class="filter-row" id="filterRow">
        <div class="chip active" data-cat="all"       onclick="setCategory('all')"      th:text="${lang == 'en' ? 'All' : '전체'}">전체</div>
        <div class="chip"       data-cat="highrating" onclick="setCategory('highrating')" th:text="${lang == 'en' ? '⭐ High Rating' : '⭐ 고평점'}">⭐ 고평점</div>
        <div class="chip"       data-cat="manyreviews" onclick="setCategory('manyreviews')" th:text="${lang == 'en' ? '💬 Many Reviews' : '💬 리뷰많음'}">💬 리뷰많음</div>
      </div>
      <button class="scroll-btn right" id="scrollRight" onclick="scrollFilter(1)">›</button>
    </div>

    <div class="sort-row">
      <div class="result-count">
        <strong id="countDisplay">0</strong>
        <span th:text="${lang == 'en' ? ' cafes' : ' 개 카페'}"> 개 카페</span>
      </div>
      <div class="sort-btns">
        <button class="sort-btn active" onclick="setSort('recommended')" th:text="${lang == 'en' ? '⭐ AI Pick' : '⭐ AI추천'}">⭐ AI추천</button>
        <button class="sort-btn"        onclick="setSort('distance')"    th:text="${lang == 'en' ? '📍 Distance' : '📍 거리순'}">📍 거리순</button>
      </div>
    </div>

    <div class="place-list" id="placeList"></div>
  </div>

  <div class="map-area" id="mapArea">
    <div id="kakaoMap"></div>

    <div class="map-controls" style="z-index:30">
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()-1)">＋</div>
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()+1)">－</div>
    </div>

    <button class="loc-btn" onclick="getLocation()"
            th:text="${lang == 'en' ? '📍 Near Me' : '📍 현재 위치로 추천'}">📍 현재 위치로 추천</button>

    <!-- ✅ BUG1 FIX: static .map-popup 제거 → CustomOverlay(showPopupOverlay)로 완전히 대체
         기존 static div의 onclick="openDetail(currentPopupName)"이 이름을 못 읽고,
         div 자체가 CustomOverlay 위를 덮어 클릭을 막는 이중 문제였음 -->

    <!-- 상세 패널 -->
    <div class="detail-panel" id="detailPanel">
      <div class="dp-header">
        <button class="dp-back" onclick="closeDetail()">←</button>
        <div class="dp-title" id="dpTitle"></div>
      </div>
      <div class="dp-img" id="dpImg">☕</div>
      <div class="dp-body">
        <div class="dp-badge-row" id="dpBadges"></div>
        <div class="dp-name"      id="dpName"></div>
        <div class="dp-sub"       id="dpSub"></div>
        <div class="dp-stars"     id="dpStars"></div>
        <div class="dp-info-row"  id="dpInfoRow"></div>
        <div class="dp-section-title" th:text="${lang == 'en' ? 'Reviews' : '리뷰'}">리뷰</div>
        <div class="rev-summary"  id="dpRevSummary"></div>
        <div id="dpReviews"></div>
      </div>
      <div class="dp-action">
        <button class="dp-action-btn dp-btn-transport" onclick="openTransportMap()"
                th:text="${lang == 'en' ? '🚇 Directions' : '🚇 교통'}">🚇 교통</button>
        <button class="dp-action-btn dp-btn-tour" onclick="openTourMap()"
                th:text="${lang == 'en' ? '🗺️ Tourism' : '🗺️ 근처 관광지'}">🗺️ 근처 관광지</button>
        <button class="dp-action-btn" onclick="openFoodMap()"
                style="background:#f472b6;color:#fff;border:none"
                th:text="${lang == 'en' ? '🍽️ Nearby Food' : '🍽️ 근처 음식점'}">🍽️ 근처 음식점</button>
      </div>
    </div>
  </div>
</div>

<!-- Thymeleaf → JS 변수 주입 -->
<script th:inline="javascript">
  const userLat       = /*[[${userlat}]]*/ 37.5665;
  const userLon       = /*[[${userlon}]]*/ 126.9780;
  const PLACES        = /*[[${list}]]*/    [];
  const LANG          = /*[[${lang}]]*/    'ko';  // 'ko' 또는 'en'
  const CAFE_THUMB_LIST   = /*[[${cafeThumbList}]]*/   [];  // ✅ 카드용 썸네일 리스트 (10장)
  const CAFE_REGULAR_LIST = /*[[${cafeRegularList}]]*/ [];  // ✅ 상세패널용 고화질 리스트 (10장)
  // 인덱스 기반으로 이미지 선택 (% 로 순환)
  const getCafeThumb   = idx => CAFE_THUMB_LIST.length   ? CAFE_THUMB_LIST[idx   % CAFE_THUMB_LIST.length]   : '';
  const getCafeRegular = idx => CAFE_REGULAR_LIST.length ? CAFE_REGULAR_LIST[idx % CAFE_REGULAR_LIST.length] : getCafeThumb(idx);
  // ── 파파고 번역 캐시 & 함수 ────────────────────────────
  // localStorage 영구 캐시: 한 번 번역한 이름은 다음 방문 시 즉시 표시
  const _LS_KEY = 'tCache_cafe_en';
  const _tCache = LANG === 'en'
          ? (() => { try { return JSON.parse(localStorage.getItem(_LS_KEY) || '{}'); } catch { return {}; } })()
          : {};

  function _saveCache() {
    try { localStorage.setItem(_LS_KEY, JSON.stringify(_tCache)); } catch {}
  }

  // 단건 번역 (상세 패널 이름·리뷰 등 개별 텍스트용)
  async function tr(text) {
    if (!text || !text.trim() || LANG !== 'en') return text;
    if (_tCache[text] !== undefined) return _tCache[text];
    try {
      // ✅ 수정 코드 — CSRF 토큰 추가
      const csrfToken  = document.querySelector('meta[name="_csrf"]')?.content;
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          [_csrfHeader]: _csrfToken
        },


        body: JSON.stringify({ text, source: 'ko', target: 'en' })
      });
      const data = await res.json();
      _tCache[text] = data.translatedText || text;
      _saveCache();
    } catch { _tCache[text] = text; }
    return _tCache[text];
  }

  async function _trChunk(arr) {
    // 1. 유효한 텍스트만 먼저 필터링
    const valid = arr.filter(t => t && t.trim());
    if (!valid.length) return;

    try {
      // 2. CSRF 토큰 가져오기
      const csrfToken  = document.querySelector('meta[name="_csrf"]')?.content;
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          [csrfHeader]: csrfToken // 변수명 대괄호 확인
        },
        body: JSON.stringify({ text: valid.join('\n'), source: 'ko', target: 'en' })
      });

      const data = await res.json();
      const translated = (data.translatedText || '').split('\n');

      // 3. 번역 결과 매핑
      valid.forEach((t, i) => {
        _tCache[t] = translated[i]?.trim() || t;
      });
      _saveCache();
    } catch (e) {
      console.error("Translation error:", e);
      valid.forEach(t => { _tCache[t] = t; });
    }
  }

  // 가시 영역 N개만 번역 (스크롤/카테고리 전환 시 호출)
  async function trAll(arr) {
    if (!arr.length || LANG !== 'en') return arr;
    const uncached = [...new Set(arr.filter(t => t && t.trim() && _tCache[t] === undefined))];
    if (uncached.length) {
      const CHUNK = 10;
      for (let i = 0; i < uncached.length; i += CHUNK) {
        await _trChunk(uncached.slice(i, i + CHUNK));
      }
    }
    return arr.map(t => _tCache[t] || t);
  }

  async function trAll_reviews(arr) { return trAll(arr); }


  // 언어별 UI 텍스트 상수
  const T = {
    searchSuggestion : LANG === 'en' ? '🔍 Suggestions'    : '🔍 연관 검색어',
    recentKeywords   : LANG === 'en' ? '🕐 Recent'         : '🕐 최근 검색어',
    clearAll         : LANG === 'en' ? 'Clear all'          : '전체 삭제',
    searchPlaceholder: LANG === 'en' ? 'Type to search...'  : '검색어를 입력하세요',
    emptyState       : LANG === 'en' ? 'Press "Near Me" or search a cafe name'
            : '현재 위치 버튼을 누르거나<br>카페 이름을 검색해보세요',
    cafeBadge        : LANG === 'en' ? 'Cafe'               : '카페',
    popularBadge     : LANG === 'en' ? 'Popular'            : '인기',
    reviewLabel      : LANG === 'en' ? 'reviews'            : '개',
    labelAvgReview   : LANG === 'en' ? 'Avg. Review'        : '평균 리뷰 별점',
    labelDistance    : LANG === 'en' ? 'Distance'           : '거리',
    labelAiScore     : LANG === 'en' ? 'AI Score'           : 'AI 추천 점수',
    labelCoords      : LANG === 'en' ? 'Coordinates'        : '좌표',
    noReviews        : LANG === 'en' ? 'No reviews yet.'    : '등록된 리뷰가 없습니다.',
    detailsBtn       : LANG === 'en' ? 'Details →'          : '상세보기 →',
    distSuffix       : LANG === 'en' ? ''                   : ' 거리',
    reviewerLabel    : LANG === 'en' ? 'Reviewer'           : '리뷰어',
    aiLabel          : LANG === 'en' ? 'AI'                 : 'AI',
  };

  // URL prefix: 한국어는 /cafe/..., 영어는 /en/cafe/...
  const PREFIX      = LANG === 'en' ? '/en' : '';
  const TOUR_LANG   = LANG === 'en' ? 'EN'  : 'KR';
  const TRANSPORT_PREFIX = LANG === 'en' ? '/en' : '/ko';
</script>

<script>
  let activeCategory   = 'all';
  let activeSort       = 'recommended';
  let activePinId      = null;
  let currentPopupName = null;
  let map;
  let popupOverlay     = null;

  /* ── 최근 검색어 (localStorage) ── */
  const RECENT_KEY = LANG === 'en' ? 'cafe_en_recent_keywords' : 'cafe_recent_keywords';

  function getRecent() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
  }
  function saveRecent(kw) {
    if (!kw.trim()) return;
    let list = getRecent().filter(k => k !== kw);
    list.unshift(kw);
    if (list.length > 8) list = list.slice(0, 8);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
  }
  function deleteRecent(kw, e) {
    e.stopPropagation();
    const list = getRecent().filter(k => k !== kw);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    renderDropdown(document.getElementById('searchInput').value);
  }
  function clearAllRecent() {
    localStorage.removeItem(RECENT_KEY);
    renderDropdown('');
  }

  /* ── 자동완성 후보 ── */
  function getSuggestions(q) {
    if (!q) return [];
    const lower = q.toLowerCase();
    return PLACES
            .filter(p => (p.name ?? '').toLowerCase().includes(lower) || (p.googleName ?? '').toLowerCase().includes(lower))
            .slice(0, 6)
            .map(p => p.name);
  }

  /* ── 드롭다운 렌더 ── */
  function renderDropdown(q) {
    const box = document.getElementById('suggestContent');
    const suggestions = getSuggestions(q);
    const recent = getRecent();
    let html = '';

    if (suggestions.length > 0) {
      html += `<div class="suggest-section-title"><span>${T.searchSuggestion}</span></div>`;
      suggestions.forEach(s => {
        html += `<div class="suggest-item" onmousedown="doSearch('${escJS(s)}')">
          <div class="suggest-item-kw"><span class="icon">☕</span><span>${s}</span></div>
        </div>`;
      });
      if (recent.length > 0) html += `<hr class="suggest-divider">`;
    }

    if (recent.length > 0) {
      html += `<div class="suggest-section-title"><span>${T.recentKeywords}</span>
        <button type="button" onmousedown="clearAllRecent()">${T.clearAll}</button></div>`;
      recent.forEach(kw => {
        html += `<div class="suggest-item">
          <div class="suggest-item-kw" onmousedown="doSearch('${escJS(kw)}')">
            <span class="icon">🕐</span><span>${kw}</span>
          </div>
          <button class="suggest-del" onmousedown="deleteRecent('${escJS(kw)}', event)">✕</button>
        </div>`;
      });
    }

    if (!html) html = `<div class="suggest-empty">${T.searchPlaceholder}</div>`;
    box.innerHTML = html;
  }

  function showDropdown() {
    renderDropdown(document.getElementById('searchInput').value);
    document.getElementById('suggestDropdown').classList.add('show');
  }
  let hideDropdownTimer;
  function scheduleHideDropdown() {
    hideDropdownTimer = setTimeout(() => {
      document.getElementById('suggestDropdown').classList.remove('show');
    }, 200);
  }
  function handleSearchInput() {
    renderDropdown(document.getElementById('searchInput').value);
    document.getElementById('suggestDropdown').classList.add('show');
    render();
  }
  function handleSearchKey(e) {
    if (e.key === 'Enter') goSearch();
    if (e.key === 'Escape') document.getElementById('suggestDropdown').classList.remove('show');
  }
  function doSearch(kw) {
    document.getElementById('searchInput').value = kw;
    document.getElementById('suggestDropdown').classList.remove('show');
    saveRecent(kw);
    location.href = `${PREFIX}/cafe/search?keyword=${encodeURIComponent(kw)}`;
  }
  function goSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) { saveRecent(q); location.href = `${PREFIX}/cafe/search?keyword=${encodeURIComponent(q)}`; }
  }

  /* ── 필터 스크롤 버튼 ── */
  function scrollFilter(dir) {
    document.getElementById('filterRow').scrollLeft += dir * 120;
    setTimeout(updateScrollBtns, 150);
  }
  function updateScrollBtns() {
    const row = document.getElementById('filterRow');
    document.getElementById('scrollLeft').disabled  = row.scrollLeft <= 0;
    document.getElementById('scrollRight').disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 1;
  }
  document.getElementById('filterRow').addEventListener('scroll', updateScrollBtns);
  window.addEventListener('load', updateScrollBtns);

  /* ── 카테고리 / 정렬 ── */
  function setCategory(c) {
    activeCategory = c;
    document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('active', ch.dataset.cat === c));
    render();
  }
  function setSort(s) {
    activeSort = s;
    document.querySelectorAll('.sort-btn').forEach((b, i) =>
            b.classList.toggle('active', (s === 'recommended' && i === 0) || (s === 'distance' && i === 1))
    );
    render();
  }

  /* ── 필터 + 정렬 ── */
  function getFiltered() {
    let list = [...PLACES];
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    if (activeCategory === 'highrating')  list = list.filter(p => (p.avgStar ?? 0) >= 4.3);
    if (activeCategory === 'manyreviews') list = list.filter(p => (p.reviewCount ?? 0) >= 5);
    if (q) list = list.filter(p =>
            (p.name ?? '').toLowerCase().includes(q) || (p.googleName ?? '').toLowerCase().includes(q)
    );
    if (activeSort === 'recommended') list.sort((a,b) => (b.finalScore ?? 0) - (a.finalScore ?? 0));
    else                              list.sort((a,b) => (a.distance ?? 99) - (b.distance ?? 99));
    return list;
  }

  /* ── 유틸 ── */
  function distStr(d) {
    if (d == null || d === 0) return '-';
    return d < 1 ? (d * 1000).toFixed(0) + 'm' : d.toFixed(1) + 'km';
  }
  function encodeId(name) { return btoa(encodeURIComponent(name || '')).replace(/[^a-zA-Z0-9]/g, ''); }
  function escJS(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

  /* ── 렌더 ── */
  function render() {
    const list = getFiltered();
    document.getElementById('countDisplay').textContent = list.length;
    const el = document.getElementById('placeList');

    if (list.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="ei">☕</div>
        <p>${T.emptyState}</p></div>`;
      return;
    }

    // ✅ EN이면 이름 번역 (병렬)
    const renderList = () => {
      el.innerHTML = list.map((p, i) => `
        <div class="place-card${activePinId === p.name ? ' active' : ''}"
             id="card-${encodeId(p.name)}"
             onclick="selectPlace('${escJS(p.name)}')">
          <div class="thumb">
            <div class="rank">${i + 1}</div>
            ${getCafeThumb(i)
              ? `<img src="${getCafeThumb(i)}" alt="cafe"
                      style="width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;"
                      onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span style=\\'font-size:28px;display:flex;align-items:center;justify-content:center;width:100%;height:100%\\'>☕</span>')">`
              : '<span style="font-size:28px;display:flex;align-items:center;justify-content:center;width:100%;height:100%">☕</span>'}
          </div>
          <div class="card-info">
            <div class="card-cat">${T.cafeBadge} · ${T.aiLabel} ${((p.finalScore ?? 0) * 100).toFixed(0)}${LANG === 'en' ? 'pt' : '점'}</div>
            <div class="card-name">${LANG==='en' ? (p.nameEn || _tCache[p.name ?? ''] || p.name || '-') : (p.name || '-')}</div>
            <div class="card-meta">
              <span class="stars-s">★</span>${(p.avgStar ?? 0).toFixed(1)}
              (${LANG === 'en' ? (p.reviewCount ?? 0) + ' reviews' : '리뷰 ' + (p.reviewCount ?? 0) + '개'})
              <span class="card-dist">📍 ${distStr(p.distance)}</span>
            </div>
          </div>
        </div>`).join('');
    };

    // 즉시 렌더 (nameEn 있으면 파파고 없이 바로 영어 표시)
    renderList();

    // nameEn 없는 항목만 파파고로 보완
    if (LANG === 'en') {
      const needTranslate = list.slice(0, 10).filter(p => !p.nameEn && p.name && !_tCache[p.name]).map(p => p.name);
      if (needTranslate.length) {
        trAll(needTranslate).then(() => renderList());
      }
    }

    // 스크롤 시 새로 보이는 항목 번역
    el.onscroll = async () => {
      if (LANG !== 'en') return;
      const scrollTop = el.scrollTop;
      const itemH = 100;
      const viewH = el.clientHeight;
      const si = Math.max(0, Math.floor(scrollTop / itemH) - 2);
      const ei = Math.min(list.length - 1, Math.ceil((scrollTop + viewH) / itemH) + 2);
      const visibleNames = list.slice(si, ei + 1).map(p => p.name ?? '').filter(n => n && !_tCache[n]);
      if (visibleNames.length) {
        await trAll(visibleNames);
        renderList();
      }
    };
  }

  /* ── 선택 ── */
  function selectPlace(name) {
    closeDetail();
    activePinId = name;
    render();
    document.getElementById('card-' + encodeId(name))?.scrollIntoView({behavior:'smooth', block:'nearest'});
    const p = PLACES.find(x => x.name === name);
    if (p && p.lat && p.lng && map) map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
    showPopupOverlay(name);
  }

  /* ── 팝업 오버레이 ── */
  function showPopupOverlay(name) {
    if (popupOverlay) { popupOverlay.setMap(null); popupOverlay = null; }
    currentPopupName = name;
    const p = PLACES.find(x => x.name === name);
    if (!p || !p.lat || !p.lng || !map) return;

    const content = `
      <div style="background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);
                  width:240px;overflow:hidden;border:1px solid #e8d5c4;">
        <div style="height:90px;background:#fdf6f0;display:flex;align-items:center;
                    justify-content:center;font-size:36px;position:relative;overflow:hidden;">
          ${getCafeThumb(PLACES.indexOf(p))
            ? `<img src="${getCafeThumb(PLACES.indexOf(p))}" alt="cafe"
                    style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;"
                    onerror="this.style.display='none'">`
            : '☕'}
          <button onmousedown="closePopup()"
            style="position:absolute;top:6px;right:8px;background:rgba(0,0,0,.4);
                   color:#fff;border:none;border-radius:50%;width:22px;height:22px;
                   cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">×</button>
        </div>
        <div style="padding:12px;">
          <div style="font-size:14px;font-weight:700;margin-bottom:3px;">${LANG==='en' ? (p.nameEn || p.name || '-') : (p.name ?? '-')}</div>
          <div style="font-size:12px;color:#64748b;margin-bottom:8px;">
            ★ ${(p.avgStar ?? 0).toFixed(1)} · ${distStr(p.distance)} · ${T.aiLabel} ${((p.finalScore??0)*100).toFixed(0)}${LANG === 'en' ? 'pt' : '점'}
          </div>
          <a href="#" onmousedown="openDetail('${escJS(name)}');event.preventDefault()"
             style="display:block;width:100%;padding:8px;background:#6f4e37;color:#fff;
                    border-radius:8px;font-size:13px;font-weight:600;text-align:center;text-decoration:none;">
            ${T.detailsBtn}
          </a>
        </div>
      </div>`;

    popupOverlay = new kakao.maps.CustomOverlay({
      map: map,
      position: new kakao.maps.LatLng(p.lat, p.lng),
      content: content,
      yAnchor: 1.45,
      zIndex: 40
    });
  }

  function closePopup() {
    if (popupOverlay) { popupOverlay.setMap(null); popupOverlay = null; }
    currentPopupName = null;
    activePinId = null;
    render();
  }

  /* ── 상세 패널 ── */
  async function openDetail(name) {
    const p = PLACES.find(x => x.name === name);
    if (!p) return;
    if (popupOverlay) { popupOverlay.setMap(null); popupOverlay = null; }

    // ✅ nameEn이 있으면 파파고 호출 없이 즉시 사용
    const dispName = LANG === 'en' ? (p.nameEn || await tr(p.name ?? '')) : (p.name ?? '');
    const dispSub  = p.googleName ?? '';

    document.getElementById('dpTitle').textContent = dispName;
    document.getElementById('dpName').textContent  = dispName;
    document.getElementById('dpSub').textContent   = dispSub;

    document.getElementById('dpBadges').innerHTML =
            `<span class="dp-badge db-brown">${T.cafeBadge}</span>
       <span class="dp-badge db-gold">🏆 ${((p.finalScore??0)*100).toFixed(0)}${LANG === 'en' ? 'pt' : '점'}</span>
       ${(p.reviewCount??0) >= 10 ? `<span class="dp-badge db-green">${T.popularBadge}</span>` : ''}`;

    const stars = Math.round(p.avgStar ?? 0);
    document.getElementById('dpStars').innerHTML =
            `<span class="s">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span>
       <span class="sc">${(p.avgStar??0).toFixed(1)}</span>
       <span class="sm">/ 5.0 &nbsp;·&nbsp; ${LANG === 'en' ? (p.reviewCount??0) + ' reviews' : '리뷰 ' + (p.reviewCount??0) + '개'}</span>`;

    document.getElementById('dpInfoRow').innerHTML = `
      <div class="dp-info"><div class="dp-info-label">${T.labelAvgReview}</div>
        <div class="dp-info-val">★ ${(p.reviewMean??0).toFixed(1)} / 5.0</div></div>
      <div class="dp-info"><div class="dp-info-label">${T.labelDistance}</div>
        <div class="dp-info-val">${distStr(p.distance)}${T.distSuffix}</div></div>
      <div class="dp-info"><div class="dp-info-label">${T.labelAiScore}</div>
        <div class="dp-info-val">🏆 ${((p.finalScore??0)*100).toFixed(1)} / 100</div></div>
      <div class="dp-info"><div class="dp-info-label">${T.labelCoords}</div>
        <div class="dp-info-val">${(p.lat??0).toFixed(4)}, ${(p.lng??0).toFixed(4)}</div></div>`;

    const reviews = p.reviews ?? [];
    const avg = (p.reviewMean ?? p.avgStar ?? 0).toFixed(1);
    document.getElementById('dpRevSummary').innerHTML = `
      <div><div class="rev-score">${avg}</div>
        <div style="color:var(--gold);font-size:14px;margin-top:4px">${'★'.repeat(Math.round(parseFloat(avg)))}</div>
      </div>
      <div class="rev-right"><div class="rev-bars">
        ${[5,4,3,2,1].map(s => {
      const cnt = reviews.filter(r => Math.round(r.rating ?? 0) === s).length;
      const pct = reviews.length ? Math.round(cnt / reviews.length * 100) : 0;
      return `<div class="rev-row"><span>${s}</span>
            <div class="rev-track"><div class="rev-fill" style="width:${pct}%"></div></div>
            <span>${pct}%</span></div>`;
    }).join('')}
      </div></div>`;

    // ✅ EN이면 리뷰 번역
    if (reviews.length > 0 && LANG === 'en') {
      const tContents = await trAll(reviews.slice(0, 5).map(r => r.content ?? ''));
      document.getElementById('dpReviews').innerHTML = reviews.slice(0, 5).map((r, i) => `
        <div class="review-item">
          <div class="ri-top"><div><div class="ri-name">${T.reviewerLabel}</div></div>
            <div class="ri-stars">${'★'.repeat(Math.round(r.rating ?? 0))}</div></div>
          <div class="ri-text">${tContents[i] || r.content || ''}</div>
        </div>`).join('');
    } else {
      document.getElementById('dpReviews').innerHTML = reviews.length > 0
              ? reviews.slice(0, 5).map(r => `
          <div class="review-item">
            <div class="ri-top"><div><div class="ri-name">${T.reviewerLabel}</div></div>
              <div class="ri-stars">${'★'.repeat(Math.round(r.rating ?? 0))}</div></div>
            <div class="ri-text">${r.content ?? ''}</div>
          </div>`).join('')
              : `<p style="color:var(--gray);font-size:13px;padding:12px 0">${T.noReviews}</p>`;
    }

    window._detailPlace = p;
    // ✅ Unsplash 고화질 이미지 → 상세 패널 (regular 사이즈, 화질 개선)
    const _placeIdx   = PLACES.indexOf(p);
    const _regularUrl = getCafeRegular(_placeIdx >= 0 ? _placeIdx : 0);
    const dpImgEl = document.getElementById('dpImg');
    if (_regularUrl) {
      dpImgEl.innerHTML = `<img src="${_regularUrl}" alt="cafe"
        style="width:100%;height:100%;object-fit:cover;object-position:center;display:block;"
        onerror="this.outerHTML='<span style=\\\'font-size:56px;display:flex;align-items:center;justify-content:center;width:100%;height:100%\\\'>&#x2615;</span>'">` ;
    } else {
      dpImgEl.textContent = '☕';
    }
    document.getElementById('detailPanel').classList.add('open');
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
    window._detailPlace = null;
  }

  /* ── 버튼 액션 ── */
  function openTransportMap() {
    const p = window._detailPlace;
    if (!p) return;
    const endTitle  = encodeURIComponent(p.name);
    // ✅ BUG3 FIX: 이름만 넘기면 카카오 지오코딩이 동명 장소로 오작동
    //   → 음식점/카페의 실제 좌표(endLat, endLng)도 함께 전달
    const endCoords = `&endLat=${p.lat}&endLng=${p.lng}`;
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${pos.coords.latitude}&startLng=${pos.coords.longitude}&end=${endTitle}${endCoords}`,
              ()   => location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${userLat}&startLng=${userLon}&end=${endTitle}${endCoords}`
      );
    } else {
      location.href = `${TRANSPORT_PREFIX}/transport/search?startLat=${userLat}&startLng=${userLon}&end=${endTitle}${endCoords}`;
    }
  }

  function openTourMap() {
    const p = window._detailPlace;
    if (!p) return;
    location.href = `/tour/mylocation/${p.lat}/${p.lng}?lang=${TOUR_LANG}`;
  }

  function openFoodMap() {
    const p = window._detailPlace;
    if (!p) return;
    location.href = `${PREFIX}/foodmap/mylocation/${p.lat}/${p.lng}`;
  }

  /* ── 현위치 ── */
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${PREFIX}/cafe/mylocation/${pos.coords.latitude}/${pos.coords.longitude}`,
              ()  => location.href = `${PREFIX}/cafe/mylocation/37.5665/126.9780`
      );
    } else {
      location.href = `${PREFIX}/cafe/mylocation/37.5665/126.9780`;
    }
  }

  /* ── 언어 전환 ── */
  function switchLang(toLang) {
    // ✅ 언어 설정 localStorage에 저장 → 다른 페이지 갔다와도 유지
    localStorage.setItem('site_lang', toLang);
    const path = location.pathname;
    if (toLang === 'en') {
      location.href = path.replace('/cafe/', '/en/cafe/');
    } else {
      location.href = path.replace('/en/cafe/', '/cafe/');
    }
  }

  // ✅ 페이지 진입 시 저장된 언어와 현재 언어가 다르면 자동 전환
  (function autoLang() {
    const saved = localStorage.getItem('site_lang');
    if (!saved) { localStorage.setItem('site_lang', LANG); return; }
    if (saved === 'en' && LANG !== 'en' && !location.pathname.startsWith('/en/')) {
      location.href = location.pathname.replace('/cafe/', '/en/cafe/');
    } else if (saved === 'ko' && LANG === 'en') {
      location.href = location.pathname.replace('/en/cafe/', '/cafe/');
    }
  })();

  document.getElementById('mapArea').addEventListener('click', function(e) {
    // ✅ BUG FIX: popupOverlay(CustomOverlay)가 열려있을 때 mapArea 클릭 무시
    if (popupOverlay) return;
    if (!e.target.closest('.detail-panel')) closePopup();
  });

  render();
  setTimeout(updateScrollBtns, 100);

  // ✅ ?continue 파라미터가 붙으면 제거 (무한 리다이렉트 방지)
  if (location.search.includes('continue')) {
    history.replaceState(null, '', location.pathname);
  }

  if (PLACES.length === 0 && !location.pathname.includes('/cafe/mylocation')) {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `${PREFIX}/cafe/mylocation/${pos.coords.latitude}/${pos.coords.longitude}`,
              ()  => location.href = `${PREFIX}/cafe/mylocation/37.5665/126.9780`
      );
    } else {
      location.href = `${PREFIX}/cafe/mylocation/37.5665/126.9780`;
    }
  }
</script>

<script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoKey}&autoload=false|"></script>
<script>
  kakao.maps.load(function () {
    map = new kakao.maps.Map(document.getElementById('kakaoMap'), {
      center: new kakao.maps.LatLng(userLat, userLon),
      level: 5
    });

    const myMarkerImg = new kakao.maps.MarkerImage(
            'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
            new kakao.maps.Size(30, 40)
    );
    new kakao.maps.Marker({
      map,
      position: new kakao.maps.LatLng(userLat, userLon),
      title: LANG === 'en' ? 'My Location' : '내 위치',
      image: myMarkerImg
    });

    PLACES.forEach(p => {
      if (!p.lat || !p.lng) return;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
        <ellipse cx="16" cy="38" rx="6" ry="2.5" fill="rgba(0,0,0,0.18)"/>
        <path d="M16 2 C8.268 2 2 8.268 2 16 C2 26 16 38 16 38 C16 38 30 26 30 16 C30 8.268 23.732 2 16 2Z"
              fill="#6f4e37" stroke="#4a3220" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="7" fill="white" opacity="0.9"/>
        <text x="16" y="20" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#4a3220">☕</text>
      </svg>`;
      const markerImage = new kakao.maps.MarkerImage(
              'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
              new kakao.maps.Size(32, 40)
      );
      const marker = new kakao.maps.Marker({ map, position: new kakao.maps.LatLng(p.lat, p.lng), title: p.name, image: markerImage });
      kakao.maps.event.addListener(marker, 'click', () => selectPlace(p.name));
    });
  });
</script>
</body>
</html>
