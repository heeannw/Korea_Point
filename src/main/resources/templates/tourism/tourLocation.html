<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Location Permission</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const lang = params.get("lang") || "ko";

  // ✅ 함수를 바깥으로 꺼냄
  function getLocationAndGo() {
    if (!navigator.geolocation) {
      alert("Location is not supported by this browser.");
      location.href = "/tour/all?lat=35.1796&lon=129.0756&lang=" + lang;
      return;
    }
    navigator.geolocation.getCurrentPosition(
            function (pos) {
              const lat = pos.coords.latitude;
              const lon = pos.coords.longitude;
              location.href = "/tour/all?lat=" + lat + "&lon=" + lon + "&lang=" + lang;
            },
            function () {
              location.href = "/tour/all?lat=35.1796&lon=129.0756&lang=" + lang;
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  }

  $(document).ready(function () {
    const alreadyAllowed = localStorage.getItem('locationAllowed') === 'true';

    if (alreadyAllowed) {
      getLocationAndGo();
      return;
    }

    const ok = confirm("Allow access to your location to find nearby attractions?");

    if (!ok) {
      location.href = "/tour/all?lat=35.1796&lon=129.0756&lang=" + lang;
      return;
    }

    localStorage.setItem('locationAllowed', 'false');
    getLocationAndGo();
  });
</script>
</body>
</html>
