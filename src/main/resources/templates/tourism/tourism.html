<!DOCTYPE html>
<html th:lang="${lang}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="#{tour.pageTitle}">Explore — KoreaPoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <!-- 상세 패널 공용 스타일 -->
  <link rel="stylesheet" th:href="@{/css/tourism/detail-panel.css}">
  <link rel="stylesheet" th:href="@{/css/common/header-menu.css}">
  <style>
    :root {
      --blue:#3b9eff; --blue-dk:#1a7de0; --blue-lt:#eff6ff;
      --dark:#0f172a; --mid:#334155; --gray:#64748b;
      --border:#dbeafe; --white:#fff; --light:#f0f7ff;
      --gold:#f59e0b; --green:#16a34a;
      --r:12px; --sh:0 2px 16px rgba(59,158,255,.10);
      --hdr-h:60px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--dark);display:flex;flex-direction:column}
    header{position:absolute;top:0;left:0;right:0;height:var(--hdr-h);display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 20px;background:var(--white);border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(16,24,40,.06);z-index:100}
    .app-body{flex:1;display:flex;overflow:hidden}
    .sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--white);padding-top:var(--hdr-h)}
    /* 헤더가 지도 위에 반투명으로 떠 있으므로 상세 패널·지도 컨트롤은 그만큼 내려서 안 가리게 */
    .detail-panel{top:var(--hdr-h);height:calc(100% - var(--hdr-h))}
    .search-bar{padding:14px 16px 0;flex-shrink:0;position:relative}
    .search-wrap{position:relative}
    .search-wrap input{width:100%;padding:10px 42px 10px 16px;border:1.5px solid var(--border);border-radius:50px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:var(--light);transition:border .2s;color:var(--dark)}
    .search-wrap input:focus{border-color:var(--blue);background:#fff}
    .search-wrap .si{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray);font-size:15px;cursor:pointer;padding:0;line-height:1}
    .suggest-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);z-index:301;display:none;max-height:220px;overflow-y:auto}
    .suggest-dropdown.show{display:block}
    .suggest-item{padding:9px 14px;cursor:pointer;font-size:13px;color:var(--dark);display:flex;align-items:center;gap:8px;transition:background .15s}
    .suggest-item:hover{background:var(--light)}
    .suggest-item .si-icon{color:var(--blue);font-size:12px}
    .suggest-item .si-cat{font-size:11px;color:var(--gray);margin-left:auto}
    .recent-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);z-index:300;display:none}
    .recent-dropdown.show{display:block}
    .recent-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;border-bottom:1px solid var(--border)}
    .recent-header span{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
    .recent-header button{background:none;border:none;font-size:11px;color:var(--blue);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600}
    .recent-item{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;transition:background .15s}
    .recent-item:hover{background:var(--light)}
    .recent-item-kw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dark);flex:1}
    .recent-item-kw span:first-child{color:var(--gray)}
    .recent-del{background:none;border:none;color:var(--gray);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
    .recent-del:hover{color:var(--dark)}
    .recent-empty{padding:14px;text-align:center;font-size:13px;color:var(--gray)}
    .filter-wrap{padding:10px 0 0;display:flex;align-items:center;gap:0;flex-shrink:0;position:relative}
    .scroll-btn{flex-shrink:0;width:28px;height:28px;border:1.5px solid var(--border);border-radius:50%;background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gray);transition:all .2s;box-shadow:0 1px 6px rgba(0,0,0,.08);z-index:2}
    .scroll-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}
    .scroll-btn:disabled{opacity:0.3;cursor:default;pointer-events:none}
    .scroll-btn.left{margin-left:8px}
    .scroll-btn.right{margin-right:8px}
    .filter-row{flex:1;display:flex;gap:6px;overflow-x:auto;padding:0 6px;scrollbar-width:none;scroll-behavior:smooth}
    .filter-row::-webkit-scrollbar{display:none}
    .chip{padding:6px 14px;border-radius:50px;border:1.5px solid var(--border);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:'DM Sans',sans-serif;color:var(--gray);display:flex;align-items:center;gap:5px;}
    .chip:hover{border-color:var(--blue);color:var(--blue)}
    .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .chip[data-cat="All"].active{background:var(--blue);border-color:var(--blue);color:#fff}
    .chip[data-cat="attraction"]:hover,.chip[data-cat="attraction"].active{background:#ef4444;border-color:#ef4444;color:#fff}
    .chip[data-cat="culture"]:hover,.chip[data-cat="culture"].active{background:#f59e0b;border-color:#f59e0b;color:#fff}
    .chip[data-cat="festival"]:hover,.chip[data-cat="festival"].active{background:#ec4899;border-color:#ec4899;color:#fff}
    .chip[data-cat="leisure"]:hover,.chip[data-cat="leisure"].active{background:#22c55e;border-color:#22c55e;color:#fff}
    .chip[data-cat="shopping"]:hover,.chip[data-cat="shopping"].active{background:#3b9eff;border-color:#3b9eff;color:#fff}
    .sort-row{padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .near-note{margin:0 16px 8px;padding:8px 11px;border-radius:10px;background:var(--light);border:1px solid var(--border);font-size:12px;color:var(--mid);line-height:1.5;flex-shrink:0}
    .near-note[hidden]{display:none}
    .near-note b{color:var(--blue-dk)}
    .result-count{font-size:13px;color:var(--gray)}
    .result-count strong{color:var(--dark)}
    .sort-btns{display:flex;gap:4px;max-width:270px;overflow-x:auto;scrollbar-width:none}
    .sort-btns::-webkit-scrollbar{display:none}
    .sort-btn{padding:4px 12px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--gray);transition:all .2s}
    .sort-btn.active{background:var(--blue-lt);color:var(--blue);border-color:var(--blue)}
    .place-list{flex:1;overflow-y:auto;padding:0 12px 12px}
    .place-list::-webkit-scrollbar{width:4px}
    .place-list::-webkit-scrollbar-track{background:transparent}
    .place-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .place-card{position:relative;display:flex;gap:12px;padding:12px;border-radius:var(--r);cursor:pointer;transition:background .15s, box-shadow .15s;margin-bottom:4px;border:1.5px solid transparent;content-visibility:auto;contain-intrinsic-size:0 98px}
    .card-save{position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;border-radius:50%;background:rgba(255,255,255,.92);color:#cbd5e1;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.14);z-index:2;transition:color .15s,transform .1s}
    .card-save:hover{color:#ef4444;transform:scale(1.1)}
    .card-save.saved{color:#ef4444}
    .place-card:hover{background:var(--light)}
    .place-card.active{border:1.5px solid var(--blue);background:var(--blue-lt)}
    .place-card.active .card-name{color:var(--blue-dk);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--blue)}
    .place-card .thumb{width:72px;height:72px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0;position:relative;background-color:var(--light)}
    .place-card .rank{position:absolute;top:-6px;left:-6px;width:20px;height:20px;background:var(--blue);color:#fff;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .card-info{flex:1;min-width:0}
    .card-name{font-size:14px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:5px}
    .card-name .cn-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .fest-badge{flex-shrink:0;display:inline-block;padding:1px 7px;border-radius:50px;font-size:10px;font-weight:800;vertical-align:middle;letter-spacing:.2px}
    .fest-badge.ongoing{background:#dcfce7;color:#15803d}
    .fest-badge.upcoming{background:#fef3c7;color:#b45309}
    .fest-badge.ended{background:#f1f5f9;color:#94a3b8}
    .dp-name .fest-badge{font-size:12px;padding:2px 9px}
    .card-cat{font-size:11px;color:var(--blue);font-weight:600;margin-bottom:4px}
    .card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray)}
    .stars-s{color:var(--gold);font-size:11px}
    .card-dist{font-size:11px;color:var(--gray);background:var(--light);padding:2px 8px;border-radius:50px;white-space:nowrap}
    .map-area{flex:1;position:relative;background:#e8f0fe;overflow:hidden}
    .map-controls{position:absolute;top:calc(var(--hdr-h) + 12px);right:16px;display:flex;flex-direction:column;gap:4px;z-index:30}
    .mc{width:36px;height:36px;background:#fff;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;box-shadow:var(--sh);transition:background .2s}
    .mc:hover{background:var(--light)}
    .loc-btn{position:absolute;bottom:24px;right:16px;background:#fff;border:1px solid var(--border);border-radius:50px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--sh);color:var(--dark);font-family:'DM Sans',sans-serif;z-index:30;transition:all .2s}
    .loc-btn:hover{border-color:var(--blue);color:var(--blue)}
    /* 상세 패널(.detail-panel / .dp-* / .rev-* / .review-* / .ri-*) 스타일은
       /css/tourism/detail-panel.css 로 분리 */
  </style>
  <!-- 관광/음식/카페 화면은 TourAPI 다국어 응답 + messages_*.properties 를 쓰고
       Google 자동번역(trip-translate.js)은 싣지 않는다. 홈에서 넘어올 때 섞여 번역되는 것을 막는다. -->
</head>
<body>
<div th:replace="~{fragments/app-header :: header(${lang}, ${isLoggedIn}, ${currentUserName})}"></div>
<div class="app-body">
  <div class="sidebar">
    <div class="search-bar">
      <form action="/tour/search/" method="get" id="searchForm">
        <div class="search-wrap">
          <input type="text" th:placeholder="#{tour.search.placeholder}" placeholder="Search attractions in Busan..." name="keyword" id="searchInput"
                 th:value="${keyword}" autocomplete="off"
                 onfocus="onSearchFocus()" onblur="onSearchBlur()" oninput="onSearchInput(this.value)">
          <input name="lang" th:value="${lang}" value="ko" type="hidden">
          <button class="si" type="submit">🔍</button>
          <div class="suggest-dropdown" id="suggestDropdown"></div>
          <div class="recent-dropdown" id="recentDropdown">
            <div th:if="${recentKeywords != null and !#lists.isEmpty(recentKeywords)}">
              <div class="recent-header">
                <span th:text="#{tour.search.recent}">Recent</span>
                <button type="button" onmousedown="clearAllKeywords()" th:text="#{tour.search.clearAll}">Clear all</button>
              </div>
              <div th:each="kw : ${recentKeywords}">
                <div class="recent-item">
                  <div class="recent-item-kw" th:data-kw="${kw}" onclick="doSearch(this.dataset.kw)">
                    <span>🕐</span><span th:text="${kw}"></span>
                  </div>
                  <button class="recent-del" type="button"
                          th:data-kw="${kw}" onmousedown="deleteKeyword(this.dataset.kw, event)">✕</button>
                </div>
              </div>
            </div>
            <div class="recent-empty"
                 th:if="${recentKeywords == null or #lists.isEmpty(recentKeywords)}"
                 th:text="#{tour.search.noRecent}">
              No recent searches
            </div>
          </div>
        </div>
      </form>
    </div>

    <div class="filter-wrap">
      <button class="scroll-btn left" id="scrollLeft" onclick="scrollFilter(-1)" disabled>‹</button>
      <div class="filter-row" id="filterRow">
        <div class="chip active" data-cat="All" id="chipAll" onclick="setCategory('All')">🗺️ <span th:text="#{tour.cat.all}">All</span></div>
        <div class="chip" data-cat="attraction" onclick="setCategory('attraction')">📍 <span th:text="#{tour.cat.attraction}">Attractions</span></div>
        <div class="chip" data-cat="culture" onclick="setCategory('culture')">🏛️ <span th:text="#{tour.cat.culture}">Culture</span></div>
        <div class="chip" data-cat="leisure" onclick="setCategory('leisure')">🏄 <span th:text="#{tour.cat.leisure}">Leisure &amp; Activities</span></div>
        <div class="chip" data-cat="shopping" onclick="setCategory('shopping')">🛍️ <span th:text="#{tour.cat.shopping}">Shopping</span></div>
        <div class="chip" data-cat="festival" onclick="setCategory('festival')">🎉 <span th:text="#{tour.cat.festival}">Festivals &amp; Events</span></div>
      </div>
      <button class="scroll-btn right" id="scrollRight" onclick="scrollFilter(1)">›</button>
    </div>

    <div class="sort-row">
      <div class="result-count"><strong id="countDisplay">0</strong> <span th:text="#{tour.list.placesFound}">places found</span></div>
      <div class="sort-btns">
        <button class="sort-btn" id="sortPopular" onclick="setSort('popular')" hidden>🔥 <span th:text="#{tour.sort.popular}">Popular TOP 20</span></button>
        <button class="sort-btn" id="sortRating" onclick="setSort('rating')" hidden>★ <span th:text="#{tour.sort.rating}">Rating</span></button>
        <button class="sort-btn" id="sortReviews" onclick="setSort('reviews')" hidden>💬 <span th:text="#{tour.sort.reviews}">Reviews</span></button>
        <button class="sort-btn active" id="sortRecommended" onclick="setSort('recommended')">⭐ <span th:text="#{tour.sort.recommended}">Recommended</span></button>
        <button class="sort-btn" id="sortDistance" onclick="setSort('distance')">📍 <span th:text="#{tour.sort.distance}">Distance</span></button>
      </div>
    </div>

    <div class="near-note" id="nearNote" hidden></div>

    <div class="place-list" id="placeList"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;"></div>
  </div>

  <div class="map-area" id="mapArea">
    <div id="kakaoMap" style="position:absolute;inset:0;z-index:0;"></div>
    <button class="loc-btn" onclick="getLocation()">📍 <span th:text="#{tour.map.myLocation}">My Location</span></button>
    <div class="map-controls" style="z-index:30;">
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()-1)">＋</div>
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()+1)">－</div>
    </div>

    <div class="detail-panel" id="detailPanel">
      <div class="dp-header">
        <button class="dp-back" onclick="closeDetail()">←</button>
        <div class="dp-title" id="dpTitle"></div>
      </div>
      <div class="dp-hero no-image" id="dpHero">
        <button class="dp-hero-nav dp-hero-prev dp-hero-hidden" id="dpImgPrev" type="button" onclick="moveDetailImage(-1)" th:attr="aria-label=#{tour.detail.prevImage}" aria-label="Previous image">‹</button>
        <button class="dp-hero-nav dp-hero-next dp-hero-hidden" id="dpImgNext" type="button" onclick="moveDetailImage(1)" th:attr="aria-label=#{tour.detail.nextImage}" aria-label="Next image">›</button>
        <div class="dp-hero-count dp-hero-hidden" id="dpImgCount"></div>
      </div>
      <div class="dp-body">
        <section class="dp-summary">
          <button class="summary-save" id="btnSave" type="button" th:attr="aria-label=#{tour.detail.savePlace}" aria-label="Save place">♡</button>
          <div class="dp-badges" id="dpBadges"></div>
          <div class="dp-name" id="dpName"></div>
          <div class="dp-sub" id="dpSub"></div>
          <div class="dp-rating" id="dpRating"></div>
        </section>
        <div class="quick-actions">
          <button class="quick-btn" id="itineraryBtn2" type="button">
            <div class="qb-icon">🚊</div><span class="qb-label" th:text="#{tour.detail.directions}">Directions</span>
          </button>
          <button class="quick-btn" id="itineraryBtn" type="button">
            <div class="qb-icon">🍽️</div><span class="qb-label" th:text="#{tour.detail.nearbyFood}">Food</span>
          </button>
          <button class="quick-btn" id="itineraryBtn1" type="button">
            <div class="qb-icon">☕</div><span class="qb-label" th:text="#{tour.detail.nearbyCafe}">Cafés</span>
          </button>
          <button class="quick-btn" id="btnShare" type="button">
            <div class="qb-icon">🔗</div><span class="qb-label" th:text="#{tour.detail.share}">Share</span>
          </button>
        </div>
        <nav class="dp-tabs">
          <button class="dp-tab active" type="button" data-tab="info" onclick="showDetailTab('info')" th:text="#{tour.detail.tabInfo}">Info</button>
          <button class="dp-tab" type="button" data-tab="reviews" onclick="showDetailTab('reviews')" th:text="#{tour.detail.tabReviews}">Reviews</button>
          <button class="dp-tab" type="button" data-tab="community" onclick="showDetailTab('community')" th:text="#{tour.detail.tabCommunity}">Community</button>
        </nav>
        <section class="tab-panel" id="tab-info">
          <div class="dp-info-row" id="dpInfoRow"></div>
          <div class="section-card"><div class="section-title" th:text="#{tour.detail.about}">About</div><div class="dp-desc" id="dpDesc"></div></div>
          <div class="dp-course" id="dpCourse" hidden></div>
        </section>
        <section class="tab-panel" id="tab-reviews" hidden><div id="dpReviews"></div></section>
        <section class="tab-panel" id="tab-community" hidden><div id="dpCommunity"></div></section>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const userLat   = /*[[${userlat}]]*/ 35.1796;
  const userLon   = /*[[${userlon}]]*/ 129.0756;
  const PLACES    = /*[[${list}]]*/ [];
  const centerLat = /*[[${centerLat}]]*/ 35.1796;
  const centerLon = /*[[${centerLon}]]*/ 129.0756;
  const currentUserId = /*[[${currentUserId}]]*/ null;
  const NEAR_TITLE = /*[[${near}]]*/ null;
  let spotName = /*[[${spotname}]]*/ 'My Location';
  let lang = /*[[${lang}]]*/ 'ko';

  /** 화면 문자열은 messages_*.properties(tour.*)에서 온다. {0}은 JS에서 replace. */
  const I18N = {
    cat: {
      all:        /*[[#{tour.cat.all}]]*/ 'All',
      attraction: /*[[#{tour.cat.attraction}]]*/ 'Attraction',
      culture:    /*[[#{tour.cat.culture}]]*/ 'Cultural Facility',
      festival:   /*[[#{tour.cat.festival}]]*/ 'Festival & Event',
      course:     /*[[#{tour.cat.course}]]*/ 'Travel Course',
      leisure:    /*[[#{tour.cat.leisure}]]*/ 'Leisure & Activities',
      shopping:   /*[[#{tour.cat.shopping}]]*/ 'Shopping',
      other:      /*[[#{tour.cat.other}]]*/ 'Other'
    },
    chipPopular:  /*[[#{tour.chip.popular}]]*/ 'Popular',
    nearNote:     /*[[#{tour.list.nearNote}]]*/ 'Sorted by distance from <b>{0}</b>',
    festival: {
      ongoing: /*[[#{tour.festival.ongoing}]]*/ 'Ongoing',
      dday:    /*[[#{tour.festival.dday}]]*/ 'D-{0}',
      ended:   /*[[#{tour.festival.ended}]]*/ 'Ended'
    },
    detailLabels: {
      hours:          /*[[#{tour.dl.hours}]]*/ 'Hours',
      bizHours:       /*[[#{tour.dl.bizHours}]]*/ 'Hours',
      closed:         /*[[#{tour.dl.closed}]]*/ 'Closed',
      contact:        /*[[#{tour.dl.contact}]]*/ 'Contact',
      parking:        /*[[#{tour.dl.parking}]]*/ 'Parking',
      fee:            /*[[#{tour.dl.fee}]]*/ 'Admission',
      eventStart:     /*[[#{tour.dl.eventStart}]]*/ 'Starts',
      eventEnd:       /*[[#{tour.dl.eventEnd}]]*/ 'Ends',
      eventPlace:     /*[[#{tour.dl.eventPlace}]]*/ 'Venue',
      playtime:       /*[[#{tour.dl.playtime}]]*/ 'Schedule',
      festivalDuration: /*[[#{tour.dl.festivalDuration}]]*/ 'Duration',
      courseDistance: /*[[#{tour.dl.courseDistance}]]*/ 'Course distance',
      schedule:       /*[[#{tour.dl.schedule}]]*/ 'Itinerary',
      taketime:       /*[[#{tour.dl.taketime}]]*/ 'Duration',
      courseContact:  /*[[#{tour.dl.courseContact}]]*/ 'Contact',
      openperiod:     /*[[#{tour.dl.openperiod}]]*/ 'Operating period',
      reservation:    /*[[#{tour.dl.reservation}]]*/ 'Reservation',
      ageRange:       /*[[#{tour.dl.ageRange}]]*/ 'Age range',
      checkin:        /*[[#{tour.dl.checkin}]]*/ 'Check-in',
      checkout:       /*[[#{tour.dl.checkout}]]*/ 'Check-out',
      reservationUrl: /*[[#{tour.dl.reservationUrl}]]*/ 'Reservation',
      roomcount:      /*[[#{tour.dl.roomcount}]]*/ 'Rooms',
      saleitem:       /*[[#{tour.dl.saleitem}]]*/ 'Items',

<script th:inline="javascript">
  /** 부산 전역이 한 화면에 들어오는 축척. */
  const BUSAN_MAP_LEVEL = 8;
  /** 이 축척보다 넓게 보면 마커를 묶는다. 더 당기면 개별 핀으로 펼쳐진다. */
  const CLUSTER_MIN_LEVEL = 5;
  let clusterer = null;

  // ── 인기 관광지 강조 ────────────────────────────────
  // 전체 보기에서는 카테고리별 TOP 3만 띄운다. 부산은 관광지가 몰려 있어
  // 카테고리마다 5개씩 띄우면 초기 축척에서 핀이 서로 포개진다.
  const POPULAR_TOP_OVERVIEW = 3;
  // 카테고리를 고르거나 지도를 당기면 TOP 5까지 펼친다.
  const POPULAR_TOP_FOCUSED = 5;
  /** 이 축척보다 당겨 보면 전체 보기에서도 TOP 5까지 보여준다. */
  const POPULAR_EXPAND_LEVEL = 6;

  function popularLimit() {
    if (activeCategory !== 'All') return POPULAR_TOP_FOCUSED;
    if (map && map.getLevel() <= POPULAR_EXPAND_LEVEL) return POPULAR_TOP_FOCUSED;
    return POPULAR_TOP_OVERVIEW;
  }

  /** 지금 강조해야 할 인기 장소들. 인기 데이터가 없으면 빈 배열이라 아무것도 강조되지 않는다. */
  function popularPlaces() {
    const limit = popularLimit();
    return getFiltered().filter(p => p.popularRank != null && p.popularRank <= limit);
  }

  function hasPopularityData() {
    return PLACES.some(p => p.popularRank != null);
  }

  /**
   * 첫 칩은 인기 자리로 둔다.
   * 인기 데이터가 들어오기 전까지는 이 탭이 전체 목록을 보여주므로 라벨과 내용이 일치하지 않는다.
   */
  function applyAllChipLabel() {
    const chip = document.getElementById('chipAll');
    if (chip) chip.textContent = (hasPopularityData() ? '🔥 ' + I18N.chipPopular : '🗺️ ' + I18N.cat.all);
  }

  /**
   * 전체 보기는 인기 추천지만 띄우고 클러스터를 쓰지 않는다.
   * 다만 인기 데이터가 아직 없으면 지도가 통째로 비어버리므로 클러스터로 되돌린다.
   */
  function isPopularOnlyView() {
    return activeCategory === 'All' && hasPopularityData();
  }

  /** 목록에서 고른 항목은 인기가 아니어도 핀을 띄운다. 카드만 뜨고 핀이 없으면 위치를 알 수 없다. */
  function selectedPlaceTitle() {
    const list = window._currentList || PLACES;
    return (activePinId != null && list[activePinId]) ? list[activePinId].title : null;
  }
  let activeCategory = 'All';
  let activeSort = NEAR_TITLE ? 'distance' : 'recommended';   // 근처 조회로 넘어오면 거리순으로 시작
  let activePinId = null;
  let map;
  let markerMap = [];
  let selectedMarker = null;
  let detailImages = [];
  let detailImageIndex = 0;

  const CATEGORY_COLOR = {
    '12': '#ef4444', '14': '#f59e0b', '15': '#ec4899',
    '25': '#8b5cf6', '28': '#22c55e', '38': '#3b9eff',
  };
  const CATEGORY_EMOJI = {
    '12': '📍', '14': '🏛️', '15': '🎉',
    '25': '🗺️', '28': '🏄', '38': '🛍️',
  };
  // Tabler Icons(MIT): 해변·박물관·축제·경로·카약·쇼핑백을 관광 유형에 맞춰 사용한다.
  const CATEGORY_MARKER_ICONS = {
    '12':'<path d="M17.553 16.75a7.5 7.5 0 0 0-10.606 0M18 3.804A6 6 0 0 0 9.804 6l10.392 6A6 6 0 0 0 18 3.804"/><path d="M16.732 10C18.39 7.13 18.957 4.356 18 3.804c-.957-.552-3.075 1.326-4.732 4.196M15 9l-3 5.196M3 19.25A2.4 2.4 0 0 1 4 19a2.4 2.4 0 0 1 2 1 2.4 2.4 0 0 0 4 0 2.4 2.4 0 0 1 4 0 2.4 2.4 0 0 0 4 0 2.4 2.4 0 0 1 3-.75"/>',
    '14':'<path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/>',
    '15':'<path d="M4 5h2M5 4v2M11.5 4 11 6M18 5h2M19 4v2M15 9l-1 1M18 13l2-.5M18 19h2M19 18v2"/><path d="m14 16.518-6.518-6.518-4.39 9.58a1 1 0 0 0 1.329 1.329L14 16.519"/>',
    '25':'<path d="M3 19a2 2 0 1 0 4 0 2 2 0 0 0-4 0M19 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4M11 19h5.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H13"/>',
    '28':'<path d="M6.414 6.414a2 2 0 0 0 0-2.828L5 2.172 2.172 5l1.414 1.414a2 2 0 0 0 2.828 0M17.586 17.586a2 2 0 0 0 0 2.828L19 21.828 21.828 19l-1.414-1.414a2 2 0 0 0-2.828 0M6.5 6.5l11 11"/><path d="M22 2.5C12.017 5.101 4.373 10.452 2 22c9.983-2.601 17.627-7.952 20-19.5M6.5 12.5l5 5M12.5 6.5l5 5"/>',
    '38':'<path d="M6.331 8H17.67a2 2 0 0 1 1.977 2.304l-1.255 8.152A3 3 0 0 1 15.426 21H8.574a3 3 0 0 1-2.965-2.544l-1.255-8.152A2 2 0 0 1 6.331 8M9 11V6a3 3 0 0 1 6 0v5"/>'
  };



  function createMarkerImage(color, emoji) {
    const icon = CATEGORY_MARKER_ICONS[Object.keys(CATEGORY_COLOR).find(key => CATEGORY_COLOR[key] === color)]
      ?? CATEGORY_MARKER_ICONS['12'];
    const level = map?.getLevel?.() ?? 8;
    if (level >= 8) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">
        <circle cx="7" cy="7" r="5" fill="#3b9eff" stroke="white" stroke-width="2"/></svg>`;
      return new kakao.maps.MarkerImage(
              'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
              new kakao.maps.Size(14, 14),
              { offset: new kakao.maps.Point(7, 7) }
      );
    }
    {
      const size = level >= 6 ? 22 : 26;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 22 22">
        <circle cx="11" cy="11" r="10" fill="#3b9eff" stroke="white" stroke-width="2"/>
        <g transform="translate(3 3) scale(.667)" fill="none" stroke="white" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">${icon}</g></svg>`;
      return new kakao.maps.MarkerImage(
              'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
              new kakao.maps.Size(size, size),
              { offset: new kakao.maps.Point(size / 2, size / 2) }
      );
    }
  }

  /**
   * 인기 핀은 순위 숫자를 그대로 박는다. 홈의 순위와 눈으로 바로 이어지게 하기 위해서다.
   * 4위 이하는 숫자 대신 금색 테두리만 둘러 덜 강조한다.
   */
  function createPopularMarkerImage(color, rank) {
    const level = map?.getLevel?.() ?? 8;
    const size = level >= 8 ? 24 : (level >= 6 ? 28 : 30);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 28 28">
      <circle cx="14" cy="14" r="12" fill="#3b9eff" stroke="#f59e0b" stroke-width="3"/>
      <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="white"
            font-family="system-ui,-apple-system,sans-serif">${rank}</text></svg>`;
    return new kakao.maps.MarkerImage(
            'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
            new kakao.maps.Size(size, size),
            { offset: new kakao.maps.Point(size / 2, size / 2) }
    );
  }

  function createActiveMarkerImage(color, emoji) {
    const icon = CATEGORY_MARKER_ICONS[Object.keys(CATEGORY_COLOR).find(key => CATEGORY_COLOR[key] === color)]
      ?? CATEGORY_MARKER_ICONS['12'];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="52" viewBox="0 0 44 52">
      <defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".32"/>
      </filter></defs>
      <g filter="url(#shadow)">
        <rect x="2" y="2" width="40" height="40" rx="12" fill="#3b9eff" stroke="#0f6fcf" stroke-width="3"/>
        <path d="M17 40 L22 49 L27 40 Z" fill="#3b9eff" stroke="#0f6fcf" stroke-width="3" stroke-linejoin="round"/>
        <path d="M17 39 H27" stroke="#3b9eff" stroke-width="5"/>
      </g>
      <g transform="translate(10 10)" fill="none" stroke="white" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">${icon}</g></svg>`;
    return new kakao.maps.MarkerImage(
            'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
            new kakao.maps.Size(44, 52),
            { offset: new kakao.maps.Point(22, 52) }
    );
  }

  // ── 여행코스 전용 표시 ─────────────────────────────
  // 코스는 경로라 대표 좌표 하나로는 설명이 안 된다. 경유지를 번호 마커로 순서대로 찍는다.
  let courseMarkers = [];
  let currentDetailPlace = null;

  function isCourse(p) {
    return !!p && Array.isArray(p.coursePoints) && p.coursePoints.length > 0;
  }

  function createCourseMarkerImage(order) {
    const color = CATEGORY_COLOR['25'] ?? '#64748b';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48">
      <path d="M18 0 C8.1 0 0 8.1 0 18 C0 31.5 18 48 18 48 C18 48 36 31.5 36 18 C36 8.1 27.9 0 18 0Z" fill="${color}" stroke="white" stroke-width="2"/>
      <circle cx="18" cy="17" r="11" fill="white" opacity="0.95"/>
      <text x="18" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="system-ui,-apple-system,sans-serif">${order}</text>
    </svg>`;
    return new kakao.maps.MarkerImage(
            'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
            new kakao.maps.Size(36, 48),
            { offset: new kakao.maps.Point(18, 48) }
    );
  }

  function exitCourseMode() {
    if (courseMarkers.length === 0) return;
    courseMarkers.forEach(marker => marker.setMap(null));
    courseMarkers = [];
    updateMarkerVisibility();
  }

  function enterCourseMode(p) {
    exitCourseMode();
    if (!map || !isCourse(p)) return;

    // 경유지 번호가 묻히지 않도록 코스를 볼 때는 나머지를 모두 감춘다.
    // 인기 핀은 클러스터 밖에 직접 붙어 있어 clear()만으로는 안 사라진다.
    if (clusterer) clusterer.clear();
    markerMap.forEach(item => item.marker.setMap(null));

    const bounds = new kakao.maps.LatLngBounds();
    p.coursePoints.forEach(pt => {
      const position = new kakao.maps.LatLng(pt.lat, pt.lng);
      courseMarkers.push(new kakao.maps.Marker({
        map: map,
        position: position,
        title: `${pt.order}. ${pt.name ?? ''}`,
        image: createCourseMarkerImage(pt.order),
        zIndex: 3
      }));
      bounds.extend(position);
    });
    map.setBounds(bounds, 60, 60, 60, 60);
  }

  /**
   * 홈에서 인기 관광지를 눌러 넘어온 경우(?focus=contentId)
   * 지도 이동·핀 선택·미니 카드·상세 패널까지 한 번에 열어 준다.
   */
  function focusInitialPlace() {
    const focusId = new URLSearchParams(location.search).get('focus');
    if (!focusId) return;

    const list = window._currentList || PLACES;
    const idx = list.findIndex(p => String(p.id) === String(focusId));
    if (idx < 0) return;

    selectPlace(idx);
    const target = list[idx];
    if (map && target.lat && target.lng) {
      map.setLevel(Math.min(map.getLevel(), POPULAR_EXPAND_LEVEL));
      map.panTo(new kakao.maps.LatLng(target.lat, target.lng));
    }
    openDetail(target);
  }

  function scrollFilter(dir) {
    const row = document.getElementById('filterRow');
    row.scrollLeft += dir * 120;
    setTimeout(updateScrollBtns, 150);
  }
  function updateScrollBtns() {
    const row = document.getElementById('filterRow');
    document.getElementById('scrollLeft').disabled  = row.scrollLeft <= 0;
    document.getElementById('scrollRight').disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 1;
  }
  document.getElementById('filterRow').addEventListener('scroll', updateScrollBtns);
  window.addEventListener('load', updateScrollBtns);

  // 콘텐츠 유형 코드 ↔ 안정 슬러그(필터·칩 키). 화면 라벨은 I18N.cat에서 온다.
  const TYPE_SLUG = { '12':'attraction','14':'culture','15':'festival','25':'course','28':'leisure','38':'shopping' };
  function typeSlug(type) {
    return TYPE_SLUG[String(type)] ?? 'other';
  }
  function typeName(type) {
    return I18N.cat[typeSlug(type)] ?? I18N.cat.other;
  }
  // 카드에는 대분류(관광지) 대신 TourAPI 분류체계의 세부 타입명을 쓴다.
  // 카테고리 칩 필터는 그대로 콘텐츠 유형(typeName) 기준이다.
  function catLabel(p) {
    return p.typeName ?? typeName(p.type);
  }
  function distStr(d) {
    if (d == null) return '-';
    return d < 1 ? (d * 1000).toFixed(0) + 'm' : d.toFixed(1) + 'km';
  }

  /** 축제(type 15) 상태 뱃지: 시작 전이면 D-n, 기간 중이면 '진행중'. 그 외 null. */
  function festivalStatus(p) {
    if (String(p.type) !== '15' || !p.eventStartDate) return null;
    const toDate = s => {
      const t = String(s);
      return new Date(+t.slice(0, 4), +t.slice(4, 6) - 1, +t.slice(6, 8));
    };
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = toDate(p.eventStartDate);
    const end = p.eventEndDate ? toDate(p.eventEndDate) : start;
    if (today < start) {
      const days = Math.round((start - today) / 86400000);
      return { text: i18nFmt(I18N.festival.dday, days), cls: 'upcoming' };
    }
    if (today <= end) return { text: I18N.festival.ongoing, cls: 'ongoing' };
    return { text: I18N.festival.ended, cls: 'ended' };
  }
  function festBadgeHtml(p) {
    const s = festivalStatus(p);
    return s ? `<span class="fest-badge ${s.cls}">${s.text}</span>` : '';
  }
  /** 축제 정렬 키: 진행 중/오늘 시작이면 -1(최상단), 아니면 시작까지 남은 일수. 축제 아니면 Infinity. */
  function festivalDday(p) {
    if (String(p.type) !== '15' || !p.eventStartDate) return Infinity;
    const t = String(p.eventStartDate);
    const start = new Date(+t.slice(0, 4), +t.slice(4, 6) - 1, +t.slice(6, 8));
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((start - today) / 86400000);
    return days <= 0 ? -1 : days;
  }
  function getCatColor(type) {
    return CATEGORY_COLOR[String(type)] ?? '#64748b';
  }

  function highlightMarkerByTitle(title) {
    if (courseMarkers.length > 0) return; // 코스 모드에서는 일반 핀을 건드리지 않는다
    markerMap.forEach(item => {
      const color = CATEGORY_COLOR[String(item.type)] ?? '#64748b';
      const emoji = CATEGORY_EMOJI[String(item.type)] ?? '📍';
      item.marker.setImage(createMarkerImage(color, emoji));
      item.marker.setZIndex(1);
    });
    syncClusteredMarkers();
    const target = markerMap.find(item => item.title === title);
    if (target) {
      const color = CATEGORY_COLOR[String(target.type)] ?? '#64748b';
      const emoji = CATEGORY_EMOJI[String(target.type)] ?? '📍';
      target.marker.setImage(createActiveMarkerImage(color, emoji));
      target.marker.setZIndex(1000);
      selectedMarker = target.marker;
    }
  }

  function centerPlaceBesideTourDetail(p) {
    if (!map || !p?.lat || !p?.lng || isCourse(p)) return;
    const pos = new kakao.maps.LatLng(p.lat, p.lng);
    // 멀리 축소돼 있으면 위치가 보이도록 확대. 이미 가까우면 그대로 둔다.
    if (map.getLevel() > 5) map.setLevel(5, { anchor: pos });
    map.panTo(pos);
    // 음식점 화면과 같이 상세 패널이 왼쪽을 덮으므로 남은 지도 영역 가운데로 옮긴다.
    setTimeout(() => {
      const panelWidth = document.getElementById('detailPanel').getBoundingClientRect().width;
      map.panBy(-Math.round(panelWidth / 2), 0);
    }, 330);
  }

  function getMatchingPlaces() {
    let list = [...PLACES].filter(p => String(p.type) !== '25');   // 여행코스: 부산 1건뿐이라 목록에서 제외
    const q = document.getElementById('searchInput').value.toLowerCase();
    if (activeCategory !== 'All') {
      list = list.filter(p => typeSlug(p.type) === activeCategory);
    }
    if (q) {
      list = list.filter(p =>
              p.title?.toLowerCase().includes(q) ||
              p.addr?.toLowerCase().includes(q)
      );
    }
    return list;
  }

  function reviewCount(p) {
    return Math.max(p.user_ratings_total ?? 0, Array.isArray(p.reviews) ? p.reviews.length : 0);
  }

  function updateSortAvailability() {
    const matching = getMatchingPlaces();
    const availability = {
      popular: matching.filter(p => p.popularRank != null).length >= 5,
      rating: matching.filter(p => p.rating != null && reviewCount(p) >= 10).length >= 5,
      reviews: matching.filter(p => reviewCount(p) > 0).length >= 5
    };
    document.getElementById('sortPopular').hidden = !availability.popular;
    document.getElementById('sortRating').hidden = !availability.rating;
    document.getElementById('sortReviews').hidden = !availability.reviews;
    if (availability[activeSort] === false) activeSort = 'recommended';
    document.querySelectorAll('.sort-btn').forEach(button =>
      button.classList.toggle('active', button.id === {
        popular:'sortPopular', rating:'sortRating', reviews:'sortReviews',
        recommended:'sortRecommended', distance:'sortDistance'
      }[activeSort])
    );
  }

  function getFiltered() {
    let list = getMatchingPlaces();
    if (activeSort === 'recommended') {
      if (activeCategory === 'festival') {
        list.sort((a, b) => festivalDday(a) - festivalDday(b));   // 임박한 축제 먼저
      } else {
        list.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
      }
    } else if (activeSort === 'popular') {
      list = list.filter(p => p.popularRank != null)
        .sort((a, b) => activeCategory === 'All'
          ? (b.popularityScore ?? 0) - (a.popularityScore ?? 0)
          : a.popularRank - b.popularRank)
        .slice(0, 20);
    } else if (activeSort === 'rating') {
      list = list.filter(p => p.rating != null && reviewCount(p) >= 10)
        .sort((a, b) => (b.rating - a.rating) || (reviewCount(b) - reviewCount(a)));
    } else if (activeSort === 'reviews') {
      list = list.filter(p => reviewCount(p) > 0)
        .sort((a, b) => reviewCount(b) - reviewCount(a));
    } else {
      list.sort((a, b) => (a.distance ?? 999) - (b.distance ?? 999));
    }
    return list;
  }

  function setCategory(c) {
    exitCourseMode();
    activeCategory = c;
    if (c === 'festival') activeSort = 'recommended';   // 축제는 D-day 순으로
    document.querySelectorAll('.chip').forEach(ch =>
            ch.classList.toggle('active', ch.dataset.cat === c)
    );
    render();
  }

  function setSort(s) {
    activeSort = s;
    render();
  }

  /**
   * 클러스터러를 쓰면 마커 표시 여부가 setMap이 아니라 클러스터 소속으로 결정된다.
   * 현재 필터에 걸리는 마커만 다시 담아 준다.
   */
  function syncClusteredMarkers() {
    if (!clusterer) return;
    const visibleTitles = new Set(getFiltered().map(p => p.title));
    // 인기 핀은 클러스터에 넣지 않고 지도에 직접 띄운다. 묶여 버리면 순위 숫자가 묻힌다.
    const popularTitles = new Set(popularPlaces().map(p => p.title));

    const popularOnly = isPopularOnlyView();
    const chosen = selectedPlaceTitle();

    const clustered = [];
    markerMap.forEach(item => {
      const visible = visibleTitles.has(item.title);
      const popular = visible && popularTitles.has(item.title);
      const chosenPin = visible && item.title === chosen;
      const color = CATEGORY_COLOR[String(item.type)] ?? '#64748b';

      item.isPopular = popular;
      item.marker.setMap(popular || chosenPin ? map : null);

      if (chosenPin) {
        item.marker.setImage(createActiveMarkerImage(color, CATEGORY_EMOJI[String(item.type)] ?? '📍'));
        item.marker.setZIndex(1000);
      } else if (popular) {
        item.marker.setImage(createPopularMarkerImage(color, item.rank ?? 1));
        item.marker.setZIndex(5);
      } else if (visible && !popularOnly) {
        clustered.push(item.marker);
      }
    });

    clusterer.clear();
    clusterer.addMarkers(clustered);
  }

  function updateMarkerVisibility() {
    if (!markerMap || markerMap.length === 0) return;
    if (courseMarkers.length > 0) return; // 코스 모드에서는 일반 핀을 건드리지 않는다
    syncClusteredMarkers();
  }

  function render() {
    updateSortAvailability();
    const list = getFiltered();
    window._currentList = list;
    document.getElementById('countDisplay').textContent = list.length;
    if (activePinId != null && list[activePinId]) {
      requestAnimationFrame(() => highlightMarkerByTitle(list[activePinId].title));
    }
    updateMarkerVisibility();
    document.getElementById('placeList').innerHTML = list.map((p, i) => `
      <div class="place-card${activePinId == i ? ' active' : ''}" id="card-${i}" onclick="selectPlace(${i})">
        <button class="card-save${savedSet().has(String(p.id)) ? ' saved' : ''}" type="button"
                data-id="${p.id ?? ''}" data-type="${p.type ?? ''}" onclick="cardSaveClick(event, this)"
        >${savedSet().has(String(p.id)) ? '♥' : '♡'}</button>
        <div class="thumb" style="background-image:url('${p.image ?? ''}')">
          <div class="rank" style="background:${getCatColor(p.type)}">${i + 1}</div>
        </div>
        <div class="card-info">
          <div class="card-cat" style="color:${getCatColor(p.type)}">${catLabel(p)}</div>
          <div class="card-name"><span class="cn-text">${p.title ?? '-'}</span>${festBadgeHtml(p)}</div>
          <div class="card-meta">
            ${p.userReviewCount
              ? `<span><span class="stars-s">★</span>${p.userRating.toFixed(1)} (${p.userReviewCount})</span>`
              : `<span><span class="stars-s">★</span>${p.rating ?? '-'} (${p.user_ratings_total ? (p.user_ratings_total / 1000).toFixed(1) + 'k' : '-'})</span>`}
            <span class="card-dist">📍 ${distStr(p.distance)}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function selectPlace(idx) {
    const list = window._currentList || PLACES;
    const p = list[idx];
    if (!p) return;
    activePinId = Number(idx);
    if (isCourse(p)) {
      enterCourseMode(p);
    } else {
      exitCourseMode();
      highlightMarkerByTitle(p.title);
    }
    render();
    centerPlaceBesideTourDetail(p);
    setTimeout(() => {
      const card = document.getElementById('card-' + idx);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 60);
    openDetail(p);
  }

  function detailText(value) {
    if (!value) return '';
    const holder = document.createElement('div');
    holder.innerHTML = String(value);
    return holder.textContent?.trim() || '';
  }

  function setDetailImages(images) {
    detailImages = [...new Set((images || []).filter(Boolean))];
    detailImageIndex = 0;
    renderDetailImage();
  }

  function moveDetailImage(direction) {
    if (detailImages.length < 2) return;
    detailImageIndex = (detailImageIndex + direction + detailImages.length) % detailImages.length;
    renderDetailImage();
  }

  function renderDetailImage() {
    const hero = document.getElementById('dpHero');
    const hasImage = detailImages.length > 0;
    const current = hasImage ? detailImages[detailImageIndex] : '';
    hero.style.backgroundImage = current ? `url("${String(current).replace(/"/g, '%22')}")` : '';
    hero.classList.toggle('no-image', !hasImage);
    const multiple = detailImages.length > 1;
    document.getElementById('dpImgPrev').classList.toggle('dp-hero-hidden', !multiple);
    document.getElementById('dpImgNext').classList.toggle('dp-hero-hidden', !multiple);
    const counter = document.getElementById('dpImgCount');
    counter.classList.toggle('dp-hero-hidden', !multiple);
    counter.textContent = multiple ? `${detailImageIndex + 1} / ${detailImages.length}` : '';
  }

  function escapeDetail(value) {
    return detailText(value).replace(/[&<>"']/g, ch => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[ch]);
  }

  function detailDate(value) {
    const text = detailText(value);
    return /^\d{8}$/.test(text)
            ? `${text.slice(0,4)}.${text.slice(4,6)}.${text.slice(6,8)}` : text;
  }

  const DL = I18N.detailLabels;
  const DETAIL_LABELS = {
    usetime:DL.hours, restdate:DL.closed, infocenter:DL.contact, parking:DL.parking,
    usetimeculture:DL.hours, restdateculture:DL.closed, usefee:DL.fee, parkingculture:DL.parking,
    eventstartdate:DL.eventStart, eventenddate:DL.eventEnd, eventplace:DL.eventPlace, playtime:DL.playtime,
    usetimefestival:DL.fee, spendtimefestival:DL.festivalDuration,
    distance:DL.courseDistance, schedule:DL.schedule, taketime:DL.taketime, infocentertourcourse:DL.courseContact,
    openperiod:DL.openperiod, usetimeleports:DL.hours, restdateleports:DL.closed, reservation:DL.reservation,
    expagerangeleports:DL.ageRange, usefeeleports:DL.fee, checkintime:DL.checkin, checkouttime:DL.checkout,
    reservationurl:DL.reservationUrl, roomcount:DL.roomcount, parkinglodging:DL.parking, opentime:DL.bizHours,
    restdateshopping:DL.closed, saleitem:DL.saleitem, firstmenu:DL.firstmenu, opentimefood:DL.bizHours,
    restdatefood:DL.closed, reservationfood:DL.reservation, treatmenu:DL.treatmenu
  };

  // 코스는 경유지가 핵심 정보라 상세 패널 '정보' 탭에 순서대로 펼쳐준다.
  function renderCourseSection(p) {
    const box = document.getElementById('dpCourse');
    if (!isCourse(p)) { box.hidden = true; box.innerHTML = ''; return; }
    box.hidden = false;
    const color = getCatColor(p.type);
    box.innerHTML = `
      <div class="section-title">${i18nFmt(I18N.detail.waypoints, p.coursePoints.length)}</div>
      <div class="dp-course-list">
        ${p.coursePoints.map(pt => `
          <button type="button" class="dp-course-item" onclick="focusCoursePoint(${pt.order - 1})">
            <span class="dp-course-num" style="background:${color}">${pt.order}</span>
            <span class="dp-course-name">${escapeDetail(pt.name ?? '')}</span>
          </button>`).join('')}
      </div>`;
  }

  function focusCoursePoint(index) {
    const p = currentDetailPlace;
    if (!p || !isCourse(p) || !map) return;
    const pt = p.coursePoints[index];
    if (!pt) return;
    if (courseMarkers.length === 0) enterCourseMode(p);
    map.panTo(new kakao.maps.LatLng(pt.lat, pt.lng));
  }

  async function loadTourApiDetail(p) {
    const desc = document.getElementById('dpDesc');
    if (!p.id || !p.type) {
      desc.textContent = I18N.detail.noId;
      return;
    }
    desc.textContent = I18N.detail.loading;
    try {
      const response = await fetch(`/tour/api/detail/${encodeURIComponent(p.id)}?contentTypeId=${encodeURIComponent(p.type)}&lang=${encodeURIComponent(lang)}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const detail = await response.json();
      if (currentDetailPlace !== p) return;   // 그 사이 다른 곳을 눌렀으면 버린다
      const rows = Object.entries(detail.details || {}).map(([key, value]) => {
        const shown = key.includes('date') ? detailDate(value) : detailText(value);
        return `<div class="dp-info"><div class="dp-info-label">${escapeDetail(DETAIL_LABELS[key] || key)}</div><div class="dp-info-val">${escapeDetail(shown)}</div></div>`;
      }).join('');
      const overview = escapeDetail(detail.overview || I18N.detail.noOverview);
      const tel = detail.tel ? `<p style="margin-top:10px"><b>${escapeDetail(I18N.detail.tel)}:</b> ${escapeDetail(detail.tel)}</p>` : '';
      desc.innerHTML = `<p style="line-height:1.75;white-space:pre-line">${overview}</p>${tel}`;
      // 운영정보(영업시간·휴무일 등)를 별도 제목 없이 주소 바로 밑에 이어 붙인다.
      if (rows) document.getElementById('dpInfoRow').insertAdjacentHTML('beforeend', rows);
      setDetailImages(detail.images?.length ? detail.images : [detail.image || p.image]);
    } catch (error) {
      desc.textContent = I18N.detail.loadFail;
      console.error('TourAPI detail error', error);
    }
  }

  function showDetailTab(name) {
    ['info', 'reviews', 'community'].forEach(tab => {
      const panel = document.getElementById('tab-' + tab);
      if (panel) panel.hidden = tab !== name;
      document.querySelector(`.dp-tab[data-tab="${tab}"]`)?.classList.toggle('active', tab === name);
    });
  }

  // 관광지 리뷰(있으면)를 방문자 리뷰 카드로 보여준다.
  let rvRating = 0;        // 쓰기 폼에서 선택한 별점
  let rvFormOpen = false;  // 리뷰 작성/수정 폼이 열려 있는지
  let rvFormPlace = null;  // 폼이 열린 장소 (장소 바뀌면 닫음)

  // 상세 헤더 별점(방문자 리뷰 평균). count 0이면 "평점 없음".
  function renderDpRating(score, count) {
    const el = document.getElementById('dpRating');
    if (!el) return;
    el.innerHTML = (score > 0 && count > 0)
      ? `<span class="dp-rating-stars">★</span>
         <span class="dp-rating-score">${score.toFixed(1)}</span>
         <span class="dp-rating-count">${i18nFmt(I18N.detail.reviewsCount, count.toLocaleString())}</span>`
      : `<span style="color:#bbb;font-size:11px">${escapeDetail(I18N.detail.noRating)}</span>`;
  }

  async function renderReviews(p) {
    const root = document.getElementById('dpReviews');
    root.innerHTML = `<div class="section-card empty-state">${escapeDetail(I18N.reviews.loading)}</div>`;
    let reviews = [];
    try {
      const res = await fetch(`/tour/api/reviews/${encodeURIComponent(p.id)}`);
      if (res.ok) reviews = await res.json();
    } catch (e) { /* 빈 목록으로 진행 */ }
    if (currentDetailPlace !== p) return;

    if (rvFormPlace !== p) { rvFormOpen = false; rvFormPlace = p; }

    const mine = reviews.find(r => r.mine);
    const editing = rvFormOpen && !!mine;   // 내 리뷰 수정 중
    rvRating = editing ? mine.rating : 0;

    const fmtDate = s => (s || '').slice(0, 10).replace(/-/g, '.');
    const initial = n => (n || I18N.reviews.anonymous || '?').trim().charAt(0).toUpperCase() || '?';
    const avg = reviews.length ? reviews.reduce((s, r) => s + r.rating, 0) / reviews.length : 0;

    const form = (LOGGED_IN && rvFormOpen) ? `
      <div class="rv-form" data-content="${escapeDetail(String(p.id))}" data-type="${escapeDetail(p.type ?? '')}">
        <div class="rv-stars" id="rvStars">${[1,2,3,4,5].map(n =>
          `<span data-n="${n}" class="${n <= rvRating ? 'on' : ''}">★</span>`).join('')}</div>
        <textarea id="rvText" rows="3" placeholder="${escapeDetail(I18N.reviews.placeholder)}">${editing ? escapeDetail(mine.text || '') : ''}</textarea>
        <button type="button" class="rv-submit" onclick="submitReview()">${escapeDetail(editing ? I18N.reviews.edit : I18N.reviews.write)}</button>
        <div class="rv-actions"><button type="button" onclick="closeReviewForm()">${escapeDetail(I18N.reviews.cancel)}</button></div>
      </div>` : '';

    // 내 리뷰가 없고 폼도 닫혀 있으면 "리뷰 쓰기" 버튼만.
    const writeBtn = (LOGGED_IN && !mine && !rvFormOpen)
      ? `<button type="button" class="rv-open" onclick="openReviewForm()">✏️ ${escapeDetail(I18N.reviews.write)}</button>` : '';

    const others = reviews.filter(r => !r.mine);
    const shown = editing ? others : (mine ? [mine, ...others] : others);   // 내 리뷰는 항상 맨 위
    const list = shown.length ? shown.map(r => `<article class="review-card">
        <div class="rv-avatar">${escapeDetail(initial(r.authorName))}</div>
        <div>
          <div class="review-head">
            <span class="review-author">${escapeDetail(r.authorName || I18N.reviews.anonymous)}</span>
            <span class="review-date">${escapeDetail(fmtDate(r.createdAt))}</span>
            ${r.edited ? `<span class="review-edited">${escapeDetail(I18N.reviews.edited)}</span>` : ''}
            ${r.mine ? `<span class="rv-actions">
              <button type="button" onclick="openReviewForm()">${escapeDetail(I18N.reviews.edit)}</button>
              <button type="button" onclick="deleteReview(${r.id})">${escapeDetail(I18N.reviews.delete)}</button>
            </span>` : ''}
          </div>
          <div class="review-star">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
          <p class="review-text">${escapeDetail(r.text || '')}</p>
        </div>
      </article>`).join('')
      : (reviews.length ? '' : `<div class="empty-state" style="padding:24px 16px"><strong>${escapeDetail(I18N.reviews.emptyTitle)}</strong>${escapeDetail(I18N.reviews.emptyBody)}</div>`);

    const titleMeta = reviews.length
      ? `<span class="rv-avg">★ ${avg.toFixed(1)}</span> <span class="rv-cnt">(${reviews.length})</span>`
      : `<span class="rv-cnt">(0)</span>`;
    root.innerHTML = `<div class="section-card rv-wrap"><div class="rv-head"><div class="section-title">${escapeDetail(I18N.reviews.title)} ${titleMeta}</div>${writeBtn}</div>${form}${list}</div>`;

    renderDpRating(avg, reviews.length);   // 헤더 별점을 방문자 리뷰 평균으로 갱신

    const tabBtn = document.querySelector('.dp-tab[data-tab="reviews"]');
    if (tabBtn) {
      tabBtn.dataset.baseLabel = tabBtn.dataset.baseLabel || tabBtn.textContent.trim();
      tabBtn.textContent = tabBtn.dataset.baseLabel + (reviews.length ? ` (${reviews.length})` : '');
    }

    const starBox = document.getElementById('rvStars');
    if (starBox) {
      const paint = v => starBox.querySelectorAll('span').forEach(s => s.classList.toggle('on', +s.dataset.n <= v));
      starBox.querySelectorAll('span').forEach(s => {
        s.addEventListener('mouseenter', () => paint(+s.dataset.n));
        s.addEventListener('click', () => { rvRating = +s.dataset.n; paint(rvRating); });
      });
      starBox.addEventListener('mouseleave', () => paint(rvRating));
    }
  }

  function openReviewForm() {
    rvFormOpen = true;
    if (currentDetailPlace) renderReviews(currentDetailPlace);
  }

  function closeReviewForm() {
    rvFormOpen = false;
    if (currentDetailPlace) renderReviews(currentDetailPlace);
  }

  async function submitReview() {
    const box = document.querySelector('.rv-form');
    if (!box) return;
    if (!rvRating) { alert(I18N.reviews.pickRating); return; }
    try {
      await csrfFetch('/tour/api/reviews', 'POST', {
        contentId: box.dataset.content, contentTypeId: box.dataset.type,
        rating: rvRating, text: document.getElementById('rvText').value
      });
      rvFormOpen = false;
      if (currentDetailPlace) renderReviews(currentDetailPlace);
    } catch (e) { alert(I18N.reviews.saveFail); }
  }

  async function deleteReview(id) {
    if (!confirm(I18N.reviews.deleteConfirm)) return;
    try {
      await csrfFetch(`/tour/api/reviews/${id}`, 'DELETE');
      rvFormOpen = false;
      if (currentDetailPlace) renderReviews(currentDetailPlace);
    } catch (e) {}
  }

  // 이 장소를 태그한 커뮤니티 글을 불러온다.
  async function loadCommunityPosts(p) {
    const root = document.getElementById('dpCommunity');
    const writeUrl = `/community/post/write?placeContentId=${encodeURIComponent(p.id || '')}`
      + `&placeContentTypeId=${encodeURIComponent(p.type || '')}&placeTitle=${encodeURIComponent(p.title || '')}`;
    root.innerHTML = `<div class="section-card empty-state">${escapeDetail(I18N.community.loading)}</div>`;
    try {
      const res = await fetch(`/tour/api/community/${encodeURIComponent(p.id)}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const posts = await res.json();
      if (currentDetailPlace !== p) return;
      if (!posts.length) {
        root.innerHTML = `<div class="section-card empty-state"><span style="font-size:25px">💬</span>
          <strong>${escapeDetail(I18N.community.emptyTitle)}</strong>
          ${escapeDetail(I18N.community.emptyBody)}<br>
          <a class="outline-btn" href="${writeUrl}">${escapeDetail(I18N.community.write)}</a></div>`;
        return;
      }
      root.innerHTML = `<div class="section-card"><div class="section-title">${escapeDetail(I18N.community.title)} <small>${posts.length}</small></div>`
        + posts.map(post => `<a class="community-card" href="/community/post/${post.postId}">
            <div class="community-meta"><span>${escapeDetail(post.authorName || '')}</span><span>${escapeDetail(I18N.community.views)} ${Number(post.viewCount || 0).toLocaleString()} · ${escapeDetail(I18N.community.comments)} ${Number(post.commentCount || 0).toLocaleString()}</span></div>
            <div class="community-title">${escapeDetail(post.title || '')}</div>
            <p class="community-preview">${escapeDetail(post.contentPreview || '')}</p>
          </a>`).join('') + `<a class="outline-btn" href="${writeUrl}">${escapeDetail(I18N.community.writeThis)}</a></div>`;
    } catch (e) {
      root.innerHTML = `<div class="section-card empty-state">${escapeDetail(I18N.community.loadFail)}</div>`;
      console.error('community posts error', e);
    }
  }

  // 로그인 사용자는 서버(saved_place)에 저장한다. 비로그인은 기존처럼 localStorage.
  const LOGGED_IN = currentUserId != null;
  const SAVED_KEY = currentUserId ? `tourSavedPlaces:${currentUserId}` : 'tourSavedPlaces:guest';
  let savedIds = new Set();

  function localSavedIds() {
    try {
      const value = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]');
      return new Set((Array.isArray(value) ? value : [])
        .map(item => String(typeof item === 'object' && item ? item.id : item))
        .filter(id => id && id !== 'undefined'));
    } catch (e) { return new Set(); }
  }
  async function loadSavedIds() {
    if (!LOGGED_IN) { savedIds = localSavedIds(); return; }
    try {
      const res = await fetch('/tour/api/saved-places/ids');
      savedIds = new Set((await res.json()).map(String));
    } catch (e) { savedIds = new Set(); }
  }
  function savedSet() { return savedIds; }
  function updateSaveButton(p) {
    const btn = document.getElementById('btnSave');
    const on = p && p.id != null && savedIds.has(String(p.id));
    btn.classList.toggle('saved', on);
    btn.textContent = on ? '♥' : '♡';
  }
  async function toggleSave(p) {
    if (!p || p.id == null) return;
    const key = String(p.id);
    const wasOn = savedIds.has(key);
    if (wasOn) savedIds.delete(key); else savedIds.add(key);
    updateSaveButton(p);   // 낙관적 반영

    if (LOGGED_IN) {
      try {
        if (wasOn) {
          await csrfFetch(`/tour/api/saved-places/${encodeURIComponent(key)}`, 'DELETE');
        } else {
          await csrfFetch('/tour/api/saved-places', 'POST',
            { contentId: key, contentTypeId: p.type ?? '' });
        }
      } catch (e) {
        if (wasOn) savedIds.add(key); else savedIds.delete(key);  // 실패 시 롤백
        updateSaveButton(p);
      }
    } else {
      // 비로그인: 기존 항목의 이름·주소는 보존하고 이 장소만 넣고 뺀다.
      let stored = [];
      try { stored = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); } catch (e) {}
      stored = (Array.isArray(stored) ? stored : []).filter(it => String(it && it.id ? it.id : it) !== key);
      if (!wasOn) {
        stored.unshift({ id: key, title: p.title ?? I18N.untitled, addr: p.addr ?? '',
          contentTypeId: p.type ?? '', lat: p.lat ?? null, lng: p.lng ?? null });
      }
      try { localStorage.setItem(SAVED_KEY, JSON.stringify(stored)); } catch (e) {}
    }
  }

  /** 목록 카드의 하트. 상세를 열지 않고 저장만 토글한다. */
  async function cardSaveClick(event, btn) {
    event.stopPropagation();
    const id = String(btn.dataset.id || '');
    if (!id) return;
    const p = (window._currentList || PLACES).find(x => String(x.id) === id)
      || { id, type: btn.dataset.type || '' };
    await toggleSave(p);
    const on = savedIds.has(id);
    btn.classList.toggle('saved', on);
    btn.textContent = on ? '♥' : '♡';
  }

  function openDetail(p) {

    if (!p) return;
    currentDetailPlace = p;
    showDetailTab('info');
    const color = getCatColor(p.type);
    document.getElementById('dpTitle').textContent = p.title ?? '-';
    setDetailImages([p.image]);
    document.getElementById('dpName').innerHTML = escapeDetail(p.title ?? '-') + festBadgeHtml(p);
    document.getElementById('dpSub').textContent = p.addr ?? '';
    document.getElementById('dpBadges').innerHTML =
            `<span class="dp-badge" style="background:${color}22;color:${color}">${typeName(p.type)}</span>
       <span class="dp-badge db-gold">🏆 ${p.score?.toFixed(1) ?? '-'}${I18N.detail.scoreSuffix}</span>`;
    renderDpRating(p.userReviewCount ? Number(p.userRating) : Number(p.rating || 0),
                   p.userReviewCount || Number(p.user_ratings_total || 0));
    document.getElementById('dpInfoRow').innerHTML = '';   // 주소는 이름 밑에 있으므로 정보 탭엔 운영정보만
    document.getElementById('dpDesc').textContent = I18N.detail.preparing;
    renderReviews(p);
    loadCommunityPosts(p);
    updateSaveButton(p);

    // 이 관광지를 기준점으로 삼아 새 맛집 화면으로 넘긴다.
    function goTaste(path) {
      if (!(p.lat && p.lng)) return;
      const params = new URLSearchParams({
        lang: lang, lat: p.lat, lon: p.lng, near: p.title ?? ''
      });
      location.href = path + '?' + params.toString();
    }

    document.getElementById('itineraryBtn').onclick  = () => goTaste('/tour/food');
    document.getElementById('itineraryBtn1').onclick = () => goTaste('/tour/cafe');
    document.getElementById('btnSave').onclick = () => toggleSave(p);
    document.getElementById('btnShare').onclick = async function () {
      const shareData = { title: p.title || 'KoreaPoint', text: p.title || '', url: location.href };
      try {
        if (navigator.share) await navigator.share(shareData);
        else { await navigator.clipboard.writeText(location.href); alert(I18N.share.copied); }
      } catch (e) {
        if (e?.name !== 'AbortError') console.error('share error', e);
      }
    };

    // ✅ 중복 없이 한 번만 선언
    document.getElementById('itineraryBtn2').onclick = function() {
      if (!(p.lat && p.lng)) { alert(I18N.noCoords); return; }
      const endTitle = encodeURIComponent(p.title ?? '');
      navigator.geolocation.getCurrentPosition(
              function(pos) {
                const uLat = pos.coords.latitude;
                const uLon = pos.coords.longitude;
                location.href = `/${lang.toLowerCase()}/transport/search?startLat=${uLat}&startLng=${uLon}&end=${endTitle}`;
              },
              function() {
                const sLat = /*[[${userlat}]]*/ null;
                const sLon = /*[[${userlon}]]*/ null;
                if (sLat && sLon) {
                  location.href = `/${lang.toLowerCase()}/transport/search?startLat=${sLat}&startLng=${sLon}&end=${endTitle}`;
                } else {
                  location.href = `/${lang.toLowerCase()}/transport/search?end=${endTitle}`;
                }
              }
      );
    };

    renderCourseSection(p);
    document.getElementById('detailPanel').classList.add('open');
    centerPlaceBesideTourDetail(p);
    loadTourApiDetail(p);
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
    currentDetailPlace = null;
    activePinId = null;
    exitCourseMode();
    markerMap.forEach(item => {
      const color = CATEGORY_COLOR[String(item.type)] ?? '#64748b';
      const emoji = CATEGORY_EMOJI[String(item.type)] ?? '📍';
      item.marker.setImage(createMarkerImage(color, emoji));
      item.marker.setZIndex(1);
    });
    selectedMarker = null;
    render();
  }

  function getLocation() {
    const options = { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 };
    navigator.geolocation.getCurrentPosition(
            pos => { location.href = `/tour/mylocation/${pos.coords.latitude}/${pos.coords.longitude}?lang=${lang}`; },
            err => { location.href = `/tour/mylocation/35.1796/129.0756?lang=${lang}`; },
            options
    );
  }

  let hideTimer;


  function onSearchFocus() {
    const val = document.getElementById('searchInput').value;
    if (val.trim().length > 0) showSuggest(val);
    else showRecent();
  }
  function onSearchBlur() {
    hideTimer = setTimeout(() => {
      document.getElementById('suggestDropdown').classList.remove('show');
      document.getElementById('recentDropdown').classList.remove('show');
    }, 500);
  }
  let searchFilterTimer;
  function onSearchInput(val) {
    // 타이핑하는 동안 로드된 목록을 즉시 필터한다. Enter/버튼은 폼 submit → 서버 검색(미로드 결과·최근검색어 저장).
    clearTimeout(searchFilterTimer);
    searchFilterTimer = setTimeout(render, 150);
    if (val.trim().length === 0) {
      document.getElementById('suggestDropdown').classList.remove('show');
      showRecent();
      return;
    }
    document.getElementById('recentDropdown').classList.remove('show');
    showSuggest(val);
  }
  function showSuggest(val) {
    const q = val.toLowerCase();
    const matched = PLACES.filter(p =>
            p.title && p.title.toLowerCase().includes(q)
    ).slice(0, 8);
    const box = document.getElementById('suggestDropdown');
    if (matched.length === 0) { box.classList.remove('show'); return; }
    box.innerHTML = matched.map((p, i) => `
      <div class="suggest-item" data-idx="${i}">
        <span class="si-icon">🔍</span>
        <span>${highlight(p.title, q)}</span>
        <span class="si-cat">${typeName(p.type)}</span>
      </div>`).join('');
    const items = box.querySelectorAll('.suggest-item');
    matched.forEach((p, i) => {
      items[i].dataset.title = p.title;
      items[i].addEventListener('mousedown', function(e) {
        e.preventDefault();
        doSearch(this.dataset.title);
      });
    });
    box.classList.add('show');
  }
  function highlight(text, q) {
    const idx = text.toLowerCase().indexOf(q);
    if (idx < 0) return text;
    return text.slice(0, idx)
            + '<strong style="color:var(--blue)">' + text.slice(idx, idx + q.length) + '</strong>'
            + text.slice(idx + q.length);
  }
  function showRecent() {
    clearTimeout(hideTimer);
    document.getElementById('recentDropdown').classList.add('show');
  }
  function doSearch(kw) {
    document.getElementById('searchInput').value = kw;
    document.getElementById('searchForm').submit();
  }
  function csrfPost(url, body) {
    const token  = document.querySelector('meta[name="_csrf"]')?.content ?? '';
    const header = document.querySelector('meta[name="_csrf_header"]')?.content ?? 'X-CSRF-TOKEN';
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', [header]: token },
      body: body
    });
  }
  /** JSON 본문 + CSRF 헤더로 fetch. 2xx 아니면 throw. */
  async function csrfFetch(url, method, jsonBody) {
    const token  = document.querySelector('meta[name="_csrf"]')?.content ?? '';
    const header = document.querySelector('meta[name="_csrf_header"]')?.content ?? 'X-CSRF-TOKEN';
    const opts = { method, headers: { [header]: token } };
    if (jsonBody !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(jsonBody);
    }
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res;
  }
  function deleteKeyword(kw, event) {
    event.preventDefault();
    event.stopPropagation();
    clearTimeout(hideTimer);
    csrfPost('/tour/search/history/delete', 'keyword=' + encodeURIComponent(kw))
            .then(() => {
              const btn = event.target;
              const item = btn.closest('.recent-item');
              if (item) item.remove();
              const dropdown = document.getElementById('recentDropdown');
              if (dropdown.querySelectorAll('.recent-item').length === 0) {
                dropdown.innerHTML = '<div class="recent-empty">No recent searches</div>';
              }
            });
  }
  function clearAllKeywords() {
    clearTimeout(hideTimer);
    csrfPost('/tour/search/history/clear', '')
            .then(() => {
              const dropdown = document.getElementById('recentDropdown');
              dropdown.innerHTML = '<div class="recent-empty">No recent searches</div>';
            });
  }

  applyAllChipLabel();
  if (NEAR_TITLE) {
    const note = document.getElementById('nearNote');
    note.innerHTML = i18nFmt(I18N.nearNote, escapeDetail(NEAR_TITLE));
    note.hidden = false;
  }
  render();
  loadSavedIds().then(() => {
    render();   // 서버에서 받은 저장 상태를 카드 하트에 반영
    if (currentDetailPlace) updateSaveButton(currentDetailPlace);
  });
</script>

<script th:src="'//dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoKey} + '&autoload=false&libraries=clusterer'"></script>
<script>
  kakao.maps.load(function() {
    // 지도는 항상 부산을 보여준다. 현위치 값은 거리 계산에만 쓰고 지도에는 찍지 않는다.
    map = new kakao.maps.Map(document.getElementById('kakaoMap'), {
      center: new kakao.maps.LatLng(centerLat, centerLon),
      level: BUSAN_MAP_LEVEL
    });
    // 관광지가 600곳이 넘어 그대로 찍으면 지도가 핀으로 덮인다. 가까운 것끼리 묶어 보여준다.
    clusterer = new kakao.maps.MarkerClusterer({
      map: map,
      averageCenter: true,
      minLevel: CLUSTER_MIN_LEVEL,
      disableClickZoom: false,
      styles: [{
        width: '38px', height: '38px', background: 'rgba(59,158,255,.85)',
        border: '2.5px solid #1a7de0', borderRadius: '50%', color: '#fff',
        textAlign: 'center', lineHeight: '38px', fontSize: '12px', fontWeight: '700'
      }]
    });

    markerMap = [];
    PLACES.forEach(p => {
      if (!p.lat || !p.lng) return;
      const color = CATEGORY_COLOR[String(p.type)] ?? '#64748b';
      const emoji = CATEGORY_EMOJI[String(p.type)] ?? '📍';
      // map을 지정하지 않는다. 표시 여부는 클러스터러가 관리한다.
      const marker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(p.lat, p.lng),
        title: p.title ?? '',
        image: createMarkerImage(color, emoji),
        zIndex: 1
      });
      markerMap.push({ title: p.title, type: p.type, marker: marker, rank: p.popularRank ?? null });
      kakao.maps.event.addListener(marker, 'click', () => {
        const list = window._currentList || PLACES;
        let listIdx = list.findIndex(x => x.title === p.title);
        if (listIdx < 0) {
          highlightMarkerByTitle(p.title);
          openDetail(p);
          return;
        }
        selectPlace(listIdx);
      });
    });
    // setBounds로 마커 전체를 맞추면 현위치나 외곽 항목까지 끌려들어가 화면이 부산을 벗어난다.
    // 마커 등록 완료 후 현재 카테고리에 맞게 핀 표시
    updateMarkerVisibility();

    // 축척이 바뀌면 강조할 인기 개수(TOP 3 ↔ TOP 5)가 달라진다.
    kakao.maps.event.addListener(map, 'zoom_changed', () => {
      if (courseMarkers.length > 0) return;
      const activeTitle = (activePinId != null)
        ? ((window._currentList || PLACES)[activePinId] || {}).title : null;
      if (activeTitle) {
        highlightMarkerByTitle(activeTitle);   // 전체 리셋 후 활성 핀은 다시 강조
        return;
      }
      markerMap.forEach(item => {
        const color = CATEGORY_COLOR[String(item.type)] ?? '#64748b';
        const emoji = CATEGORY_EMOJI[String(item.type)] ?? '📍';
        item.marker.setImage(createMarkerImage(color, emoji));
      });
      syncClusteredMarkers();
    });

    focusInitialPlace();
  });
</script>

<script th:src="@{/js/common/header-menu.js}"></script>
