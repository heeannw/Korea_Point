<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>Explore — KoreaPoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:#3b9eff; --blue-dk:#1a7de0; --blue-lt:#eff6ff;
      --dark:#0f172a; --mid:#334155; --gray:#64748b;
      --border:#dbeafe; --white:#fff; --light:#f0f7ff;
      --gold:#f59e0b; --green:#16a34a;
      --r:12px; --sh:0 2px 16px rgba(59,158,255,.10);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--dark);display:flex;flex-direction:column}
    header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);background:var(--white);flex-shrink:0;z-index:100}
    .logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--blue-dk);text-decoration:none}
    .logo span{color:var(--dark)}
    .header-right{display:flex;gap:8px;align-items:center}
    .h-btn{padding:7px 16px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--dark);transition:all .2s}
    .h-btn:hover,.h-btn.active{border-color:var(--blue);color:var(--blue)}
    .h-btn-fill{background:var(--blue);color:#fff;border-color:var(--blue)}
    .h-btn-fill:hover{background:var(--blue-dk);color:#fff}
    .app-body{flex:1;display:flex;overflow:hidden}
    .sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--white)}
    .search-bar{padding:14px 16px 0;flex-shrink:0;position:relative}
    .search-wrap{position:relative}
    .search-wrap input{width:100%;padding:10px 42px 10px 16px;border:1.5px solid var(--border);border-radius:50px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:var(--light);transition:border .2s;color:var(--dark)}
    .search-wrap input:focus{border-color:var(--blue);background:#fff}
    .search-wrap .si{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray);font-size:15px;cursor:pointer;padding:0;line-height:1}
    /* 최근 검색어 */
    .recent-dropdown{position:absolute;top:calc(100% + 4px);left:16px;right:16px;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);z-index:300;display:none}
    .recent-dropdown.show{display:block}
    .recent-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;border-bottom:1px solid var(--border)}
    .recent-header span{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
    .recent-header button{background:none;border:none;font-size:11px;color:var(--blue);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600}
    .recent-item{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;transition:background .15s}
    .recent-item:hover{background:var(--light)}
    .recent-item-kw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dark);flex:1}
    .recent-item-kw span:first-child{color:var(--gray)}
    .recent-del{background:none;border:none;color:var(--gray);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
    .recent-del:hover{color:var(--dark)}
    .recent-empty{padding:14px;text-align:center;font-size:13px;color:var(--gray)}
    .filter-row{padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
    .filter-row::-webkit-scrollbar{display:none}
    .chip{padding:5px 14px;border-radius:50px;border:1.5px solid var(--border);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:'DM Sans',sans-serif;color:var(--gray)}
    .chip:hover{border-color:var(--blue);color:var(--blue)}
    .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .sort-row{padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .result-count{font-size:13px;color:var(--gray)}
    .result-count strong{color:var(--dark)}
    .sort-btns{display:flex;gap:4px}
    .sort-btn{padding:4px 12px;border-radius:50px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--gray);transition:all .2s}
    .sort-btn.active{background:var(--blue-lt);color:var(--blue);border-color:var(--blue)}
    .place-list{flex:1;overflow-y:auto;padding:0 12px 12px}
    .place-list::-webkit-scrollbar{width:4px}
    .place-list::-webkit-scrollbar-track{background:transparent}
    .place-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .place-card{display:flex;gap:12px;padding:12px;border-radius:var(--r);cursor:pointer;transition:background .15s, box-shadow .15s;margin-bottom:4px;border:1.5px solid transparent}
    .place-card:hover{background:var(--light)}
    .place-card.active{border:1.5px solid var(--blue);background:var(--blue-lt)}
    .place-card.active .card-name{color:var(--blue-dk);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--blue)}
    .place-card .thumb{width:72px;height:72px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0;position:relative;background-color:var(--light)}
    .place-card .rank{position:absolute;top:-6px;left:-6px;width:20px;height:20px;background:var(--blue);color:#fff;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .card-info{flex:1;min-width:0}
    .card-name{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-cat{font-size:11px;color:var(--blue);font-weight:600;margin-bottom:4px}
    .card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray)}
    .stars-s{color:var(--gold);font-size:11px}
    .card-dist{font-size:11px;color:var(--gray);background:var(--light);padding:2px 8px;border-radius:50px;white-space:nowrap}
    .map-area{flex:1;position:relative;background:#e8f0fe;overflow:hidden}
    .map-controls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:30}
    .mc{width:36px;height:36px;background:#fff;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;box-shadow:var(--sh);transition:background .2s}
    .mc:hover{background:var(--light)}
    .loc-btn{position:absolute;bottom:24px;right:16px;background:#fff;border:1px solid var(--border);border-radius:50px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--sh);color:var(--dark);font-family:'DM Sans',sans-serif;z-index:30;transition:all .2s}
    .loc-btn:hover{border-color:var(--blue);color:var(--blue)}
    .map-popup{position:absolute;z-index:40;background:#fff;border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.18);width:240px;display:none;overflow:hidden;animation:popIn .2s ease}
    .map-popup.show{display:block}
    @keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .popup-img{height:110px;background-size:cover;background-position:center;position:relative;background-color:var(--light)}
    .popup-close{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;line-height:1}
    .popup-body{padding:12px}
    .popup-name{font-size:14px;font-weight:700;margin-bottom:3px}
    .popup-meta{font-size:12px;color:var(--gray);margin-bottom:8px}
    .popup-btn{display:block;width:100%;padding:8px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s;text-align:center;text-decoration:none}
    .popup-btn:hover{background:var(--blue-dk)}
    .detail-panel{position:absolute;inset:0;background:#fff;z-index:50;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;pointer-events:none;}
    .detail-panel.open{transform:translateX(0);pointer-events:auto;}
    .dp-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:5}
    .dp-back{background:none;border:none;font-size:20px;cursor:pointer;color:var(--dark);padding:4px;line-height:1}
    .dp-title{font-size:16px;font-weight:700;flex:1}
    .dp-img{width:100%;height:180px;object-fit:cover;background-size:cover;background-position:center;background-color:var(--light)}
    .dp-body{padding:16px}
    .dp-badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .dp-badge{padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700}
    .db-blue{background:var(--blue-lt);color:var(--blue-dk)}
    .db-gold{background:#fef3c7;color:#92400e}
    .db-green{background:#f0fdf4;color:#166534}
    .dp-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;margin-bottom:2px}
    .dp-sub{font-size:14px;color:var(--gray);margin-bottom:12px}
    .dp-stars{display:flex;align-items:center;gap:6px;margin-bottom:14px}
    .dp-stars .s{color:var(--gold);font-size:16px}
    .dp-stars .sc{font-size:18px;font-weight:700}
    .dp-stars .sm{font-size:13px;color:var(--gray)}
    .dp-info-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .dp-info{background:var(--light);border-radius:10px;padding:12px 14px}
    .dp-info-label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
    .dp-info-val{font-size:13px;font-weight:500;line-height:1.4}
    .dp-desc{font-size:14px;color:var(--mid);line-height:1.7;margin-bottom:16px}
    .dp-section-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--dark)}
    .rev-summary{display:flex;align-items:center;gap:16px;background:var(--light);border-radius:10px;padding:14px 16px;margin-bottom:12px}
    .rev-score{font-size:42px;font-weight:900;font-family:'Playfair Display',serif;line-height:1}
    .rev-right{flex:1}
    .rev-bars{display:flex;flex-direction:column;gap:5px}
    .rev-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray)}
    .rev-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
    .rev-fill{height:100%;background:var(--gold);border-radius:3px}
    .review-item{padding:12px 0;border-bottom:1px solid var(--border)}
    .review-item:last-child{border-bottom:none}
    .ri-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
    .ri-name{font-size:13px;font-weight:600}
    .ri-date{font-size:11px;color:var(--gray)}
    .ri-stars{font-size:12px;color:var(--gold)}
    .ri-text{font-size:13px;color:var(--mid);line-height:1.6}
    .dp-action{position:sticky;bottom:0;padding:12px 16px;background:#fff;border-top:1px solid var(--border)}
    .dp-action-btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s}
    .dp-action-btn:hover{background:var(--blue-dk)}
  </style>
</head>
<body>

<header>
  <a class="logo" href="/tour/all">Korea<span>Point</span></a>
  <div class="header-right">
    <button class="h-btn active">EN</button>
    <button class="h-btn">KR</button>
    <button class="h-btn h-btn-fill">Login</button>
  </div>
</header>

<div class="app-body">
  <div class="sidebar">

    <!-- 검색창 + 최근 검색어 드롭다운 -->
    <div class="search-bar">
      <form action="/tour/search/" method="get" id="searchForm">
        <div class="search-wrap">
          <input type="text" placeholder="Search in Seoul..." name="keyword" id="searchInput"
                 th:value="${keyword}" autocomplete="off"
                 onfocus="showRecent()" onblur="hideRecent()">
          <button class="si" type="submit">🔍</button>
        </div>
      </form>

      <div class="recent-dropdown" id="recentDropdown">
        <div th:if="${recentKeywords != null and !#lists.isEmpty(recentKeywords)}">
          <div class="recent-header">
            <span>Recent</span>
            <button type="button" onclick="clearAllKeywords()">Clear all</button>
          </div>
          <div th:each="kw : ${recentKeywords}">
            <div class="recent-item">
              <div class="recent-item-kw" th:data-kw="${kw}" onclick="doSearch(this.dataset.kw)">
                <span>🕐</span><span th:text="${kw}"></span>
              </div>
              <button class="recent-del" type="button"
                      th:data-kw="${kw}" onclick="deleteKeyword(this.dataset.kw, event)">✕</button>
            </div>
          </div>
        </div>
        <div class="recent-empty"
             th:if="${recentKeywords == null or #lists.isEmpty(recentKeywords)}">
          No recent searches
        </div>
      </div>
    </div>

    <div class="filter-row" id="filterRow">
      <div class="chip active" onclick="setCategory('All')">All</div>
      <div class="chip" onclick="setCategory('문화시설')">🏛 문화시설</div>
      <div class="chip" onclick="setCategory('박물관')">🏺 박물관</div>
      <div class="chip" onclick="setCategory('자연')">🌿 자연</div>
      <div class="chip" onclick="setCategory('쇼핑')">🛍️ 쇼핑</div>
      <div class="chip" onclick="setCategory('체험관광')">🎡 체험관광</div>
      <div class="chip" onclick="setCategory('축제')">🎉 축제</div>
    </div>

    <div class="sort-row">
      <div class="result-count"><strong id="countDisplay">0</strong> places found</div>
      <div class="sort-btns">
        <button class="sort-btn active" onclick="setSort('recommended')">⭐ Recommended</button>
        <button class="sort-btn" onclick="setSort('distance')">📍 Distance</button>
      </div>
    </div>

    <div class="place-list" id="placeList"></div>

    <div style="padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;">
      <button type="button" onclick="getLocation()"
              style="width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;">
        📍 My Location
      </button>
    </div>
  </div>

  <div class="map-area" id="mapArea">
    <div id="kakaoMap" style="position:absolute;inset:0;z-index:0;"></div>

    <div class="map-controls" style="z-index:30;">
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()-1)">＋</div>
      <div class="mc" onclick="map&&map.setLevel(map.getLevel()+1)">－</div>
    </div>

    <div class="map-popup" id="mapPopup">
      <div class="popup-img" id="popupImg">
        <button class="popup-close" onclick="closePopup()">×</button>
      </div>
      <div class="popup-body">
        <div class="popup-name" id="popupName"></div>
        <div class="popup-meta" id="popupMeta"></div>
        <a class="popup-btn" href="#" id="popupDetailBtn">View Details →</a>
      </div>
    </div>

    <div class="detail-panel" id="detailPanel">
      <div class="dp-header">
        <button class="dp-back" onclick="closeDetail()">←</button>
        <div class="dp-title" id="dpTitle"></div>
        <div style="font-size:20px;cursor:pointer">🔖</div>
      </div>
      <div class="dp-img" id="dpImg"></div>
      <div class="dp-body">
        <div class="dp-badge-row" id="dpBadges"></div>
        <div class="dp-name" id="dpName"></div>
        <div class="dp-sub" id="dpSub"></div>
        <div class="dp-stars" id="dpStars"></div>
        <div class="dp-info-row" id="dpInfoRow"></div>
        <div class="dp-desc" id="dpDesc"></div>
        <div class="dp-section-title">Reviews</div>
        <div class="rev-summary" id="dpRevSummary"></div>
        <div id="dpReviews"></div>
      </div>
      <div class="dp-action">
        <button class="dp-action-btn" id="itineraryBtn">❤️ Save to Itinerary</button>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const userLat   = /*[[${userlat}]]*/ 37.5665;
  const userLon   = /*[[${userlon}]]*/ 126.9780;
  const PLACES    = /*[[${list}]]*/ [];
  const centerLat = /*[[${centerLat}]]*/ 37.5665;
  const centerLon = /*[[${centerLon}]]*/ 126.9780;
</script>

<script>
  let activeCategory = 'All';
  let activeSort     = 'recommended';
  let activePinId    = null;
  let currentPopup   = null;
  let currentPopupPlace = null;
  let map;

  // type이 String/숫자 둘 다 처리
  function typeName(type) {
    const m = {'12':'문화시설','14':'박물관','15':'축제','25':'체험관광','28':'자연','38':'쇼핑'};
    return m[String(type)] ?? '기타';
  }

  function distStr(d) {
    if (d == null) return '-';
    return d < 1 ? (d * 1000).toFixed(0) + 'm' : d.toFixed(1) + 'km';
  }

  function getFiltered() {
    let list = [...PLACES];
    const q = document.getElementById('searchInput').value.toLowerCase();
    if (activeCategory !== 'All') list = list.filter(p => typeName(p.type) === activeCategory);
    if (q) list = list.filter(p =>
            p.title?.toLowerCase().includes(q) || p.addr?.toLowerCase().includes(q)
    );
    if (activeSort === 'recommended') list.sort((a,b) => (b.score ?? 0) - (a.score ?? 0));
    else list.sort((a,b) => (a.distance ?? 999) - (b.distance ?? 999));
    return list;
  }

  function setCategory(c) {
    activeCategory = c;
    document.querySelectorAll('.chip').forEach(ch =>
            ch.classList.toggle('active', ch.textContent.trim() === c || (c === 'All' && ch.textContent.trim() === 'All'))
    );
    render();
  }

  function setSort(s) {
    activeSort = s;
    document.querySelectorAll('.sort-btn').forEach(b =>
            b.classList.toggle('active',
                    (s === 'recommended' && b.textContent.includes('Recommended')) ||
                    (s === 'distance' && b.textContent.includes('Distance'))
            )
    );
    render();
  }

  function render() {
    const list = getFiltered();
    window._currentList = list;  // 마커 클릭 시 인덱스로 찾기 위해 저장
    document.getElementById('countDisplay').textContent = list.length;
    document.getElementById('placeList').innerHTML = list.map((p, i) => `
      <div class="place-card${activePinId == i ? ' active' : ''}"
           id="card-${i}" onclick="selectPlace(${i})">
        <div class="thumb" style="background-image:url('${p.image ?? ''}')">
          <div class="rank">${i + 1}</div>
        </div>
        <div class="card-info">
          <div class="card-cat">${typeName(p.type)}</div>
          <div class="card-name">${p.title ?? '-'}</div>
          <div class="card-meta">
            <span class="stars-s">★</span>${p.rating ?? '-'}
            (${p.user_ratings_total ? (p.user_ratings_total / 1000).toFixed(1) + 'k' : '-'})
            <span class="card-dist">📍 ${distStr(p.distance)}</span>
          </div>
        </div>
      </div>`).join('');
  }

  function selectPlace(idx) {
    activePinId = Number(idx);
    render(); // active 클래스 포함해서 카드 다시 그림

    const list = window._currentList || PLACES;
    const p = list[idx];
    if (p && p.lat && p.lng && map) {
      map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
    }

    // render() 후 DOM 반영된 뒤 스크롤 + active 카드 강조
    setTimeout(() => {
      const card = document.getElementById('card-' + idx);
      if (card) {
        card.scrollIntoView({behavior: 'smooth', block: 'nearest'});
        // active 클래스가 붙었는지 보장
        document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      }
    }, 60);

    if (p) showPopup(p);
  }

  function showPopup(p) {
    if (!p) return;
    currentPopupPlace = p;

    document.getElementById('popupImg').style.backgroundImage = `url('${p.image ?? ''}')`;
    document.getElementById('popupName').textContent = p.title ?? '-';
    document.getElementById('popupMeta').textContent =
            `★ ${p.rating ?? '-'} · ${distStr(p.distance)} away · ${typeName(p.type)}`;

    document.getElementById('popupDetailBtn').onclick = function(e) {
      e.preventDefault();
      openDetail(p);
    };

    const popup = document.getElementById('mapPopup');
    popup.style.left = '20px';
    popup.style.top  = '20px';
    popup.classList.add('show');
  }

  function closePopup() {
    document.getElementById('mapPopup').classList.remove('show');
    activePinId = null;
    render();
  }

  function openDetail(p) {
    if (!p) return;
    document.getElementById('mapPopup').classList.remove('show');

    document.getElementById('dpTitle').textContent = p.title ?? '-';
    document.getElementById('dpImg').style.backgroundImage = `url('${p.image ?? ''}')`;
    document.getElementById('dpName').textContent = p.title ?? '-';
    document.getElementById('dpSub').textContent  = p.addr ?? '';
    document.getElementById('dpBadges').innerHTML =
            `<span class="dp-badge db-blue">${typeName(p.type)}</span>
       <span class="dp-badge db-gold">🏆 ${p.score?.toFixed(1) ?? '-'}점</span>`;
    document.getElementById('dpStars').innerHTML =
            `<span class="s">★★★★★</span>
       <span class="sc">${p.rating ?? '-'}</span>
       <span class="sm">/ 5.0 &nbsp;·&nbsp; ${p.user_ratings_total?.toLocaleString() ?? '-'} reviews</span>`;
    document.getElementById('dpInfoRow').innerHTML = `
      <div class="dp-info"><div class="dp-info-label">Address</div><div class="dp-info-val">${p.addr ?? '-'}</div></div>
      <div class="dp-info"><div class="dp-info-label">Distance</div><div class="dp-info-val">${distStr(p.distance)} away</div></div>
      <div class="dp-info"><div class="dp-info-label">Score</div><div class="dp-info-val">🏆 ${p.score?.toFixed(1) ?? '-'} / 100</div></div>
      <div class="dp-info"><div class="dp-info-label">Category</div><div class="dp-info-val">${typeName(p.type)}</div></div>`;
    document.getElementById('dpDesc').textContent = '';

    const reviews = p.reviews ?? [];
    const avg = p.rating ?? 0;
    document.getElementById('dpRevSummary').innerHTML = `
      <div>
        <div class="rev-score">${avg}</div>
        <div style="color:var(--gold);font-size:14px;margin-top:4px">${'★'.repeat(Math.round(avg))}</div>
      </div>
      <div class="rev-right"><div class="rev-bars">
        ${[5,4,3,2,1].map(s => {
      const cnt = reviews.filter(r => Math.round(r.rating ?? 0) === s).length;
      const pct = reviews.length ? Math.round(cnt / reviews.length * 100) : 0;
      return `<div class="rev-row"><span>${s}</span>
            <div class="rev-track"><div class="rev-fill" style="width:${pct}%"></div></div>
            <span>${pct}%</span></div>`;
    }).join('')}
      </div></div>`;
    document.getElementById('dpReviews').innerHTML = reviews.slice(0, 5).map(r => `
      <div class="review-item">
        <div class="ri-top">
          <div>
            <div class="ri-name">${r.author_name ?? '익명'}</div>
            <div class="ri-date">${r.relative_time_description ?? ''}</div>
          </div>
          <div class="ri-stars">${'★'.repeat(Math.round(r.rating ?? 0))}</div>
        </div>
        <div class="ri-text">${r.text ?? ''}</div>
      </div>`).join('');

    // Save to Itinerary → /tour/itinerary 이동
    document.getElementById('itineraryBtn').onclick = function() {
      if (p.lat && p.lng) {
        location.href = `/tour/itinerary?lat=${p.lat}&lon=${p.lng}&title=${encodeURIComponent(p.title ?? '')}`;
      }
    };

    document.getElementById('detailPanel').classList.add('open');
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
  }

  document.getElementById('mapArea').addEventListener('click', function(e) {
    if (!e.target.closest('.map-popup') &&
            !e.target.closest('.detail-panel') &&
            !e.target.closest('.place-card') &&
            !e.target.closest('.loc-btn') &&
            !e.target.closest('.map-controls')) {
      closePopup();
    }
  });

  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
              pos => location.href = `/tour/mylocation/${pos.coords.latitude}/${pos.coords.longitude}`,
              ()  => location.href = '/tour/mylocation/37.5665/126.9780'
      );
    } else {
      location.href = '/tour/mylocation/37.5665/126.9780';
    }
  }

  // ── 최근 검색어 ──────────────────────────────────────────
  let hideTimer;
  function showRecent() {
    clearTimeout(hideTimer);
    document.getElementById('recentDropdown').classList.add('show');
  }
  function hideRecent() {
    hideTimer = setTimeout(() =>
            document.getElementById('recentDropdown').classList.remove('show'), 200);
  }
  function doSearch(kw) {
    document.getElementById('searchInput').value = kw;
    document.getElementById('searchForm').submit();
  }
  // CSRF 토큰 포함 POST 헬퍼
  function csrfPost(url, body) {
    const token  = document.querySelector('meta[name="_csrf"]')?.content ?? '';
    const header = document.querySelector('meta[name="_csrf_header"]')?.content ?? 'X-CSRF-TOKEN';
    return fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded', [header]: token},
      body: body
    });
  }
  function deleteKeyword(kw, event) {
    event.stopPropagation();
    csrfPost('/tour/search/history/delete', 'keyword=' + encodeURIComponent(kw))
            .then(() => location.reload());
  }
  function clearAllKeywords() {
    csrfPost('/tour/search/history/clear', '').then(() => location.reload());
  }

  render();
</script>

<script th:src="'//dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoKey} + '&autoload=false'"></script>
<script>
  kakao.maps.load(function() {
    map = new kakao.maps.Map(document.getElementById('kakaoMap'), {
      center: new kakao.maps.LatLng(centerLat, centerLon),
      level: 5
    });

    if (userLat && userLon) {
      new kakao.maps.Marker({
        map: map,
        position: new kakao.maps.LatLng(userLat, userLon),
        title: '내 위치'
      });
    }

    PLACES.forEach(p => {
      if (!p.lat || !p.lng) return;
      const marker = new kakao.maps.Marker({
        map: map,
        position: new kakao.maps.LatLng(p.lat, p.lng),
        title: p.title ?? ''
      });
      // 마커 클릭도 String으로 전달
      kakao.maps.event.addListener(marker, 'click', () => {
        // title로 _currentList에서 인덱스 찾기 (가장 안정적)
        const list = window._currentList || PLACES;
        const listIdx = list.findIndex(x => x.title === p.title);
        if (listIdx >= 0) {
          selectPlace(listIdx);  // active 스타일 + 스크롤 + 팝업
        } else {
          // 현재 필터에 없는 마커
          if (p.lat && p.lng) map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
          showPopup(p);
        }
      });
    });
  });
</script>

</body>
